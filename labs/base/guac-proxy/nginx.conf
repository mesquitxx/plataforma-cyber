# guac-proxy: the only container on the non-internal guac_front network and
# the only published port (127.0.0.1:8080). Phase 8, trade-offs T8 and T9 in
# docs/LABORATORIO.md:
# - T8: Guacamole (Tomcat, which holds the database password) moves to the
#   internal guac_edge network and loses its internet access; this proxy
#   only forwards /guacamole/ to it.
# - T9: adds the frame-ancestors that the official Guacamole image does not
#   send, so only the platform (127.0.0.1:3000 / localhost:3000) can embed it.
# Runs as the unprivileged nginx user (uid 101) on a read-only filesystem.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    access_log off;
    server_tokens off;

    # WebSocket tunnel: pass Upgrade through, close plain requests normally.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    server {
        listen 8080;

        location = / {
            return 302 /guacamole/;
        }

        location /guacamole/ {
            proxy_pass http://guacamole:8080;
            proxy_http_version 1.1;
            # Guacamole's tunnels stream the screen: never buffer them, and
            # keep idle desktops connected.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            # File transfers through Guacamole's menu.
            client_max_body_size 256m;

            proxy_hide_header X-Powered-By;
            add_header Content-Security-Policy "frame-ancestors http://127.0.0.1:3000 http://localhost:3000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # Anything else is not Guacamole.
        location / {
            return 404;
        }
    }
}
