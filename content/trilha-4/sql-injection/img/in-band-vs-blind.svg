<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Árvore de decisão: qual técnica de SQL injection usar conforme o que a resposta mostra</title>
  <desc id="d">Uma árvore que parte da pergunta central: depois de injetar, o que a resposta da aplicação deixa ver? Primeiro ramo: a resposta mostra os dados da consulta na página? Se sim, é in-band, e o caminho é union-based, usando UNION SELECT para anexar os dados que você quer às colunas que a página já exibe. Se a resposta não mostra os dados mas vaza a mensagem de erro do banco, é error-based, extraindo dados dentro do texto do erro. Se a resposta não mostra dados nem erro, é blind (cega): resta inferir. Dois sub-ramos do blind: se a página muda entre dois estados conforme a condição é verdadeira ou falsa, é boolean-based, extraindo um bit por requisição com SUBSTRING e comparação; se a página não muda de forma visível, resta o time-based, medindo o tempo com SLEEP para ler cada bit pelo atraso. Uma caixa lateral lembra que o out-of-band usa um canal externo, como DNS, quando nenhum dos anteriores dá sinal.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .code { font-size: 11px; fill: #5cc8d8; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .c { fill: #5cc8d8; }
    .q { fill: #15130f; stroke: #e8c46a; stroke-width: 1.3; }
    .leaf { fill: #16201b; stroke: #5ee08a; stroke-width: 1.3; }
    .side { fill: #1b2a3a; stroke: #5cc8d8; stroke-width: 1.2; }
    .line { stroke: #2c3a33; stroke-width: 1.6; fill: none; }
  </style>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="24" y="30">Qual técnica usar? Depende do que a resposta deixa ver</text>

  <!-- Q1 -->
  <rect class="q" x="300" y="52" width="300" height="52" rx="10"/>
  <text class="h y" x="450" y="74" text-anchor="middle">A resposta mostra os dados</text>
  <text class="h y" x="450" y="92" text-anchor="middle">da consulta na própria página?</text>

  <!-- branch to in-band -->
  <path class="line" d="M300,78 L150,78 L150,150"/>
  <text class="s g" x="158" y="70">sim</text>
  <rect class="leaf" x="40" y="150" width="220" height="92" rx="10"/>
  <text class="h g" x="52" y="172">in-band — union-based</text>
  <text class="b" x="52" y="192">os dados voltam na tela;</text>
  <text class="b" x="52" y="208">anexe o que quiser às</text>
  <text class="b" x="52" y="224">colunas exibidas:</text>
  <text class="code" x="52" y="240">' UNION SELECT user,pass..</text>

  <!-- Q2 -->
  <path class="line" d="M600,78 L750,78 L750,150"/>
  <text class="s" x="705" y="70">não</text>
  <rect class="q" x="620" y="150" width="256" height="52" rx="10"/>
  <text class="h y" x="748" y="172" text-anchor="middle">...mas vaza a mensagem</text>
  <text class="h y" x="748" y="190" text-anchor="middle">de erro do banco?</text>

  <!-- error-based leaf -->
  <path class="line" d="M620,176 L560,176 L560,250"/>
  <text class="s g" x="568" y="168">sim</text>
  <rect class="leaf" x="440" y="250" width="240" height="78" rx="10"/>
  <text class="h g" x="452" y="272">error-based</text>
  <text class="b" x="452" y="292">force o banco a pôr o dado</text>
  <text class="b" x="452" y="308">dentro do texto do erro</text>
  <text class="s" x="452" y="322">(EXTRACTVALUE, CAST...)</text>

  <!-- Q3 blind -->
  <path class="line" d="M748,202 L748,250"/>
  <text class="s" x="756" y="230">não</text>
  <rect class="q" x="636" y="250" width="240" height="52" rx="10"/>
  <text class="h y" x="756" y="272" text-anchor="middle">cega (blind): a página</text>
  <text class="h y" x="756" y="290" text-anchor="middle">muda entre 2 estados?</text>

  <!-- boolean leaf -->
  <path class="line" d="M636,276 L300,276 L300,360"/>
  <text class="s g" x="308" y="268">sim</text>
  <rect class="leaf" x="180" y="360" width="256" height="96" rx="10"/>
  <text class="h g" x="192" y="382">boolean-based blind</text>
  <text class="b" x="192" y="402">1 bit por requisição: compare</text>
  <text class="b" x="192" y="418">caractere a caractere e veja</text>
  <text class="b" x="192" y="434">qual dos 2 estados volta:</text>
  <text class="code" x="192" y="450">' AND SUBSTRING(..,1,1)='a</text>

  <!-- time leaf -->
  <path class="line" d="M876,276 L876,360"/>
  <text class="s" x="884" y="320">não</text>
  <rect class="leaf" x="520" y="360" width="300" height="96" rx="10"/>
  <text class="h g" x="532" y="382">time-based blind</text>
  <text class="b" x="532" y="402">nada muda na tela: meça o TEMPO.</text>
  <text class="b" x="532" y="418">se a condição for verdadeira, o</text>
  <text class="b" x="532" y="434">banco dorme e a resposta atrasa:</text>
  <text class="code" x="532" y="450">' AND IF(cond, SLEEP(2), 0)</text>

  <!-- out-of-band side note -->
  <rect class="side" x="40" y="474" width="820" height="34" rx="8"/>
  <text class="b c" x="52" y="495">out-of-band: quando nada acima dá sinal, faça o banco falar por um canal externo (ex.: uma consulta DNS que você observa) — raro e dependente de função específica.</text>
</svg>
