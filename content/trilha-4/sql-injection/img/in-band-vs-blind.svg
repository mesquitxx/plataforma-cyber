<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 610" width="960" height="610" role="img" aria-labelledby="t d">
  <title id="t">Qual técnica de SQL injection usar? Depende do que a resposta deixa ver</title>
  <desc id="d">Quatro perguntas, de cima para baixo: pare no primeiro sim. Quanto mais para baixo, menos a resposta mostra e mais trabalhoso é tirar o dado. Grupo in-band, em verde, o dado volta na própria resposta. Pergunta 1: os dados da consulta aparecem na página? Então é union-based: anexe o que quiser às colunas que a página já mostra, com ' UNION SELECT user, password. Pergunta 2: a mensagem de erro do banco aparece? Então é error-based: force o banco a pôr o dado dentro do texto do erro. Grupo blind, ou cega, em laranja, o dado nunca aparece e você deduz. Pergunta 3: a página só muda entre 2 estados conforme a condição é verdadeira ou falsa? Então é boolean-based: uma resposta sim ou não por pedido, comparando letra a letra com ' AND SUBSTRING(..,1,1)='a. Pergunta 4: nada muda na tela? Então é time-based: meça o tempo; se a condição é verdadeira, o banco espera e a resposta atrasa, com ' AND IF(cond, SLEEP(2), 0). Em cinza tracejado, separado e raro: out-of-band, quando nada acima dá sinal, o banco fala por um canal externo, como uma consulta DNS que você observa. Legenda: verde é in-band, laranja é blind, cinza tracejado é out-of-band.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .grp { font-size: 13px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .tech { font-size: 15px; font-weight: 700; }
    .code { font-size: 12px; fill: #cbd5e1; }
    .small { font-size: 12px; fill: #94a3b8; }
    .inb { fill: #34d399; }
    .bld { fill: #fb923c; }
    .panel-in { fill: #0f172a; stroke: #10b981; stroke-width: 1.4; }
    .panel-bl { fill: #0f172a; stroke: #f97316; stroke-width: 1.4; }
    .obs { fill: #111827; stroke: #64748b; stroke-width: 1.4; }
    .tech-in { fill: #052e16; stroke: #10b981; stroke-width: 1.6; }
    .tech-bl { fill: #2a1708; stroke: #f97316; stroke-width: 1.6; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="610" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Qual técnica usar? Depende do que a resposta deixa ver</text>
  <text class="sub" x="30" y="66">Pergunte de cima para baixo e pare no primeiro SIM. Quanto mais para baixo,</text>
  <text class="sub" x="30" y="84">menos a página mostra e mais trabalho dá tirar o dado.</text>

  <text class="col" x="46" y="112">A RESPOSTA MOSTRA...</text>
  <text class="col" x="378" y="112">TÉCNICA</text>
  <text class="col" x="572" y="112">COMO O DADO SAI</text>

  <!-- in-band group -->
  <rect class="panel-in" data-graph-role="container" x="30" y="122" width="900" height="182" rx="8"/>
  <text class="grp inb" x="46" y="144">IN-BAND — o dado volta na própria resposta</text>

  <rect class="obs" x="46" y="156" width="300" height="60" rx="6"/>
  <text class="lbl" x="60" y="181">1. os dados da consulta</text>
  <text class="lbl" x="60" y="201">   aparecem na página?</text>
  <path class="edge" d="M346,186 L372,186" marker-end="url(#arrow-gray)"/>
  <rect class="tech-in" x="376" y="156" width="180" height="60" rx="6"/>
  <text class="tech inb" x="390" y="192">union-based</text>
  <text class="small" x="572" y="180">anexe o que quiser às colunas</text>
  <text class="small" x="572" y="196">que a página já mostra:</text>
  <text class="code" x="572" y="212">' UNION SELECT user, password ...</text>

  <rect class="obs" x="46" y="230" width="300" height="60" rx="6"/>
  <text class="lbl" x="60" y="255">2. a mensagem de erro</text>
  <text class="lbl" x="60" y="275">   do banco aparece?</text>
  <path class="edge" d="M346,260 L372,260" marker-end="url(#arrow-gray)"/>
  <rect class="tech-in" x="376" y="230" width="180" height="60" rx="6"/>
  <text class="tech inb" x="390" y="266">error-based</text>
  <text class="small" x="572" y="256">force o banco a pôr o dado</text>
  <text class="small" x="572" y="272">dentro do texto do erro</text>

  <!-- blind group -->
  <rect class="panel-bl" data-graph-role="container" x="30" y="320" width="900" height="182" rx="8"/>
  <text class="grp bld" x="46" y="342">BLIND (CEGA) — o dado nunca aparece; você deduz</text>

  <rect class="obs" x="46" y="354" width="300" height="60" rx="6"/>
  <text class="lbl" x="60" y="379">3. a página só muda entre</text>
  <text class="lbl" x="60" y="399">   2 estados (sim / não)?</text>
  <path class="edge" d="M346,384 L372,384" marker-end="url(#arrow-gray)"/>
  <rect class="tech-bl" x="376" y="354" width="180" height="60" rx="6"/>
  <text class="tech bld" x="390" y="390">boolean-based</text>
  <text class="small" x="572" y="378">1 resposta sim/não por pedido,</text>
  <text class="small" x="572" y="394">comparando letra a letra:</text>
  <text class="code" x="572" y="410">' AND SUBSTRING(..,1,1)='a</text>

  <rect class="obs" x="46" y="428" width="300" height="60" rx="6"/>
  <text class="lbl" x="60" y="453">4. nada muda na tela?</text>
  <text class="small" x="60" y="473">   (último recurso)</text>
  <path class="edge" d="M346,458 L372,458" marker-end="url(#arrow-gray)"/>
  <rect class="tech-bl" x="376" y="428" width="180" height="60" rx="6"/>
  <text class="tech bld" x="390" y="464">time-based</text>
  <text class="small" x="572" y="452">meça o TEMPO: se a condição é</text>
  <text class="small" x="572" y="468">verdadeira, a resposta atrasa:</text>
  <text class="code" x="572" y="484">' AND IF(cond, SLEEP(2), 0)</text>

  <!-- out-of-band: separate and secondary -->
  <rect x="30" y="518" width="900" height="44" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="small" x="46" y="537">Raro — out-of-band: quando nada acima dá sinal, o banco "fala" por um</text>
  <text class="small" x="46" y="553">canal externo (ex.: uma consulta DNS que você observa).</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="578" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="52" y="590">in-band: o dado vem na resposta</text>
  <rect x="330" y="578" width="14" height="14" rx="3" fill="#fb923c"/>
  <text class="small" x="352" y="590">blind: você deduz o dado</text>
  <rect x="580" y="578" width="14" height="14" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text class="small" x="602" y="590">out-of-band (raro)</text>
  </g>
</svg>
