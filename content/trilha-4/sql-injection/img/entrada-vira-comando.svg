<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">A aspa digitada fecha o texto antes da hora, e o resto da entrada vira comando</title>
  <desc id="d">O mesmo código do DVWA no nível low cola a entrada do usuário no meio do comando SQL, entre aspas: WHERE user_id = aspa, $id, aspa. Parte 1, entrada esperada, em cinza: o usuário digita 1, a aplicação monta SELECT first_name, last_name FROM users WHERE user_id = '1', o 1 fica dentro das aspas como dado, e o banco devolve 1 linha. Parte 2, entrada do atacante: ele digita apóstrofo espaço OR '1'='1. A aplicação monta SELECT ... WHERE user_id = '' OR '1'='1'. Em amarelo, o momento da falha: a aspa digitada fecha o texto antes da hora, e user_id passa a comparar com um texto vazio. Em vermelho, o trecho OR '1'='1' sai de dentro das aspas e vira comando: uma condição sempre verdadeira. O que o atacante ganha, em vermelho: o banco devolve todas as linhas da tabela users. Nota final: o banco recebe um texto só e não tem como saber que esse trecho veio de um campo de formulário, e não do programador. Legenda: cinza é a entrada esperada, azul é o dado dentro das aspas, amarelo é onde está a falha, vermelho é o ataque e o que ele ganha.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .code { font-size: 13px; }
    .q { font-size: 20px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .big { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .data { fill: #60a5fa; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .req { fill: #111827; stroke: #64748b; stroke-width: 1.4; }
    .atkbox { fill: #111827; stroke: #ef4444; stroke-width: 1.4; }
    .gain { fill: #2a1215; stroke: #ef4444; stroke-width: 2; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2; fill: none; }
    .brk-key { stroke: #facc15; stroke-width: 2; fill: none; }
    .brk-atk { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">A aspa digitada fecha o texto antes da hora,</text>
  <text class="title" x="30" y="68">e o resto da entrada vira comando</text>
  <text class="sub" x="30" y="92">O código do DVWA (low) cola a entrada no meio do comando:  WHERE user_id = '<tspan class="data">$id</tspan>'</text>

  <!-- 1. expected input -->
  <rect class="panel" data-graph-role="container" x="30" y="108" width="900" height="104" rx="8"/>
  <text class="col" x="46" y="130">1. ENTRADA ESPERADA</text>
  <rect class="req" x="46" y="142" width="150" height="54" rx="6"/>
  <text class="small" x="58" y="162">o usuário digita</text>
  <text class="big" x="58" y="184">1</text>
  <path class="edge" d="M196,169 L222,169" marker-end="url(#arrow-gray)"/>
  <rect class="req" x="226" y="142" width="530" height="54" rx="6"/>
  <text class="small" x="240" y="162">a aplicação monta:</text>
  <text class="code" x="240" y="184">SELECT first_name, last_name FROM users WHERE user_id = '<tspan class="data">1</tspan>'</text>
  <path class="edge" d="M756,169 L782,169" marker-end="url(#arrow-gray)"/>
  <rect class="req" x="786" y="142" width="128" height="54" rx="6"/>
  <text class="small" x="798" y="162">o banco devolve</text>
  <text class="bold" x="798" y="184">1 linha</text>

  <!-- 2. attacker input -->
  <rect class="panel" data-graph-role="container" x="30" y="228" width="900" height="268" rx="8"/>
  <text class="col" x="46" y="250">2. ENTRADA DO ATACANTE — o mesmo código</text>
  <rect class="atkbox" x="46" y="268" width="190" height="72" rx="6"/>
  <text class="small" x="58" y="290">o atacante digita</text>
  <text class="big atk" x="58" y="322">' OR '1'='1</text>
  <path class="edge-atk" d="M236,304 L262,304" marker-end="url(#arrow-red)"/>

  <rect class="req" x="266" y="268" width="648" height="72" rx="6"/>
  <text class="small" x="280" y="288">a aplicação monta:</text>
  <!-- query split in segments with fixed x so the marks below stay aligned in any font -->
  <rect x="622" y="303" width="22" height="30" rx="3" fill="#facc15" fill-opacity="0.22" stroke="#facc15" stroke-width="1.5" filter="url(#glow-gold)"/>
  <text class="q" x="282" y="325">SELECT ... WHERE user_id =</text>
  <text class="q" x="608" y="325">'</text>
  <text class="q key" x="627" y="325">'</text>
  <text class="q atk" x="656" y="325">OR '1'='1</text>
  <text class="q" x="770" y="325">'</text>

  <!-- the key moment: where the text ends and the command begins -->
  <path class="brk-key" d="M633,340 L633,372"/>
  <text class="bold key" x="622" y="372" text-anchor="end">a aspa digitada FECHA o texto</text>
  <text class="lbl key" x="622" y="394" text-anchor="end">user_id passa a comparar com ''</text>
  <text class="bold key" x="622" y="416" text-anchor="end">aqui está a falha</text>
  <path class="brk-atk" d="M656,340 L656,348 L766,348 L766,340"/>
  <path class="brk-atk" d="M711,348 L711,358"/>
  <text class="bold atk" x="656" y="374">saiu das aspas:</text>
  <text class="lbl atk" x="656" y="394">virou COMANDO,</text>
  <text class="lbl atk" x="656" y="414">sempre verdadeiro</text>

  <path class="edge-atk" d="M860,340 L860,426" marker-end="url(#arrow-red)"/>
  <rect class="gain" x="266" y="430" width="648" height="50" rx="6"/>
  <text class="big atk" x="282" y="461">GANHA: o banco devolve TODAS as linhas da tabela users</text>

  <!-- root cause note -->
  <rect class="panel" x="30" y="512" width="900" height="46" rx="6"/>
  <text class="small" x="46" y="532">Por que o banco não percebe: ele recebe UM texto só. Não tem como saber que</text>
  <text class="small" x="46" y="549">' OR '1'='1 veio de um campo de formulário, e não do programador.</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="574" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="small" x="52" y="586">entrada esperada</text>
  <rect x="236" y="574" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="258" y="586">dado (dentro das aspas)</text>
  <rect x="478" y="574" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="500" y="586">onde está a falha</text>
  <rect x="680" y="574" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="702" y="586">ataque e o que ele ganha</text>
  </g>
</svg>
