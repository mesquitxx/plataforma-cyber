<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">Sair não cancela o token: o servidor segue aceitando cópias</title>
  <desc id="d">Diagrama de sequência entre três participantes: atacante, navegador e servidor. Passo 1, o navegador envia e-mail e senha ao servidor; a falha possível é a senha fraca ou reaproveitada. Passo 2, o servidor devolve um token assinado (JWT); a falha é que qualquer um que tenha o token lê o conteúdo, que traz dados demais. Passo 3, cada pedido do navegador leva o token e o servidor responde 200 OK porque só confere a assinatura. Passo 4, o momento-chave: o usuário clica em Sair e o navegador apaga apenas a sua cópia do token, enquanto no servidor nada muda, porque não existe lista de sessões para apagar. Passo 5, o atacante reusa uma cópia do token guardada antes do Sair e o servidor responde 200 OK: o atacante entra como a vítima. Caixa de ideia-chave: o token vale até alguém recusá-lo, e o servidor nunca recusa, pois não há prazo de validade nem invalidação no Sair. Legenda: azul é o fluxo normal da sessão, vermelho é falha ou ação do atacante.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .lane { font-size: 14px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bad { font-size: 12px; fill: #f87171; }
    .badb { font-size: 13px; font-weight: 700; fill: #f87171; }
    .key { font-size: 15px; font-weight: 700; fill: #f87171; }
    .body { font-size: 13px; }
    .muted { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="44">Sair não cancela o token: o servidor segue aceitando cópias</text>
  <text class="sub" x="40" y="68">Sessão por token (JWT), como no Juice Shop: o servidor não guarda lista de sessões.</text>

  <!-- participants -->
  <rect x="40" y="90" width="150" height="36" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="1.5"/>
  <text class="lane" x="115" y="113" text-anchor="middle" fill="#f87171">Atacante</text>
  <rect x="250" y="90" width="170" height="36" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="lane" x="335" y="113" text-anchor="middle">Navegador</text>
  <rect x="730" y="90" width="190" height="36" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="lane" x="825" y="113" text-anchor="middle">Servidor</text>

  <!-- lifelines -->
  <line x1="115" y1="126" x2="115" y2="486" stroke="#ef4444" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 5"/>
  <line x1="335" y1="126" x2="335" y2="330" stroke="#334155" stroke-width="2"/>
  <line x1="825" y1="126" x2="825" y2="486" stroke="#334155" stroke-width="2"/>

  <!-- 1 login -->
  <text class="lbl" x="352" y="152">1. login: e-mail + senha</text>
  <line x1="337" y1="160" x2="821" y2="160" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text class="bad" x="352" y="178">falha: senha fraca ou reaproveitada</text>

  <!-- 2 token -->
  <text class="lbl" x="352" y="206">2. devolve um token assinado (JWT)</text>
  <line x1="823" y1="214" x2="339" y2="214" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text class="bad" x="352" y="232">falha: quem tem o token lê o conteúdo (e há dados demais)</text>

  <!-- 3 use -->
  <text class="lbl" x="352" y="260">3. cada pedido leva o token (Bearer)</text>
  <line x1="337" y1="268" x2="821" y2="268" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <text class="lbl" x="352" y="292">200 OK: o servidor só confere a assinatura e confia</text>
  <line x1="823" y1="300" x2="339" y2="300" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow-blue)"/>

  <!-- 4 logout: key moment -->
  <rect x="226" y="330" width="218" height="58" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="badb" x="242" y="353">4. Sair</text>
  <text class="body" x="242" y="375">apaga SÓ a cópia daqui</text>
  <rect x="660" y="330" width="260" height="58" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="badb" x="676" y="353">nada muda aqui:</text>
  <text class="body" x="676" y="375">não há sessão para apagar</text>
  <text class="badb" x="552" y="356" text-anchor="middle">momento-chave</text>
  <text class="muted" x="552" y="374" text-anchor="middle">só um lado esquece</text>

  <!-- 5 attacker reuses copy -->
  <text class="lbl" x="132" y="428">5. reusa uma cópia do token, guardada antes do Sair</text>
  <line x1="117" y1="436" x2="821" y2="436" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="badb" x="132" y="466">200 OK: o atacante entra como a vítima</text>
  <line x1="823" y1="476" x2="119" y2="476" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- key idea -->
  <rect x="40" y="506" width="880" height="76" rx="6" fill="#1f0d12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="key" x="58" y="532">Ideia-chave</text>
  <text class="body" x="58" y="554">O token vale até alguém recusá-lo, e o servidor nunca recusa: sem prazo de validade</text>
  <text class="body" x="58" y="572">e sem invalidação no Sair, quem tem uma cópia do token É o usuário.</text>

  <!-- legend -->
  <line x1="40" y1="612" x2="76" y2="612" stroke="#3b82f6" stroke-width="2"/>
  <text class="muted" x="86" y="616">fluxo normal da sessão</text>
  <line x1="320" y1="612" x2="356" y2="612" stroke="#ef4444" stroke-width="2"/>
  <text class="muted" x="366" y="616">falha ou ação do atacante</text>
</svg>
