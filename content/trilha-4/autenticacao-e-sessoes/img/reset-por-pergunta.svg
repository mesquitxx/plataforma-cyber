<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Reset por pergunta: uma resposta pública troca a senha de outra pessoa</title>
  <desc id="d">Fluxo em três passos, da esquerda para a direita, de como o atacante toma a conta do Jim no Juice Shop sem saber a senha dele. Passo 1, descobrir a conta: o atacante pede a pergunta de segurança do e-mail jim@juice-sh.op; o servidor responde com a pergunta "nome do meio do irmão mais velho?", o que prova que a conta existe. Passo 2, pesquisar a resposta: as resenhas do Jim citam Star Trek; o capitão James Kirk tem o irmão George Samuel Kirk; a resposta é Samuel. Passo 3, o momento-chave: o atacante envia e-mail, resposta e uma senha nova, e o servidor troca a senha sem pedir a senha antiga nem um código enviado ao e-mail. Resultado: conta tomada, o atacante entra como o Jim com a senha que ele escolheu. Abaixo, em destaque, por que funciona: a pergunta secreta é uma segunda senha fraca, com poucas respostas possíveis, que nunca muda e muitas vezes está na internet. Numa faixa separada e secundária, a defesa: o servidor gera um código aleatório, de uso único e prazo curto, e o envia a um canal que só a vítima controla, como o e-mail dela; só esse código autoriza a troca. Legenda: azul é passo do atacante, vermelho é falha do servidor e o que o atacante ganha, verde é defesa.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .step { font-size: 13px; font-weight: 700; }
    .body { font-size: 12px; fill: #cbd5e1; }
    .strong { font-size: 12px; font-weight: 700; }
    .badb { font-size: 13px; font-weight: 700; fill: #f87171; }
    .bad { font-size: 12px; fill: #f87171; }
    .res { font-size: 16px; font-weight: 700; fill: #fecaca; }
    .key { font-size: 15px; font-weight: 700; fill: #f87171; }
    .text13 { font-size: 13px; }
    .def { font-size: 13px; font-weight: 700; fill: #34d399; }
    .muted { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="44">Reset por pergunta: uma resposta pública troca a senha</text>
  <text class="sub" x="40" y="68">No Juice Shop: tomar a conta do Jim sem nunca saber a senha dele.</text>

  <!-- step 1 -->
  <rect x="40" y="96" width="206" height="172" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="step" x="54" y="120">1. Descobrir a conta</text>
  <text class="body" x="54" y="146">pede a pergunta do</text>
  <text class="body" x="54" y="164">e-mail jim@juice-sh.op</text>
  <text class="body" x="54" y="190">servidor mostra:</text>
  <text class="strong" x="54" y="208">"nome do meio do</text>
  <text class="strong" x="54" y="226">irmão mais velho?"</text>
  <text class="bad" x="54" y="252">= a conta existe</text>

  <path d="M246,182 L262,182" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- step 2 -->
  <rect x="264" y="96" width="206" height="172" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="step" x="278" y="120">2. Achar a resposta</text>
  <text class="body" x="278" y="146">resenhas do Jim</text>
  <text class="body" x="278" y="164">citam Star Trek</text>
  <text class="body" x="278" y="190">capitão James Kirk:</text>
  <text class="body" x="278" y="208">irmão George Samuel</text>
  <text class="strong" x="278" y="246">resposta = "Samuel"</text>

  <path d="M470,182 L486,182" fill="none" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- step 3: key moment -->
  <rect x="488" y="96" width="206" height="172" rx="6" fill="#3b0f16" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="badb" x="502" y="120">3. Trocar a senha</text>
  <text class="body" x="502" y="146">envia e-mail +</text>
  <text class="body" x="502" y="164">resposta + senha nova</text>
  <text class="badb" x="502" y="196">servidor aceita SEM:</text>
  <text class="bad" x="502" y="220">- a senha antiga</text>
  <text class="bad" x="502" y="242">- código no e-mail</text>

  <path d="M694,182 L710,182" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- consequence -->
  <rect x="712" y="96" width="208" height="172" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="res" x="816" y="140" text-anchor="middle">Conta tomada</text>
  <text class="body" x="816" y="176" text-anchor="middle">o atacante entra</text>
  <text class="body" x="816" y="194" text-anchor="middle">como o Jim, com a</text>
  <text class="body" x="816" y="212" text-anchor="middle">senha que ele</text>
  <text class="body" x="816" y="230" text-anchor="middle">mesmo escolheu</text>

  <!-- why it works -->
  <rect x="40" y="296" width="880" height="88" rx="6" fill="#1f0d12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="key" x="58" y="322">Por que funciona</text>
  <text class="text13" x="58" y="346">A pergunta secreta é uma 2ª senha fraca: poucas respostas possíveis, nunca muda</text>
  <text class="text13" x="58" y="366">e muitas vezes está na internet. Quem acha a resposta, troca a senha.</text>

  <!-- defense: separate, secondary -->
  <rect x="40" y="410" width="880" height="84" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="def" x="58" y="434">Defesa (reset correto)</text>
  <text class="body" x="58" y="456">o servidor gera um código aleatório, de uso único e prazo curto, e o envia a um canal</text>
  <text class="body" x="58" y="476">que só a vítima controla (o e-mail dela); só esse código autoriza a troca.</text>

  <!-- legend -->
  <line x1="40" y1="526" x2="76" y2="526" stroke="#3b82f6" stroke-width="2"/>
  <text class="muted" x="86" y="530">passo do atacante</text>
  <line x1="280" y1="526" x2="316" y2="526" stroke="#ef4444" stroke-width="2"/>
  <text class="muted" x="326" y="530">falha do servidor / o que o atacante ganha</text>
  <line x1="720" y1="526" x2="756" y2="526" stroke="#34d399" stroke-width="2"/>
  <text class="muted" x="766" y="530">defesa</text>
</svg>
