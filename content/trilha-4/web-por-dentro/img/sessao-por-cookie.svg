<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="t d">
  <title id="t">Como um cookie de sessão transforma um protocolo sem estado em um login</title>
  <desc id="d">Diagrama de sequência com três participantes: navegador, servidor de aplicação e o armazenamento de sessões do servidor. Passo 1: o navegador envia POST /login com usuário e senha. Passo 2: o servidor confere a senha, sorteia um identificador de sessão aleatório (9f3c...) e grava no armazenamento: 9f3c... corresponde a carla, papel cliente. Passo 3: o servidor responde 302 com Location /painel e Set-Cookie sid=9f3c...; Path=/; Secure; HttpOnly; SameSite=Lax. Passo 4: o navegador guarda o cookie no pote, associado ao host e ao caminho. Passo 5: em toda requisição seguinte ao mesmo site, o navegador anexa sozinho o cabeçalho Cookie: sid=9f3c.... Passo 6: o servidor procura o identificador no armazenamento e descobre que é a carla. Passo 7: responde 200 com a página dela. O quadro da direita resume: quem apresenta o sid é a carla para o servidor; por isso o identificador é uma credencial. Os atributos protegem contra roubo por JavaScript (HttpOnly), contra leitura na rede (Secure), contra envio em requisições de outros sites (SameSite) e o servidor deve trocar o sid no login para evitar fixação de sessão.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .c { fill: #5cc8d8; }
    .r { fill: #ef7b6b; }
    .life { stroke: #2c3a33; stroke-width: 2; }
    .msg { stroke: #5cc8d8; stroke-width: 2; marker-end: url(#ar); fill: none; }
    .back { stroke: #5ee08a; stroke-width: 2; marker-end: url(#ag); fill: none; }
    .note { fill: #2a2614; stroke: #e8c46a; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="540" fill="#121815"/>
  <text class="t" x="24" y="32">Sessão por cookie: o HTTP esquece, o cookie lembra</text>

  <rect x="40" y="50" width="120" height="32" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="62" y="71">Navegador</text>
  <rect x="330" y="50" width="120" height="32" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="352" y="71">Servidor</text>
  <rect x="500" y="50" width="120" height="32" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="520" y="71">Sessões</text>
  <line class="life" x1="100" y1="82" x2="100" y2="510"/>
  <line class="life" x1="390" y1="82" x2="390" y2="510"/>
  <line class="life" x1="560" y1="82" x2="560" y2="510"/>

  <text class="b c" x="110" y="108">1  POST /login</text>
  <text class="s" x="128" y="122">usuario=carla&amp;senha=...</text>
  <path class="msg" d="M102,130 L386,130"/>

  <text class="b" x="398" y="156">2  senha ok? sid novo</text>
  <path class="msg" d="M392,166 L556,166"/>
  <rect class="note" x="572" y="146" width="160" height="38" rx="4"/>
  <text class="s y" x="580" y="162">9f3c… → carla,</text>
  <text class="s y" x="580" y="176">papel=cliente</text>

  <text class="b g" x="110" y="208">3  302 Location: /painel</text>
  <text class="s" x="128" y="224">Set-Cookie: sid=9f3c…; Path=/;</text>
  <text class="s" x="128" y="238">Secure; HttpOnly; SameSite=Lax</text>
  <path class="back" d="M388,248 L104,248"/>

  <rect class="note" x="20" y="262" width="220" height="38" rx="4"/>
  <text class="s y" x="28" y="278">4  pote: host loja.exemplo,</text>
  <text class="s y" x="28" y="292">path /, sid=9f3c…</text>

  <text class="b c" x="110" y="332">5  GET /painel</text>
  <text class="s" x="128" y="348">Cookie: sid=9f3c…  (automático)</text>
  <path class="msg" d="M102,358 L386,358"/>

  <text class="b" x="398" y="384">6  quem é 9f3c…?</text>
  <path class="msg" d="M392,394 L556,394"/>
  <path class="back" d="M556,414 L394,414"/>
  <text class="s g" x="410" y="430">carla, cliente</text>

  <text class="b g" x="110" y="460">7  200 OK "Olá, carla"</text>
  <path class="back" d="M388,474 L104,474"/>

  <rect x="652" y="216" width="232" height="282" rx="8" fill="#16201b" stroke="#ef7b6b"/>
  <text class="h r" x="666" y="240">Quem tem o sid</text>
  <text class="h r" x="666" y="256">é a carla</text>
  <text class="s" x="666" y="282">O sid é uma credencial.</text>
  <text class="s" x="666" y="300">Cada atributo fecha uma</text>
  <text class="s" x="666" y="314">porta de roubo ou abuso:</text>
  <text class="s c" x="666" y="340">HttpOnly</text>
  <text class="s" x="740" y="340">JS não lê</text>
  <text class="s c" x="666" y="362">Secure</text>
  <text class="s" x="740" y="362">só via HTTPS</text>
  <text class="s c" x="666" y="384">SameSite</text>
  <text class="s" x="740" y="384">não vai junto</text>
  <text class="s" x="740" y="398">de outro site</text>
  <text class="s c" x="666" y="420">sid novo</text>
  <text class="s" x="740" y="420">no login:</text>
  <text class="s" x="740" y="434">contra fixação</text>
  <text class="s c" x="666" y="456">expirar</text>
  <text class="s" x="740" y="456">e invalidar</text>
  <text class="s" x="740" y="470">no servidor</text>
</svg>
