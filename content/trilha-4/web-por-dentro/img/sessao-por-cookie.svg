<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="t d">
  <title id="t">O HTTP esquece, o cookie lembra: quem apresenta o sid é a carla para o servidor</title>
  <desc id="d">Diagrama de sequência entre o navegador, o servidor e as sessões guardadas no servidor. O sid é o session ID, o identificador aleatório da sessão. Passo 1: o navegador envia POST /login com usuário carla e a senha. Passo 2: o servidor confere a senha, sorteia um sid novo e grava: 9f3c… é a carla, papel cliente. Passo 3: o servidor responde com Set-Cookie: sid=9f3c…, e o navegador guarda o sid no pote de cookies. Depois, em toda requisição ao mesmo site: passo 4, em destaque, o navegador envia GET /painel e anexa sozinho Cookie: sid=9f3c…, sem o código pedir. Passo 5: o servidor pergunta às sessões quem é 9f3c… e a resposta é a carla, cliente. Passo 6: o servidor responde 200 OK com Olá, carla. Caixa de destaque: o sid é uma credencial; quem apresentar 9f3c… entra como a carla, sem digitar senha. Separada e secundária: a proteção, explicada logo abaixo no texto, são os atributos do cookie, que limitam para onde e quando o sid é enviado. Legenda: cinza é o fluxo normal, azul é o sid, amarelo é o momento-chave.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .name { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .big { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .sid { fill: #60a5fa; }
    .key { fill: #facc15; }
    .actor { fill: #111827; stroke: #64748b; stroke-width: 1.4; }
    .life { stroke: #334155; stroke-width: 2; stroke-dasharray: 4 4; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-ret { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
    .edge-sid { stroke: #60a5fa; stroke-width: 2; fill: none; }
    .edge-key { stroke: #facc15; stroke-width: 3; fill: none; }
    .note-sid { fill: #0c1a33; stroke: #60a5fa; stroke-width: 1.2; }
    .keybox { fill: #1f1a07; stroke: #facc15; stroke-width: 2; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#facc15"/></marker>
  </defs>
  <rect width="960" height="720" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">O HTTP esquece, o cookie lembra:</text>
  <text class="title" x="30" y="68">quem apresenta o sid é a carla para o servidor</text>
  <text class="sub" x="30" y="92"><tspan class="sid">sid</tspan> = o session ID, o identificador aleatório que o servidor sorteia no login</text>

  <!-- participants -->
  <rect class="actor" data-graph-role="node" id="p-browser" x="50" y="112" width="200" height="38" rx="6"/>
  <text class="name" x="150" y="136" text-anchor="middle">Navegador</text>
  <rect class="actor" data-graph-role="node" id="p-server" x="380" y="112" width="200" height="38" rx="6"/>
  <text class="name" x="480" y="136" text-anchor="middle">Servidor</text>
  <rect class="actor" data-graph-role="node" id="p-store" x="700" y="112" width="200" height="38" rx="6"/>
  <text class="name" x="800" y="136" text-anchor="middle">Sessões guardadas</text>
  <line class="life" x1="150" y1="150" x2="150" y2="580"/>
  <line class="life" x1="480" y1="150" x2="480" y2="580"/>
  <line class="life" x1="800" y1="150" x2="800" y2="580"/>

  <!-- 1 login -->
  <text class="bold" x="166" y="186">1  POST /login</text>
  <text class="small" x="290" y="186">usuario=carla&amp;senha=…</text>
  <path class="edge" data-graph-role="edge" d="M152,198 L474,198" marker-end="url(#arrow-gray)"/>

  <!-- 2 server stores session -->
  <text class="bold" x="496" y="234">2  senha ok: sorteia sid novo</text>
  <path class="edge" data-graph-role="edge" d="M482,246 L794,246" marker-end="url(#arrow-gray)"/>
  <rect class="note-sid" x="690" y="258" width="240" height="30" rx="4"/>
  <text class="bold sid" x="704" y="278">9f3c… = carla, cliente</text>

  <!-- 3 Set-Cookie -->
  <text class="bold sid" x="166" y="314">3  Set-Cookie: sid=9f3c…</text>
  <path class="edge-sid" data-graph-role="edge" d="M478,326 L156,326" marker-end="url(#arrow-blue)"/>
  <rect class="note-sid" x="30" y="338" width="260" height="30" rx="4"/>
  <text class="small" x="44" y="358">guarda o <tspan class="sid">sid</tspan> no pote de cookies</text>

  <!-- later requests -->
  <text class="col" x="166" y="398">DEPOIS, EM TODA REQUISIÇÃO:</text>

  <!-- 4 key moment: the cookie goes along by itself -->
  <rect data-graph-role="decoration" data-owner="step-4" x="140" y="410" width="350" height="72" rx="6" fill="#facc15" fill-opacity="0.10" stroke="#facc15" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="bold" x="166" y="430">4  GET /painel   Cookie: <tspan class="sid">sid=9f3c…</tspan></text>
  <path class="edge-key" data-graph-role="edge" d="M152,444 L472,444" marker-end="url(#arrow-gold)"/>
  <text class="big key" x="166" y="470">o navegador anexa SOZINHO</text>

  <!-- 5 lookup -->
  <text class="bold" x="496" y="490">5  quem é <tspan class="sid">9f3c…</tspan>?</text>
  <path class="edge" data-graph-role="edge" d="M482,502 L794,502" marker-end="url(#arrow-gray)"/>
  <text class="bold" x="600" y="526">é a carla, cliente</text>
  <path class="edge-ret" data-graph-role="edge" d="M798,538 L486,538" marker-end="url(#arrow-gray)"/>

  <!-- 6 response -->
  <text class="bold" x="166" y="556">6  200 OK  "Olá, carla"</text>
  <path class="edge-ret" data-graph-role="edge" d="M478,568 L156,568" marker-end="url(#arrow-gray)"/>

  <!-- consequence: the sid is a credential -->
  <rect class="keybox" x="30" y="596" width="900" height="50" rx="8"/>
  <text class="big key" x="50" y="627">O sid é uma credencial: quem apresentar 9f3c… entra como a carla, sem senha.</text>

  <!-- defense: separate and secondary -->
  <rect class="panel" x="30" y="656" width="900" height="30" rx="6"/>
  <text class="small" x="46" y="676">Proteção (logo abaixo no texto): os atributos do cookie limitam para onde e quando o sid vai.</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="698" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="small" x="52" y="710">fluxo normal</text>
  <rect x="236" y="698" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="258" y="710">o sid</text>
  <rect x="400" y="698" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="422" y="710">o momento-chave</text>
  </g>
</svg>
