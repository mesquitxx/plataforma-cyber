<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">O mesmo dado, cinco lugares: o perigo depende de onde ele cai</title>
  <desc id="d">No topo, o dado digitado pelo usuário: O'Neil &lt;b&gt; &amp; Cia, com os caracteres que mandam em algum lugar em amarelo (a aspa, o menor-que, o maior-que e o e-comercial). Uma tabela mostra cinco lugares para onde esse dado pode ir. Para cada um: os caracteres que mandam ali, em amarelo; o que acontece se o dado entrar cru, em vermelho; e o tratamento certo, em verde. URL: mandam &amp; = # %; cru, o &amp; parte o parâmetro em dois; certo, percent-encoding, O%27Neil%20%3Cb%3E%20%26%20Cia. HTML: mandam &lt; &gt; &amp; e aspas; cru, o &lt;b&gt; vira tag de verdade e um &lt;script&gt; viraria código, que é XSS; certo, entidades HTML, O&amp;#39;Neil &amp;lt;b&amp;gt; &amp;amp; Cia. JavaScript: mandam as aspas e a barra invertida; cru, a aspa fecha a string e o resto vira código; certo, escape de JavaScript ou JSON. SQL: mandam a aspa, o ponto e vírgula e o traço duplo; cru, a aspa fecha o texto e o resto vira comando, que é SQL injection; certo, não escapar, e sim mandar o dado como parâmetro, separado do comando. Shell: mandam ponto e vírgula, barra vertical, e-comercial e cifrão; cru, o &amp; ou o ; começa outro comando, que é command injection; certo, uma lista de argumentos, sem passar pelo shell. Caixa de destaque: não existe limpar uma vez para tudo; cada lugar tem a sua regra, aplicada na saída, na hora em que o dado entra nele. Legenda: amarelo é o caractere que manda, vermelho é o que acontece se entrar cru, verde é o tratamento certo.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .name { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .big { font-size: 16px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .key { fill: #facc15; }
    .no { fill: #f87171; }
    .ok { fill: #34d399; }
    .strong { font-weight: 700; }
    .data { fill: #111827; stroke: #94a3b8; stroke-width: 1.6; }
    .row { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .ctx { fill: #111827; stroke: #64748b; stroke-width: 1.2; }
    .keybox { fill: #111827; stroke: #e2e8f0; stroke-width: 1.6; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="640" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">O mesmo dado, cinco lugares:</text>
  <text class="title" x="30" y="68">o perigo depende de onde ele cai</text>

  <!-- the user data -->
  <rect class="data" x="30" y="86" width="900" height="44" rx="6"/>
  <text class="lbl" x="46" y="114">dado digitado pelo usuário:</text>
  <text class="big" x="300" y="115">O<tspan class="key">'</tspan>Neil <tspan class="key">&lt;</tspan>b<tspan class="key">&gt;</tspan> <tspan class="key">&amp;</tspan> Cia</text>

  <!-- column headers -->
  <text class="col" x="46" y="160">LUGAR</text>
  <text class="col" x="160" y="160">QUEM MANDA</text>
  <text class="col" x="300" y="160">SE ENTRAR CRU</text>
  <text class="col" x="620" y="160">O CERTO</text>

  <!-- URL -->
  <rect class="row" x="30" y="170" width="900" height="56" rx="6"/>
  <text class="name" x="46" y="203">URL</text>
  <text class="bold key" x="160" y="203">&amp; = # %</text>
  <text class="bold no" x="300" y="194">o &amp; parte o parâmetro</text>
  <text class="bold no" x="300" y="214">em dois</text>
  <text class="small" x="620" y="194">percent-encoding:</text>
  <text class="bold ok" x="620" y="214">O%27Neil%20%3Cb%3E%20%26%20Cia</text>

  <!-- HTML -->
  <rect class="row" x="30" y="234" width="900" height="56" rx="6"/>
  <text class="name" x="46" y="267">HTML</text>
  <text class="bold key" x="160" y="267">&lt; &gt; &amp; " '</text>
  <text class="bold no" x="300" y="258">&lt;b&gt; vira tag de verdade;</text>
  <text class="bold no" x="300" y="278">&lt;script&gt; viraria código: XSS</text>
  <text class="small" x="620" y="258">entidades HTML:</text>
  <text class="bold ok" x="620" y="278">O&amp;#39;Neil &amp;lt;b&amp;gt; &amp;amp; Cia</text>

  <!-- JS -->
  <rect class="row" x="30" y="298" width="900" height="56" rx="6"/>
  <text class="name" x="46" y="331">JS</text>
  <text class="bold key" x="160" y="331">' " &#92;</text>
  <text class="bold no" x="300" y="322">a aspa fecha a string</text>
  <text class="bold no" x="300" y="342">e o resto vira código</text>
  <text class="small" x="620" y="322">escape de JavaScript / JSON:</text>
  <text class="bold ok" x="620" y="342">"O'Neil &#92;u003cb&#92;u003e &amp; Cia"</text>

  <!-- SQL -->
  <rect class="row" x="30" y="362" width="900" height="56" rx="6"/>
  <text class="name" x="46" y="395">SQL</text>
  <text class="bold key" x="160" y="395">' ; --</text>
  <text class="bold no" x="300" y="386">a aspa fecha o texto e o</text>
  <text class="bold no" x="300" y="406">resto vira comando: SQL injection</text>
  <text class="small" x="620" y="386">não escapar: mandar como</text>
  <text class="bold ok" x="620" y="406">parâmetro, separado do comando</text>

  <!-- shell -->
  <rect class="row" x="30" y="426" width="900" height="56" rx="6"/>
  <text class="name" x="46" y="459">shell</text>
  <text class="bold key" x="160" y="459">; | &amp; $</text>
  <text class="bold no" x="300" y="450">o &amp; ou o ; começa outro</text>
  <text class="bold no" x="300" y="470">comando: command injection</text>
  <text class="small" x="620" y="450">sem passar pelo shell:</text>
  <text class="bold ok" x="620" y="470">uma lista de argumentos</text>

  <!-- key takeaway -->
  <rect class="keybox" x="30" y="502" width="900" height="72" rx="8"/>
  <text class="big" x="50" y="532">Não existe "limpar uma vez para tudo": cada lugar tem a sua regra,</text>
  <text class="big" x="50" y="556">aplicada na SAÍDA, na hora em que o dado entra nele.</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="600" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="52" y="612">caractere que manda</text>
  <rect x="260" y="600" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="282" y="612">o que acontece se entrar cru</text>
  <rect x="560" y="600" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="582" y="612">o tratamento certo</text>
  </g>
</svg>
