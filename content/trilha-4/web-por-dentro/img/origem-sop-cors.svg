<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="960" height="716" role="img" aria-labelledby="t d">
  <title id="t">A SOP deixa enviar, mas não deixa ler: a resposta volta e o JavaScript não a recebe</title>
  <desc id="d">Parte 1: a origem é esquema mais host mais porta, e as três precisam bater. Comparando com a página em http://localhost:8041: http://localhost:8041/outra/pagina é a mesma origem, porque só o caminho muda; http://localhost:8042 é outra origem, porque a porta mudou; https://localhost:8041 é outra origem, porque o esquema mudou; http://127.0.0.1:8041 é outra origem, porque o host mudou, mesmo sendo a mesma máquina. A parte que muda está em amarelo. Parte 2: o JavaScript da página em :8041, dentro do navegador, chama a API em :8042, que é outra origem. Passo 1, em verde: a requisição é enviada, com o cookie junto, e chega; a API recebe e processa, e o efeito já aconteceu. Passo 2: a resposta volta ao navegador. Passo 3, em vermelho, o momento-chave: o navegador bloqueia a entrega e o JavaScript não lê a resposta. Caixa de destaque: não leu não quer dizer não chegou; a SOP bloqueia a leitura, não o envio. Resumo: enviar (formulário, link) é permitido; embutir (imagem, script) é permitido; ler a resposta pelo JavaScript é bloqueado, salvo se o servidor liberar com CORS, explicado logo adiante. Legenda: amarelo é a parte que muda e a ideia-chave, verde é permitido ou chegou, vermelho é bloqueado.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .name { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .big { font-size: 15px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .ok { fill: #34d399; }
    .no { fill: #f87171; }
    .key { fill: #facc15; }
    .strong { font-weight: 700; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .browser { fill: #0f172a; stroke: #64748b; stroke-width: 1.4; }
    .node { fill: #111827; stroke: #64748b; stroke-width: 1.4; }
    .api { fill: #111827; stroke: #10b981; stroke-width: 1.6; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-ok { stroke: #10b981; stroke-width: 2.4; fill: none; }
    .wall { stroke: #ef4444; stroke-width: 6; fill: none; stroke-linecap: round; }
    .keybox { fill: #1f1a07; stroke: #facc15; stroke-width: 2; }
    .chip-ok { fill: #052e1f; stroke: #10b981; stroke-width: 1.2; }
    .chip-no { fill: #2a1215; stroke: #ef4444; stroke-width: 1.2; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
  </defs>
  <rect width="960" height="716" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">A SOP deixa enviar, mas não deixa ler:</text>
  <text class="title" x="30" y="68">a resposta volta, e o JavaScript não a recebe</text>

  <!-- 1. what an origin is -->
  <rect class="panel" data-graph-role="container" x="30" y="88" width="900" height="166" rx="8"/>
  <text class="col" x="46" y="110">1. ORIGEM = ESQUEMA + HOST + PORTA (AS TRÊS PRECISAM BATER)</text>
  <text class="lbl" x="46" y="136">página em  <tspan class="strong">http://localhost:8041</tspan></text>
  <text class="lbl" x="46" y="166">http://localhost:8041/outra/pagina</text>
  <text class="bold" x="470" y="166">mesma origem</text>
  <text class="small" x="640" y="166">só o caminho muda</text>
  <text class="lbl" x="46" y="190">http://localhost:<tspan class="key strong">8042</tspan></text>
  <text class="bold" x="470" y="190">outra origem</text>
  <text class="small" x="640" y="190">a porta mudou</text>
  <text class="lbl" x="46" y="214"><tspan class="key strong">https</tspan>://localhost:8041</text>
  <text class="bold" x="470" y="214">outra origem</text>
  <text class="small" x="640" y="214">o esquema mudou</text>
  <text class="lbl" x="46" y="238">http://<tspan class="key strong">127.0.0.1</tspan>:8041</text>
  <text class="bold" x="470" y="238">outra origem</text>
  <text class="small" x="640" y="238">o host mudou (mesma máquina!)</text>

  <!-- 2. what the SOP does -->
  <text class="col" x="30" y="284">2. A PÁGINA EM :8041 CHAMA A API EM :8042 (OUTRA ORIGEM)</text>

  <rect class="browser" data-graph-role="container" x="30" y="298" width="410" height="226" rx="8"/>
  <text class="name" x="46" y="322">Navegador</text>
  <rect class="node" data-graph-role="node" id="n-js" x="50" y="346" width="180" height="120" rx="6"/>
  <text class="bold" x="64" y="372">JavaScript</text>
  <text class="small" x="64" y="392">da página :8041</text>
  <text class="small" x="64" y="450">espera a resposta</text>

  <rect class="api" data-graph-role="node" id="n-api" x="640" y="330" width="290" height="150" rx="6"/>
  <text class="name" x="656" y="358">API em :8042</text>
  <text class="lbl" x="656" y="384">recebe e processa</text>
  <text class="bold ok" x="656" y="414">o efeito no servidor</text>
  <text class="bold ok" x="656" y="434">já aconteceu</text>

  <!-- 1: request goes out and arrives -->
  <text class="bold ok" x="454" y="366">① envia: CHEGA</text>
  <text class="small" x="454" y="398">(o cookie vai junto)</text>
  <path class="edge-ok" data-graph-role="edge" d="M230,378 L634,378" marker-end="url(#arrow-green)"/>

  <!-- 2: response comes back, 3: blocked before the JS -->
  <text class="lbl" x="452" y="430">② a resposta volta</text>
  <path class="edge" data-graph-role="edge" d="M640,444 L300,444" marker-end="url(#arrow-gray)"/>
  <path class="wall" d="M290,414 L290,474"/>
  <text class="big no" x="252" y="494">③ BLOQUEADO:</text>
  <text class="bold no" x="252" y="512">o JavaScript não lê</text>

  <!-- consequence / key idea -->
  <rect class="keybox" x="30" y="540" width="900" height="54" rx="8"/>
  <text class="big key" x="50" y="573">Não leu ≠ não chegou: a SOP bloqueia a LEITURA, não o envio.</text>

  <!-- summary of the three cases -->
  <rect class="chip-ok" x="30" y="610" width="290" height="54" rx="6"/>
  <text class="bold ok" x="46" y="632">ENVIAR</text>
  <text class="small" x="46" y="652">formulário, link: permitido</text>
  <rect class="chip-ok" x="335" y="610" width="290" height="54" rx="6"/>
  <text class="bold ok" x="351" y="632">EMBUTIR</text>
  <text class="small" x="351" y="652">imagem, script: permitido</text>
  <rect class="chip-no" x="640" y="610" width="290" height="54" rx="6"/>
  <text class="bold no" x="656" y="632">LER a resposta pelo JS</text>
  <text class="small" x="656" y="652">bloqueado, salvo CORS (adiante)</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="684" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="52" y="696">parte que muda e ideia-chave</text>
  <rect x="330" y="684" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="352" y="696">permitido / chegou</text>
  <rect x="560" y="684" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="582" y="696">bloqueado</text>
  </g>
</svg>
