<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">Uma requisição, vários leitores: cada programa no caminho lê os mesmos bytes de novo</title>
  <desc id="d">Da esquerda para a direita, o caminho de uma requisição: navegador (monta a mensagem e anexa os cookies), rede (o DNS acha o IP e a conexão leva os bytes, sem interpretar), intermediário (fica na frente do site, lê a mensagem e repassa), aplicação (decodifica, vê quem é você e o que pode fazer) e banco ou shell (recebe um texto e decide se é dado ou comando). Quatro caixas têm um losango amarelo: são programas que leem e interpretam os mesmos bytes. Embaixo de cada uma, em vermelho, a falha que nasce ali e o módulo da trilha: navegador, XSS e CSRF (4.3 e 4.7); intermediário, ataques avançados (seção 6); aplicação, sessão e IDOR (4.4 e 4.5); banco ou shell, SQL injection e command injection (4.2 e 4.6). Em destaque, o momento-chave: a mesma mensagem, mas o intermediário acha que ela acaba num ponto e a aplicação acha que acaba noutro; cada um enxerga uma mensagem diferente, e é aí que nasce a falha. Legenda: cinza é o caminho normal, amarelo é um programa que lê e interpreta os bytes e o ponto em que cada um acha que a mensagem acaba, vermelho é a falha que nasce ali.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .name { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .tagt { font-size: 12px; font-weight: 700; fill: #f87171; }
    .small { font-size: 12px; fill: #94a3b8; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .reader { fill: #111827; stroke: #facc15; stroke-width: 1.6; }
    .net { fill: #0f172a; stroke: #64748b; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .tag { fill: #2a1215; stroke: #ef4444; stroke-width: 1.2; }
    .keybox { fill: #1f1a07; stroke: #facc15; stroke-width: 2; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .mark { stroke: #facc15; stroke-width: 3; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="620" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Uma requisição, vários leitores:</text>
  <text class="title" x="30" y="68">cada programa no caminho lê os mesmos bytes de novo</text>
  <text class="sub" x="30" y="92">https://loja.exemplo/busca?q=caneca sai do navegador e atravessa esta fila até o banco</text>

  <!-- path: 5 stops (w=160, gap=25) -->
  <rect class="reader" data-graph-role="node" id="n-browser" x="30" y="116" width="160" height="110" rx="6"/>
  <text class="name" x="44" y="144">Navegador</text>
  <text class="small" x="44" y="168">monta a mensagem</text>
  <text class="small" x="44" y="186">e anexa os</text>
  <text class="small" x="44" y="204">cookies</text>
  <path d="M176,108 l8,8 l-8,8 l-8,-8 z" fill="#facc15"/>

  <rect class="net" data-graph-role="node" id="n-net" x="215" y="116" width="160" height="110" rx="6"/>
  <text class="name" x="229" y="144">Rede</text>
  <text class="small" x="229" y="168">o DNS acha o IP;</text>
  <text class="small" x="229" y="186">a conexão leva</text>
  <text class="small" x="229" y="204">os bytes</text>

  <rect class="reader" data-graph-role="node" id="n-proxy" x="400" y="116" width="160" height="110" rx="6"/>
  <text class="name" x="414" y="144">Intermediário</text>
  <text class="small" x="414" y="168">fica na frente</text>
  <text class="small" x="414" y="186">do site, lê e</text>
  <text class="small" x="414" y="204">repassa</text>
  <path d="M546,108 l8,8 l-8,8 l-8,-8 z" fill="#facc15"/>

  <rect class="reader" data-graph-role="node" id="n-app" x="585" y="116" width="160" height="110" rx="6"/>
  <text class="name" x="599" y="144">Aplicação</text>
  <text class="small" x="599" y="168">decodifica, vê</text>
  <text class="small" x="599" y="186">quem é você e o</text>
  <text class="small" x="599" y="204">que pode fazer</text>
  <path d="M731,108 l8,8 l-8,8 l-8,-8 z" fill="#facc15"/>

  <rect class="reader" data-graph-role="node" id="n-db" x="770" y="116" width="160" height="110" rx="6"/>
  <text class="name" x="784" y="144">Banco / shell</text>
  <text class="small" x="784" y="168">recebe um texto:</text>
  <text class="small" x="784" y="186">é dado ou é</text>
  <text class="small" x="784" y="204">comando?</text>
  <path d="M916,108 l8,8 l-8,8 l-8,-8 z" fill="#facc15"/>

  <path class="edge" data-graph-role="edge" d="M190,171 L211,171" marker-end="url(#arrow-gray)"/>
  <path class="edge" data-graph-role="edge" d="M375,171 L396,171" marker-end="url(#arrow-gray)"/>
  <path class="edge" data-graph-role="edge" d="M560,171 L581,171" marker-end="url(#arrow-gray)"/>
  <path class="edge" data-graph-role="edge" d="M745,171 L766,171" marker-end="url(#arrow-gray)"/>

  <!-- failure born at each reader -->
  <text class="col" x="30" y="258">A FALHA QUE NASCE EM CADA LEITOR (E O MÓDULO DA TRILHA)</text>
  <rect class="tag" x="30" y="270" width="160" height="68" rx="6"/>
  <text class="tagt" x="44" y="292">XSS</text>
  <text class="tagt" x="44" y="310">CSRF</text>
  <text class="small" x="44" y="328">4.3 e 4.7</text>
  <text class="small" x="229" y="310">só transporta</text>
  <rect class="tag" x="400" y="270" width="160" height="68" rx="6"/>
  <text class="tagt" x="414" y="292">ataques</text>
  <text class="tagt" x="414" y="310">avançados</text>
  <text class="small" x="414" y="328">seção 6</text>
  <rect class="tag" x="585" y="270" width="160" height="68" rx="6"/>
  <text class="tagt" x="599" y="292">sessão</text>
  <text class="tagt" x="599" y="310">IDOR</text>
  <text class="small" x="599" y="328">4.4 e 4.5</text>
  <rect class="tag" x="770" y="270" width="160" height="68" rx="6"/>
  <text class="tagt" x="784" y="292">SQL injection</text>
  <text class="tagt" x="784" y="310">command injection</text>
  <text class="small" x="784" y="328">4.2 e 4.6</text>

  <!-- key moment: two readers disagree -->
  <rect class="keybox" x="30" y="362" width="900" height="186" rx="8" filter="url(#glow-gold)"/>
  <text class="name key" x="50" y="392">O momento-chave: dois leitores discordam</text>
  <text class="lbl" x="50" y="416">Os bytes são os mesmos, mas cada programa decide sozinho onde a mensagem acaba.</text>

  <!-- message bar; the two marks sit under the intermediário and aplicação columns -->
  <rect x="50" y="460" width="860" height="34" rx="4" fill="#111827" stroke="#64748b" stroke-width="1.2"/>
  <text class="lbl" x="64" y="482">POST /busca  +  cabeçalhos  +  corpo ...</text>
  <rect x="480" y="461" width="185" height="32" fill="#ef4444" fill-opacity="0.25"/>
  <text class="bold atk" x="572" y="482" text-anchor="middle">... mais bytes</text>
  <path class="mark" d="M480,450 L480,504"/>
  <path class="mark" d="M665,450 L665,504"/>
  <text class="bold key" x="474" y="446" text-anchor="end">o intermediário acha que acaba AQUI</text>
  <text class="bold key" x="671" y="446">a aplicação: AQUI</text>
  <text class="bold atk" x="480" y="528" text-anchor="middle">cada um enxerga uma mensagem diferente: é aí que nasce a falha</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="580" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="small" x="52" y="592">caminho normal</text>
  <path d="M232,580 l7,7 l-7,7 l-7,-7 z" fill="#facc15"/>
  <text class="small" x="248" y="592">programa que lê e interpreta os bytes</text>
  <rect x="580" y="580" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="602" y="592">a falha que nasce ali</text>
  </g>
</svg>
