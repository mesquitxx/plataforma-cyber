<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d">
  <title id="t">Controle de acesso só no cliente é decoração</title>
  <desc id="d">Comparação de dois caminhos até uma função privilegiada. No caminho de cima, o navegador esconde o botão de administração quando o usuário é um cliente comum: a interface não mostra a opção, mas isso é só aparência, porque a decisão roda no cliente. No caminho de baixo, o atacante ignora a interface e fala direto com a API do servidor, por exemplo com curl, pedindo a mesma função; como o servidor não refaz a verificação de papel, ele responde normalmente. A lição, marcada em verde, é que esconder o botão no front-end não protege nada: toda decisão de acesso precisa ser tomada e imposta no servidor, a cada requisição, porque o cliente está inteiramente sob o controle do atacante.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .r { fill: #f08a7e; }
  </style>
  <rect width="900" height="480" fill="#121815"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08a7e"/></marker>
  </defs>
  <text class="t" x="30" y="34">Esconder o botão não é controle de acesso</text>

  <!-- top path: UI hides button -->
  <rect x="30" y="64" width="300" height="120" rx="10" fill="#16201b" stroke="#9fb0a6"/>
  <text class="h" x="46" y="90" fill="#9fb0a6">navegador (cliente)</text>
  <text class="b" x="46" y="116">if (user.role !== "admin")</text>
  <text class="b" x="46" y="134">   esconder o botão "Admin"</text>
  <text class="s" x="46" y="158">a decisão roda no cliente —</text>
  <text class="s" x="46" y="174">e o cliente é do atacante</text>

  <text class="b" x="360" y="118">a UI só OMITE a opção</text>
  <text class="s" x="360" y="136">(aparência, não barreira)</text>

  <rect x="570" y="64" width="300" height="120" rx="10" fill="#16201b" stroke="#5cc8d8"/>
  <text class="h" x="586" y="90" fill="#5cc8d8">servidor + API</text>
  <text class="b" x="586" y="116">GET /api/Users, /admin/...</text>
  <text class="b" x="586" y="134">responde a quem pedir, se</text>
  <text class="b" x="586" y="152">não refizer a checagem de papel</text>

  <!-- bottom path: direct API -->
  <rect x="30" y="250" width="300" height="130" rx="10" fill="#16201b" stroke="#f08a7e"/>
  <text class="h r" x="46" y="276">atacante (ignora a UI)</text>
  <text class="b" x="46" y="302">não precisa do botão:</text>
  <text class="b" x="46" y="322">curl -H "Authorization: Bearer ..."</text>
  <text class="b" x="46" y="340">     http://alvo/api/Users</text>
  <text class="s" x="46" y="364">fala direto com o servidor</text>

  <line x1="330" y1="310" x2="570" y2="310" stroke="#f08a7e" stroke-width="1.5" marker-end="url(#arr)"/>
  <text class="b r" x="360" y="300">mesma função, sem passar pela tela</text>

  <rect x="570" y="250" width="300" height="130" rx="10" fill="#16201b" stroke="#f08a7e"/>
  <text class="h r" x="586" y="276">servidor responde</text>
  <text class="b" x="586" y="302">o endpoint não refaz a</text>
  <text class="b" x="586" y="322">verificação de papel →</text>
  <text class="b r" x="586" y="342">200 + dados privilegiados</text>
  <text class="s" x="586" y="364">forced browsing / API direta</text>

  <!-- lesson -->
  <rect x="30" y="406" width="840" height="56" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="46" y="430">Toda decisão de acesso é tomada e imposta no SERVIDOR, a cada requisição.</text>
  <text class="s" x="46" y="450">O front-end pode esconder o botão por conveniência, mas isso nunca substitui a checagem no servidor.</text>
</svg>
