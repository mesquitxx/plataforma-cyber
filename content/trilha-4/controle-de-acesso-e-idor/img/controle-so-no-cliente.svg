<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" role="img" aria-labelledby="t d">
  <title id="t">Esconder o botão não tranca a porta</title>
  <desc id="d">O atacante, um cliente comum logado, tem dois caminhos até uma função de administrador. Pelo caminho de cima, a tela do navegador roda a regra "se não é admin, esconde o botão Admin": o botão some da tela, e é só isso, porque essa decisão roda no navegador, que é do atacante. Pelo caminho de baixo, em vermelho, o atacante ignora a tela e pede a função direto ao servidor, com curl, em GET /api/Users. No servidor, a caixa amarela marca a falha: ele não confere se quem pede é admin. Então responde com dados de admin. Consequência: o atacante usa funções de admin sem nunca ver o botão. Separada, em verde, a defesa: o servidor confere o papel a cada pedido; esconder o botão é só conveniência. Legenda: vermelho é o caminho do atacante, amarelo é onde está a falha, verde é a defesa; cinza é a tela.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
    .code { font-size: 13px; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .def { fill: #34d399; }
    .gray { fill: #94a3b8; }
    .panel { fill: #0f172a; stroke: #475569; stroke-width: 1.2; }
    .panel-atk { fill: #1f1315; stroke: #ef4444; stroke-width: 1.8; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="570" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Esconder o botão NÃO tranca a porta</text>
  <text class="sub" x="30" y="66">A tela é do atacante; quem pode barrar o pedido é só o servidor.</text>

  <!-- attacker -->
  <rect class="panel-atk" x="30" y="120" width="200" height="200" rx="6"/>
  <text class="tag atk" x="46" y="150">ATACANTE</text>
  <text class="lbl" x="46" y="178">cliente comum,</text>
  <text class="lbl" x="46" y="198">logado</text>
  <text class="small" x="46" y="236">manda no próprio</text>
  <text class="small" x="46" y="254">navegador</text>

  <!-- top path: the screen -->
  <path class="edge" d="M230,170 L296,170" marker-end="url(#arrow-gray)"/>
  <text class="small" x="263" y="160" text-anchor="middle">tela</text>
  <rect class="panel" x="300" y="120" width="300" height="104" rx="6"/>
  <text class="bold gray" x="316" y="146">TELA DO NAVEGADOR</text>
  <text class="code" x="316" y="172">se não é admin:</text>
  <text class="code" x="316" y="192">  esconde o botão</text>
  <rect x="496" y="178" width="78" height="24" rx="4" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text class="small" x="535" y="195" text-anchor="middle">Admin</text>
  <line x1="500" y1="200" x2="570" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="small" x="316" y="214">o botão some, e só isso</text>

  <!-- bottom path: direct to the API -->
  <text class="bold atk" x="250" y="262">ignora a tela e pede direto:</text>
  <path class="edge-atk" d="M230,280 L656,280" marker-end="url(#arrow-red)"/>
  <text class="code atk" x="250" y="304">curl http://alvo/api/Users</text>

  <!-- server -->
  <rect class="panel" x="660" y="120" width="270" height="242" rx="6"/>
  <text class="tag" x="676" y="150">SERVIDOR (API)</text>
  <text class="small" x="676" y="196">recebe o pedido, venha</text>
  <text class="small" x="676" y="214">da tela ou não</text>
  <rect x="672" y="246" width="246" height="52" rx="5" fill="#2a2410" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="bold key" x="686" y="268">✗ não confere se</text>
  <text class="bold key" x="686" y="288">  quem pede é admin</text>
  <text class="lbl atk" x="676" y="324">→ responde com</text>
  <text class="bold atk" x="676" y="342">  dados de admin</text>

  <!-- consequence -->
  <rect x="30" y="378" width="900" height="56" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="bold atk" x="480" y="412" text-anchor="middle">O que o atacante ganha: usa funções de admin sem nunca ver o botão.</text>

  <!-- defense (secondary) -->
  <rect x="30" y="452" width="900" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="small" x="46" y="477"><tspan class="def">como se defende:</tspan> o servidor confere o papel a cada pedido; esconder o botão é só conveniência.</text>

  <!-- legend -->
  <rect x="30" y="522" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="52" y="534">caminho do atacante</text>
  <rect x="250" y="522" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="272" y="534">onde está a falha</text>
  <rect x="450" y="522" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="472" y="534">defesa</text>
  <rect x="580" y="522" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text class="small" x="602" y="534">tela (só aparência)</text>
</svg>
