<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Com o mesmo login, dá para andar de lado ou subir de nível</title>
  <desc id="d">Você, um cliente comum logado, está no canto inferior esquerdo; o servidor sabe quem você é. Uma seta para a direita, chamada horizontal, leva a outro cliente do mesmo nível: o atacante ganha o carrinho, os pedidos e as mensagens dele. Uma seta para cima, chamada vertical, leva ao administrador: o atacante ganha o painel de admin e a função de apagar usuários. Nas duas setas, um ponto amarelo marca onde o servidor não conferiu nada. A caixa amarela à direita diz que a falha é a mesma nos dois casos: o servidor sabe quem você é, mas não confere se você pode pegar este dado ou usar esta função. Separada, em verde, a defesa: na horizontal, conferir se o dado é seu; na vertical, conferir se você é admin. Legenda: azul é você, vermelho é o que o atacante alcança, amarelo é onde o servidor não conferiu, verde é a defesa.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .tag { font-size: 13px; font-weight: 700; letter-spacing: 0.06em; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .me { fill: #60a5fa; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .def { fill: #34d399; }
    .edge-atk { stroke: #ef4444; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Com o MESMO login: andar de lado ou subir de nível</text>
  <text class="sub" x="30" y="66">O atacante está logado com a própria conta e pede o que não é dele.</text>

  <!-- vertical target: admin -->
  <rect x="30" y="110" width="250" height="110" rx="6" fill="#1f1315" stroke="#ef4444" stroke-width="1.8"/>
  <text class="tag atk" x="46" y="138">ADMINISTRADOR</text>
  <text class="lbl" x="46" y="166">o atacante ganha:</text>
  <text class="lbl atk" x="46" y="188">painel de admin,</text>
  <text class="lbl atk" x="46" y="208">apagar usuários</text>

  <!-- vertical arrow -->
  <path class="edge-atk" d="M150,370 L150,314"/>
  <path class="edge-atk" d="M150,282 L150,226" marker-end="url(#arrow-red)"/>
  <circle cx="150" cy="298" r="13" fill="#2a2410" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="bold key" x="150" y="303" text-anchor="middle">?</text>
  <text class="tag atk" x="176" y="290">VERTICAL</text>
  <text class="small" x="176" y="310">sobe de nível</text>

  <!-- start: you -->
  <rect x="30" y="370" width="250" height="90" rx="6" fill="#0f1a2e" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="tag me" x="46" y="398">VOCÊ</text>
  <text class="lbl" x="46" y="424">cliente comum, logado</text>
  <text class="small" x="46" y="446">o servidor sabe quem é</text>

  <!-- horizontal arrow -->
  <path class="edge-atk" d="M280,415 L332,415"/>
  <path class="edge-atk" d="M364,415 L414,415" marker-end="url(#arrow-red)"/>
  <circle cx="348" cy="415" r="13" fill="#2a2410" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="bold key" x="348" y="420" text-anchor="middle">?</text>
  <text class="tag atk" x="348" y="388" text-anchor="middle">HORIZONTAL</text>
  <text class="small" x="348" y="450" text-anchor="middle">anda de lado</text>

  <!-- horizontal target: other customer -->
  <rect x="420" y="370" width="220" height="90" rx="6" fill="#1f1315" stroke="#ef4444" stroke-width="1.8"/>
  <text class="tag atk" x="436" y="398">OUTRO CLIENTE</text>
  <text class="lbl" x="436" y="422">o atacante ganha:</text>
  <text class="lbl atk" x="436" y="444">carrinho, pedidos...</text>

  <!-- the flaw -->
  <rect x="680" y="110" width="250" height="220" rx="6" fill="#2a2410" stroke="#facc15" stroke-width="2"/>
  <text class="tag key" x="696" y="140">A FALHA É A MESMA</text>
  <text class="tag key" x="696" y="160">NOS DOIS CASOS</text>
  <text class="lbl" x="696" y="194">O servidor sabe</text>
  <text class="lbl" x="696" y="214"><tspan class="bold">QUEM</tspan> você é,</text>
  <text class="lbl" x="696" y="242">mas não confere se</text>
  <text class="lbl" x="696" y="262">você <tspan class="bold key">PODE</tspan> pegar</text>
  <text class="lbl" x="696" y="282">ESTE dado ou usar</text>
  <text class="lbl" x="696" y="302">ESTA função.</text>

  <!-- defense (secondary) -->
  <rect x="680" y="356" width="250" height="116" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="small def" x="696" y="378">como se defende:</text>
  <text class="small" x="696" y="400">horizontal: conferir</text>
  <text class="small" x="696" y="418">se o dado é SEU</text>
  <text class="small" x="696" y="444">vertical: conferir</text>
  <text class="small" x="696" y="462">se você é ADMIN</text>

  <!-- legend -->
  <rect x="30" y="508" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="52" y="520">você</text>
  <rect x="140" y="508" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="162" y="520">o que o atacante alcança</text>
  <rect x="400" y="508" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="422" y="520">onde o servidor não conferiu</text>
  <rect x="690" y="508" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="712" y="520">defesa</text>
</svg>
