<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">IDOR: trocar só o número entrega o carrinho de outra pessoa</title>
  <desc id="d">Duas linhas comparam dois pedidos do mesmo atacante, logado como usuário 25 e dono do carrinho 6. No pedido normal, ele pede GET /rest/basket/6 com o seu token; o servidor confere que o login é válido e que o carrinho 6 é dele, e devolve o carrinho 6, o dele. No ataque, ele troca só o número para GET /rest/basket/1, com o mesmo token. O número 1, em destaque, é a única mudança. O servidor confere de novo que o login é válido, mas a pergunta "este carrinho é seu?" ninguém faz: é aí que está a falha, marcada em amarelo. O servidor devolve o carrinho 1, que é do administrador. Consequência: o atacante lê o carrinho de qualquer pessoa só mudando o número, logado com a própria conta. Separada, em verde, a defesa: no servidor, comparar o dono do carrinho com quem está logado e negar se não bater. Legenda: azul é o que é seu, vermelho é o que é de outra pessoa, amarelo é onde está a falha, verde é a defesa.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .code { font-size: 14px; }
    .big { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .me { fill: #60a5fa; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .def { fill: #34d399; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .panel-me { fill: #0f1a2e; stroke: #3b82f6; stroke-width: 1.5; }
    .panel-atk { fill: #1f1315; stroke: #ef4444; stroke-width: 1.8; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="580" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Muda o número, muda o dono, e ninguém confere</text>
  <text class="sub" x="30" y="66">O atacante está logado como ele mesmo (usuário 25, dono do carrinho 6).</text>

  <!-- column headers -->
  <text class="col" x="30" y="106">1. O ATACANTE PEDE</text>
  <text class="col" x="320" y="106">2. O SERVIDOR CONFERE</text>
  <text class="col" x="690" y="106">3. O SERVIDOR DEVOLVE</text>

  <!-- row A: normal request -->
  <text class="tag me" x="30" y="134">PEDIDO NORMAL</text>
  <rect class="panel-me" x="30" y="144" width="250" height="76" rx="6"/>
  <text class="code" x="46" y="176">GET /rest/basket/<tspan class="big me">6</tspan></text>
  <text class="small" x="46" y="202">+ o seu token (login)</text>
  <path class="edge" d="M280,182 L316,182" marker-end="url(#arrow-gray)"/>

  <rect class="panel" x="320" y="144" width="330" height="76" rx="6"/>
  <text class="lbl" x="336" y="174"><tspan class="bold me">✓</tspan> o login é válido?  sim</text>
  <text class="lbl" x="336" y="200"><tspan class="bold me">✓</tspan> o carrinho é seu?  sim</text>
  <path class="edge" d="M650,182 L686,182" marker-end="url(#arrow-gray)"/>

  <rect class="panel-me" x="690" y="144" width="240" height="76" rx="6"/>
  <text class="bold" x="706" y="174">carrinho 6</text>
  <text class="lbl me" x="706" y="200">o seu (tudo certo)</text>

  <!-- row B: attack -->
  <text class="tag atk" x="30" y="268">ATAQUE: TROCA SÓ O NÚMERO</text>
  <rect class="panel-atk" x="30" y="278" width="250" height="100" rx="6"/>
  <text class="code" x="46" y="316">GET /rest/basket/</text>
  <rect x="196" y="296" width="26" height="28" rx="5" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="big atk" x="209" y="316" text-anchor="middle">1</text>
  <text class="small" x="46" y="344">+ o MESMO token</text>
  <text class="small" x="46" y="364">(antes era 6)</text>
  <path class="edge-atk" d="M280,328 L316,328" marker-end="url(#arrow-red)"/>

  <rect class="panel-atk" x="320" y="278" width="330" height="100" rx="6"/>
  <text class="lbl" x="336" y="304"><tspan class="bold me">✓</tspan> o login é válido?  sim</text>
  <rect x="332" y="318" width="306" height="48" rx="5" fill="#2a2410" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="bold key" x="346" y="338">✗ o carrinho é seu?</text>
  <text class="lbl key" x="346" y="358">ninguém pergunta  ← a falha</text>
  <path class="edge-atk" d="M650,328 L686,328" marker-end="url(#arrow-red)"/>

  <rect class="panel-atk" x="690" y="278" width="240" height="100" rx="6"/>
  <text class="bold" x="706" y="308">carrinho 1</text>
  <text class="lbl atk" x="706" y="334">que é do</text>
  <text class="big atk" x="706" y="358">ADMINISTRADOR</text>

  <!-- consequence -->
  <rect x="30" y="404" width="900" height="64" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="bold atk" x="480" y="430" text-anchor="middle">O que o atacante ganha: lê o carrinho de QUALQUER pessoa</text>
  <text class="bold atk" x="480" y="452" text-anchor="middle">só mudando o número, logado com a própria conta.</text>

  <!-- defense (secondary) -->
  <rect x="30" y="484" width="900" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="small" x="46" y="509"><tspan class="def">como se defende:</tspan> no servidor, comparar o dono do carrinho com quem está logado; se não bater, negar.</text>

  <!-- legend -->
  <rect x="30" y="546" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="52" y="558">o que é seu</text>
  <rect x="200" y="546" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="222" y="558">de outra pessoa</text>
  <rect x="400" y="546" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="422" y="558">onde está a falha</text>
  <rect x="600" y="546" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="622" y="558">defesa</text>
</svg>
