<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">REST confere o acesso em cada endpoint; GraphQL tem uma porta só e precisa conferir em cada resolver</title>
  <desc id="d">Dois painéis lado a lado. À esquerda, REST com muitos endpoints: o cliente faz três chamadas, GET /users/25, GET /baskets/6 e GET /orders/42, e cada endpoint tem a sua própria checagem de acesso, marcada em amarelo; se um endpoint esquecer, só aquele recurso vaza. À direita, GraphQL com um endpoint só: o cliente manda uma única query para POST /graphql. A porta confere apenas se o cliente está logado. Lá dentro, o schema distribui o trabalho para três resolvers, um por campo: user, basket e orders. Em cada resolver aparece, em amarelo, a pergunta "este dado é seu?", porque é ali que a checagem precisa estar. Embaixo, em destaque, a ideia principal: em GraphQL, conferir só a porta /graphql não basta; uma única query logada pode pedir dados que não são seus, então cada resolver precisa conferir o acesso. Legenda: azul é o cliente e o seu pedido, cinza são as partes do servidor, amarelo é onde a checagem de acesso precisa estar.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .head { font-size: 15px; font-weight: 700; }
    .code { font-size: 13px; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .me { fill: #60a5fa; }
    .key { fill: #facc15; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .panel-me { fill: #0f1a2e; stroke: #3b82f6; stroke-width: 1.5; }
    .chk { fill: #2a2410; stroke: #facc15; stroke-width: 1.6; }
    .edge { stroke: #60a5fa; stroke-width: 2; fill: none; }
    .edge-s { stroke: #64748b; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Onde a checagem de acesso precisa morar</text>
  <text class="sub" x="30" y="66">REST: uma checagem por endpoint. GraphQL: uma porta só, e a checagem desce para cada resolver.</text>

  <!-- REST panel -->
  <rect class="panel" data-graph-role="container" x="30" y="88" width="420" height="330" rx="8"/>
  <text class="head me" x="50" y="118">REST — muitos endpoints</text>

  <rect class="panel-me" x="50" y="200" width="100" height="56" rx="6"/>
  <text class="bold" x="100" y="233" text-anchor="middle">cliente</text>

  <path class="edge" d="M150,220 C180,220 180,166 206,166" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M150,228 L206,228" marker-end="url(#arrow-blue)"/>
  <path class="edge" d="M150,236 C180,236 180,290 206,290" marker-end="url(#arrow-blue)"/>

  <rect class="panel" x="210" y="142" width="220" height="48" rx="6"/>
  <text class="code" x="224" y="171">GET /users/25</text>
  <rect class="chk" x="346" y="152" width="72" height="28" rx="5"/>
  <text class="bold key" x="382" y="171" text-anchor="middle">é seu?</text>

  <rect class="panel" x="210" y="204" width="220" height="48" rx="6"/>
  <text class="code" x="224" y="233">GET /baskets/6</text>
  <rect class="chk" x="346" y="214" width="72" height="28" rx="5"/>
  <text class="bold key" x="382" y="233" text-anchor="middle">é seu?</text>

  <rect class="panel" x="210" y="266" width="220" height="48" rx="6"/>
  <text class="code" x="224" y="295">GET /orders/42</text>
  <rect class="chk" x="346" y="276" width="72" height="28" rx="5"/>
  <text class="bold key" x="382" y="295" text-anchor="middle">é seu?</text>

  <text class="lbl" x="50" y="356">3 pedidos, 3 endpoints,</text>
  <text class="lbl key" x="50" y="378">cada um com a sua checagem.</text>
  <text class="small" x="50" y="400">Se um esquece, só aquele recurso vaza.</text>

  <!-- GraphQL panel -->
  <rect class="panel" data-graph-role="container" x="470" y="88" width="460" height="330" rx="8"/>
  <text class="head me" x="490" y="118">GraphQL — um endpoint só</text>

  <rect class="panel-me" x="490" y="140" width="100" height="56" rx="6"/>
  <text class="bold" x="540" y="166" text-anchor="middle">cliente</text>
  <text class="small" x="540" y="184" text-anchor="middle">1 query</text>
  <path class="edge" d="M590,168 L626,168" marker-end="url(#arrow-blue)"/>

  <rect class="panel" x="630" y="136" width="280" height="64" rx="6"/>
  <text class="code" x="646" y="162">POST /graphql</text>
  <text class="small" x="646" y="186">a porta só confere: está logado? ✓</text>

  <path class="edge-s" d="M770,200 L770,220" marker-end="url(#arrow-gray)"/>
  <text class="small" x="780" y="216">o schema reparte</text>
  <path class="edge-s" d="M770,224 C770,236 560,232 560,252" marker-end="url(#arrow-gray)"/>
  <path class="edge-s" d="M770,224 L700,252" marker-end="url(#arrow-gray)"/>
  <path class="edge-s" d="M770,224 C770,236 840,232 840,252" marker-end="url(#arrow-gray)"/>

  <rect class="panel" x="490" y="256" width="136" height="110" rx="6"/>
  <text class="small" x="558" y="278" text-anchor="middle">resolver</text>
  <text class="bold" x="558" y="300" text-anchor="middle">user</text>
  <rect class="chk" x="500" y="314" width="116" height="40" rx="5" filter="url(#glow-gold)"/>
  <text class="bold key" x="558" y="339" text-anchor="middle">é seu?</text>

  <rect class="panel" x="632" y="256" width="136" height="110" rx="6"/>
  <text class="small" x="700" y="278" text-anchor="middle">resolver</text>
  <text class="bold" x="700" y="300" text-anchor="middle">basket</text>
  <rect class="chk" x="642" y="314" width="116" height="40" rx="5" filter="url(#glow-gold)"/>
  <text class="bold key" x="700" y="339" text-anchor="middle">é seu?</text>

  <rect class="panel" x="774" y="256" width="136" height="110" rx="6"/>
  <text class="small" x="842" y="278" text-anchor="middle">resolver</text>
  <text class="bold" x="842" y="300" text-anchor="middle">orders</text>
  <rect class="chk" x="784" y="314" width="116" height="40" rx="5" filter="url(#glow-gold)"/>
  <text class="bold key" x="842" y="339" text-anchor="middle">é seu?</text>

  <text class="small" x="490" y="400">cada resolver busca um campo — e precisa conferir</text>

  <!-- main idea -->
  <rect x="30" y="440" width="900" height="96" rx="8" fill="#2a2410" stroke="#facc15" stroke-width="2"/>
  <text class="head key" x="480" y="472" text-anchor="middle">Em GraphQL, conferir só a porta /graphql não basta.</text>
  <text class="lbl" x="480" y="498" text-anchor="middle">Uma única query, de alguém logado, pode pedir dados que não são dele.</text>
  <text class="bold" x="480" y="520" text-anchor="middle">Cada resolver precisa perguntar: “este dado é seu?”</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="560" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="52" y="572">cliente e o seu pedido</text>
  <rect x="290" y="560" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="small" x="312" y="572">partes do servidor</text>
  <rect x="520" y="560" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="542" y="572">onde a checagem de acesso precisa estar</text>
  </g>
</svg>
