<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">REST com muitos endpoints contra GraphQL com um endpoint só</title>
  <desc id="d">Comparação de duas arquiteturas de API. À esquerda, o estilo REST: o cliente fala com vários endpoints diferentes, um por recurso — barra users barra 25, barra baskets barra 6, barra orders barra 42 —, e cada endpoint é um ponto onde o servidor precisa checar a autorização; se um endpoint esquece a checagem, só aquele recurso vaza. À direita, o estilo GraphQL: o cliente manda todas as consultas para um único endpoint, barra graphql, que recebe uma query descrevendo exatamente os campos desejados; esse endpoint consulta o schema e distribui o trabalho para vários resolvers, um por campo, e cada resolver é quem busca o dado na sua fonte. A lição, numa faixa embaixo: em REST a autorização mora em cada endpoint; em GraphQL ela precisa morar em cada resolver, porque um só endpoint esconde dezenas de operações, e uma única query pode tocar muitos objetos de uma vez. Autenticar o endpoint não basta; cada campo resolvido precisa decidir se o chamador pode vê-lo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .c { font-size: 11.5px; fill: #e8c46a; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .r { fill: #f08a7e; }
  </style>
  <rect width="900" height="520" fill="#121815"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
  </defs>
  <text class="t" x="30" y="34">Duas APIs, duas superfícies: onde a autorização precisa estar</text>

  <!-- REST side -->
  <text class="h" x="40" y="74" fill="#5cc8d8">REST — muitos endpoints</text>
  <rect x="30" y="92" width="130" height="40" rx="8" fill="#16201b" stroke="#5cc8d8"/>
  <text class="b" x="95" y="117" text-anchor="middle">cliente</text>
  <line x1="160" y1="112" x2="250" y2="100" stroke="#5cc8d8" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="160" y1="112" x2="250" y2="160" stroke="#5cc8d8" stroke-width="1.4" marker-end="url(#ar)"/>
  <line x1="160" y1="112" x2="250" y2="220" stroke="#5cc8d8" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="250" y="82" width="190" height="36" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="b" x="262" y="105">GET /users/25</text>
  <rect x="250" y="142" width="190" height="36" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="b" x="262" y="165">GET /baskets/6</text>
  <rect x="250" y="202" width="190" height="36" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="b" x="262" y="225">GET /orders/42</text>
  <text class="s" x="250" y="262">cada endpoint = um ponto</text>
  <text class="s" x="250" y="278">que precisa checar o acesso</text>

  <!-- divider -->
  <line x1="460" y1="70" x2="460" y2="300" stroke="#2a3a31" stroke-width="1"/>

  <!-- GraphQL side -->
  <text class="h" x="480" y="74" fill="#5ee08a">GraphQL — um endpoint só</text>
  <rect x="480" y="92" width="120" height="40" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b" x="540" y="117" text-anchor="middle">cliente</text>
  <line x1="600" y1="112" x2="660" y2="112" stroke="#5cc8d8" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="660" y="90" width="210" height="44" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="672" y="110">POST /graphql</text>
  <text class="s" x="672" y="126">uma query, campos à escolha</text>
  <line x1="765" y1="134" x2="765" y2="162" stroke="#5cc8d8" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="640" y="162" width="250" height="34" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="b" x="652" y="184">schema (tipos + campos)</text>
  <line x1="700" y1="196" x2="680" y2="222" stroke="#5cc8d8" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="765" y1="196" x2="765" y2="222" stroke="#5cc8d8" stroke-width="1.2" marker-end="url(#ar)"/>
  <line x1="830" y1="196" x2="850" y2="222" stroke="#5cc8d8" stroke-width="1.2" marker-end="url(#ar)"/>
  <rect x="628" y="222" width="80" height="32" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="s" x="668" y="242" text-anchor="middle">resolver</text>
  <rect x="724" y="222" width="80" height="32" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="s" x="764" y="242" text-anchor="middle">resolver</text>
  <rect x="820" y="222" width="70" height="32" rx="6" fill="#16201b" stroke="#2a3a31"/>
  <text class="s" x="855" y="242" text-anchor="middle">resolver</text>
  <text class="s" x="628" y="278">cada resolver busca um campo</text>
  <text class="s" x="628" y="294">numa fonte de dados</text>

  <rect x="30" y="320" width="840" height="76" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="46" y="346">A lição: em REST a autorização mora em CADA endpoint; em GraphQL, em CADA resolver.</text>
  <text class="b" x="46" y="366">Um único /graphql esconde dezenas de operações, e uma só query pode tocar muitos objetos.</text>
  <text class="s" x="46" y="386">Autenticar o endpoint não basta: cada campo resolvido decide se o chamador pode vê-lo.</text>

  <text class="c" x="30" y="430">O erro recorrente das APIs não é injeção — é autorização: o servidor confia no id</text>
  <text class="c" x="30" y="450">que o cliente manda e devolve o objeto sem conferir de quem ele é (BOLA/IDOR).</text>
  <text class="s" x="30" y="474">Por isso o risco nº 1 do OWASP API Security Top 10 é Broken Object Level Authorization.</text>
</svg>
