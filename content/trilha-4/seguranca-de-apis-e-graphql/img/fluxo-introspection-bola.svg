<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="t d">
  <title id="t">Com o mapa da introspection, o atacante pede à API o que a tela esconde</title>
  <desc id="d">Caminho do ataque contra a API GraphQL da DVGA, tudo pelo mesmo POST /graphql. Passo 1, pedir o mapa: o atacante manda uma introspection query e o servidor devolve o schema, que revela a query pastes com o argumento public e a mutation login. Daí saem dois caminhos. Caminho 2A, pedir o que a tela esconde: o atacante pede pastes com public igual a false, e os campos content, ipAddr e owner. A tela só lista os pastes públicos. A falha, em amarelo: nenhum resolver pergunta se o paste é de quem pede. O que o atacante ganha, em vermelho: os pastes privados de outro usuário, com conteúdo e IP. Caminho 2B, muitas senhas num pedido só: com aliases a, b e c, o atacante chama login três vezes, com três senhas diferentes, numa única requisição. A falha, em amarelo: o limite de taxa conta um pedido e não vê as três tentativas. O que o atacante ganha, em vermelho: o alias com a senha certa devolve o token JWT do admin. Separada e em segundo plano, em verde tracejado, a defesa: conferir o acesso em cada resolver e limitar pelo custo do pedido, não pelo número de requisições; desligar a introspection ajuda, mas não basta. Legenda: cinza é o pedido do atacante, amarelo é onde está a falha, vermelho é o que o atacante ganha, verde é a defesa.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .code { font-size: 13px; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .big { font-size: 14px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .def { fill: #34d399; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .req { fill: #111827; stroke: #64748b; stroke-width: 1.4; }
    .flaw { fill: #2a2410; stroke: #facc15; stroke-width: 2; }
    .gain { fill: #2a1215; stroke: #ef4444; stroke-width: 2; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="630" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">Com o mapa da API, o atacante pede o que a tela esconde</text>
  <text class="sub" x="30" y="66">Tudo vai para o mesmo POST /graphql da DVGA (o laboratório local).</text>

  <!-- step 1: the map -->
  <rect class="panel" data-graph-role="container" x="30" y="84" width="900" height="100" rx="8"/>
  <text class="col" x="46" y="106">1. PEDIR O MAPA (introspection)</text>
  <rect class="req" x="46" y="118" width="410" height="50" rx="6"/>
  <text class="code" x="60" y="148">query{ __schema{ types{ fields } } }</text>
  <path class="edge" d="M456,143 L496,143" marker-end="url(#arrow-gray)"/>
  <rect class="panel" x="500" y="118" width="414" height="50" rx="6"/>
  <text class="small" x="514" y="138">o schema volta inteiro e revela:</text>
  <text class="bold" x="514" y="158">pastes(public)   e   login(...)</text>

  <path class="edge" d="M250,184 L250,206" marker-end="url(#arrow-gray)"/>
  <path class="edge" d="M710,184 L710,206" marker-end="url(#arrow-gray)"/>

  <!-- branch A: hidden data -->
  <rect class="panel" data-graph-role="container" x="30" y="210" width="440" height="282" rx="8"/>
  <text class="col" x="46" y="234">2A. PEDIR O QUE A TELA ESCONDE</text>
  <rect class="req" x="46" y="246" width="408" height="66" rx="6"/>
  <text class="code" x="60" y="272">pastes(public: <tspan class="big">false</tspan>){</text>
  <text class="code" x="60" y="296">  content ipAddr owner{name} }</text>
  <text class="small" x="46" y="332">a tela só lista os pastes públicos</text>
  <path class="edge" d="M420,312 L420,342" marker-end="url(#arrow-gray)"/>

  <rect class="flaw" x="46" y="346" width="408" height="52" rx="6" filter="url(#glow-gold)"/>
  <text class="bold key" x="60" y="367">✗ este paste é de quem pede?</text>
  <text class="lbl key" x="60" y="388">nenhum resolver pergunta  ← a falha</text>
  <path class="edge-atk" d="M250,398 L250,420" marker-end="url(#arrow-red)"/>

  <rect class="gain" x="46" y="424" width="408" height="54" rx="6"/>
  <text class="bold atk" x="60" y="446">GANHA: os pastes PRIVADOS</text>
  <text class="lbl atk" x="60" y="468">de outro usuário, com conteúdo e IP</text>

  <!-- branch B: many passwords in one request -->
  <rect class="panel" data-graph-role="container" x="490" y="210" width="440" height="282" rx="8"/>
  <text class="col" x="506" y="234">2B. MUITAS SENHAS NUM PEDIDO SÓ</text>
  <rect class="req" x="506" y="246" width="408" height="66" rx="6"/>
  <text class="code" x="520" y="266"><tspan class="big">a:</tspan> login(admin, senha 1)</text>
  <text class="code" x="520" y="284"><tspan class="big">b:</tspan> login(admin, senha 2)</text>
  <text class="code" x="520" y="302"><tspan class="big">c:</tspan> login(admin, senha 3)  …</text>
  <text class="small" x="506" y="332">aliases: 3 tentativas dentro de 1 pedido</text>
  <path class="edge" d="M880,312 L880,342" marker-end="url(#arrow-gray)"/>

  <rect class="flaw" x="506" y="346" width="408" height="52" rx="6" filter="url(#glow-gold)"/>
  <text class="bold key" x="520" y="367">✗ o limite de taxa conta “1 pedido”</text>
  <text class="lbl key" x="520" y="388">e não vê as 3 tentativas  ← a falha</text>
  <path class="edge-atk" d="M710,398 L710,420" marker-end="url(#arrow-red)"/>

  <rect class="gain" x="506" y="424" width="408" height="54" rx="6"/>
  <text class="bold atk" x="520" y="446">GANHA: o token (JWT) do admin</text>
  <text class="lbl atk" x="520" y="468">o alias com a senha certa o devolve</text>

  <!-- defense (secondary) -->
  <rect x="30" y="510" width="900" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="small" x="46" y="534"><tspan class="def">como se defende:</tspan> conferir o acesso em CADA resolver e limitar pelo custo do</text>
  <text class="small" x="46" y="554">pedido, não pelo nº de requisições. Desligar a introspection ajuda, mas não basta.</text>

  <!-- legend -->
  <g id="legend">
  <rect x="30" y="590" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="small" x="52" y="602">pedido do atacante</text>
  <rect x="250" y="590" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="272" y="602">onde está a falha</text>
  <rect x="470" y="590" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="492" y="602">o que o atacante ganha</text>
  <rect x="720" y="590" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="742" y="602">defesa</text>
  </g>
</svg>
