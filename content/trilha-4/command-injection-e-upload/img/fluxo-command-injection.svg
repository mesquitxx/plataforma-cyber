<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">O ponto e vírgula digitado vira um segundo comando no servidor</title>
  <desc id="d">Duas linhas comparam a mesma ferramenta de ping, que cola o texto digitado no fim do comando fixo "ping -c 4 ". No uso normal, a pessoa digita 127.0.0.1, a aplicação monta ping -c 4 127.0.0.1 e o shell roda um comando só, devolvendo a saída do ping. No ataque, a pessoa digita 127.0.0.1; cat /etc/passwd. A aplicação monta ping -c 4 127.0.0.1; cat /etc/passwd, e o ponto e vírgula, em destaque, é onde está a falha: ele separa comandos, então o shell lê dois comandos e roda o ping e também o cat, devolvendo o conteúdo de /etc/passwd. Consequência: o atacante roda o comando que quiser no servidor, com o mesmo direito do comando legítimo. A legenda indica azul para o texto fixo do programador, verde para o dado esperado, vermelho para o trecho injetado pelo atacante e amarelo para o ponto da falha.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.04em; }
    .tag { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; }
    .code { font-size: 13px; }
    .big { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .small { font-size: 12px; fill: #94a3b8; }
    .fix { fill: #60a5fa; }
    .ok { fill: #34d399; }
    .atk { fill: #f87171; font-weight: 700; }
    .key { fill: #facc15; font-weight: 700; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .panel-ok { fill: #0f172a; stroke: #10b981; stroke-width: 1.5; }
    .panel-atk { fill: #1f1315; stroke: #ef4444; stroke-width: 1.8; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">O <tspan class="key">;</tspan> digitado vira um SEGUNDO comando no servidor</text>
  <text class="sub" x="30" y="66">A aplicação cola o que você digita no comando, e o shell não separa dado de comando.</text>

  <!-- column headers -->
  <text class="col" x="30" y="106">1. VOCÊ DIGITA NO CAMPO</text>
  <text class="col" x="290" y="106">2. A APLICAÇÃO MONTA O COMANDO</text>
  <text class="col" x="720" y="106">3. O SHELL EXECUTA</text>

  <!-- row A: normal use -->
  <text class="tag ok" x="30" y="134">USO NORMAL</text>
  <rect class="panel-ok" x="30" y="144" width="220" height="64" rx="6"/>
  <text class="big ok" x="140" y="182" text-anchor="middle">127.0.0.1</text>
  <path class="edge" d="M250,176 L286,176" marker-end="url(#arrow-gray)"/>

  <rect class="panel" x="290" y="144" width="390" height="64" rx="6"/>
  <text class="code" x="464" y="181" text-anchor="end"><tspan class="fix">ping -c 4</tspan><tspan class="ok" dx="8">127.0.0.1</tspan></text>
  <path class="edge" d="M680,176 L716,176" marker-end="url(#arrow-gray)"/>

  <rect class="panel" x="720" y="144" width="210" height="64" rx="6"/>
  <text class="bold" x="736" y="170">roda 1 comando</text>
  <text class="lbl ok" x="736" y="192">saída do ping</text>

  <!-- row B: attack -->
  <text class="tag atk" x="30" y="256">ATAQUE</text>
  <rect class="panel-atk" x="30" y="266" width="220" height="112" rx="6"/>
  <text class="big ok" x="46" y="308">127.0.0.1</text>
  <text class="big atk" x="46" y="334">; cat /etc/passwd</text>
  <path class="edge-atk" d="M250,312 L286,312" marker-end="url(#arrow-red)"/>

  <rect class="panel-atk" x="290" y="266" width="390" height="112" rx="6"/>
  <text class="code" x="464" y="304" text-anchor="end"><tspan class="fix">ping -c 4</tspan><tspan class="ok" dx="8">127.0.0.1</tspan></text>
  <rect x="470" y="284" width="28" height="28" rx="5" fill="#2a2410" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="big key" x="484" y="304" text-anchor="middle">;</text>
  <text class="code atk" x="506" y="304">cat /etc/passwd</text>
  <polygon points="484,318 477,330 491,330" fill="#facc15"/>
  <text class="lbl key" x="484" y="358" text-anchor="middle">a falha: o ; separa comandos</text>
  <path class="edge-atk" d="M680,312 L716,312" marker-end="url(#arrow-red)"/>

  <rect class="panel-atk" x="720" y="266" width="210" height="112" rx="6"/>
  <text class="bold" x="736" y="292">roda 2 comandos</text>
  <text class="lbl ok" x="736" y="316">saída do ping</text>
  <text class="lbl atk" x="736" y="340">+ conteúdo de</text>
  <text class="lbl atk" x="736" y="362">/etc/passwd</text>

  <!-- consequence -->
  <rect x="30" y="406" width="900" height="64" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="bold atk" x="480" y="432" text-anchor="middle">O que o atacante ganha: roda o comando que quiser no servidor,</text>
  <text class="bold atk" x="480" y="454" text-anchor="middle">com o mesmo direito do comando legítimo.</text>

  <!-- legend -->
  <rect x="30" y="500" width="14" height="14" rx="3" fill="#60a5fa"/>
  <text class="small" x="52" y="512">texto fixo do programador</text>
  <rect x="268" y="500" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="290" y="512">dado esperado (o IP)</text>
  <rect x="468" y="500" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="490" y="512">trecho do atacante</text>
  <rect x="652" y="500" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="674" y="512">onde está a falha</text>
</svg>
