<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="960" height="630" role="img" aria-labelledby="t d">
  <title id="t">O upload vira RCE quando o servidor executa o arquivo enviado</title>
  <desc id="d">Quatro passos e o resultado. 1: o atacante envia pelo formulário de upload um arquivo shell.php contendo a linha PHP system de dólar GET cmd. 2: o servidor grava o arquivo, sem conferir o conteúdo, na pasta pública hackable/uploads. 3: o atacante pede pelo navegador uploads/shell.php?cmd=id. 4, em destaque como a falha: o servidor não devolve o texto do .php, ele o executa. 5, a consequência: RCE, o comando roda no servidor e responde uid=33(www-data), o usuário do servidor web; daí o atacante lê arquivos, pega credenciais ou abre uma reverse shell. Separada abaixo, em segundo plano, uma faixa mostra o que cada nível do DVWA confere no upload: low não confere nada e o ataque passa; medium confere só o tipo de arquivo que o navegador declara, que pode ser forjado, e passa; high confere a extensão e se o arquivo parece imagem, e só passa encadeando outra falha; impossible regrava a imagem do zero, apagando o código embutido, e bloqueia. Legenda: vermelho é o atacante e o que ele ganha, amarelo é onde está a falha, verde é a defesa que funciona, cinza é o servidor.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 20px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .step { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .code { font-size: 12px; fill: #cbd5e1; }
    .small { font-size: 12px; fill: #94a3b8; }
    .tiny { font-size: 11px; fill: #94a3b8; }
    .atk { fill: #f87171; }
    .key { fill: #facc15; }
    .def { fill: #34d399; }
    .srv { fill: #94a3b8; }
    .panel { fill: #0f172a; stroke: #475569; stroke-width: 1.3; }
    .panel-atk { fill: #1f1315; stroke: #ef4444; stroke-width: 1.8; }
    .panel-muted { fill: #0f172a; stroke: #334155; stroke-width: 1; }
    .edge { stroke: #64748b; stroke-width: 2; fill: none; }
    .edge-atk { stroke: #ef4444; stroke-width: 2.5; fill: none; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="630" fill="url(#bg-grad)"/>

  <!-- key idea -->
  <text class="title" x="30" y="42">O upload vira RCE quando o servidor <tspan class="key">EXECUTA</tspan> o arquivo</text>
  <text class="sub" x="30" y="66">Um .php gravado numa pasta pública não volta como texto: o PHP roda o código dele.</text>

  <!-- step 1: attacker uploads -->
  <rect class="panel-atk" x="30" y="96" width="200" height="124" rx="6"/>
  <text class="step atk" x="46" y="122">1. ATACANTE ENVIA</text>
  <text class="bold" x="46" y="148">shell.php</text>
  <text class="code" x="46" y="174">&lt;?php system(</text>
  <text class="code" x="46" y="194">$_GET['cmd']); ?&gt;</text>
  <path class="edge" d="M230,158 L258,158" marker-end="url(#arrow-gray)"/>

  <!-- step 2: server stores -->
  <rect class="panel" x="262" y="96" width="200" height="124" rx="6"/>
  <text class="step srv" x="278" y="122">2. SERVIDOR GRAVA</text>
  <text class="small" x="278" y="148">sem conferir nada,</text>
  <text class="small" x="278" y="166">na pasta pública:</text>
  <text class="code" x="278" y="192">/hackable/uploads/</text>
  <text class="code" x="278" y="210">shell.php</text>
  <path class="edge" d="M462,158 L490,158" marker-end="url(#arrow-gray)"/>

  <!-- step 3: attacker requests -->
  <rect class="panel-atk" x="494" y="96" width="200" height="124" rx="6"/>
  <text class="step atk" x="510" y="122">3. ATACANTE PEDE</text>
  <text class="small" x="510" y="148">pelo navegador:</text>
  <text class="code" x="510" y="174">uploads/</text>
  <text class="code" x="510" y="194">shell.php?cmd=id</text>
  <path class="edge" d="M694,158 L722,158" marker-end="url(#arrow-gray)"/>

  <!-- step 4: the flaw -->
  <rect x="726" y="96" width="204" height="124" rx="6" fill="#2a2410" stroke="#facc15" stroke-width="2.2" filter="url(#glow-gold)"/>
  <text class="step key" x="742" y="122">4. A FALHA</text>
  <text class="bold key" x="742" y="148">o servidor EXECUTA</text>
  <text class="lbl" x="742" y="170">o .php, em vez de</text>
  <text class="lbl" x="742" y="190">devolver o texto</text>
  <text class="tiny" x="742" y="210">(pasta que roda PHP)</text>
  <path class="edge-atk" d="M828,220 L828,262" marker-end="url(#arrow-red)"/>

  <!-- step 5: consequence -->
  <rect x="30" y="266" width="900" height="100" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="step atk" x="50" y="294">5. O QUE O ATACANTE GANHA: RCE</text>
  <text class="bold" x="50" y="320">o comando "id" rodou NO servidor e respondeu:</text>
  <text class="code atk" x="50" y="344">uid=33(www-data) gid=33(www-data)   <tspan class="tiny">← o usuário do servidor web</tspan></text>
  <text class="small" x="910" y="320" text-anchor="end">daí ele lê arquivos,</text>
  <text class="small" x="910" y="338" text-anchor="end">pega credenciais ou</text>
  <text class="small" x="910" y="356" text-anchor="end">abre uma reverse shell</text>

  <!-- secondary: DVWA levels -->
  <line x1="30" y1="396" x2="930" y2="396" stroke="#334155" stroke-width="1" stroke-dasharray="5 5"/>
  <text class="step srv" x="30" y="424">À PARTE: O QUE CADA NÍVEL DO DVWA CONFERE NO UPLOAD</text>

  <rect class="panel-muted" x="30" y="438" width="216" height="112" rx="6"/>
  <text class="bold srv" x="44" y="462">low</text>
  <text class="small" x="44" y="486">não confere nada</text>
  <text class="bold atk" x="44" y="534">ataque passa</text>

  <rect class="panel-muted" x="258" y="438" width="216" height="112" rx="6"/>
  <text class="bold srv" x="272" y="462">medium</text>
  <text class="small" x="272" y="486">confere só o tipo que</text>
  <text class="small" x="272" y="504">o navegador declara</text>
  <text class="bold atk" x="272" y="534">passa: é forjável</text>

  <rect class="panel-muted" x="486" y="438" width="216" height="112" rx="6"/>
  <text class="bold srv" x="500" y="462">high</text>
  <text class="small" x="500" y="486">confere a extensão e</text>
  <text class="small" x="500" y="504">se parece imagem</text>
  <text class="bold atk" x="500" y="524">passa só encadeando</text>
  <text class="bold atk" x="500" y="542">outra falha</text>

  <rect class="panel-muted" x="714" y="438" width="216" height="112" rx="6" stroke="#10b981"/>
  <text class="bold def" x="728" y="462">impossible</text>
  <text class="small" x="728" y="486">regrava a imagem do</text>
  <text class="small" x="728" y="504">zero: o código some</text>
  <text class="bold def" x="728" y="534">bloqueia</text>

  <!-- legend -->
  <rect x="30" y="582" width="14" height="14" rx="3" fill="#f87171"/>
  <text class="small" x="52" y="594">atacante e o que ele ganha</text>
  <rect x="290" y="582" width="14" height="14" rx="3" fill="#facc15"/>
  <text class="small" x="312" y="594">onde está a falha</text>
  <rect x="482" y="582" width="14" height="14" rx="3" fill="#94a3b8"/>
  <text class="small" x="504" y="594">servidor</text>
  <rect x="604" y="582" width="14" height="14" rx="3" fill="#34d399"/>
  <text class="small" x="626" y="594">defesa que funciona</text>
</svg>
