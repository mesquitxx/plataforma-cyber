<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">Árvore de ataque: o objetivo é um nó OU, então um caminho aberto basta</title>
  <desc id="d">Árvore de ataque com o objetivo no topo: assumir uma conta privilegiada. Logo abaixo, um nó OU recebe dois caminhos independentes, e um só caminho aberto basta para o atacante vencer: fechar apenas o caminho A deixa o B livre. Caminho A, de baixo para cima: SQL injection no login entra como admin; com o acesso de admin, um IDOR lê dados de outros clientes. Caminho B: SQL injection rouba a semente 2FA do wurstbrot; depois o atacante pula a senha e calcula o código, tomando a conta. Numa faixa separada, em verde, as defesas e onde cada uma corta: tesoura 1, query parametrizada, corta os dois caminhos na origem; tesoura 2, controle de acesso no servidor, corta o IDOR; tesoura 3, hash salgado e semente 2FA guardada protegida, esvaziam o caminho B. Fechar a árvore exige cortar todos os caminhos.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .key { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; fill: #cbd5e1; }
    .muted { font-size: 11px; fill: #94a3b8; }
    .cut { font-size: 11px; font-weight: 700; fill: #34d399; }
    .amber { fill: #fbbf24; }
    .purple { fill: #c084fc; }
    .cyan { fill: #67e8f9; }
    .green { fill: #34d399; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-amber" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f59e0b"/></marker>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="40" y="40">Árvore de ataque: dois caminhos, um objetivo</text>
  <rect x="40" y="56" width="880" height="40" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="key" x="58" y="81">Nó OU: UM caminho aberto já basta. Fechar só um ramo não adianta.</text>

  <!-- goal -->
  <rect id="goal" x="320" y="118" width="320" height="58" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2.2" filter="url(#glow-purple)"/>
  <text class="h purple" x="338" y="143">OBJETIVO DO ATACANTE</text>
  <text class="b" x="338" y="164">assumir uma conta privilegiada</text>

  <!-- OR gate -->
  <rect id="or" x="400" y="210" width="160" height="40" rx="20" fill="#083344" stroke="#22d3ee" stroke-width="2"/>
  <text class="h cyan" x="418" y="235">OU · basta 1</text>
  <line x1="480" y1="210" x2="480" y2="180" stroke="#22d3ee" stroke-width="2" marker-end="url(#arrow-cyan)"/>

  <!-- side note: key moment -->
  <text class="muted" x="590" y="226">fechou o A?</text>
  <text class="muted" x="590" y="242">o atacante usa o B.</text>

  <!-- Path A -->
  <text class="h amber" x="60" y="292">CAMINHO A · via admin</text>
  <rect id="a2" x="60" y="304" width="330" height="62" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="76" y="328">A2 · IDOR com acesso de admin</text>
  <text class="b" x="76" y="350">lê dados de outros clientes</text>
  <rect id="a1" x="60" y="410" width="330" height="62" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="76" y="434">A1 · SQLi no login</text>
  <text class="b" x="76" y="456">' OR true-- → entra como admin</text>
  <line x1="225" y1="410" x2="225" y2="370" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 390 335 L 440 335 L 440 254" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text class="muted" x="160" y="492">começa anônimo</text>

  <!-- Path B -->
  <text class="h amber" x="570" y="292">CAMINHO B · via 2FA</text>
  <rect id="b2" x="570" y="304" width="330" height="62" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="586" y="328">B2 · Pula a senha + calcula</text>
  <text class="b" x="586" y="350">o código → conta do wurstbrot</text>
  <rect id="b1" x="570" y="410" width="330" height="62" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="586" y="434">B1 · SQLi rouba a semente</text>
  <text class="b" x="586" y="456">semente 2FA do wurstbrot</text>
  <line x1="735" y1="410" x2="735" y2="370" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <path d="M 570 335 L 520 335 L 520 254" fill="none" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text class="muted" x="670" y="492">começa anônimo</text>

  <!-- cut markers (secondary) -->
  <rect x="340" y="414" width="46" height="18" rx="9" fill="#052e16" stroke="#10b981"/>
  <text class="cut" x="349" y="427">✂ 1</text>
  <rect x="340" y="308" width="46" height="18" rx="9" fill="#052e16" stroke="#10b981"/>
  <text class="cut" x="349" y="321">✂ 2</text>
  <rect x="850" y="414" width="46" height="18" rx="9" fill="#052e16" stroke="#10b981"/>
  <text class="cut" x="859" y="427">✂ 1</text>
  <rect x="850" y="438" width="46" height="18" rx="9" fill="#052e16" stroke="#10b981"/>
  <text class="cut" x="859" y="451">✂ 3</text>

  <!-- legend -->
  <rect x="40" y="510" width="12" height="12" rx="2" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="muted" x="60" y="521">passo do ataque (sobe até o objetivo)</text>
  <rect x="350" y="510" width="12" height="12" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="muted" x="370" y="521">nó OU</text>
  <rect x="450" y="510" width="12" height="12" rx="2" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text class="muted" x="470" y="521">o que o atacante ganha</text>
  <rect x="680" y="510" width="12" height="12" rx="2" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="muted" x="700" y="521">defesa (onde cortar)</text>

  <!-- defense band (secondary) -->
  <line x1="40" y1="538" x2="920" y2="538" stroke="#334155" stroke-dasharray="4 4"/>
  <rect x="40" y="550" width="880" height="96" rx="6" fill="#0b1f17" stroke="#059669" stroke-width="1"/>
  <text class="h green" x="58" y="574">Defesa (seção 8): cortar TODOS os caminhos</text>
  <text class="b" x="58" y="598">✂1 query parametrizada → corta A e B na origem</text>
  <text class="b" x="58" y="616">✂2 controle de acesso no servidor → corta o IDOR</text>
  <text class="b" x="58" y="634">✂3 hash salgado + semente 2FA guardada protegida → esvazia o B</text>
</svg>
