<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">A cadeia de ataque do mini-projeto: cada passo entrega o que o próximo precisa</title>
  <desc id="d">Seis passos de um ataque encadeado. 1: atacante anônimo, sem conta. 2: SQL injection UNION na busca vaza a base de usuários; ele entrega os hashes das senhas, o e-mail da vítima wurstbrot e a semente de 2FA dela. 3: quebrar as senhas offline trava, porque o hash forte resiste à wordlist; é um beco sem saída e o atacante desvia. 4: um SQL injection no login com o e-mail da vítima pula a senha e para no portão do segundo fator. 5: com a semente roubada, o atacante calcula o código de uso único válido. 6: a conta do wurstbrot é tomada, com senha e 2FA vencidos. Uma faixa separada, em verde, lembra a defesa: quebrar qualquer elo derruba a cadeia inteira.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .key { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 12px; fill: #cbd5e1; }
    .chip { font-size: 11.5px; font-weight: 700; fill: #67e8f9; }
    .muted { font-size: 11px; fill: #94a3b8; }
    .amber { fill: #fbbf24; }
    .red { fill: #f87171; }
    .purple { fill: #c084fc; }
    .green { fill: #34d399; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#22d3ee"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#f87171"/></marker>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="620" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="40" y="40">A cadeia do mini-projeto, elo por elo</text>
  <rect x="40" y="56" width="880" height="40" rx="6" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="key" x="58" y="81">O que um passo ENTREGA vira a entrada do próximo. Se um passo trava, desvie.</text>

  <!-- 1 Anônimo -->
  <rect id="n1" x="40" y="130" width="190" height="84" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="56" y="158">1 · Anônimo</text>
  <text class="b" x="56" y="180">sem conta, só vê</text>
  <text class="b" x="56" y="198">a loja pública</text>

  <!-- 2 SQLi UNION -->
  <rect id="n2" x="320" y="130" width="280" height="84" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="336" y="158">2 · SQLi UNION na busca</text>
  <text class="b" x="336" y="180">vaza a base de usuários</text>
  <text class="b" x="336" y="198">(e-mails, hashes, sementes 2FA)</text>

  <!-- 3 Quebra (dead end) -->
  <rect id="n3" x="690" y="130" width="230" height="84" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="h red" x="706" y="158">3 · Quebrar senhas ✗</text>
  <text class="b" x="706" y="180">o hash forte do admin</text>
  <text class="b" x="706" y="198">resiste à wordlist</text>
  <text class="h red" x="706" y="240">TRAVA: beco sem saída</text>
  <text class="muted" x="706" y="258">→ o atacante desvia pelo 4</text>

  <!-- edges row 1 -->
  <line x1="230" y1="172" x2="316" y2="172" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text class="chip" x="244" y="162">começa</text>
  <line x1="600" y1="172" x2="686" y2="172" stroke="#f87171" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text class="chip" x="614" y="162">hashes</text>

  <!-- 2 -> 4 (email) -->
  <path d="M 380 214 L 380 270 L 165 270 L 165 346" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <rect x="190" y="280" width="160" height="22" rx="4" fill="#0f172a" stroke="#155e75"/>
  <text class="chip" x="200" y="295">e-mail da vítima</text>

  <!-- 2 -> 5 (seed) -->
  <line x1="510" y1="214" x2="510" y2="346" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <rect x="520" y="268" width="150" height="22" rx="4" fill="#0f172a" stroke="#155e75"/>
  <text class="chip" x="530" y="283">semente 2FA</text>

  <!-- 4 SQLi login -->
  <rect id="n4" x="40" y="350" width="250" height="84" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="56" y="378">4 · SQLi no login</text>
  <text class="b" x="56" y="400">wurstbrot@…'-- pula a</text>
  <text class="b" x="56" y="418">senha; para no portão 2FA</text>

  <!-- 5 OTP -->
  <rect id="n5" x="400" y="350" width="230" height="84" rx="6" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="h amber" x="416" y="378">5 · Calcula o código</text>
  <text class="b" x="416" y="400">semente + relógio =</text>
  <text class="b" x="416" y="418">código 2FA válido</text>

  <!-- 4 -> 5 -->
  <line x1="290" y1="392" x2="396" y2="392" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text class="chip" x="300" y="382">falta só</text>
  <text class="chip" x="300" y="412">o código</text>

  <!-- 6 Conta tomada -->
  <rect id="n6" x="720" y="340" width="200" height="104" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2.2" filter="url(#glow-purple)"/>
  <text class="h purple" x="736" y="368">6 · CONTA TOMADA</text>
  <text class="b" x="736" y="392">sessão do wurstbrot:</text>
  <text class="b" x="736" y="410">senha E 2FA</text>
  <text class="b" x="736" y="428">vencidos</text>

  <!-- 5 -> 6 -->
  <line x1="630" y1="392" x2="716" y2="392" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <text class="chip" x="642" y="382">código</text>

  <!-- legend -->
  <rect x="40" y="466" width="12" height="12" rx="2" fill="#1c1917" stroke="#f59e0b" stroke-width="1.5"/>
  <text class="muted" x="60" y="477">passo do ataque</text>
  <line x1="190" y1="472" x2="214" y2="472" stroke="#22d3ee" stroke-width="1.8"/>
  <text class="muted" x="222" y="477">o que o passo entrega ao próximo</text>
  <rect x="470" y="466" width="12" height="12" rx="2" fill="#2a1215" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text class="muted" x="490" y="477">elo que trava</text>
  <rect x="610" y="466" width="12" height="12" rx="2" fill="#2e1065" stroke="#a855f7" stroke-width="1.5"/>
  <text class="muted" x="630" y="477">o que o atacante ganha</text>
  <rect x="800" y="466" width="12" height="12" rx="2" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="muted" x="820" y="477">defesa</text>

  <!-- defense band (secondary) -->
  <line x1="40" y1="500" x2="920" y2="500" stroke="#334155" stroke-dasharray="4 4"/>
  <rect x="40" y="516" width="880" height="72" rx="6" fill="#0b1f17" stroke="#059669" stroke-width="1"/>
  <text class="h green" x="58" y="542">Defesa (seção 8): basta quebrar UM elo para a cadeia cair</text>
  <text class="b" x="58" y="566">query parametrizada · hash salgado · semente 2FA protegida · limite de tentativas no código</text>
</svg>
