<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="t d">
  <title id="t">Roubo de sessão por XSS armazenado, passo a passo</title>
  <desc id="d">Diagrama de sequência com quatro participantes: atacante, site vulnerável (servidor e banco), navegador da vítima logada e coletor do atacante. 1: o atacante posta um comentário com um script, que o site guarda no banco. 2: a vítima logada abre a página. 3: a página chega com o script junto. 4, o momento-chave: o script roda no navegador como se fosse do site e lê o cookie de sessão com document.cookie. 5: o script envia o cookie ao coletor do atacante. 6: o atacante põe o cookie no próprio navegador. Resultado: o atacante navega na conta da vítima sem nunca saber a senha, porque a sessão é a credencial. À parte, a defesa: com o cookie marcado HttpOnly o script ainda roda, mas não consegue ler o cookie, o que corta o passo 4.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .idea { font-size: 14px; font-weight: 700; }
    .actor { font-size: 14px; font-weight: 700; }
    .asub { font-size: 12px; fill: #94a3b8; }
    .step { font-size: 12.5px; }
    .stepr { font-size: 12.5px; fill: #fca5a5; }
    .code { font-size: 11px; fill: #94a3b8; }
    .note { font-size: 11.5px; fill: #94a3b8; }
    .gold-h { font-size: 13px; font-weight: 700; fill: #facc15; }
    .gold-b { font-size: 12.5px; fill: #fef3c7; }
    .res-h { font-size: 15px; font-weight: 700; fill: #f87171; }
    .res-b { font-size: 13.5px; }
    .def-h { font-size: 12.5px; font-weight: 700; fill: #34d399; }
    .def-b { font-size: 12px; fill: #a7f3d0; }
    .leg { font-size: 12px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-grey" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="720" fill="url(#bg-grad)"/>

  <!-- title + main idea -->
  <text class="title" x="500" y="36" text-anchor="middle">Roubo de sessão por XSS armazenado</text>
  <rect x="120" y="50" width="760" height="34" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="idea" x="500" y="72" text-anchor="middle">O script do atacante lê o cookie de sessão da vítima e o entrega a ele</text>

  <!-- actors -->
  <rect x="35" y="104" width="170" height="50" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="actor" x="120" y="134" text-anchor="middle">atacante</text>
  <rect x="285" y="104" width="170" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="actor" x="370" y="125" text-anchor="middle">site vulnerável</text>
  <text class="asub" x="370" y="143" text-anchor="middle">(servidor + banco)</text>
  <rect x="535" y="104" width="170" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="actor" x="620" y="125" text-anchor="middle">navegador</text>
  <text class="asub" x="620" y="143" text-anchor="middle">da vítima (logada)</text>
  <rect x="785" y="104" width="170" height="50" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="actor" x="870" y="125" text-anchor="middle">coletor</text>
  <text class="asub" x="870" y="143" text-anchor="middle">(do atacante)</text>

  <!-- lifelines -->
  <g stroke="#475569" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="154" x2="120" y2="532"/>
    <line x1="370" y1="154" x2="370" y2="532"/>
    <line x1="620" y1="154" x2="620" y2="532"/>
    <line x1="870" y1="154" x2="870" y2="532"/>
  </g>

  <!-- 1 -->
  <text class="stepr" x="245" y="190" text-anchor="middle">1. posta comentário com script</text>
  <line x1="120" y1="200" x2="364" y2="200" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="code" x="245" y="217" text-anchor="middle">&lt;script&gt;…document.cookie…&lt;/script&gt;</text>
  <text class="note" x="380" y="204">o site guarda no banco</text>

  <!-- 2 -->
  <text class="step" x="495" y="252" text-anchor="middle">2. vítima abre a página</text>
  <line x1="620" y1="262" x2="376" y2="262" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-grey)"/>

  <!-- 3 -->
  <text class="stepr" x="495" y="302" text-anchor="middle">3. a página vem com o script</text>
  <line x1="370" y1="312" x2="614" y2="312" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 4: key moment -->
  <rect x="612" y="328" width="16" height="88" rx="3" fill="#eab308"/>
  <rect x="385" y="328" width="216" height="88" rx="6" fill="#2a2208" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="gold-h" x="397" y="349">4. MOMENTO-CHAVE</text>
  <text class="gold-b" x="397" y="370">o script roda como se</text>
  <text class="gold-b" x="397" y="388">fosse do site e LÊ o</text>
  <text class="gold-b" x="397" y="406">cookie de sessão</text>
  <text class="note" x="640" y="373">document.cookie</text>
  <text class="note" x="640" y="390">(cookie sem HttpOnly)</text>

  <!-- 5 -->
  <text class="stepr" x="745" y="440" text-anchor="middle">5. envia o cookie</text>
  <line x1="620" y1="450" x2="864" y2="450" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="code" x="745" y="467" text-anchor="middle">GET /?c=PHPSESSID=c7701e…</text>

  <!-- 6 -->
  <rect data-graph-role="decoration" x="300" y="488" width="390" height="19" rx="3" fill="#15152a"/>
  <text class="stepr" x="495" y="502" text-anchor="middle">6. atacante põe o cookie no próprio navegador</text>
  <line x1="870" y1="512" x2="126" y2="512" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- result -->
  <rect x="35" y="550" width="590" height="100" rx="8" fill="#3b0d0d" stroke="#ef4444" stroke-width="2.5"/>
  <text class="res-h" x="55" y="578">RESULTADO: o atacante vira a vítima</text>
  <text class="res-b" x="55" y="604">navega logado na conta dela, sem nunca saber</text>
  <text class="res-b" x="55" y="626">a senha: a sessão é a credencial</text>

  <!-- defense, separate and secondary -->
  <rect x="660" y="562" width="305" height="76" rx="6" fill="#0b1f17" fill-opacity="0.6" stroke="#10b981" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="def-h" x="674" y="582">Defesa (à parte): HttpOnly</text>
  <text class="def-b" x="674" y="602">o script ainda roda, mas não</text>
  <text class="def-b" x="674" y="620">consegue ler o cookie → corta o 4</text>

  <!-- legend -->
  <line x1="40" y1="687" x2="72" y2="687" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="leg" x="82" y="691">ação do atacante</text>
  <line x1="250" y1="687" x2="282" y2="687" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-grey)"/>
  <text class="leg" x="292" y="691">uso normal do site</text>
  <rect x="478" y="680" width="22" height="14" rx="3" fill="#2a2208" stroke="#eab308" stroke-width="2"/>
  <text class="leg" x="510" y="691">momento-chave</text>
  <rect x="680" y="680" width="22" height="14" rx="3" fill="#0b1f17" stroke="#10b981" stroke-dasharray="4 3"/>
  <text class="leg" x="712" y="691">defesa</text>
</svg>
