<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d">
  <title id="t">Três tipos de XSS: onde o código do atacante fica guardado</title>
  <desc id="d">Três faixas comparam os tipos de XSS. Refletido: o código fica no link, o servidor só o devolve na resposta sem guardar nada, e atinge só quem clicar no link. Armazenado: o código fica salvo no banco do site, enviado uma vez num comentário, e o site o entrega junto com a página a todo visitante; é o mais grave. DOM: o código fica só no navegador, depois do # do link, que não é enviado ao servidor; o JavaScript da página o escreve no DOM; atinge quem abrir o link e o servidor nunca recebe o código, por isso é o mais difícil de detectar.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .idea { font-size: 14px; font-weight: 700; }
    .colh { font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .colh-gold { fill: #facc15; }
    .colh-red { fill: #f87171; }
    .type { font-size: 16px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .head-gold { font-size: 14px; font-weight: 700; fill: #facc15; }
    .head-red { font-size: 14px; font-weight: 700; fill: #f87171; }
    .body { font-size: 13px; }
    .code { font-size: 12px; fill: #fde68a; }
    .em { font-size: 13px; font-weight: 700; fill: #f87171; }
    .lbl { font-size: 12px; fill: #fca5a5; }
    .leg { font-size: 12px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <filter id="glow-gold">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="640" fill="url(#bg-grad)"/>

  <!-- title + main idea -->
  <text class="title" x="500" y="38" text-anchor="middle">Três tipos de XSS: onde o código do atacante fica guardado</text>
  <rect x="150" y="54" width="700" height="34" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="idea" x="500" y="76" text-anchor="middle">Onde ele fica decide quem é atingido e se o servidor vê o ataque</text>

  <!-- column headers -->
  <text class="colh" x="115" y="122" text-anchor="middle">TIPO</text>
  <text class="colh colh-gold" x="385" y="122" text-anchor="middle">ONDE O CÓDIGO FICA</text>
  <text class="colh colh-red" x="795" y="122" text-anchor="middle">QUEM É ATINGIDO</text>

  <!-- lane 1: reflected -->
  <rect data-graph-role="background" x="20" y="132" width="960" height="130" rx="8" fill="#0f172a" fill-opacity="0.55" stroke="#334155"/>
  <text class="type" x="40" y="188">1. Refletido</text>
  <text class="sub" x="40" y="208">(reflected)</text>
  <rect x="210" y="147" width="350" height="100" rx="6" fill="#2a2208" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="head-gold" x="226" y="172">NO LINK (não fica salvo)</text>
  <text class="body" x="226" y="196">o atacante põe o código no link:</text>
  <text class="code" x="226" y="215">?name=&lt;script&gt;…&lt;/script&gt;</text>
  <text class="body" x="226" y="235">o servidor só o devolve na resposta</text>
  <line x1="560" y1="197" x2="626" y2="197" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="lbl" x="595" y="188" text-anchor="middle">dispara</text>
  <rect x="630" y="147" width="330" height="100" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="head-red" x="646" y="182">SÓ QUEM CLICAR NO LINK</text>
  <text class="body" x="646" y="208">o navegador de quem clica</text>
  <text class="body" x="646" y="228">executa o código, uma vez</text>

  <!-- lane 2: stored -->
  <rect data-graph-role="background" x="20" y="277" width="960" height="130" rx="8" fill="#0f172a" fill-opacity="0.55" stroke="#334155"/>
  <text class="type" x="40" y="333">2. Armazenado</text>
  <text class="sub" x="40" y="353">(stored)</text>
  <rect x="210" y="292" width="350" height="100" rx="6" fill="#2a2208" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="head-gold" x="226" y="317">NO BANCO DO SITE (fica salvo)</text>
  <text class="body" x="226" y="341">o atacante envia 1 vez, num</text>
  <text class="body" x="226" y="360">comentário; o site entrega o código</text>
  <text class="body" x="226" y="379">junto com a página, a cada visita</text>
  <line x1="560" y1="342" x2="626" y2="342" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="lbl" x="595" y="333" text-anchor="middle">dispara</text>
  <rect x="646" y="286" width="322" height="100" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-opacity="0.45"/>
  <rect x="638" y="289" width="326" height="100" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-opacity="0.7"/>
  <rect x="630" y="292" width="330" height="100" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="head-red" x="646" y="320">TODO VISITANTE DA PÁGINA</text>
  <text class="body" x="646" y="345">ninguém precisa clicar em link:</text>
  <text class="body" x="646" y="364">basta abrir a página</text>
  <text class="em" x="646" y="383">→ o mais grave</text>

  <!-- lane 3: DOM -->
  <rect data-graph-role="background" x="20" y="422" width="960" height="130" rx="8" fill="#0f172a" fill-opacity="0.55" stroke="#334155"/>
  <text class="type" x="40" y="478">3. DOM</text>
  <text class="sub" x="40" y="498">(baseado no DOM)</text>
  <rect x="210" y="437" width="350" height="100" rx="6" fill="#2a2208" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="head-gold" x="226" y="462">SÓ NO NAVEGADOR</text>
  <text class="body" x="226" y="486">o código vai depois do # do link:</text>
  <text class="code" x="226" y="505">#&lt;img src=x onerror=…&gt;</text>
  <text class="body" x="226" y="525">o JS da página o escreve no DOM</text>
  <line x1="560" y1="487" x2="626" y2="487" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="lbl" x="595" y="478" text-anchor="middle">dispara</text>
  <rect x="630" y="437" width="330" height="100" rx="6" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="head-red" x="646" y="462">QUEM ABRIR O LINK</text>
  <text class="body" x="646" y="486">o servidor nunca recebe o código</text>
  <text class="body" x="646" y="505">(a parte depois do # não é enviada)</text>
  <text class="em" x="646" y="525">→ o mais difícil de detectar</text>

  <g id="legend">
  <rect x="20" y="572" width="960" height="48" rx="6" fill="#0f172a" stroke="#334155"/>
  <rect x="44" y="589" width="22" height="14" rx="3" fill="#2a2208" stroke="#eab308" stroke-width="2"/>
  <text class="leg" x="76" y="601">onde o código do atacante fica</text>
  <line x1="370" y1="596" x2="404" y2="596" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="leg" x="414" y="601">o código dispara</text>
  <rect x="600" y="589" width="22" height="14" rx="3" fill="#1f0d10" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="632" y="601">quem é atingido (as vítimas)</text>
  </g>
</svg>
