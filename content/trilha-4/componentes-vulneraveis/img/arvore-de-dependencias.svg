<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">A falha de uma peça que você nem escolheu vira falha sua</title>
  <desc id="d">Uma árvore de dependências dividida em duas faixas. Na faixa de cima, o que você escolheu: a sua aplicação, o código que você escreve, e as duas dependências diretas que você declarou, relatorios 3.2 e http-client 2.0. Na faixa de baixo, o que veio junto sem você pedir: a biblioteca relatorios puxou sozinha duas dependências transitivas, datas-util 5.1 e parser-xml 1.4. O parser-xml 1.4 está destacado em vermelho: tem uma falha pública conhecida, e você nunca o declarou. Uma seta vermelha sai dele para a consequência: o atacante explora essa falha e roda comandos no seu servidor, com o poder da sua aplicação, porque a peça roda dentro dela. Legenda: azul é o que você escolheu, cinza é o que veio junto, vermelho é a falha e o que o atacante ganha.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .zone { font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .name { font-size: 14px; font-weight: 700; }
    .nameb { font-size: 14px; font-weight: 700; fill: #93c5fd; }
    .namer { font-size: 15px; font-weight: 700; fill: #f87171; }
    .body { font-size: 12px; fill: #cbd5e1; }
    .res { font-size: 14px; font-weight: 700; fill: #fecaca; }
    .muted { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="44">A falha de uma peça que você nem escolheu vira falha sua</text>
  <text class="sub" x="40" y="68">Você declara só a ponta da árvore; o resto vem junto, sem você ver.</text>

  <!-- zone 1: what you chose -->
  <rect data-graph-role="container" x="40" y="88" width="880" height="176" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="zone" x="56" y="110">VOCÊ ESCOLHEU</text>

  <rect x="380" y="100" width="200" height="56" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="nameb" x="480" y="124" text-anchor="middle">Sua aplicação</text>
  <text class="body" x="480" y="144" text-anchor="middle">o código que você escreve</text>

  <path d="M450,156 L300,188" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M510,156 L660,188" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="150" y="190" width="230" height="58" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="nameb" x="265" y="214" text-anchor="middle">relatorios 3.2</text>
  <text class="body" x="265" y="234" text-anchor="middle">dependência direta</text>

  <rect x="580" y="190" width="230" height="58" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="nameb" x="695" y="214" text-anchor="middle">http-client 2.0</text>
  <text class="body" x="695" y="234" text-anchor="middle">dependência direta</text>

  <!-- zone 2: came along -->
  <rect data-graph-role="container" x="40" y="282" width="620" height="166" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="zone" x="644" y="304" text-anchor="end">VEIO JUNTO, SEM VOCÊ PEDIR</text>

  <path d="M230,248 L180,328" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <path d="M300,248 L420,320" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <rect x="60" y="330" width="220" height="58" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.2"/>
  <text class="name" x="170" y="354" text-anchor="middle">datas-util 5.1</text>
  <text class="body" x="170" y="374" text-anchor="middle">dependência transitiva</text>

  <rect x="320" y="322" width="310" height="104" rx="6" fill="#3b0f16" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="namer" x="475" y="350" text-anchor="middle">parser-xml 1.4</text>
  <text class="body" x="475" y="372" text-anchor="middle">dependência transitiva</text>
  <text class="res" x="475" y="396" text-anchor="middle">falha pública conhecida</text>
  <text class="muted" x="475" y="415" text-anchor="middle">e você nunca a declarou</text>

  <!-- consequence -->
  <path d="M630,374 L692,374" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>
  <rect x="696" y="314" width="224" height="120" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="res" x="808" y="340" text-anchor="middle">Atacante explora</text>
  <text class="body" x="808" y="364" text-anchor="middle">e roda comandos no seu</text>
  <text class="body" x="808" y="382" text-anchor="middle">servidor, com o poder</text>
  <text class="body" x="808" y="400" text-anchor="middle">da sua aplicação</text>
  <text class="muted" x="808" y="422" text-anchor="middle">a peça roda DENTRO dela</text>

  <!-- legend -->
  <line x1="40" y1="496" x2="76" y2="496" stroke="#3b82f6" stroke-width="2"/>
  <text class="muted" x="86" y="500">o que você escolheu</text>
  <line x1="320" y1="496" x2="356" y2="496" stroke="#64748b" stroke-width="2"/>
  <text class="muted" x="366" y="500">veio junto, sem você pedir</text>
  <line x1="650" y1="496" x2="686" y2="496" stroke="#ef4444" stroke-width="2"/>
  <text class="muted" x="696" y="500">falha / ganho do atacante</text>
</svg>
