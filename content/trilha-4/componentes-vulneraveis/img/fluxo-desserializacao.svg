<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Desserialização nativa: os bytes do atacante escolhem o objeto e disparam código</title>
  <desc id="d">O caminho do ataque, da esquerda para a direita. Os bytes do atacante, uma entrada que ele controla, chegam a uma função de desserialização nativa, como readObject() em Java ou unserialize() em PHP. No momento-chave, destacado em vermelho, essa função faz duas coisas perigosas: primeiro, recria o tipo de objeto que os bytes mandarem, qualquer classe que exista no servidor; segundo, chama métodos desse objeto durante a reconstrução. Com isso, os bytes acionam uma gadget chain, que encadeia classes que já estão no servidor, sem injetar código novo. A consequência: o servidor executa o comando do atacante. Numa caixa separada e secundária, para comparar: ler JSON para um tipo que você fixou de antemão só copia valores para campos conhecidos; não escolhe o tipo nem chama métodos, então nada é executado. Legenda: vermelho é o atacante e o perigo, cinza é o passo normal do servidor, verde é o caminho seguro para comparação.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .name { font-size: 14px; font-weight: 700; }
    .namer { font-size: 14px; font-weight: 700; fill: #f87171; }
    .key { font-size: 12px; font-weight: 700; fill: #f87171; letter-spacing: 0.08em; }
    .step { font-size: 13px; font-weight: 700; }
    .body { font-size: 12px; fill: #cbd5e1; }
    .res { font-size: 16px; font-weight: 700; fill: #fecaca; }
    .def { font-size: 13px; font-weight: 700; fill: #34d399; }
    .muted { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="44">Desserialização nativa: os bytes escolhem o objeto e disparam código</text>
  <text class="sub" x="40" y="68">O atacante não injeta código novo: ele encadeia o que já está no servidor.</text>

  <!-- 1: attacker bytes -->
  <rect x="40" y="128" width="150" height="96" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="1.5"/>
  <text class="namer" x="115" y="160" text-anchor="middle">Bytes do</text>
  <text class="namer" x="115" y="178" text-anchor="middle">atacante</text>
  <text class="muted" x="115" y="204" text-anchor="middle">ele controla</text>
  <path d="M190,176 L224,176" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 2: native deserializer (normal server step) -->
  <rect x="228" y="128" width="180" height="96" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text class="name" x="318" y="156" text-anchor="middle">readObject()</text>
  <text class="name" x="318" y="176" text-anchor="middle">unserialize()</text>
  <text class="muted" x="318" y="204" text-anchor="middle">desserialização nativa</text>
  <path d="M408,176 L442,176" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 3: key moment -->
  <rect x="446" y="96" width="270" height="168" rx="6" fill="#3b0f16" stroke="#ef4444" stroke-width="2.4" filter="url(#glow-red)"/>
  <text class="key" x="581" y="120" text-anchor="middle">MOMENTO-CHAVE</text>
  <text class="step" x="462" y="150">1. Recria o TIPO que</text>
  <text class="step" x="462" y="168">   os bytes mandarem</text>
  <text class="body" x="462" y="186">   qualquer classe do servidor</text>
  <text class="step" x="462" y="218">2. Chama métodos dele</text>
  <text class="step" x="462" y="236">   DURANTE a reconstrução</text>
  <path d="M716,176 L750,176" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- 4: gadget chain -->
  <rect x="754" y="128" width="166" height="96" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="1.5"/>
  <text class="namer" x="837" y="156" text-anchor="middle">gadget chain</text>
  <text class="body" x="837" y="180" text-anchor="middle">encadeia classes</text>
  <text class="body" x="837" y="198" text-anchor="middle">que já estão lá</text>
  <path d="M837,224 L837,290" fill="none" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>

  <!-- 5: consequence -->
  <rect x="460" y="294" width="460" height="74" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2.4" filter="url(#glow-red)"/>
  <text class="res" x="690" y="326" text-anchor="middle">O servidor executa o comando do atacante</text>
  <text class="body" x="690" y="350" text-anchor="middle">só por ter reconstruído o objeto</text>

  <!-- 6: safe comparison, separate and secondary -->
  <rect x="40" y="410" width="880" height="110" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="muted" x="56" y="434">Para comparar: o caminho seguro</text>
  <text class="def" x="56" y="462">Ler JSON para um tipo que VOCÊ fixou</text>
  <text class="body" x="56" y="484">o parser só copia valores para campos conhecidos:</text>
  <text class="body" x="56" y="502">não escolhe o tipo, não chama métodos, nada é executado</text>

  <!-- legend -->
  <line x1="40" y1="562" x2="76" y2="562" stroke="#ef4444" stroke-width="2"/>
  <text class="muted" x="86" y="566">atacante / perigo</text>
  <line x1="320" y1="562" x2="356" y2="562" stroke="#64748b" stroke-width="2"/>
  <text class="muted" x="366" y="566">passo normal do servidor</text>
  <line x1="650" y1="562" x2="686" y2="562" stroke="#34d399" stroke-width="2"/>
  <text class="muted" x="696" y="566">caminho seguro</text>
</svg>
