<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Por que desserializar bytes não confiáveis executa código, enquanto ler dados puros não</title>
  <desc id="d">Duas trilhas paralelas partindo de uma entrada controlada pelo atacante. Na trilha de cima, perigosa: os bytes do atacante entram numa função de desserialização nativa, como readObject em Java ou unserialize em PHP; essa função reconstrói o objeto a partir dos bytes, e isso não é só preencher campos — ela recria o tipo que os bytes mandarem e, durante a reconstrução, chama métodos do próprio objeto, como readObject interno, finalize ou comparadores; se existir na aplicação uma corrente de classes encadeáveis, a chamada vira uma gadget chain que termina executando um comando do sistema, resultando em execução remota de código. Na trilha de baixo, segura: os mesmos bytes, agora num formato de dados puro como JSON, são apenas lidos para dentro de um tipo que você fixou de antemão; o parser preenche campos conhecidos e não instancia tipos escolhidos pelo atacante nem chama métodos, então não há execução. O rodapé resume a diferença: o perigo não é ler dados, é deixar os bytes decidirem qual objeto construir e disparar código durante a construção.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 15.5px; font-weight: 700; }
    .h { font-size: 12.5px; font-weight: 700; }
    .b { font-size: 11px; }
    .code { font-size: 10.5px; }
    .s { font-size: 10px; fill: #9fb0a6; }
    .r { fill: #ef7b6b; font-weight: 700; }
    .g { fill: #5ee08a; font-weight: 700; }
    .y { fill: #e8c46a; }
    .in { fill: #241717; stroke: #ef7b6b; stroke-width: 1.4; }
    .boxr { fill: #1d1513; stroke: #ef7b6b; stroke-width: 1.4; }
    .boxg { fill: #16201b; stroke: #5ee08a; stroke-width: 1.4; }
    .arr { stroke: #ef7b6b; stroke-width: 2.2; marker-end: url(#ar); fill: none; }
    .arg { stroke: #5ee08a; stroke-width: 2.2; marker-end: url(#ag); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ef7b6b"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="24" y="32">Desserialização nativa x leitura de dados puros</text>

  <!-- shared input -->
  <rect class="in" x="24" y="210" width="150" height="90" rx="10"/>
  <text class="h r" x="99" y="240" text-anchor="middle">Bytes do</text>
  <text class="h r" x="99" y="258" text-anchor="middle">atacante</text>
  <text class="s" x="99" y="284" text-anchor="middle">entrada que ele</text>
  <text class="s" x="99" y="298" text-anchor="middle">controla</text>

  <!-- DANGEROUS lane -->
  <text class="h r" x="210" y="80">TRILHA PERIGOSA — desserialização nativa</text>
  <path class="arr" d="M174,232 C195,232 195,120 214,120"/>
  <rect class="boxr" x="214" y="92" width="180" height="60" rx="9"/>
  <text class="b r" x="304" y="116" text-anchor="middle">readObject() /</text>
  <text class="b r" x="304" y="134" text-anchor="middle">unserialize()</text>
  <path class="arr" d="M394,122 L432,122"/>
  <rect class="boxr" x="432" y="92" width="190" height="60" rx="9"/>
  <text class="b" x="527" y="112" text-anchor="middle">reconstrói o objeto</text>
  <text class="s" x="527" y="130" text-anchor="middle">recria o TIPO que os</text>
  <text class="s" x="527" y="144" text-anchor="middle">bytes mandarem</text>
  <path class="arr" d="M622,122 L660,122"/>
  <rect class="boxr" x="660" y="86" width="216" height="72" rx="9"/>
  <text class="b r" x="768" y="108" text-anchor="middle">gadget chain dispara</text>
  <text class="code" x="768" y="126" text-anchor="middle">Runtime.exec("...")</text>
  <text class="h r" x="768" y="146" text-anchor="middle">→ RCE</text>
  <text class="s" x="214" y="176">durante a reconstrução a função chama métodos do próprio objeto (readObject</text>
  <text class="s" x="214" y="190">interno, comparadores, finalize): é aí que o código do atacante entra.</text>

  <!-- SAFE lane -->
  <text class="g" x="210" y="360" style="font-size:12.5px">TRILHA SEGURA — formato de dados puro (JSON)</text>
  <path class="arg" d="M174,278 C195,278 195,392 214,392"/>
  <rect class="boxg" x="214" y="364" width="180" height="60" rx="9"/>
  <text class="b g" x="304" y="388" text-anchor="middle">parser JSON lê</text>
  <text class="b g" x="304" y="406" text-anchor="middle">para um tipo FIXO</text>
  <path class="arg" d="M394,394 L432,394"/>
  <rect class="boxg" x="432" y="364" width="190" height="60" rx="9"/>
  <text class="b" x="527" y="388" text-anchor="middle">preenche campos</text>
  <text class="s" x="527" y="406" text-anchor="middle">conhecidos, só isso</text>
  <path class="arg" d="M622,394 L660,394"/>
  <rect class="boxg" x="660" y="364" width="216" height="60" rx="9"/>
  <text class="b g" x="768" y="388" text-anchor="middle">nenhum método é</text>
  <text class="b g" x="768" y="406" text-anchor="middle">chamado → sem RCE</text>
  <text class="s" x="214" y="446">o atacante não escolhe o tipo a construir, e nada é executado ao ler.</text>

  <line x1="24" y1="472" x2="876" y2="472" stroke="#2a332e" stroke-width="1"/>
  <text class="s" x="24" y="496">O perigo não é "ler dados": é deixar os BYTES decidirem qual objeto construir e</text>
  <text class="s" x="24" y="512">disparar código DURANTE a construção. Dados puros só preenchem; não instanciam nem executam.</text>
</svg>
