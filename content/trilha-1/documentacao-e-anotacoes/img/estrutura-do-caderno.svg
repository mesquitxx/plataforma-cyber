<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">A árvore de pastas de um engajamento</title>
  <desc id="d">Uma árvore de diretórios. Na raiz, a pasta 2026-088_transportadora-exemplo, o contrato e o cliente no nome. Dentro dela, oito itens: admin (carta de autorização, regras de engajamento, contatos); escopo (faixas de IP e janela em texto); notas, que contém diario.md (uma linha por ação, em UTC) e a subpasta hosts (uma nota por máquina); achados (uma nota por achado, no modelo); evidencias, com as subpastas originais (nunca editadas) e derivadas (mascaradas e cortadas); sessoes (gravações do terminal, fora do Git); relatorio (o documento final); e dois arquivos na raiz, MANIFESTO.sha256 (os hashes de cada evidência) e o repositório Git .git, que versiona tudo menos as sessões grandes. Uma legenda marca em verde o que entra no Git e em cinza o que fica de fora.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .dir { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .file { font-size: 12.5px; fill: #e6ede8; }
    .s { font-size: 11px; fill: #9fb0a6; }
    .green { fill: #5ee08a; }
  </style>
  <rect width="900" height="500" fill="#121815"/>
  <text class="t" x="30" y="30">Uma pasta por engajamento, versionada no Git</text>

  <g stroke="#34413b" stroke-width="1.5" fill="none">
    <path d="M 46 58 V 462 M 46 76 H 66 M 46 110 H 66 M 46 144 H 66 M 46 230 H 66 M 46 316 H 66 M 46 376 H 66 M 46 410 H 66 M 46 444 H 66"/>
    <path d="M 86 144 V 212 M 86 162 H 106 M 86 196 H 106 M 86 212 H 106"/>
    <path d="M 86 316 V 384 M 86 334 H 106 M 86 368 H 106"/>
  </g>

  <text class="dir" x="30" y="56">2026-088_transportadora-exemplo/</text>

  <text class="dir" x="70" y="80">admin/</text>
  <text class="s" x="300" y="80">carta de autorização, RoE, contatos</text>

  <text class="dir" x="70" y="114">escopo/</text>
  <text class="s" x="300" y="114">faixas de IP e janela, em texto</text>

  <text class="dir" x="70" y="148">notas/</text>
  <text class="file green" x="110" y="166">diario.md</text>
  <text class="s" x="300" y="166">uma linha por ação, em UTC</text>
  <text class="dir" x="110" y="200">hosts/</text>
  <text class="s" x="300" y="200">uma nota por máquina</text>
  <text class="file green" x="130" y="216" style="font-size:11.5px">10.0.5.15.md ...</text>

  <text class="dir" x="70" y="234">achados/</text>
  <text class="s" x="300" y="234">uma nota por achado, no modelo</text>
  <text class="file green" x="110" y="252" style="font-size:11.5px">A01.md  A02.md  MODELO.md</text>

  <text class="dir" x="70" y="320">evidencias/</text>
  <text class="dir" x="110" y="338">originais/</text>
  <text class="s" x="300" y="338">nunca editadas</text>
  <text class="dir" x="110" y="372">derivadas/</text>
  <text class="s" x="300" y="372">mascaradas e cortadas</text>

  <text class="dir" x="70" y="380">sessoes/</text>
  <text class="s" x="300" y="380">gravações do terminal (fora do Git)</text>

  <text class="file green" x="70" y="414">MANIFESTO.sha256</text>
  <text class="s" x="300" y="414">hash de cada evidência</text>

  <text class="dir" x="70" y="448">.git/</text>
  <text class="s" x="300" y="448">versiona tudo, menos sessoes/</text>

  <rect x="560" y="440" width="18" height="12" fill="#5ee08a"/>
  <text class="s" x="584" y="450" style="fill:#5ee08a">entra no Git</text>
  <rect x="690" y="440" width="18" height="12" fill="#9fb0a6"/>
  <text class="s" x="714" y="450">fica de fora (grande)</text>
</svg>
