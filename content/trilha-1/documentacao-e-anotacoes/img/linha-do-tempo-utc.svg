<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="t d">
  <title id="t">Três fontes, três fusos, uma linha do tempo em UTC</title>
  <desc id="d">Três faixas à esquerda representam três anotações do mesmo trabalho: a de Ana em horário de Brasília (UTC menos 3), o terminal de Bruno em UTC com Z, e o proxy de Carla em Unix epoch (segundos desde 1970). Cada registro é convertido para UTC e colocado numa régua de tempo única embaixo, em ordem. A conversão mostra, por exemplo, que a nota de Ana das 20:41 (Brasília) e o alerta do SOC das 23:41 UTC são o mesmo instante. Na régua, um marcador vermelho às 02:26 UTC fica sozinho: nenhuma ação da equipe cai ali, então aquele alerta do SOC é atividade externa, de um atacante real, e não da equipe de teste.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11px; fill: #9fb0a6; }
    .c { font-size: 11.5px; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="440" fill="#121815"/>
  <text class="t" x="30" y="30">Primeiro converta tudo para UTC, depois ordene</text>

  <!-- three sources -->
  <rect class="box" x="30" y="56" width="250" height="60" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="78" style="fill:#5cc8d8">notas-ana.md  (Brasília, UTC-3)</text>
  <text class="c" x="44" y="100" style="font-size:11.5px">A04 20:41  nmap -sV em 10.0.5.15</text>

  <rect class="box" x="30" y="124" width="250" height="60" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="44" y="146" style="fill:#e8c25a">terminal-bruno.log  (UTC, Z)</text>
  <text class="c" x="44" y="168" style="font-size:11.5px">B06 2026-10-07T00:52:11Z  senhas</text>

  <rect class="box" x="30" y="192" width="250" height="60" rx="8" style="stroke:#b48cf0"/>
  <text class="m" x="44" y="214" style="fill:#b48cf0">proxy-carla.csv  (Unix epoch)</text>
  <text class="c" x="44" y="236" style="font-size:11.5px">C07 1791335585  ?q=caneta'--</text>

  <!-- convert arrows -->
  <g stroke="#5ee08a" stroke-width="2" marker-end="url(#g)">
    <line x1="280" y1="86" x2="330" y2="150"/>
    <line x1="280" y1="154" x2="330" y2="160"/>
    <line x1="280" y1="222" x2="330" y2="172"/>
  </g>
  <rect class="box" x="332" y="132" width="180" height="60" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="346" y="156" style="fill:#5ee08a">converter p/ UTC</text>
  <text class="s" x="346" y="176">date -u -d ... / @epoch</text>

  <line x1="512" y1="162" x2="556" y2="162" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>

  <!-- ruler -->
  <text class="m" x="590" y="78">régua única (UTC)</text>
  <line x1="600" y1="96" x2="600" y2="300" stroke="#9fb0a6" stroke-width="1.6"/>
  <g class="c" style="font-size:11.5px">
    <circle cx="600" cy="118" r="4" fill="#5cc8d8"/><text x="616" y="122">23:41  A04  (= alerta SOC AL1)</text>
    <circle cx="600" cy="150" r="4" fill="#e8c25a"/><text x="616" y="154">00:52  B06  (= alerta SOC AL2)</text>
    <circle cx="600" cy="182" r="4" fill="#b48cf0"/><text x="616" y="186">01:13  C07  (= alerta SOC AL3)</text>
    <circle cx="600" cy="230" r="6" fill="#f06a6a"/><text x="616" y="234" style="fill:#f06a6a">02:26  — nenhuma ação aqui</text>
  </g>
  <text class="s" x="616" y="258" style="fill:#f06a6a">sem correspondência = atividade</text>
  <text class="s" x="616" y="274" style="fill:#f06a6a">externa (atacante real), não a equipe</text>
  <text class="s" x="600" y="316">o tempo corre para baixo</text>

  <rect class="box" x="30" y="356" width="840" height="56" rx="8" style="stroke:#9fb0a6"/>
  <text class="c" x="46" y="388" style="font-size:12px">Sem fuso escrito, a nota "20:41" é ambígua: pode ser 23:41Z ou outra hora. Por isso toda linha do caderno leva o fuso — de preferência UTC.</text>
</svg>
