<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">O ciclo da anotação: da ação ao relatório</title>
  <desc id="d">Um ciclo com cinco caixas ligadas por setas. (1) Ação: um comando que toca o alvo. Dela sai uma seta para (2) Registro: uma linha no diário com a hora em UTC, o alvo, o comando e o resultado. Do registro sai uma seta para (3) Evidência: a saída salva num arquivo e o hash no manifesto. Da evidência sai uma seta para (4) Achado: título, ativo, hora, passos para reproduzir, impacto e recomendação, que citam a evidência. Do achado sai uma seta para (5) Relatório: resumo executivo e achados, entregue ao cliente. Uma seta curva volta do relatório e do achado para a ação, porque cada achado abre novas ações a testar. Embaixo, uma faixa atravessa as cinco caixas dizendo que a hora em UTC e a integridade por hash acompanham o dado em todas as etapas.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .c { font-size: 11.5px; fill: #e6ede8; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0a35a"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="30">O que não foi registrado não aconteceu</text>

  <!-- loop back arrow -->
  <path d="M 790 150 C 860 120, 860 40, 300 40 L 150 40 C 70 40, 70 96, 96 118" fill="none" stroke="#f0a35a" stroke-width="2" marker-end="url(#o)"/>
  <text class="s" x="300" y="72" style="fill:#f0a35a">cada achado abre novas ações a testar (é iterativo)</text>

  <!-- box 1 Ação -->
  <rect class="box" x="30" y="120" width="150" height="96" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="144" style="fill:#5cc8d8">1 ação</text>
  <text class="c" x="44" y="166">um comando</text>
  <text class="c" x="44" y="184">que toca o</text>
  <text class="c" x="44" y="202">alvo</text>

  <!-- box 2 Registro -->
  <rect class="box" x="210" y="120" width="150" height="96" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="224" y="144" style="fill:#5ee08a">2 registro</text>
  <text class="c" x="224" y="166">linha no diário:</text>
  <text class="c" x="224" y="184">hora UTC, alvo,</text>
  <text class="c" x="224" y="202">comando, resultado</text>

  <!-- box 3 Evidência -->
  <rect class="box" x="390" y="120" width="150" height="96" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="404" y="144" style="fill:#5ee08a">3 evidência</text>
  <text class="c" x="404" y="166">saída salva em</text>
  <text class="c" x="404" y="184">arquivo + hash</text>
  <text class="c" x="404" y="202">no manifesto</text>

  <!-- box 4 Achado -->
  <rect class="box" x="570" y="120" width="150" height="96" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="584" y="144" style="fill:#e8c25a">4 achado</text>
  <text class="c" x="584" y="166">passos para</text>
  <text class="c" x="584" y="184">reproduzir,</text>
  <text class="c" x="584" y="202">impacto, correção</text>

  <!-- box 5 Relatório -->
  <rect class="box" x="750" y="120" width="120" height="96" rx="8" style="stroke:#b48cf0"/>
  <text class="m" x="764" y="144" style="fill:#b48cf0">5 relatório</text>
  <text class="c" x="764" y="166">resumo +</text>
  <text class="c" x="764" y="184">achados ao</text>
  <text class="c" x="764" y="202">cliente</text>

  <g stroke="#5ee08a" stroke-width="2" marker-end="url(#g)">
    <line x1="180" y1="168" x2="208" y2="168"/>
    <line x1="360" y1="168" x2="388" y2="168"/>
    <line x1="540" y1="168" x2="568" y2="168"/>
    <line x1="720" y1="168" x2="748" y2="168"/>
  </g>

  <!-- bottom band -->
  <rect class="box" x="30" y="360" width="840" height="72" rx="8" style="stroke:#9fb0a6"/>
  <text class="m" x="46" y="386" style="fill:#9fb0a6">em todas as etapas:</text>
  <text class="c" x="46" y="410">a hora em UTC (ISO 8601) e a integridade por hash acompanham o dado — do comando ao relatório</text>
  <g stroke="#9fb0a6" stroke-width="1.6" stroke-dasharray="4 4">
    <line x1="105" y1="216" x2="105" y2="360"/>
    <line x1="465" y1="216" x2="465" y2="360"/>
    <line x1="810" y1="216" x2="810" y2="360"/>
  </g>
</svg>
