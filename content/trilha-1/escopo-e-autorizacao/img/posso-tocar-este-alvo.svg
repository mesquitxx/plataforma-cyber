<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">Árvore de decisão: posso tocar este alvo agora?</title>
  <desc id="d">Seis perguntas em sequência, de cima para baixo. Um: o alvo está escrito no escopo, como IP, faixa ou URL exata? Se não, não toque, ou peça um adendo. Dois: ele está numa exclusão? Se sim, não toque. Três: se é um nome, você resolveu agora e todos os IPs estão dentro do escopo? Se não, não toque e avise. Quatro: a infraestrutura é do cliente, ou há autorização escrita do terceiro? Se não, não toque. Cinco: agora está dentro da janela, no fuso do contrato? Se não, espere. Seis: a técnica que você vai usar é permitida pelas regras? Se não, não use, ou peça adendo. Se todas passam, pode testar, registrando data, hora, origem e comando. Uma faixa abaixo lembra que, durante o teste, uma condição de parada (invasor anterior, serviço degradado, dados pessoais além do necessário) interrompe tudo e exige aviso imediato.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f06a6a"/></marker>
  </defs>
  <rect width="900" height="560" fill="#121815"/>
  <text class="t" x="30" y="34">Antes de cada ação: posso tocar este alvo agora?</text>

  <!-- questions: x=30 w=500 h=48, step 66 starting y=52 -->
  <rect class="box" x="30" y="52" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="81">1. Está escrito no escopo (IP, faixa, URL exata)?</text>
  <rect class="box" x="30" y="118" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="147">2. Está numa exclusão?</text>
  <rect class="box" x="30" y="184" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="213">3. Se é nome: resolvi AGORA e todo IP está dentro?</text>
  <rect class="box" x="30" y="250" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="279">4. A infraestrutura é do cliente (ou o terceiro assinou)?</text>
  <rect class="box" x="30" y="316" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="345">5. Estou dentro da janela, no fuso do contrato?</text>
  <rect class="box" x="30" y="382" width="500" height="48" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="411">6. A técnica é permitida pelas regras?</text>

  <!-- yes arrows down -->
  <line x1="280" y1="100" x2="280" y2="114" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="112" style="fill:#5ee08a">sim</text>
  <line x1="280" y1="166" x2="280" y2="180" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="178" style="fill:#5ee08a">não</text>
  <line x1="280" y1="232" x2="280" y2="246" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="244" style="fill:#5ee08a">sim</text>
  <line x1="280" y1="298" x2="280" y2="312" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="310" style="fill:#5ee08a">sim</text>
  <line x1="280" y1="364" x2="280" y2="378" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="376" style="fill:#5ee08a">sim</text>
  <line x1="280" y1="430" x2="280" y2="444" stroke="#5ee08a" stroke-width="1.6" marker-end="url(#g)"/>
  <text class="s" x="290" y="442" style="fill:#5ee08a">sim</text>

  <rect class="box" x="30" y="448" width="500" height="44" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="44" y="468" style="fill:#5ee08a">Pode testar, registrando data, hora, origem</text>
  <text class="m" x="44" y="484" style="fill:#5ee08a">e comando no caderno.</text>

  <!-- no branches -->
  <line x1="530" y1="76" x2="596" y2="76" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="70" style="fill:#f06a6a">não</text>
  <text class="s" x="604" y="80">não toque, ou peça adendo</text>
  <line x1="530" y1="142" x2="596" y2="142" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="136" style="fill:#f06a6a">sim</text>
  <text class="s" x="604" y="146">não toque</text>
  <line x1="530" y1="208" x2="596" y2="208" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="202" style="fill:#f06a6a">não</text>
  <text class="s" x="604" y="212">não toque e avise o contato</text>
  <line x1="530" y1="274" x2="596" y2="274" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="268" style="fill:#f06a6a">não</text>
  <text class="s" x="604" y="278">não toque</text>
  <line x1="530" y1="340" x2="596" y2="340" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="334" style="fill:#f06a6a">não</text>
  <text class="s" x="604" y="344">espere a janela</text>
  <line x1="530" y1="406" x2="596" y2="406" stroke="#f06a6a" stroke-width="1.6" marker-end="url(#r)"/>
  <text class="s" x="540" y="400" style="fill:#f06a6a">não</text>
  <text class="s" x="604" y="410">não use, ou peça adendo</text>

  <rect x="30" y="506" width="840" height="40" rx="8" fill="#2a1a1a" stroke="#f06a6a" stroke-width="1.4"/>
  <text class="s" x="44" y="524" style="fill:#f06a6a">Durante o teste: invasor anterior, serviço degradado ou dados pessoais além do necessário</text>
  <text class="s" x="44" y="539" style="fill:#f06a6a">= condição de parada: interrompa a ação e avise o contato de emergência na hora.</text>
</svg>
