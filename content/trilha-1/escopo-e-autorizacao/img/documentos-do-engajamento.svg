<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" role="img" aria-labelledby="t d">
  <title id="t">Os documentos de um engajamento e a pergunta que cada um responde</title>
  <desc id="d">No alto, o MSA, contrato-mestre que define as regras gerais da relação: responsabilidade, sigilo, pagamento e lei aplicável. Abaixo dele, o NDA, acordo de sigilo, que pode vir separado ou dentro do MSA. Do MSA sai o SOW, que diz o que será feito, em que prazo e por qual preço. Do SOW saem dois documentos lado a lado: as regras de engajamento, que dizem como o teste acontece (janela, técnicas permitidas e proibidas, contatos, condições de parada, tratamento de dados), e a carta de autorização, curta, assinada por quem tem autoridade sobre os alvos, que o testador consegue mostrar a quem perguntar. Uma caixa lateral, o adendo, aponta para o SOW e para as regras: toda mudança de escopo, técnica ou janela vira um adendo assinado de novo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0a6"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f0a35a"/></marker>
  </defs>
  <rect width="900" height="490" fill="#121815"/>
  <text class="t" x="30" y="34">Cada documento responde a uma pergunta diferente</text>

  <rect class="box" x="200" y="56" width="330" height="74" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="214" y="80" style="fill:#5cc8d8">MSA — contrato-mestre</text>
  <text class="s" x="214" y="100">Quais as regras gerais da relação?</text>
  <text class="s" x="214" y="116">responsabilidade, sigilo, pagamento, foro</text>

  <rect class="box" x="580" y="56" width="290" height="74" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="594" y="80" style="fill:#5cc8d8">NDA — sigilo</text>
  <text class="s" x="594" y="100">O que ninguém pode contar?</text>
  <text class="s" x="594" y="116">(separado ou dentro do MSA)</text>
  <line x1="530" y1="93" x2="576" y2="93" stroke="#9fb0a6" stroke-width="1.4" stroke-dasharray="4 4"/>

  <line x1="365" y1="130" x2="365" y2="158" stroke="#9fb0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <rect class="box" x="200" y="162" width="330" height="74" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="214" y="186" style="fill:#e8c25a">SOW — escopo do trabalho</text>
  <text class="s" x="214" y="206">O que será feito, quando, por quanto?</text>
  <text class="s" x="214" y="222">alvos, tipo de teste, entregas, prazo</text>

  <line x1="300" y1="236" x2="190" y2="276" stroke="#9fb0a6" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="430" y1="236" x2="540" y2="276" stroke="#9fb0a6" stroke-width="1.6" marker-end="url(#a)"/>

  <rect class="box" x="30" y="280" width="370" height="150" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="44" y="304" style="fill:#5ee08a">RoE — regras de engajamento</text>
  <text class="s" x="44" y="324">COMO o teste acontece?</text>
  <text class="s" x="44" y="346">• janela de teste, com fuso horário</text>
  <text class="s" x="44" y="364">• técnicas permitidas e proibidas</text>
  <text class="s" x="44" y="382">• contatos, IPs de origem, status</text>
  <text class="s" x="44" y="400">• condições de parada</text>
  <text class="s" x="44" y="418">• tratamento e destruição de dados</text>

  <rect class="box" x="430" y="280" width="250" height="150" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="444" y="304" style="fill:#5ee08a">Carta de autorização</text>
  <text class="s" x="444" y="324">QUEM autoriza O QUÊ?</text>
  <text class="s" x="444" y="346">• uma ou duas páginas</text>
  <text class="s" x="444" y="364">• assinada por quem tem</text>
  <text class="s" x="444" y="380">  autoridade sobre os alvos</text>
  <text class="s" x="444" y="398">• telefone para confirmar</text>
  <text class="s" x="444" y="416">• vai com o testador</text>

  <rect class="box" x="710" y="190" width="160" height="110" rx="8" style="stroke:#f0a35a"/>
  <text class="m" x="724" y="214" style="fill:#f0a35a">Adendo</text>
  <text class="s" x="724" y="236">mudou alvo,</text>
  <text class="s" x="724" y="252">técnica ou janela?</text>
  <text class="s" x="724" y="274">novo documento,</text>
  <text class="s" x="724" y="290">assinado de novo</text>
  <line x1="710" y1="220" x2="534" y2="205" stroke="#f0a35a" stroke-width="1.6" marker-end="url(#o)"/>
  <path d="M790 300 V 446 H 215 V 434" fill="none" stroke="#f0a35a" stroke-width="1.6" marker-end="url(#o)"/>

  <text class="s" x="30" y="474">Os nomes variam entre empresas e países; o que importa é que cada pergunta tenha resposta por escrito.</text>
</svg>
