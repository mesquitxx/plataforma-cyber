<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Anatomia de uma entrada do MITRE ATT&amp;CK</title>
  <desc id="d">Quatro níveis, da esquerda para a direita, ligados por setas. Tática TA0006, Credential Access: o porquê, o adversário quer roubar contas e senhas. Técnica T1552, Unsecured Credentials: o como, em termos gerais, achar credenciais guardadas sem proteção. Subtécnica T1552.001, Credentials In Files: o como, específico, credenciais em arquivos. Procedimento: o grupo FIN13, G1016, obteve credenciais administrativas vasculhando arquivos locais de uma máquina comprometida, ou seja, como um adversário real fez. Embaixo, a página da subtécnica traz também as mitigações, como M1047 Audit e M1027 Password Policies, e uma estratégia de detecção.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .c { font-size: 11.5px; fill: #e6ede8; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="400" fill="#121815"/>
  <text class="t" x="30" y="34">Do "porquê" ao "como um grupo real fez"</text>

  <rect class="box" x="30" y="60" width="190" height="170" rx="10" style="stroke:#5cc8d8"/>
  <text class="s" x="44" y="84">TÁTICA (o porquê)</text>
  <text class="m" x="44" y="108" style="fill:#5cc8d8">TA0006</text>
  <text class="m" x="44" y="126" style="fill:#5cc8d8">Credential Access</text>
  <text class="c" x="44" y="156">o adversário quer</text>
  <text class="c" x="44" y="174">roubar contas e</text>
  <text class="c" x="44" y="192">senhas</text>

  <rect class="box" x="245" y="60" width="190" height="170" rx="10" style="stroke:#e8c25a"/>
  <text class="s" x="259" y="84">TÉCNICA (o como)</text>
  <text class="m" x="259" y="108" style="fill:#e8c25a">T1552</text>
  <text class="m" x="259" y="126" style="fill:#e8c25a">Unsecured</text>
  <text class="m" x="259" y="144" style="fill:#e8c25a">Credentials</text>
  <text class="c" x="259" y="174">achar credenciais</text>
  <text class="c" x="259" y="192">guardadas sem</text>
  <text class="c" x="259" y="210">proteção</text>

  <rect class="box" x="460" y="60" width="190" height="170" rx="10" style="stroke:#f0a35a"/>
  <text class="s" x="474" y="84">SUBTÉCNICA</text>
  <text class="m" x="474" y="108" style="fill:#f0a35a">T1552.001</text>
  <text class="m" x="474" y="126" style="fill:#f0a35a">Credentials</text>
  <text class="m" x="474" y="144" style="fill:#f0a35a">In Files</text>
  <text class="c" x="474" y="174">senha em arquivo:</text>
  <text class="c" x="474" y="192">config, script,</text>
  <text class="c" x="474" y="210">backup</text>

  <rect class="box" x="675" y="60" width="195" height="170" rx="10" style="stroke:#f06a6a"/>
  <text class="s" x="689" y="84">PROCEDIMENTO</text>
  <text class="m" x="689" y="108" style="fill:#f06a6a">FIN13 (G1016)</text>
  <text class="c" x="689" y="138">obteve credenciais</text>
  <text class="c" x="689" y="156">de administrador</text>
  <text class="c" x="689" y="174">vasculhando arquivos</text>
  <text class="c" x="689" y="192">locais de uma máquina</text>
  <text class="c" x="689" y="210">comprometida</text>

  <g stroke="#5ee08a" stroke-width="2" marker-end="url(#g)">
    <line x1="220" y1="145" x2="242" y2="145"/>
    <line x1="435" y1="145" x2="457" y2="145"/>
    <line x1="650" y1="145" x2="672" y2="145"/>
  </g>

  <rect class="box" x="30" y="256" width="840" height="120" rx="10" style="stroke:#5ee08a"/>
  <text class="m" x="46" y="280" style="fill:#5ee08a">a mesma página serve à defesa</text>
  <text class="c" x="46" y="304">Mitigations: M1047 Audit (procurar antes do atacante arquivos com senha),</text>
  <text class="c" x="46" y="322">M1027 Password Policies (proibir senha em arquivo), M1022 (restringir permissões),</text>
  <text class="c" x="46" y="340">M1017 User Training</text>
  <text class="c" x="46" y="362">Detection Strategy: como perceber alguém lendo esses arquivos</text>
</svg>
