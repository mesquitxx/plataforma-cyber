<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">As três famílias de metodologia</title>
  <desc id="d">Três colunas. A primeira, processo do engajamento, responde "em que ordem eu trabalho, do contrato ao relatório?" e traz PTES, NIST SP 800-115 e OSSTMM; quem usa é o time que conduz o teste. A segunda, guia técnico de testes, responde "o que exatamente eu testo nesta tecnologia?" e traz o OWASP WSTG, com IDs como WSTG-ATHN-03; quem usa é o testador, alvo por alvo. A terceira, modelo do adversário, responde "como um ataque real progride e onde ele pode ser quebrado?" e traz a Cyber Kill Chain, o MITRE ATT&amp;CK e a Unified Kill Chain; quem usa são o defensor, o red team e o relatório. Uma faixa embaixo diz que um engajamento bem feito usa as três ao mesmo tempo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 13px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .e { font-size: 12px; fill: #e6ede8; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="34">Três perguntas diferentes, três famílias de "metodologia"</text>

  <!-- column 1 -->
  <rect class="box" x="30" y="56" width="270" height="318" rx="10" style="stroke:#5cc8d8"/>
  <text class="m" x="46" y="82" style="fill:#5cc8d8">1. PROCESSO DO ENGAJAMENTO</text>
  <text class="s" x="46" y="108">pergunta:</text>
  <text class="e" x="46" y="128">"em que ordem eu trabalho,</text>
  <text class="e" x="46" y="146">do contrato ao relatório?"</text>
  <text class="s" x="46" y="178">exemplos:</text>
  <text class="e" x="46" y="198">PTES (7 seções)</text>
  <text class="e" x="46" y="218">NIST SP 800-115 (2008)</text>
  <text class="e" x="46" y="238">OSSTMM 3 (2010)</text>
  <text class="s" x="46" y="270">entrega:</text>
  <text class="e" x="46" y="290">fases, entradas e saídas,</text>
  <text class="e" x="46" y="308">o que documentar</text>
  <text class="s" x="46" y="340">quem usa: o time inteiro,</text>
  <text class="s" x="46" y="358">do kickoff à entrega</text>

  <!-- column 2 -->
  <rect class="box" x="315" y="56" width="270" height="318" rx="10" style="stroke:#e8c25a"/>
  <text class="m" x="331" y="82" style="fill:#e8c25a">2. GUIA TÉCNICO DE TESTES</text>
  <text class="s" x="331" y="108">pergunta:</text>
  <text class="e" x="331" y="128">"o que exatamente eu testo</text>
  <text class="e" x="331" y="146">nesta tecnologia?"</text>
  <text class="s" x="331" y="178">exemplos:</text>
  <text class="e" x="331" y="198">OWASP WSTG v4.2 (web)</text>
  <text class="e" x="331" y="218">OWASP MASTG (mobile)</text>
  <text class="s" x="331" y="270">entrega:</text>
  <text class="e" x="331" y="290">uma lista de testes com ID,</text>
  <text class="e" x="331" y="308">objetivo e "como testar"</text>
  <text class="s" x="331" y="340">quem usa: o testador,</text>
  <text class="s" x="331" y="358">teste a teste (WSTG-ATHN-03)</text>

  <!-- column 3 -->
  <rect class="box" x="600" y="56" width="270" height="318" rx="10" style="stroke:#f06a6a"/>
  <text class="m" x="616" y="82" style="fill:#f06a6a">3. MODELO DO ADVERSÁRIO</text>
  <text class="s" x="616" y="108">pergunta:</text>
  <text class="e" x="616" y="128">"como um ataque real anda,</text>
  <text class="e" x="616" y="146">e onde ele pode ser quebrado?"</text>
  <text class="s" x="616" y="178">exemplos:</text>
  <text class="e" x="616" y="198">Cyber Kill Chain (2011)</text>
  <text class="e" x="616" y="218">MITRE ATT&amp;CK</text>
  <text class="e" x="616" y="238">Unified Kill Chain (2017)</text>
  <text class="s" x="616" y="270">entrega:</text>
  <text class="e" x="616" y="290">fases e técnicas com nome</text>
  <text class="e" x="616" y="308">e ID (T1190), comuns a todos</text>
  <text class="s" x="616" y="340">quem usa: a defesa, o red</text>
  <text class="s" x="616" y="358">team e o relatório</text>

  <!-- band -->
  <rect class="box" x="30" y="392" width="840" height="58" rx="10" style="stroke:#5ee08a"/>
  <text class="m" x="46" y="416" style="fill:#5ee08a">um engajamento bem feito usa as três ao mesmo tempo:</text>
  <text class="s" x="46" y="436">o PTES dá a ordem, o WSTG diz o que testar no alvo web, o ATT&amp;CK dá nome ao que foi feito</text>
</svg>
