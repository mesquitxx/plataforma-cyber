<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">A Cyber Kill Chain e o que a defesa pode fazer em cada fase</title>
  <desc id="d">Em cima, as sete fases da intrusion kill chain da Lockheed Martin, em sequência, ligadas por setas: reconnaissance, weaponization, delivery, exploitation, installation, command and control (C2) e actions on objectives. Embaixo de cada fase, exemplos de courses of action tirados da tabela 1 do artigo de 2011: em reconnaissance, detectar com web analytics e negar com ACL de firewall; em weaponization, detectar com NIDS e negar com NIPS; em delivery, detectar com um usuário atento e negar com filtro de proxy; em exploitation, detectar com HIDS e negar com patch; em installation, detectar com HIDS e interromper com antivírus; em C2, detectar com NIDS e negar com ACL de firewall; em actions on objectives, detectar com log de auditoria e enganar com honeypot. Uma corrente embaixo mostra um elo quebrado: o atacante precisa vencer todas as fases, a defesa precisa quebrar só uma. Uma caixa final resume a crítica da Unified Kill Chain: o modelo é focado no perímetro e em malware, e ataques reais pulam fases.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .c { font-size: 11.5px; fill: #e6ede8; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f06a6a"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="34">Cyber Kill Chain: o caminho do atacante e os pontos de quebra</text>

  <!-- phases: x = 35 + i*120, width 110 -->
  <g>
    <rect class="box" x="30"  y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="40"  y="80" style="fill:#f06a6a">1 recon-</text>
    <text class="m" x="40"  y="98" style="fill:#f06a6a">naissance</text>
    <text class="s" x="40"  y="116">escolher alvo</text>

    <rect class="box" x="151" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="161" y="80" style="fill:#f06a6a">2 weapon-</text>
    <text class="m" x="161" y="98" style="fill:#f06a6a">ization</text>
    <text class="s" x="161" y="116">montar a arma</text>

    <rect class="box" x="272" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="282" y="80" style="fill:#f06a6a">3 delivery</text>
    <text class="s" x="282" y="116">fazer chegar</text>

    <rect class="box" x="393" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="403" y="80" style="fill:#f06a6a">4 exploi-</text>
    <text class="m" x="403" y="98" style="fill:#f06a6a">tation</text>
    <text class="s" x="403" y="116">a arma dispara</text>

    <rect class="box" x="514" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="524" y="80" style="fill:#f06a6a">5 instal-</text>
    <text class="m" x="524" y="98" style="fill:#f06a6a">lation</text>
    <text class="s" x="524" y="116">ficar no alvo</text>

    <rect class="box" x="635" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="645" y="80" style="fill:#f06a6a">6 command</text>
    <text class="m" x="645" y="98" style="fill:#f06a6a">&amp; control</text>
    <text class="s" x="645" y="116">mão no teclado</text>

    <rect class="box" x="756" y="56" width="114" height="70" rx="8" style="stroke:#f06a6a"/>
    <text class="m" x="766" y="80" style="fill:#f06a6a">7 actions on</text>
    <text class="m" x="766" y="98" style="fill:#f06a6a">objectives</text>
    <text class="s" x="766" y="116">o objetivo</text>
  </g>
  <g stroke="#f06a6a" stroke-width="2" marker-end="url(#g)">
    <line x1="144" y1="91" x2="150" y2="91"/>
    <line x1="265" y1="91" x2="271" y2="91"/>
    <line x1="386" y1="91" x2="392" y2="91"/>
    <line x1="507" y1="91" x2="513" y2="91"/>
    <line x1="628" y1="91" x2="634" y2="91"/>
    <line x1="749" y1="91" x2="755" y2="91"/>
  </g>

  <text class="s" x="30" y="152">o que a defesa pode fazer em cada fase (exemplos da tabela 1 do artigo de 2011)</text>
  <g>
    <rect class="box" x="30"  y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="40"  y="182">detectar:</text>
    <text class="c" x="40"  y="198">web analytics</text>
    <text class="s" x="40"  y="222">negar:</text>
    <text class="c" x="40"  y="238">ACL firewall</text>

    <rect class="box" x="151" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="161" y="182">detectar:</text>
    <text class="c" x="161" y="198">NIDS</text>
    <text class="s" x="161" y="222">negar:</text>
    <text class="c" x="161" y="238">NIPS</text>

    <rect class="box" x="272" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="282" y="182">detectar:</text>
    <text class="c" x="282" y="198">usuário atento</text>
    <text class="s" x="282" y="222">negar:</text>
    <text class="c" x="282" y="238">filtro proxy</text>

    <rect class="box" x="393" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="403" y="182">detectar:</text>
    <text class="c" x="403" y="198">HIDS</text>
    <text class="s" x="403" y="222">negar:</text>
    <text class="c" x="403" y="238">patch</text>

    <rect class="box" x="514" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="524" y="182">detectar:</text>
    <text class="c" x="524" y="198">HIDS</text>
    <text class="s" x="524" y="222">interromper:</text>
    <text class="c" x="524" y="238">antivírus</text>

    <rect class="box" x="635" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="645" y="182">detectar:</text>
    <text class="c" x="645" y="198">NIDS</text>
    <text class="s" x="645" y="222">negar:</text>
    <text class="c" x="645" y="238">ACL firewall</text>

    <rect class="box" x="756" y="162" width="114" height="92" rx="8" style="stroke:#5ee08a"/>
    <text class="s" x="766" y="182">detectar:</text>
    <text class="c" x="766" y="198">log auditoria</text>
    <text class="s" x="766" y="222">enganar:</text>
    <text class="c" x="766" y="238">honeypot</text>
  </g>

  <!-- chain: one link per phase; delivery is the broken one -->
  <g fill="none" stroke-width="3">
    <rect x="49" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
    <line x1="125" y1="282" x2="170" y2="282" stroke="#9fb0a6"/>
    <rect x="170" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
    <line x1="246" y1="282" x2="291" y2="282" stroke="#9fb0a6"/>
    <path d="M 321 270 L 303 270 A 12 12 0 0 0 303 294 L 321 294" stroke="#5ee08a"/>
    <path d="M 337 270 L 355 270 A 12 12 0 0 1 355 294 L 337 294" stroke="#5ee08a"/>
    <line x1="367" y1="282" x2="412" y2="282" stroke="#9fb0a6"/>
    <rect x="412" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
    <line x1="488" y1="282" x2="533" y2="282" stroke="#9fb0a6"/>
    <rect x="533" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
    <line x1="609" y1="282" x2="654" y2="282" stroke="#9fb0a6"/>
    <rect x="654" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
    <line x1="730" y1="282" x2="775" y2="282" stroke="#9fb0a6"/>
    <rect x="775" y="270" width="76" height="24" rx="12" stroke="#9fb0a6"/>
  </g>
  <text class="m" x="323" y="287" style="fill:#5ee08a">✂</text>
  <text class="c" x="30" y="326">um filtro de proxy que barra a entrega já quebra a corrente: o atacante precisa vencer TODAS</text>
  <text class="c" x="30" y="344">as fases; a defesa precisa quebrar UMA</text>
  <!-- critique -->
  <rect class="box" x="30" y="362" width="840" height="88" rx="10" style="stroke:#e8c25a"/>
  <text class="m" x="51" y="386" style="fill:#e8c25a">limites do modelo (crítica da Unified Kill Chain, 2017)</text>
  <text class="s" x="51" y="408">focado no perímetro e em malware: cobre mal o atacante de dentro, a nuvem e o que acontece</text>
  <text class="s" x="51" y="426">depois de entrar; e ataques reais podem PULAR fases, então nenhuma fase sozinha basta como</text>
  <text class="s" x="51" y="444">defesa: o caminho é defesa em camadas (defense in depth)</text>
</svg>
