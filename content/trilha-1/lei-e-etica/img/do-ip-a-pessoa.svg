<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Do IP à pessoa: como os registros do Marco Civil identificam quem acessou</title>
  <desc id="d">Cinco etapas da esquerda para a direita. Primeira: a vítima, por exemplo um site, guarda no log o endereço IP, a data, a hora e, de preferência, a porta de origem de quem acessou; o provedor de aplicação organizado como empresa precisa guardar esses registros de acesso por 6 meses, art. 15. Segunda: quem investiga pede ao juiz, com fundados indícios do ilícito, justificativa e período, art. 22. Terceira: com a ordem judicial, o provedor de aplicação entrega os registros. Quarta: o provedor de conexão, que guarda os registros de conexão por 1 ano, art. 13, diz qual assinante usava aquele IP naquele momento, também por ordem judicial. Quinta: o assinante é identificado e a investigação segue. Uma nota lembra que, com CGNAT, muitos clientes compartilham o mesmo IP público, então a porta de origem e o horário exato fazem diferença, e que VPN e proxy acrescentam elos, e cada elo é mais um lugar onde a conexão pode ter ficado registrada.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="30" y="34">Do IP à pessoa: o caminho que o Marco Civil (Lei 12.965/2014) desenha</text>

  <rect class="box" x="30" y="60" width="250" height="128" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="84" style="fill:#5cc8d8">1. O log da vítima</text>
  <text class="s" x="44" y="106">IP 203.0.113.50, porta 51234</text>
  <text class="s" x="44" y="122">2026-10-06 02:14:07 UTC-3</text>
  <text class="s" x="44" y="146">provedor de aplicação guarda</text>
  <text class="s" x="44" y="162">registros de acesso por</text>
  <text class="s" x="44" y="178">6 meses (art. 15)</text>

  <rect class="box" x="325" y="60" width="250" height="128" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="339" y="84" style="fill:#e8c25a">2. Pedido ao juiz</text>
  <text class="s" x="339" y="106">art. 22: fundados indícios</text>
  <text class="s" x="339" y="122">do ilícito, justificativa e</text>
  <text class="s" x="339" y="138">período dos registros</text>
  <text class="s" x="339" y="162">sem ordem judicial, o provedor</text>
  <text class="s" x="339" y="178">não entrega (art. 10, § 1º)</text>

  <rect class="box" x="620" y="60" width="250" height="128" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="634" y="84" style="fill:#5cc8d8">3. Provedor de aplicação</text>
  <text class="s" x="634" y="106">entrega IP, data e hora</text>
  <text class="s" x="634" y="122">do acesso investigado</text>
  <text class="s" x="634" y="146">polícia ou MP podem pedir que</text>
  <text class="s" x="634" y="162">guarde por mais tempo, antes</text>
  <text class="s" x="634" y="178">da ordem (art. 15, § 2º)</text>

  <line x1="280" y1="124" x2="321" y2="124" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="575" y1="124" x2="616" y2="124" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="745" y1="188" x2="745" y2="228" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="620" y="232" width="250" height="128" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="634" y="256" style="fill:#5cc8d8">4. Provedor de conexão</text>
  <text class="s" x="634" y="278">guarda registros de conexão</text>
  <text class="s" x="634" y="294">por 1 ano (art. 13): qual</text>
  <text class="s" x="634" y="310">assinante usava o IP naquele</text>
  <text class="s" x="634" y="326">instante; também só com</text>
  <text class="s" x="634" y="342">ordem judicial</text>

  <line x1="620" y1="296" x2="579" y2="296" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="325" y="232" width="250" height="128" rx="8" style="stroke:#f06a6a"/>
  <text class="m" x="339" y="256" style="fill:#f06a6a">5. O assinante</text>
  <text class="s" x="339" y="278">nome e endereço de quem</text>
  <text class="s" x="339" y="294">contratou a conexão</text>
  <text class="s" x="339" y="318">ponto de partida da</text>
  <text class="s" x="339" y="334">investigação (busca e</text>
  <text class="s" x="339" y="350">perícia nos equipamentos)</text>

  <rect class="box" x="30" y="232" width="250" height="128" rx="8" style="stroke:#9fb0a6"/>
  <text class="m" x="44" y="256">Dados cadastrais</text>
  <text class="s" x="44" y="278">qualificação, filiação e</text>
  <text class="s" x="44" y="294">endereço podem ser pedidos</text>
  <text class="s" x="44" y="310">por autoridades com</text>
  <text class="s" x="44" y="326">competência legal, na forma</text>
  <text class="s" x="44" y="342">da lei (art. 10, § 3º)</text>

  <rect class="box" x="30" y="392" width="840" height="104" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="44" y="416" style="fill:#e8c25a">Três lições para quem testa (e para quem pensa em testar "escondido")</text>
  <text class="s" x="44" y="438">• O seu IP fica nos logs do alvo. Num pentest, isso é bom: o SOC confere a origem combinada.</text>
  <text class="s" x="44" y="456">• Com CGNAT (0.2), muitos clientes dividem o mesmo IP público; por isso porta de origem e</text>
  <text class="s" x="44" y="472">  horário exato (com fuso e relógio sincronizado) fazem diferença nos logs.</text>
  <text class="s" x="44" y="490">• VPN e proxy acrescentam elos à cadeia; cada elo é mais um lugar onde a conexão pode ter ficado.</text>
</svg>
