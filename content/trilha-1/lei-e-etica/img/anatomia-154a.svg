<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="t d">
  <title id="t">Anatomia do art. 154-A do Código Penal, como uma sequência de perguntas</title>
  <desc id="d">Quatro perguntas em sequência, à esquerda, cada uma com uma saída à direita. Primeira: o dispositivo é de uso alheio? Se não, não é este crime, mas outros podem existir. Segunda: há autorização expressa de quem pode dá-la? Se sim, a conduta não é este crime: é o pentest autorizado, desde que dentro do escopo. Terceira: houve invasão, isto é, entrada que ninguém autorizou? Se não, não é o crime consumado; se a invasão só falhou por circunstâncias alheias à vontade de quem tentou, é tentativa, conforme o art. 14. Quarta: a finalidade era obter, adulterar ou destruir dados, ou instalar vulnerabilidades para obter vantagem ilícita? Se não, falta o elemento subjetivo do tipo. Se todas levam adiante, é o caput: reclusão de 1 a 4 anos e multa. Abaixo, as formas mais graves: se resultou em conteúdo de comunicações privadas, segredos comerciais ou industriais, informações sigilosas ou controle remoto, parágrafo 3º, reclusão de 2 a 5 anos; se esses dados foram divulgados ou vendidos, parágrafo 4º, aumento de um a dois terços; se houve prejuízo econômico, parágrafo 2º, aumento de um terço a dois terços. Nota: desde a Lei 14.155 de 2021 o texto não exige mais violar mecanismo de segurança.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 12.5px; font-weight: 700; }
    .s { font-size: 11.5px; fill: #9fb0a6; }
    .y { font-size: 11.5px; font-weight: 700; fill: #5ee08a; }
    .n { font-size: 11.5px; font-weight: 700; fill: #f06a6a; }
    .box { fill: #1c2521; stroke-width: 1.6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="900" height="640" fill="#121815"/>
  <text class="t" x="30" y="34">Art. 154-A: a conduta só é este crime se passar por todas as perguntas</text>

  <!-- Q1 -->
  <rect class="box" x="30" y="56" width="400" height="58" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="80" style="fill:#5cc8d8">1. O dispositivo é "de uso alheio"?</text>
  <text class="s" x="44" y="100">computador, celular, servidor, câmera, roteador...</text>
  <line x1="430" y1="85" x2="516" y2="85" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="446" y="78">não</text>
  <rect class="box" x="520" y="60" width="350" height="50" rx="8" style="stroke:#9fb0a6"/>
  <text class="s" x="534" y="81">Não é este crime (o seu próprio</text>
  <text class="s" x="534" y="97">equipamento); outros ainda podem existir</text>
  <line x1="230" y1="114" x2="230" y2="138" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="y" x="240" y="131">sim</text>

  <!-- Q2 -->
  <rect class="box" x="30" y="142" width="400" height="58" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="166" style="fill:#5cc8d8">2. Há autorização de quem pode dá-la?</text>
  <text class="s" x="44" y="186">"expressa ou tácita do usuário do dispositivo"</text>
  <line x1="430" y1="171" x2="516" y2="171" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="y" x="446" y="164">sim</text>
  <rect class="box" x="520" y="146" width="350" height="50" rx="8" style="stroke:#5ee08a"/>
  <text class="m" x="534" y="167" style="fill:#5ee08a">Pentest autorizado</text>
  <text class="s" x="534" y="183">só dentro do escopo, da janela e das RoE</text>
  <line x1="230" y1="200" x2="230" y2="224" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="240" y="217">não</text>

  <!-- Q3 -->
  <rect class="box" x="30" y="228" width="400" height="58" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="252" style="fill:#5cc8d8">3. Houve invasão?</text>
  <text class="s" x="44" y="272">entrar onde ninguém autorizou você a entrar</text>
  <line x1="430" y1="257" x2="516" y2="257" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="446" y="250">não</text>
  <rect class="box" x="520" y="232" width="350" height="50" rx="8" style="stroke:#9fb0a6"/>
  <text class="s" x="534" y="253">Não é o crime consumado; se a invasão</text>
  <text class="s" x="534" y="269">só falhou por acaso, é tentativa (art. 14)</text>
  <line x1="230" y1="286" x2="230" y2="310" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="y" x="240" y="303">sim</text>

  <!-- Q4 -->
  <rect class="box" x="30" y="314" width="400" height="74" rx="8" style="stroke:#5cc8d8"/>
  <text class="m" x="44" y="338" style="fill:#5cc8d8">4. Com que fim?</text>
  <text class="s" x="44" y="358">obter, adulterar ou destruir dados, ou</text>
  <text class="s" x="44" y="374">instalar vulnerabilidade p/ vantagem ilícita</text>
  <line x1="430" y1="351" x2="516" y2="351" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="n" x="446" y="344">não</text>
  <rect class="box" x="520" y="326" width="350" height="50" rx="8" style="stroke:#9fb0a6"/>
  <text class="s" x="534" y="347">Falta a finalidade que o tipo exige</text>
  <text class="s" x="534" y="363">(o "com o fim de" do texto da lei)</text>
  <line x1="230" y1="388" x2="230" y2="412" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="y" x="240" y="405">sim</text>

  <!-- result -->
  <rect class="box" x="30" y="416" width="400" height="58" rx="8" style="stroke:#f06a6a"/>
  <text class="m" x="44" y="440" style="fill:#f06a6a">Art. 154-A, caput</text>
  <text class="s" x="44" y="460">reclusão de 1 a 4 anos, e multa</text>

  <rect class="box" x="460" y="400" width="410" height="132" rx="8" style="stroke:#f06a6a"/>
  <text class="m" x="474" y="424" style="fill:#f06a6a">Formas mais graves</text>
  <text class="s" x="474" y="446">§ 2º prejuízo econômico: + 1/3 a 2/3</text>
  <text class="s" x="474" y="466">§ 3º comunicações privadas, segredos, info.</text>
  <text class="s" x="474" y="482">     sigilosas ou controle remoto: 2 a 5 anos</text>
  <text class="s" x="474" y="502">§ 4º e ainda divulgou ou vendeu: + 1/3 a 2/3</text>
  <text class="s" x="474" y="520">§ 5º contra altas autoridades: + 1/3 a 1/2</text>
  <line x1="430" y1="445" x2="456" y2="445" stroke="#9fb0a6" stroke-width="1.4" marker-end="url(#a)"/>

  <rect class="box" x="30" y="552" width="840" height="66" rx="8" style="stroke:#e8c25a"/>
  <text class="m" x="44" y="576" style="fill:#e8c25a">Desde a Lei 14.155/2021</text>
  <text class="s" x="44" y="596">o texto não exige mais "violação indevida de mecanismo de segurança": não é preciso</text>
  <text class="s" x="44" y="612">quebrar uma proteção. E o § 1º pune quem produz ou vende programa "com o intuito" de invadir.</text>
</svg>
