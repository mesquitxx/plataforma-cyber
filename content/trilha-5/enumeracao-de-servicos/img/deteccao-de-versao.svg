<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t2 d2">
  <title id="t2">Como a detecção de versão (-sV) funciona por dentro</title>
  <desc id="d2">Diagrama de sequência entre o nmap -sV, rodando no Kali, e o serviço na porta 80 do alvo, com o arquivo de assinaturas nmap-service-probes à esquerda. A ideia principal, numa caixa no topo: quem decide a versão é a resposta do serviço, não o número da porta. Passo 1, em azul: o nmap abre a conexão com a porta aberta. Passo 2, tracejado: espera o serviço se apresentar sozinho (NULL probe), mas o HTTP não fala primeiro e vem silêncio. Passo 3, em azul: o nmap manda a sonda GetRequest, o texto "GET / HTTP/1.0". Passo 4, o momento-chave, em verde com destaque amarelo: o serviço responde e um dos cabeçalhos é "Server: Apache/2.4.49 (Unix)". Passo 5, em amarelo: o nmap compara a resposta com as linhas match do arquivo e conclui Apache httpd 2.4.49 (Unix), com o CPE cpe:/a:apache:http_server:2.4.49. O arquivo à esquerda fornece a sonda do passo 3 e a linha match do passo 5.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 13.5px; font-weight: 700; fill: #fde68a; }
    .h { font-size: 13px; font-weight: 700; }
    .msg { font-size: 12px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .code { font-size: 11.5px; font-weight: 700; fill: #e2e8f0; }
    .blue { fill: #3b82f6; }
    .green { fill: #10b981; }
    .gold { fill: #eab308; }
    .leg { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <filter id="glow-gold"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="30" y="36">Detecção de versão (-sV): o nmap conversa com a porta</text>
  <rect x="30" y="50" width="900" height="38" rx="6" fill="#2a2108" stroke="#eab308" stroke-width="1.5"/>
  <text class="key" x="480" y="74" text-anchor="middle">Quem decide a versão é a RESPOSTA do serviço, não o número da porta</text>

  <!-- signatures file -->
  <rect x="30" y="110" width="210" height="190" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text class="h" x="135" y="134" text-anchor="middle">arquivo de assinaturas</text>
  <text class="sub" x="135" y="152" text-anchor="middle">nmap-service-probes</text>
  <rect x="42" y="166" width="186" height="50" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code blue" x="54" y="186">Probe GetRequest</text>
  <text class="sub" x="54" y="205">o que enviar (passo 3)</text>
  <rect x="42" y="228" width="186" height="58" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code gold" x="54" y="248">match http</text>
  <text class="sub" x="54" y="266">como reconhecer</text>
  <text class="sub" x="54" y="280">a resposta (passo 5)</text>

  <!-- participants -->
  <rect x="280" y="110" width="160" height="44" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="360" y="130" text-anchor="middle">nmap -sV</text>
  <text class="sub" x="360" y="146" text-anchor="middle">(Kali)</text>
  <rect x="700" y="110" width="200" height="44" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text class="h" x="800" y="130" text-anchor="middle">serviço na porta 80</text>
  <text class="sub" x="800" y="146" text-anchor="middle">(alvo)</text>

  <!-- lifelines -->
  <line x1="360" y1="154" x2="360" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="800" y1="154" x2="800" y2="400" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- 1 connect -->
  <text class="msg" x="380" y="184">1. abre a conexão (porta aberta)</text>
  <path d="M362,194 L796,194" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 2 NULL probe: wait for banner -->
  <text class="msg" x="380" y="228">2. espera ele se apresentar (NULL probe)</text>
  <path d="M796,238 L364,238" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow-gray)"/>
  <text class="sub" x="580" y="256" text-anchor="middle">… silêncio: o HTTP não fala primeiro</text>

  <!-- 3 GetRequest probe -->
  <text class="msg" x="380" y="288">3. manda a sonda GetRequest</text>
  <rect x="610" y="273" width="150" height="22" rx="4" fill="#020617" stroke="#3b82f6"/>
  <text class="code" x="685" y="289" text-anchor="middle">GET / HTTP/1.0</text>
  <path d="M362,304 L796,304" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- 4 response: key moment -->
  <text class="msg green" x="380" y="338">4. o serviço responde, e se entrega:</text>
  <path d="M798,350 L364,350" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="440" y="362" width="300" height="30" rx="4" fill="#2a2108" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="code gold" x="590" y="382" text-anchor="middle">Server: Apache/2.4.49 (Unix)</text>

  <!-- file feeds steps 3 and 5 -->
  <path d="M242,191 L262,191 L262,300 L356,300" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
  <path d="M135,302 L135,446 L276,446" stroke="#64748b" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- 5 match -> result -->
  <rect x="280" y="416" width="620" height="78" rx="6" fill="#2a2108" stroke="#eab308" stroke-width="2"/>
  <text class="msg gold" x="298" y="440">5. compara com as linhas match → reconheceu:</text>
  <text class="h" x="298" y="464">Apache httpd 2.4.49 (Unix)</text>
  <text class="sub" x="298" y="484">CPE: cpe:/a:apache:http_server:2.4.49</text>
  <path d="M590,394 L590,412" stroke="#eab308" stroke-width="2" fill="none"/>

  <!-- legend -->
  <rect x="30" y="522" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text class="leg" x="52" y="534">azul = o nmap envia</text>
  <rect x="250" y="522" width="14" height="14" rx="3" fill="#10b981"/>
  <text class="leg" x="272" y="534">verde = o serviço responde</text>
  <rect x="510" y="522" width="14" height="14" rx="3" fill="#eab308"/>
  <text class="leg" x="532" y="534">amarelo = onde a versão é descoberta</text>
</svg>
