<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Onde a enumeração de serviços entra no caminho de um ataque</title>
  <desc id="d">Uma esteira da esquerda para a direita com cinco etapas. As duas primeiras são de módulos anteriores e aparecem apagadas: reconhecimento passivo (OSINT, módulo 2.2) e descoberta de hosts (host discovery, módulo 2.4). As duas do meio são deste módulo (5.1) e estão destacadas em ciano: enumerar serviços e versões, e montar o mapa da superfície de ataque cruzando a versão com CVEs conhecidas. A última etapa, exploração (módulo 5.4), aparece tracejada e com a etiqueta "fora deste módulo": a enumeração encontra e descreve o alvo, mas parar antes de explorar. Uma chave abraça as duas etapas do meio com a legenda "o que você faz aqui".</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .step { font-size: 12.5px; font-weight: 700; }
    .tag { font-size: 10.5px; fill: #9fb0a6; }
    .past { fill: #9fb0a6; }
    .cur { fill: #5cc8d8; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .boxcur { fill: #16201b; stroke: #5cc8d8; stroke-width: 2; }
    .boxoff { fill: #141a17; stroke: #4a5a52; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .flow { stroke: #4a5a52; stroke-width: 2; fill: none; marker-end: url(#a); }
    .flowcur { stroke: #5cc8d8; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .brace { stroke: #5ee08a; stroke-width: 2; fill: none; }
    .bl { font-size: 12px; font-weight: 700; fill: #5ee08a; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5a52"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="430" fill="#121815"/>
  <text class="t" x="30" y="34">A enumeração no caminho de um ataque — onde este módulo age</text>

  <!-- stage 1: OSINT -->
  <rect class="box" x="24" y="150" width="150" height="86" rx="8"/>
  <text class="step past" x="99" y="186" text-anchor="middle">Recon passivo</text>
  <text class="step past" x="99" y="204" text-anchor="middle">(OSINT)</text>
  <text class="tag" x="99" y="224" text-anchor="middle">módulo 2.2</text>

  <!-- stage 2: host discovery -->
  <rect class="box" x="198" y="150" width="150" height="86" rx="8"/>
  <text class="step past" x="273" y="186" text-anchor="middle">Host discovery</text>
  <text class="step past" x="273" y="204" text-anchor="middle">(quem responde)</text>
  <text class="tag" x="273" y="224" text-anchor="middle">módulo 2.4</text>

  <!-- stage 3: enumeration (current) -->
  <rect class="boxcur" x="372" y="150" width="160" height="86" rx="8"/>
  <text class="step cur" x="452" y="182" text-anchor="middle">Enumerar</text>
  <text class="step cur" x="452" y="200" text-anchor="middle">serviços e</text>
  <text class="step cur" x="452" y="218" text-anchor="middle">versões</text>

  <!-- stage 4: surface map (current) -->
  <rect class="boxcur" x="556" y="150" width="168" height="86" rx="8"/>
  <text class="step cur" x="640" y="182" text-anchor="middle">Mapa da</text>
  <text class="step cur" x="640" y="200" text-anchor="middle">superfície +</text>
  <text class="step cur" x="640" y="218" text-anchor="middle">versão → CVE</text>

  <!-- stage 5: exploitation (off) -->
  <rect class="boxoff" x="748" y="150" width="128" height="86" rx="8"/>
  <text class="step past" x="812" y="190" text-anchor="middle">Exploração</text>
  <text class="tag" x="812" y="210" text-anchor="middle">módulo 5.4</text>

  <!-- flows -->
  <path class="flow" d="M174,193 L196,193"/>
  <path class="flowcur" d="M348,193 L370,193"/>
  <path class="flowcur" d="M532,193 L554,193"/>
  <path class="flow" d="M724,193 L746,193"/>

  <!-- brace over the two current stages -->
  <path class="brace" d="M372,120 q0,-14 14,-14 L638,106 q14,0 14,14"/>
  <path class="brace" d="M724,120 q0,-14 -14,-14 L652,106"/>
  <text class="bl" x="548" y="92" text-anchor="middle">o que você faz neste módulo</text>

  <!-- off label -->
  <text class="tag" x="812" y="262" text-anchor="middle">(fora deste módulo:</text>
  <text class="tag" x="812" y="278" text-anchor="middle">você encontra, não explora)</text>
</svg>
