<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Onde a enumeração de serviços entra no caminho de um ataque</title>
  <desc id="d">Uma esteira da esquerda para a direita com cinco etapas. As duas primeiras, de módulos anteriores, aparecem em cinza: recon passivo, a pesquisa pública sem tocar no alvo (módulo 2.2), e achar hosts e portas abertas, que termina em "porta 80 aberta" (módulo 2.4). As duas do meio são deste módulo (5.1) e estão em azul: enumerar o serviço, que descobre que na porta 80 roda o Apache 2.4.49, e montar o mapa da superfície ligando a versão a uma CVE conhecida, a CVE-2021-41773, destacada em amarelo como o achado-chave. A última etapa, exploração (módulo 5.4), aparece tracejada e fora deste módulo. A ideia principal, numa caixa no topo: enumerar é sair de "porta 80 aberta" para "Apache 2.4.49 com falha conhecida", e parar antes de explorar.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 13.5px; font-weight: 700; fill: #fde68a; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; }
    .h { font-size: 13px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .code { font-size: 11.5px; font-weight: 700; fill: #e2e8f0; }
    .muted { fill: #64748b; }
    .blue { fill: #3b82f6; }
    .gold { fill: #eab308; }
    .leg { font-size: 11px; fill: #94a3b8; }
    .bold { font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#64748b"/></marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <filter id="glow-gold"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="470" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="30" y="36">Onde a enumeração entra no caminho de um ataque</text>
  <rect x="30" y="50" width="900" height="38" rx="6" fill="#2a2108" stroke="#eab308" stroke-width="1.5"/>
  <text class="key" x="480" y="74" text-anchor="middle">Enumerar = sair de "porta 80 aberta" para "Apache 2.4.49 com falha conhecida"</text>

  <!-- bracket over this module's stages -->
  <path d="M390,152 L390,140 L734,140 L734,152" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="sub blue bold" x="562" y="132" text-anchor="middle">o que você faz neste módulo (5.1)</text>

  <!-- stage 1: passive recon (past) -->
  <rect x="30" y="162" width="160" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text class="h muted" x="110" y="188" text-anchor="middle">1. Recon passivo</text>
  <text class="sub" x="110" y="214" text-anchor="middle">pesquisa pública,</text>
  <text class="sub" x="110" y="230" text-anchor="middle">sem tocar no alvo</text>
  <text class="sub muted" x="110" y="296" text-anchor="middle">módulo 2.2</text>

  <!-- stage 2: hosts and ports (past) -->
  <rect x="210" y="162" width="160" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text class="h muted" x="290" y="188" text-anchor="middle">2. Achar hosts</text>
  <text class="sub" x="290" y="214" text-anchor="middle">quem responde e</text>
  <text class="sub" x="290" y="230" text-anchor="middle">quais portas abrem</text>
  <rect x="226" y="246" width="128" height="26" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code" x="290" y="264" text-anchor="middle">porta 80 aberta</text>
  <text class="sub muted" x="290" y="296" text-anchor="middle">módulo 2.4</text>

  <!-- stage 3: enumerate service (this module) -->
  <rect x="390" y="162" width="160" height="150" rx="6" fill="#0f1d3a" stroke="#3b82f6" stroke-width="2"/>
  <text class="h blue" x="470" y="188" text-anchor="middle">3. Enumerar</text>
  <text class="h blue" x="470" y="205" text-anchor="middle">o serviço</text>
  <text class="sub" x="470" y="228" text-anchor="middle">o que EXATAMENTE</text>
  <text class="sub" x="470" y="244" text-anchor="middle">roda nessa porta?</text>
  <rect x="406" y="256" width="128" height="26" rx="4" fill="#020617" stroke="#3b82f6"/>
  <text class="code" x="470" y="274" text-anchor="middle">Apache 2.4.49</text>

  <!-- stage 4: surface map + version to CVE (this module, key finding) -->
  <rect x="570" y="162" width="164" height="150" rx="6" fill="#0f1d3a" stroke="#3b82f6" stroke-width="2"/>
  <text class="h blue" x="652" y="188" text-anchor="middle">4. Mapa da</text>
  <text class="h blue" x="652" y="205" text-anchor="middle">superfície</text>
  <text class="sub" x="652" y="228" text-anchor="middle">essa versão tem</text>
  <text class="sub" x="652" y="244" text-anchor="middle">falha conhecida?</text>
  <rect x="582" y="256" width="140" height="26" rx="4" fill="#2a2108" stroke="#eab308" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="code gold" x="652" y="274" text-anchor="middle">CVE-2021-41773</text>

  <!-- stage 5: exploitation (out of scope) -->
  <rect x="770" y="162" width="160" height="150" rx="6" fill="#0f0f1a" stroke="#475569" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text class="h muted" x="850" y="188" text-anchor="middle">5. Exploração</text>
  <text class="sub" x="850" y="214" text-anchor="middle">usar a falha</text>
  <text class="sub" x="850" y="230" text-anchor="middle">contra o alvo</text>
  <text class="sub muted" x="850" y="296" text-anchor="middle">módulo 5.4</text>

  <!-- flow -->
  <path d="M190,237 L208,237" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M370,237 L388,237" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M550,237 L568,237" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M734,237 L768,237" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>

  <!-- stop line -->
  <text class="sub bold" x="850" y="336" text-anchor="middle">fora deste módulo:</text>
  <text class="sub" x="850" y="352" text-anchor="middle">você encontra,</text>
  <text class="sub" x="850" y="368" text-anchor="middle">não explora</text>

  <!-- what the attacker gains -->
  <text class="lane" x="30" y="346">O QUE ISSO RENDE</text>
  <rect x="30" y="356" width="704" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
  <text class="sub" x="46" y="381">antes: "achei um servidor web"</text>
  <text class="sub bold gold" x="300" y="381">→ depois: "achei um Apache 2.4.49 com CVE conhecida"</text>

  <!-- legend -->
  <rect x="30" y="428" width="14" height="14" rx="3" fill="#64748b"/>
  <text class="leg" x="52" y="440">cinza = etapas de outros módulos</text>
  <rect x="330" y="428" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text class="leg" x="352" y="440">azul = o que você faz aqui</text>
  <rect x="590" y="428" width="14" height="14" rx="3" fill="#eab308"/>
  <text class="leg" x="612" y="440">amarelo = o achado que importa</text>
</svg>
