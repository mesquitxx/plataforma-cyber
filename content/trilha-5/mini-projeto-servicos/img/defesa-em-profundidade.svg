<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">Defesa em profundidade: corte UM elo e a cadeia inteira cai</title>
  <desc id="d">À esquerda, em destaque, está a cadeia de ataque: cinco elos em vermelho, numerados de 1 a 5 e ligados por uma linha vertical vermelha — versão 2.4.49 vulnerável; CGI ligado e raiz liberada; banner e /internal vazando; senha fraca no /admin; e ação sem detecção. À direita, em verde e de forma secundária, está uma defesa para cada elo: atualizar para a 2.4.51; desligar o CGI e negar o acesso à raiz; ServerTokens Prod e tirar o /internal; senha forte com bloqueio e segundo fator; e registrar e alertar sobre o traversal. Uma tesoura verde em cada linha mostra que aquela defesa, sozinha, corta a cadeia naquele ponto. A ideia central: o atacante precisa de todos os cinco elos; o defensor precisa cortar apenas um.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #94a3b8; }
    .hdrA  { font-size: 12.5px; font-weight: 700; fill: #f87171; letter-spacing: 0.08em; }
    .hdrD  { font-size: 12.5px; font-weight: 700; fill: #34d399; letter-spacing: 0.08em; }
    .lt    { font-size: 12.5px; font-weight: 700; fill: #fca5a5; }
    .ls    { font-size: 10px; fill: #94a3b8; }
    .dt    { font-size: 12px; font-weight: 700; fill: #6ee7b7; }
    .ds    { font-size: 9.5px; fill: #7f9b8c; }
    .cut   { font-size: 10px; font-weight: 700; fill: #34d399; }
    .cap   { font-size: 12.5px; font-weight: 700; fill: #e2e8f0; }
    .leg   { font-size: 11px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg)"/>

  <text class="title" x="30" y="38">Defesa em profundidade: corte UM elo e a cadeia inteira cai</text>
  <text class="sub"   x="30" y="60">O atacante precisa dos 5 elos; o defensor precisa cortar só um.</text>

  <text class="hdrA" x="70"  y="92">CADEIA DE ATAQUE</text>
  <text class="hdrD" x="560" y="92">DEFESAS — cada uma corta a cadeia</text>

  <!-- red chain spine (behind links, on their right edge) -->
  <path d="M360,140 L360,440" fill="none" stroke="#ef4444" stroke-width="5"/>

  <!-- rows: centers 140 215 290 365 440 -->
  <!-- dashed defense connectors + scissors, drawn before boxes -->
  <g stroke="#34d399" stroke-width="1.6" fill="none" stroke-dasharray="6 4">
    <path d="M560,140 L392,140"/>
    <path d="M560,215 L392,215"/>
    <path d="M560,290 L392,290"/>
    <path d="M560,365 L392,365"/>
    <path d="M560,440 L392,440"/>
  </g>

  <!-- LINK 1 -->
  <rect x="70" y="112" width="290" height="56" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lt" x="86" y="137">1 · Versão 2.4.49 vulnerável</text>
  <text class="ls" x="86" y="156">CVE-2021-41773</text>
  <!-- LINK 2 -->
  <rect x="70" y="187" width="290" height="56" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lt" x="86" y="212">2 · CGI ligado, raiz liberada</text>
  <text class="ls" x="86" y="231">mod_cgid · &lt;Directory /&gt;</text>
  <!-- LINK 3 -->
  <rect x="70" y="262" width="290" height="56" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lt" x="86" y="287">3 · Banner e /internal vazam</text>
  <text class="ls" x="86" y="306">versão cheia + listagem</text>
  <!-- LINK 4 -->
  <rect x="70" y="337" width="290" height="56" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lt" x="86" y="362">4 · Senha fraca no /admin</text>
  <text class="ls" x="86" y="381">superman · password1 (reúso)</text>
  <!-- LINK 5 -->
  <rect x="70" y="412" width="290" height="56" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
  <text class="lt" x="86" y="437">5 · Ação sem detecção</text>
  <text class="ls" x="86" y="456">traversal e queries silenciosos</text>

  <!-- scissors on the chain, one per row -->
  <g>
    <g transform="translate(360,140)"><circle cx="-2" cy="-7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><circle cx="-2" cy="7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="-5" x2="16" y2="5" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="5" x2="16" y2="-5" stroke="#34d399" stroke-width="1.6"/></g>
    <g transform="translate(360,215)"><circle cx="-2" cy="-7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><circle cx="-2" cy="7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="-5" x2="16" y2="5" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="5" x2="16" y2="-5" stroke="#34d399" stroke-width="1.6"/></g>
    <g transform="translate(360,290)"><circle cx="-2" cy="-7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><circle cx="-2" cy="7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="-5" x2="16" y2="5" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="5" x2="16" y2="-5" stroke="#34d399" stroke-width="1.6"/></g>
    <g transform="translate(360,365)"><circle cx="-2" cy="-7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><circle cx="-2" cy="7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="-5" x2="16" y2="5" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="5" x2="16" y2="-5" stroke="#34d399" stroke-width="1.6"/></g>
    <g transform="translate(360,440)"><circle cx="-2" cy="-7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><circle cx="-2" cy="7" r="3.4" fill="none" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="-5" x2="16" y2="5" stroke="#34d399" stroke-width="1.6"/><line x1="1" y1="5" x2="16" y2="-5" stroke="#34d399" stroke-width="1.6"/></g>
  </g>
  <text class="cut" x="384" y="128">corta aqui</text>

  <!-- DEFENSE 1 -->
  <rect x="560" y="112" width="360" height="56" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="1.4"/>
  <text class="dt" x="576" y="137">Atualizar para a 2.4.51</text>
  <text class="ds" x="576" y="156">a 2.4.50 não bastou (CVE-2021-42013)</text>
  <!-- DEFENSE 2 -->
  <rect x="560" y="187" width="360" height="56" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="1.4"/>
  <text class="dt" x="576" y="212">Desligar CGI · Require all denied</text>
  <text class="ds" x="576" y="231">sem interpretador no caminho, sem RCE</text>
  <!-- DEFENSE 3 -->
  <rect x="560" y="262" width="360" height="56" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="1.4"/>
  <text class="dt" x="576" y="287">ServerTokens Prod · tirar /internal</text>
  <text class="ds" x="576" y="306">menos pistas para o atacante mapear</text>
  <!-- DEFENSE 4 -->
  <rect x="560" y="337" width="360" height="56" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="1.4"/>
  <text class="dt" x="576" y="362">Senha forte · lockout · MFA</text>
  <text class="ds" x="576" y="381">tira o reúso e trava o spraying</text>
  <!-- DEFENSE 5 -->
  <rect x="560" y="412" width="360" height="56" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="1.4"/>
  <text class="dt" x="576" y="437">Registrar e alertar no traversal</text>
  <text class="ds" x="576" y="456">logs + alerta cortam o tempo oculto</text>

  <!-- bottom caption (the key idea restated) -->
  <rect x="70" y="500" width="820" height="40" rx="6" fill="#141622" stroke="#334155" stroke-width="1.2"/>
  <text class="cap" x="480" y="525" text-anchor="middle">O atacante só vence com a cadeia completa — o defensor vence cortando qualquer UM elo.</text>

  <!-- legend -->
  <g>
    <rect x="70" y="560" width="14" height="14" rx="3" fill="#1a1012" stroke="#ef4444" stroke-width="1.8"/>
    <text class="leg" x="90" y="571">elo da cadeia de ataque</text>
    <rect x="300" y="560" width="14" height="14" rx="3" fill="#0f2019" stroke="#34d399" stroke-width="1.8"/>
    <text class="leg" x="320" y="571">defesa que corta a cadeia (secundária)</text>
  </g>
</svg>
