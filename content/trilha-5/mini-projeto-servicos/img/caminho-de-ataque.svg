<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 600" role="img" aria-labelledby="t d">
  <title id="t">Caminho de ataque: a Via A entrega as senhas da Via B</title>
  <desc id="d">Fluxo da esquerda para a direita. Uma caixa azul de reconhecimento (nmap e curl) mapeia o alvo e abre duas vias de ataque, em vermelho. A Via A, em cima, explora a falha da versão (CVE-2021-41773) e conquista um foothold que roda como daemon. Desse foothold sai o elo, em verde: uma caixa de saque lê o arquivo .htpasswd e quebra as senhas, revelando password1. Uma seta verde tracejada leva esse saque de volta à Via B, embaixo — a senha fraca do /admin protegido por HTTP Basic Auth — com a legenda "entrega as senhas". As duas vias convergem, à direita, numa caixa ciano em destaque: o serviço comprometido ponta a ponta, por dois caminhos independentes e com evidência registrada. É o que o atacante conquista no fim.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #94a3b8; }
    .nt    { font-size: 13.5px; font-weight: 700; }
    .ns    { font-size: 10.5px; fill: #94a3b8; }
    .cyan  { fill: #67e8f9; }
    .elab  { font-size: 11px; font-weight: 700; fill: #94a3b8; }
    .glab  { font-size: 11.5px; font-weight: 700; fill: #34d399; }
    .leg   { font-size: 11px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="ar-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ef4444"/></marker>
    <marker id="ar-grn" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#34d399"/></marker>
    <filter id="glow-cy" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1020" height="600" fill="url(#bg)"/>

  <text class="title" x="30" y="40">Caminho de ataque: a Via A entrega as senhas da Via B</text>
  <text class="sub"   x="30" y="62">O mesmo serviço cai por dois caminhos independentes — e um alimenta o outro.</text>

  <!-- arrows (drawn first, under boxes) -->
  <!-- recon -> via A -->
  <path d="M220,278 C258,262 262,196 300,180" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ar-red)"/>
  <text class="elab" x="250" y="214" text-anchor="middle">versão 2.4.49</text>
  <!-- recon -> via B -->
  <path d="M220,314 C258,332 262,452 300,466" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ar-red)"/>
  <text class="elab" x="248" y="396" text-anchor="middle">área /admin</text>
  <!-- via A -> saque (green link) -->
  <path d="M532,192 C566,214 572,256 600,278" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#ar-grn)"/>
  <text class="glab" x="588" y="236" text-anchor="middle">lê o .htpasswd</text>
  <!-- saque -> via B (green dashed KEY) -->
  <path d="M600,330 C556,372 548,430 532,452" fill="none" stroke="#34d399" stroke-width="2.6" stroke-dasharray="7 5" marker-end="url(#ar-grn)"/>
  <text class="glab" x="474" y="398" text-anchor="middle">entrega as senhas</text>
  <!-- via A -> comprometido (over top) -->
  <path d="M532,150 L800,150 C832,150 854,196 854,232" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ar-red)"/>
  <text class="elab" x="662" y="142" text-anchor="middle">via A: acesso</text>
  <!-- via B -> comprometido (under bottom) -->
  <path d="M532,500 L800,500 C832,500 854,420 854,366" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ar-red)"/>
  <text class="elab" x="662" y="516" text-anchor="middle">via B: login</text>

  <!-- recon -->
  <rect x="40" y="248" width="180" height="96" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
  <text class="nt" x="130" y="286" text-anchor="middle">Recon</text>
  <text class="ns" x="130" y="306" text-anchor="middle">nmap · curl</text>
  <text class="ns" x="130" y="322" text-anchor="middle">mapeiam o alvo</text>

  <!-- via A -->
  <rect x="300" y="118" width="232" height="96" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text class="nt" x="416" y="152" text-anchor="middle">Via A — falha da versão</text>
  <text class="ns" x="416" y="174" text-anchor="middle">CVE-2021-41773 vira acesso</text>
  <text class="ns" x="416" y="190" text-anchor="middle">(foothold: roda como daemon)</text>

  <!-- saque (green link) -->
  <rect x="600" y="248" width="214" height="100" rx="6" fill="#0f2019" stroke="#34d399" stroke-width="2"/>
  <text class="nt" x="707" y="286" text-anchor="middle" fill="#6ee7b7">Saque do foothold</text>
  <text class="ns" x="707" y="308" text-anchor="middle">lê o .htpasswd e quebra</text>
  <text class="ns" x="707" y="324" text-anchor="middle">as senhas → password1</text>

  <!-- via B -->
  <rect x="300" y="430" width="232" height="96" rx="6" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
  <text class="nt" x="416" y="464" text-anchor="middle">Via B — senha fraca</text>
  <text class="ns" x="416" y="486" text-anchor="middle">/admin protegido por</text>
  <text class="ns" x="416" y="502" text-anchor="middle">HTTP Basic Auth</text>

  <!-- comprometido (final gain, highlighted) -->
  <rect x="854" y="232" width="150" height="132" rx="6" fill="#082f33" stroke="#22d3ee" stroke-width="2.6" filter="url(#glow-cy)"/>
  <text class="nt cyan" x="929" y="274" text-anchor="middle">Serviço</text>
  <text class="nt cyan" x="929" y="292" text-anchor="middle">comprometido</text>
  <text class="ns" x="929" y="314" text-anchor="middle">ponta a ponta</text>
  <text class="ns" x="929" y="330" text-anchor="middle">2 vias +</text>
  <text class="ns" x="929" y="346" text-anchor="middle">evidência</text>

  <!-- legend -->
  <g>
    <rect x="40" y="556" width="14" height="14" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.8"/>
    <text class="leg" x="60" y="567">reconhecimento</text>
    <rect x="200" y="556" width="14" height="14" rx="3" fill="#0f172a" stroke="#ef4444" stroke-width="1.8"/>
    <text class="leg" x="220" y="567">passo de ataque</text>
    <rect x="368" y="556" width="14" height="14" rx="3" fill="#0f2019" stroke="#34d399" stroke-width="1.8"/>
    <text class="leg" x="388" y="567">o elo: credenciais roubadas que ligam as vias</text>
    <rect x="760" y="556" width="14" height="14" rx="3" fill="#082f33" stroke="#22d3ee" stroke-width="1.8"/>
    <text class="leg" x="780" y="567">o que o atacante conquista</text>
  </g>
</svg>
