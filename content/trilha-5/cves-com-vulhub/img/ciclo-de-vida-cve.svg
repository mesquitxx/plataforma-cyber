<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d">
  <title id="t">Ciclo de vida da CVE-2021-41773: o primeiro patch não bastou</title>
  <desc id="d">Linha do tempo de 16/09/2021 a 03/11/2021. Acima do eixo, o que aconteceu com o código do Apache: em 16/09 sai a 2.4.49, onde o bug nasce; em 04/10 sai a 2.4.50, o primeiro patch, que não bastou; em 07/10 sai a 2.4.51, que corrige de verdade (o furo da 2.4.50 virou outra CVE, a 2021-42013). Abaixo do eixo, o registro público: em 29/09 a falha é reportada e já está sendo explorada; em 05/10 o NVD publica com CVSS 9.8; em 03/11 a CISA põe no catálogo KEV, com prazo 17/11. Uma faixa vermelha sobre o eixo, de 16/09 até 07/10, mostra a janela em que atualizar ainda não protegia: ela atravessa a 2.4.50 sem parar. Legenda: vermelho é falha aberta, verde é corrigido, azul é registro público.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 14px; font-weight: 700; fill: #fecaca; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; }
    .date { font-size: 12px; font-weight: 700; }
    .ev { font-size: 13px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .red { fill: #ef4444; }
    .green { fill: #10b981; }
    .blue { fill: #3b82f6; }
    .leg { font-size: 11px; fill: #94a3b8; }
    .bold { font-weight: 700; }
    .muted { fill: #475569; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="470" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="30" y="36">Ciclo de vida da CVE-2021-41773</text>
  <rect x="30" y="50" width="900" height="38" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text class="key" x="480" y="74" text-anchor="middle">Ideia-chave: o 1º patch (2.4.50) NÃO fechou a falha — só a 2.4.51 corrigiu</text>

  <!-- lane labels -->
  <text class="lane" x="30" y="118">O CÓDIGO DO APACHE</text>
  <text class="lane" x="30" y="300">O REGISTRO PÚBLICO</text>

  <!-- axis -->
  <line x1="50" y1="240" x2="915" y2="240" stroke="#334155" stroke-width="2"/>
  <polygon points="925,240 913,234 913,246" fill="#334155"/>

  <!-- vulnerable window band -->
  <rect x="90" y="232" width="610" height="16" rx="8" fill="#ef4444" opacity="0.35"/>
  <rect x="90" y="236" width="610" height="8" rx="4" fill="#ef4444"/>
  <text class="sub red bold" x="245" y="222" text-anchor="middle">janela em que atualizar ainda não protegia</text>

  <!-- 1: 2.4.49 (above) -->
  <line x1="90" y1="232" x2="90" y2="198" stroke="#ef4444" stroke-width="2"/>
  <rect x="25" y="132" width="130" height="66" rx="6" fill="#1c0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="date red" x="90" y="152" text-anchor="middle">16/09</text>
  <text class="ev" x="90" y="170" text-anchor="middle">2.4.49</text>
  <text class="sub" x="90" y="187" text-anchor="middle">o bug nasce</text>
  <circle cx="90" cy="240" r="8" fill="#0f172a" stroke="#ef4444" stroke-width="2.5"/>

  <!-- 3: 2.4.50 (above, key moment) -->
  <line x1="410" y1="232" x2="410" y2="208" stroke="#ef4444" stroke-width="2"/>
  <rect x="320" y="122" width="180" height="86" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2.5" filter="url(#glow-red)"/>
  <text class="date red" x="410" y="142" text-anchor="middle">04/10</text>
  <text class="ev" x="410" y="161" text-anchor="middle">2.4.50 — 1º patch</text>
  <text class="ev red" x="410" y="180" text-anchor="middle">✗ não bastou</text>
  <text class="sub" x="410" y="198" text-anchor="middle">a falha continua aberta</text>
  <circle cx="410" cy="240" r="9" fill="#0f172a" stroke="#ef4444" stroke-width="3"/>
  <path d="M404,234 L416,246 M416,234 L404,246" stroke="#ef4444" stroke-width="2.5"/>

  <!-- 5: 2.4.51 (above) -->
  <line x1="700" y1="232" x2="700" y2="208" stroke="#10b981" stroke-width="2"/>
  <rect x="570" y="122" width="260" height="86" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="date green" x="700" y="142" text-anchor="middle">07/10</text>
  <text class="ev" x="700" y="161" text-anchor="middle">2.4.51</text>
  <text class="ev green" x="700" y="180" text-anchor="middle">✓ corrige de verdade</text>
  <text class="sub" x="700" y="198" text-anchor="middle">furo da 2.4.50 = CVE-2021-42013</text>
  <circle cx="700" cy="240" r="9" fill="#10b981" stroke="#10b981" stroke-width="2"/>

  <!-- 2: reported (below) -->
  <line x1="250" y1="248" x2="250" y2="290" stroke="#3b82f6" stroke-width="2"/>
  <rect x="180" y="290" width="140" height="66" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="date blue" x="250" y="310" text-anchor="middle">29/09</text>
  <text class="ev" x="250" y="328" text-anchor="middle">reportada</text>
  <text class="sub" x="250" y="345" text-anchor="middle">já sendo explorada</text>
  <circle cx="250" cy="240" r="7" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>

  <!-- 4: NVD (below) -->
  <line x1="540" y1="248" x2="540" y2="290" stroke="#3b82f6" stroke-width="2"/>
  <rect x="470" y="290" width="140" height="66" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="date blue" x="540" y="310" text-anchor="middle">05/10</text>
  <text class="ev" x="540" y="328" text-anchor="middle">NVD publica</text>
  <text class="sub" x="540" y="345" text-anchor="middle">CVSS 9.8 (crítica)</text>
  <circle cx="540" cy="240" r="7" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>

  <!-- 6: KEV (below) -->
  <line x1="860" y1="240" x2="860" y2="290" stroke="#3b82f6" stroke-width="2"/>
  <rect x="785" y="290" width="150" height="66" rx="6" fill="#0f1e3a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="date blue" x="860" y="310" text-anchor="middle">03/11</text>
  <text class="ev" x="860" y="328" text-anchor="middle">CISA KEV</text>
  <text class="sub" x="860" y="345" text-anchor="middle">corrigir até 17/11</text>
  <circle cx="860" cy="240" r="7" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>

  <!-- legend -->
  <line x1="30" y1="400" x2="930" y2="400" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="420" width="14" height="14" rx="3" fill="#ef4444"/>
  <text class="leg" x="52" y="432">vermelho = falha aberta</text>
  <rect x="250" y="420" width="14" height="14" rx="3" fill="#10b981"/>
  <text class="leg" x="272" y="432">verde = corrigido</text>
  <rect x="430" y="420" width="14" height="14" rx="3" fill="#3b82f6"/>
  <text class="leg" x="452" y="432">azul = registro público (aviso, ficha, catálogo)</text>
  <text class="leg muted" x="30" y="458">Datas: boletim do Apache, NVD e CISA (2021).</text>
</svg>
