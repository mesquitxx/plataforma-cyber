<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">O bug de normalização de caminho: 2.4.49 contra 2.4.51</title>
  <desc id="d">Diagrama em duas faixas. À esquerda, a mesma requisição maliciosa entra nas duas: GET barra cgi-bin barra ponto porcento 2e barra, uma sequência que vira ../ depois de decodificada. A faixa de cima é o Apache 2.4.49, vulnerável: o servidor casa o ScriptAlias cgi-bin e trata o alvo como CGI; decodifica o porcento 2e para ponto só DEPOIS de checar a presença de ../, então o filtro não enxerga a travessia; resolve os ../ e sai do document root até alcançar /bin/sh; o mod_cgid então EXECUTA o /bin/sh, resultando em remote code execution. A caixa final é vermelha. A faixa de baixo é o Apache 2.4.51, corrigido: a normalização reescrita rejeita segmentos de ponto codificados antes de mapear o caminho; a requisição nunca sai do document root e o servidor responde com erro 400 ou 404. A caixa final é verde. A lição no rodapé: a ordem decodificar/normalizar é a raiz do bug; a 2.4.50 consertou pela metade.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .lane { font-size: 12.5px; font-weight: 700; }
    .step { font-size: 11px; }
    .sub { font-size: 10px; fill: #9fb0a6; }
    .mono { fill: #5cc8d8; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .boxbad { fill: #231414; stroke: #ff6b6b; stroke-width: 2.5; }
    .boxgood { fill: #132018; stroke: #5ee08a; stroke-width: 2.5; }
    .req { fill: #1b2620; stroke: #5cc8d8; stroke-width: 2; }
    .flow { stroke: #4a5a52; stroke-width: 2; fill: none; marker-end: url(#a); }
    .flowbad { stroke: #ff6b6b; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .flowgood { stroke: #5ee08a; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .bad { fill: #ff6b6b; font-weight: 700; }
    .good { fill: #5ee08a; font-weight: 700; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5a52"/></marker>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#ff6b6b"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="960" height="440" fill="#121815"/>
  <text class="t" x="30" y="34">A mesma requisição, dois servidores: onde a normalização falha</text>

  <!-- request -->
  <rect class="req" x="24" y="185" width="150" height="86" rx="8"/>
  <text class="step" x="99" y="212" text-anchor="middle">requisição</text>
  <text class="mono" x="99" y="232" text-anchor="middle" style="font-size:10px">/cgi-bin/</text>
  <text class="mono" x="99" y="247" text-anchor="middle" style="font-size:10px">.%2e/%2e%2e/</text>
  <text class="sub" x="99" y="263" text-anchor="middle">".%2e" vira ".."</text>

  <path class="flow" d="M174,205 C195,170 205,130 226,112"/>
  <path class="flow" d="M174,251 C195,286 205,326 226,344"/>

  <!-- vulnerable lane (top) -->
  <text class="lane bad" x="230" y="78">Apache 2.4.49 — vulnerável (CVE-2021-41773)</text>
  <rect class="box" x="230" y="90" width="150" height="56" rx="7"/>
  <text class="step" x="305" y="112" text-anchor="middle">casa ScriptAlias</text>
  <text class="sub" x="305" y="129" text-anchor="middle">cgi-bin = tratar como CGI</text>

  <rect class="box" x="400" y="90" width="165" height="56" rx="7"/>
  <text class="step" x="482" y="108" text-anchor="middle">decodifica %2e</text>
  <text class="sub" x="482" y="124" text-anchor="middle">DEPOIS de checar "..":</text>
  <text class="sub" x="482" y="138" text-anchor="middle">o filtro não vê a travessia</text>

  <rect class="box" x="585" y="90" width="150" height="56" rx="7"/>
  <text class="step" x="660" y="112" text-anchor="middle">resolve ../../../</text>
  <text class="sub" x="660" y="129" text-anchor="middle">sai do document root</text>

  <rect class="boxbad" x="755" y="88" width="175" height="60" rx="7"/>
  <text class="step bad" x="842" y="110" text-anchor="middle">mod_cgid EXECUTA</text>
  <text class="mono" x="842" y="127" text-anchor="middle" style="font-size:10px">/bin/sh</text>
  <text class="bad" x="842" y="141" text-anchor="middle" style="font-size:10px">→ RCE</text>

  <path class="flow" d="M380,118 L398,118"/>
  <path class="flow" d="M565,118 L583,118"/>
  <path class="flowbad" d="M735,118 L753,118"/>

  <!-- patched lane (bottom) -->
  <text class="lane good" x="230" y="318">Apache 2.4.51 — corrigido (a 2.4.50 não bastou: CVE-2021-42013)</text>
  <rect class="box" x="230" y="330" width="235" height="56" rx="7"/>
  <text class="step" x="347" y="352" text-anchor="middle">normalização reescrita</text>
  <text class="sub" x="347" y="369" text-anchor="middle">rejeita dot-segment codificado antes de mapear</text>

  <rect class="box" x="485" y="330" width="170" height="56" rx="7"/>
  <text class="step" x="570" y="352" text-anchor="middle">fica no document root</text>
  <text class="sub" x="570" y="369" text-anchor="middle">não alcança /bin/sh</text>

  <rect class="boxgood" x="675" y="328" width="175" height="60" rx="7"/>
  <text class="step good" x="762" y="353" text-anchor="middle">400 / 404</text>
  <text class="sub" x="762" y="370" text-anchor="middle">travessia barrada</text>

  <path class="flowgood" d="M465,358 L483,358"/>
  <path class="flowgood" d="M655,358 L673,358"/>

  <text class="sub" x="30" y="414">A raiz é a ORDEM decodificar/normalizar: decodificar %2e DEPOIS de filtrar ".." deixa a travessia passar.</text>
  <text class="sub" x="30" y="430">A 2.4.50 tapou só o caso óbvio (%2e); a dupla codificação (%%32%65) ainda passava — e virou a CVE-2021-42013.</text>
</svg>
