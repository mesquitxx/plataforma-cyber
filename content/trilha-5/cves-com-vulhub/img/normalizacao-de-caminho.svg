<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">Por que o Apache 2.4.49 caiu: o filtro procura ".." antes de decodificar</title>
  <desc id="d">Fluxo do ataque em cinco passos, da esquerda para a direita. 1: o atacante envia /cgi-bin/.%2e/.%2e/... até /bin/sh; o ".%2e" é um ".." disfarçado. 2, o momento da falha, destacado em amarelo: o filtro procura "..", mas só vê ".%2e" e deixa passar. 3: só agora o servidor decodifica %2e em ponto, e ".%2e/" vira "../". 4: os "../" sobem para fora da pasta do site e chegam a /bin/sh. 5, em vermelho: na pasta cgi-bin o servidor executa o arquivo alcançado; ele roda /bin/sh e o atacante executa comandos no servidor (RCE). Uma chave sobre os passos 2 e 3 marca o erro de ordem: filtrar antes de decodificar. Separada embaixo, em verde e menor, a correção da 2.4.51: os pontos codificados são rejeitados antes de achar o arquivo, a resposta é 400 ou 404 e nada sai da pasta do site.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 13.5px; font-weight: 700; fill: #fde68a; }
    .lane { font-size: 11px; font-weight: 700; fill: #94a3b8; }
    .h { font-size: 13px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .code { font-size: 11.5px; fill: #e2e8f0; font-weight: 700; }
    .red { fill: #ef4444; }
    .gold { fill: #eab308; }
    .green { fill: #10b981; }
    .leg { font-size: 11px; fill: #94a3b8; }
    .bold { font-weight: 700; }
    .body { font-size: 12px; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-gold"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="500" fill="url(#bg-grad)"/>

  <!-- title + key idea -->
  <text class="title" x="30" y="36">Por que o Apache 2.4.49 caiu</text>
  <rect x="30" y="50" width="900" height="38" rx="6" fill="#2a2108" stroke="#eab308" stroke-width="1.5"/>
  <text class="key" x="480" y="74" text-anchor="middle">O filtro procura ".." ANTES de decodificar: o ".%2e" disfarçado passa e depois vira ".."</text>

  <text class="lane" x="30" y="122">O ATAQUE</text>

  <!-- order-error bracket over steps 2 and 3 -->
  <path d="M213,150 L213,140 L564,140 L564,150" fill="none" stroke="#eab308" stroke-width="1.5"/>
  <text class="sub gold bold" x="388" y="133" text-anchor="middle">erro de ORDEM: filtra primeiro, decodifica depois</text>

  <!-- step 1 -->
  <rect x="30" y="160" width="168" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="h" x="114" y="184" text-anchor="middle">1. Atacante envia</text>
  <rect x="42" y="196" width="144" height="44" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code" x="114" y="214" text-anchor="middle">/cgi-bin/.%2e/</text>
  <text class="code" x="114" y="231" text-anchor="middle">.%2e/…/bin/sh</text>
  <text class="sub" x="114" y="260" text-anchor="middle">".%2e" é um ".."</text>
  <text class="sub" x="114" y="276" text-anchor="middle">disfarçado</text>

  <!-- step 2: key moment -->
  <rect x="213" y="160" width="168" height="130" rx="6" fill="#2a2108" stroke="#eab308" stroke-width="2.5" filter="url(#glow-gold)"/>
  <text class="h" x="297" y="184" text-anchor="middle">2. Filtro: ".."?</text>
  <rect x="247" y="196" width="100" height="26" rx="4" fill="#020617" stroke="#eab308"/>
  <text class="code" x="297" y="214" text-anchor="middle">.%2e</text>
  <text class="h gold" x="297" y="248" text-anchor="middle">não vê ".."</text>
  <text class="h gold" x="297" y="266" text-anchor="middle">→ deixa passar</text>
  <text class="sub" x="297" y="282" text-anchor="middle">(ainda disfarçado)</text>

  <!-- step 3 -->
  <rect x="396" y="160" width="168" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="h" x="480" y="184" text-anchor="middle">3. Decodifica %2e</text>
  <rect x="408" y="196" width="144" height="26" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code" x="480" y="214" text-anchor="middle">.%2e/  →  ../</text>
  <text class="sub" x="480" y="248" text-anchor="middle">tarde demais:</text>
  <text class="sub" x="480" y="264" text-anchor="middle">agora é ".." de verdade</text>

  <!-- step 4 -->
  <rect x="579" y="160" width="168" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="h" x="663" y="184" text-anchor="middle">4. Sobe com ../</text>
  <text class="sub" x="663" y="210" text-anchor="middle">sai da pasta do site</text>
  <text class="sub" x="663" y="226" text-anchor="middle">(document root)</text>
  <rect x="613" y="240" width="100" height="26" rx="4" fill="#020617" stroke="#334155"/>
  <text class="code" x="663" y="258" text-anchor="middle">/bin/sh</text>

  <!-- step 5: consequence -->
  <rect x="762" y="160" width="168" height="130" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2.5" filter="url(#glow-red)"/>
  <text class="h red" x="846" y="184" text-anchor="middle">5. Ele EXECUTA</text>
  <text class="sub" x="846" y="204" text-anchor="middle">em /cgi-bin ele roda</text>
  <text class="sub" x="846" y="219" text-anchor="middle">o arquivo alcançado</text>
  <text class="h" x="846" y="248" text-anchor="middle">atacante roda</text>
  <text class="h" x="846" y="266" text-anchor="middle">comandos (RCE)</text>

  <!-- attack arrows -->
  <path d="M198,225 L211,225" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M381,225 L394,225" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M564,225 L577,225" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M747,225 L760,225" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <!-- separator -->
  <line x1="30" y1="322" x2="930" y2="322" stroke="#334155" stroke-width="1" stroke-dasharray="6 5"/>

  <!-- defense (secondary) -->
  <text class="lane" x="30" y="350">A CORREÇÃO (para comparar)</text>
  <rect x="30" y="362" width="900" height="56" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="body bold green" x="48" y="386">Apache 2.4.51:</text>
  <text class="body" x="168" y="386">rejeita os pontos codificados ANTES de achar o arquivo</text>
  <text class="sub" x="48" y="406">→ responde 400 / 404 e nada sai da pasta do site (a 2.4.50 consertou só pela metade)</text>

  <!-- legend -->
  <rect x="30" y="448" width="14" height="14" rx="3" fill="#eab308"/>
  <text class="leg" x="52" y="460">amarelo = onde está a falha</text>
  <rect x="290" y="448" width="14" height="14" rx="3" fill="#ef4444"/>
  <text class="leg" x="312" y="460">vermelho = o ataque e o que o atacante ganha</text>
  <rect x="680" y="448" width="14" height="14" rx="3" fill="#10b981"/>
  <text class="leg" x="702" y="460">verde = corrigido</text>
</svg>
