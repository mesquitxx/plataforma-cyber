<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">A arquitetura do Metasploit</title>
  <desc id="d">Ideia-chave: o console (msfconsole) junta duas peças separadas — um módulo exploit (explora a falha) e um payload (o que roda depois de entrar) — usando as variáveis do datastore, e dispara contra o alvo; se funciona, abre uma sessão de controle. À esquerda, a biblioteca de módulos com os seis tipos; exploit e payload aparecem destacados em laranja porque são as duas peças que o console combina. No centro, o msfconsole e, abaixo, o datastore com as variáveis definidas pelo comando set (RHOSTS, RPORT, LHOST, PAYLOAD). À direita, a caixa laranja "exploit + payload" montados e disparados contra o alvo (Apache 2.4.49 do lab), que abre uma session verde. Uma nota lembra que o Metasploit roda aqui sem banco (dbless) e o search usa o cache local de módulos.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','DejaVu Sans Mono','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .key   { font-size: 12.5px; fill: #fdba74; }
    .hdr   { font-size: 13.5px; font-weight: 700; }
    .lbl   { font-size: 13px; font-weight: 700; }
    .sub   { font-size: 10.5px; fill: #94a3b8; }
    .mono  { font-size: 11px; fill: #7dd3fc; }
    .tag   { font-size: 10.5px; fill: #cbd5e1; }
    .note  { font-size: 11px; fill: #cbd5e1; }
    .panel { fill: #0f172a; stroke: #334155; stroke-width: 1.2; }
    .mod   { fill: #111827; stroke: #334155; stroke-width: 1; }
    .modhot{ fill: #2a1708; stroke: #f97316; stroke-width: 1.6; }
    .blue  { fill: #0b1f33; stroke: #38bdf8; stroke-width: 1.8; }
    .orange{ fill: #2a1708; stroke: #f97316; stroke-width: 2.2; }
    .target{ fill: #0f172a; stroke: #64748b; stroke-width: 1.6; }
    .green { fill: #052e1b; stroke: #34d399; stroke-width: 2.2; }
    .keybox{ fill: #1c1206; stroke: #b45309; stroke-width: 1.2; }
    .a-mut { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#m-mut); }
    .a-blue{ stroke: #38bdf8; stroke-width: 2; fill: none; marker-end: url(#m-blue); }
    .a-org { stroke: #f97316; stroke-width: 2; fill: none; marker-end: url(#m-org); }
    .a-fire{ stroke: #f97316; stroke-width: 3.6; fill: none; marker-end: url(#m-org); }
    .a-grn { stroke: #34d399; stroke-width: 2; fill: none; marker-end: url(#m-grn); }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="m-mut" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <marker id="m-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#38bdf8"/></marker>
    <marker id="m-org" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker>
    <marker id="m-grn" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#34d399"/></marker>
    <filter id="g-blue" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g-org" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="g-grn" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>
  <text class="title" x="30" y="40">A arquitetura do Metasploit</text>

  <!-- key idea banner -->
  <rect class="keybox" x="30" y="54" width="900" height="36" rx="6"/>
  <rect x="30" y="54" width="5" height="36" fill="#f97316"/>
  <text class="key" x="46" y="77">Ideia-chave: o console junta um <tspan fill="#fdba74" font-weight="700">exploit</tspan> a um <tspan fill="#fdba74" font-weight="700">payload</tspan> e dispara no alvo — se funciona, abre uma sessão.</text>

  <!-- library -->
  <rect class="panel" x="30" y="112" width="236" height="330" rx="8"/>
  <text class="hdr" x="44" y="136">Biblioteca de módulos</text>
  <text class="sub" x="44" y="152">o que o console carrega</text>
  <rect class="modhot" x="44" y="162" width="208" height="40" rx="6"/>
  <text class="lbl" x="56" y="180" fill="#fdba74">exploit</text>
  <text class="sub" x="56" y="195">explora a falha, abre a porta</text>
  <rect class="modhot" x="44" y="208" width="208" height="40" rx="6"/>
  <text class="lbl" x="56" y="226" fill="#fdba74">payload</text>
  <text class="sub" x="56" y="241">o que roda depois de entrar</text>
  <rect class="mod" x="44" y="254" width="208" height="38" rx="6"/>
  <text class="lbl" x="56" y="272">auxiliary</text>
  <text class="sub" x="56" y="286">scanners e o check</text>
  <rect class="mod" x="44" y="298" width="208" height="38" rx="6"/>
  <text class="lbl" x="56" y="316">post</text>
  <text class="sub" x="56" y="330">pós-exploração, na sessão</text>
  <rect class="mod" x="44" y="342" width="208" height="38" rx="6"/>
  <text class="lbl" x="56" y="360">encoder</text>
  <text class="sub" x="56" y="374">nova forma ao payload</text>
  <rect class="mod" x="44" y="386" width="208" height="38" rx="6"/>
  <text class="lbl" x="56" y="404">nop</text>
  <text class="sub" x="56" y="418">preenchimento (no-op)</text>

  <!-- console -->
  <rect class="blue" x="330" y="190" width="172" height="92" rx="8" filter="url(#g-blue)"/>
  <text class="lbl" x="416" y="222" text-anchor="middle" fill="#7dd3fc">msfconsole</text>
  <text class="sub" x="416" y="240" text-anchor="middle">o console com que você fala</text>
  <text class="mono" x="416" y="263" text-anchor="middle">search · use · run</text>

  <!-- datastore -->
  <rect class="blue" x="330" y="332" width="172" height="100" rx="8"/>
  <text class="hdr" x="416" y="356" text-anchor="middle" fill="#7dd3fc">datastore</text>
  <text class="sub" x="416" y="374" text-anchor="middle">o que você define com set</text>
  <text class="mono" x="416" y="397" text-anchor="middle">RHOSTS · RPORT</text>
  <text class="mono" x="416" y="414" text-anchor="middle">LHOST · PAYLOAD</text>

  <!-- combined (highlight) -->
  <rect class="orange" x="560" y="188" width="184" height="104" rx="8" filter="url(#g-org)"/>
  <text class="lbl" x="652" y="220" text-anchor="middle"><tspan fill="#fdba74">exploit</tspan> <tspan fill="#e2e8f0">+</tspan> <tspan fill="#fdba74">payload</tspan></text>
  <text class="sub" x="652" y="240" text-anchor="middle">a falha e o que roda,</text>
  <text class="sub" x="652" y="255" text-anchor="middle">montados juntos</text>
  <text class="mono" x="652" y="278" text-anchor="middle" fill="#fdba74">disparados no alvo</text>

  <!-- target -->
  <rect class="target" x="788" y="190" width="150" height="90" rx="8"/>
  <text class="lbl" x="863" y="222" text-anchor="middle">alvo</text>
  <text class="sub" x="863" y="242" text-anchor="middle">Apache 2.4.49</text>
  <text class="sub" x="863" y="258" text-anchor="middle">(lab vulhub)</text>

  <!-- session -->
  <rect class="green" x="788" y="350" width="150" height="90" rx="8" filter="url(#g-grn)"/>
  <text class="lbl" x="863" y="386" text-anchor="middle" fill="#6ee7b7">session</text>
  <text class="sub" x="863" y="406" text-anchor="middle">canal de controle</text>
  <text class="sub" x="863" y="422" text-anchor="middle">sobre o alvo</text>

  <!-- arrows -->
  <path class="a-mut" d="M268,236 L326,236"/>
  <text class="tag" x="297" y="228" text-anchor="middle">carrega</text>
  <path class="a-blue" d="M416,330 L416,286"/>
  <text class="tag" x="470" y="312" text-anchor="middle">set</text>
  <path class="a-org" d="M502,236 L556,238"/>
  <text class="tag" x="529" y="228" text-anchor="middle" fill="#fdba74">monta</text>
  <path class="a-fire" d="M744,238 L784,236"/>
  <text class="tag" x="766" y="226" text-anchor="middle" fill="#fdba74" font-weight="700">dispara</text>
  <path class="a-grn" d="M863,282 L863,346"/>
  <text class="tag" x="910" y="318" text-anchor="middle" fill="#6ee7b7">abre</text>

  <!-- legend -->
  <text class="sub" x="30" y="498" font-weight="700" fill="#cbd5e1">Cores:</text>
  <line x1="88" y1="494" x2="118" y2="494" class="a-blue"/>
  <text class="sub" x="124" y="498">você controla no Kali (console, datastore)</text>
  <line x1="420" y1="494" x2="450" y2="494" class="a-org"/>
  <text class="sub" x="456" y="498">o ataque que sai (exploit + payload)</text>
  <line x1="712" y1="494" x2="742" y2="494" class="a-grn"/>
  <text class="sub" x="748" y="498">o que você ganha (a sessão)</text>

  <!-- note -->
  <rect x="30" y="528" width="900" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="note" x="46" y="548">Nesta attack box, o Metasploit roda sem banco de dados (dbless): o <tspan fill="#7dd3fc">search</tspan> usa o cache local de módulos;</text>
  <text class="note" x="46" y="564">a sessão não fica gravada entre usos. A ferramenta não dá privilégio — você entra como a conta do serviço.</text>
</svg>
