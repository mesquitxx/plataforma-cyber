<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">A arquitetura do Metasploit Framework</title>
  <desc id="d">No centro está o console (msfconsole), o programa com que o pentester conversa. À esquerda, uma pilha com os seis tipos de módulo que o console carrega da sua biblioteca local: exploit (abre a porta explorando uma falha), payload (o que roda depois de entrar), auxiliary (scanners e tarefas sem exploração, como o check), post (pós-exploração, roda dentro de uma sessão), encoder e nop (dão forma ao payload). Do console sai uma seta para a direita passando pelo datastore, um conjunto de variáveis como RHOSTS, RPORT, LHOST e PAYLOAD que o usuário define com o comando set. Configurado, o console combina um exploit com um payload e dispara contra o alvo; quando dá certo, abre uma sessão (session) — um canal de controle sobre o alvo, por exemplo um Meterpreter. Uma nota embaixo lembra que, nesta attack box, o Metasploit roda sem banco de dados (dbless): o search usa um cache local de módulos.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13.5px; font-weight: 700; }
    .step { font-size: 12.5px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #9fb0a6; }
    .mono { font-size: 11px; fill: #5cc8d8; }
    .cur { fill: #5cc8d8; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .boxcur { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .boxg { fill: #16201b; stroke: #5ee08a; stroke-width: 2.5; }
    .flow { stroke: #4a5a52; stroke-width: 2; fill: none; marker-end: url(#a); }
    .flowcur { stroke: #5cc8d8; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .bl { font-size: 11px; fill: #5ee08a; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5a52"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="34">A arquitetura do Metasploit Framework</text>

  <!-- module library (left) -->
  <rect class="box" x="24" y="70" width="210" height="330" rx="8"/>
  <text class="h" x="129" y="96" text-anchor="middle">Biblioteca de módulos</text>
  <rect class="box" x="40" y="112" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="130">exploit</text>
  <text class="sub" x="52" y="146">explora a falha, abre a porta</text>
  <rect class="box" x="40" y="160" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="178">payload</text>
  <text class="sub" x="52" y="194">o que roda depois de entrar</text>
  <rect class="box" x="40" y="208" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="226">auxiliary</text>
  <text class="sub" x="52" y="242">scanners, check (sem exploit)</text>
  <rect class="box" x="40" y="256" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="274">post</text>
  <text class="sub" x="52" y="290">pós-exploração, na sessão</text>
  <rect class="box" x="40" y="304" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="322">encoder</text>
  <text class="sub" x="52" y="338">dá nova forma ao payload</text>
  <rect class="box" x="40" y="352" width="178" height="40" rx="6"/>
  <text class="step" x="52" y="370">nop</text>
  <text class="sub" x="52" y="386">preenchimento (no-op)</text>

  <!-- console (center) -->
  <rect class="boxcur" x="300" y="176" width="180" height="118" rx="8"/>
  <text class="step cur" x="390" y="222" text-anchor="middle">msfconsole</text>
  <text class="sub" x="390" y="242" text-anchor="middle">o console com que</text>
  <text class="sub" x="390" y="257" text-anchor="middle">você conversa</text>
  <text class="mono" x="390" y="278" text-anchor="middle">search · use · run</text>

  <!-- datastore -->
  <rect class="box" x="540" y="86" width="196" height="110" rx="8"/>
  <text class="h" x="638" y="112" text-anchor="middle">datastore</text>
  <text class="sub" x="638" y="132" text-anchor="middle">as variáveis que você</text>
  <text class="sub" x="638" y="147" text-anchor="middle">define com set</text>
  <text class="mono" x="638" y="170" text-anchor="middle">RHOSTS · RPORT</text>
  <text class="mono" x="638" y="186" text-anchor="middle">LHOST · PAYLOAD</text>

  <!-- exploit+payload fired -->
  <rect class="box" x="540" y="214" width="196" height="64" rx="8"/>
  <text class="step" x="638" y="240" text-anchor="middle">exploit + payload</text>
  <text class="sub" x="638" y="260" text-anchor="middle">disparados contra o alvo</text>

  <!-- session -->
  <rect class="boxg" x="786" y="202" width="96" height="90" rx="8"/>
  <text class="step" x="834" y="238" text-anchor="middle" fill="#5ee08a">session</text>
  <text class="sub" x="834" y="258" text-anchor="middle">canal de</text>
  <text class="sub" x="834" y="272" text-anchor="middle">controle</text>

  <!-- flows -->
  <path class="flow" d="M234,235 L298,235"/>
  <text class="sub" x="266" y="226" text-anchor="middle">carrega</text>
  <path class="flowcur" d="M480,210 C512,190 512,160 538,142"/>
  <path class="flowcur" d="M480,246 L538,246"/>
  <path class="flowcur" d="M736,246 L784,246"/>

  <!-- dbless note -->
  <text class="bl" x="30" y="432">Nesta attack box: sem PostgreSQL (dbless). O `search` usa o cache local de módulos; a sessão não é gravada entre usos.</text>
</svg>
