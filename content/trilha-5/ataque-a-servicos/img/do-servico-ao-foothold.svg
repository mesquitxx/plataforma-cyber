<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Do serviço exposto ao acesso inicial (foothold)</title>
  <desc id="d">Fluxo da esquerda para a direita. Começa num serviço exposto (uma porta aberta na rede). Dele sai a enumeração do módulo 5.1, que descobre porta, versão e banner. A enumeração abre em três vetores de acesso, empilhados: má configuração (FTP anônimo, null session, directory listing), credencial fraca ou padrão (brute force, password spraying) e versão vulnerável (uma CVE conhecida). Os três convergem para uma única caixa destacada em ciano: o acesso inicial, ou foothold, em que o atacante passa a executar comandos como o usuário do serviço. Dessa caixa sai a etapa seguinte, pós-foothold: saquear o serviço e pivotar. Uma chave verde abraça a caixa do foothold com a legenda "o que você faz neste módulo". Uma nota ao lado do vetor "versão vulnerável" diz que a dissecação do CVE e o patch são o módulo 5.4.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .step { font-size: 12.5px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #9fb0a6; }
    .tag { font-size: 10.5px; fill: #9fb0a6; }
    .cur { fill: #5cc8d8; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .boxcur { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .flow { stroke: #4a5a52; stroke-width: 2; fill: none; marker-end: url(#a); }
    .flowcur { stroke: #5cc8d8; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .brace { stroke: #5ee08a; stroke-width: 2; fill: none; }
    .bl { font-size: 12px; font-weight: 700; fill: #5ee08a; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#4a5a52"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="34">Do serviço exposto ao acesso inicial (foothold)</text>

  <!-- exposed service -->
  <rect class="box" x="24" y="196" width="130" height="78" rx="8"/>
  <text class="step" x="89" y="228" text-anchor="middle">Serviço</text>
  <text class="step" x="89" y="246" text-anchor="middle">exposto</text>
  <text class="sub" x="89" y="264" text-anchor="middle">porta aberta</text>

  <!-- enumerate -->
  <rect class="box" x="178" y="196" width="150" height="78" rx="8"/>
  <text class="step" x="253" y="222" text-anchor="middle">Enumerar</text>
  <text class="sub" x="253" y="240" text-anchor="middle">porta · versão</text>
  <text class="sub" x="253" y="256" text-anchor="middle">· banner</text>
  <text class="tag" x="253" y="288" text-anchor="middle">módulo 5.1</text>

  <!-- three vectors -->
  <rect class="box" x="360" y="96" width="206" height="66" rx="8"/>
  <text class="step" x="463" y="124" text-anchor="middle">Má configuração</text>
  <text class="sub" x="463" y="142" text-anchor="middle">anon FTP · null session · listing</text>

  <rect class="box" x="360" y="202" width="206" height="66" rx="8"/>
  <text class="step" x="463" y="230" text-anchor="middle">Credencial fraca/padrão</text>
  <text class="sub" x="463" y="248" text-anchor="middle">brute force · password spraying</text>

  <rect class="box" x="360" y="308" width="206" height="66" rx="8"/>
  <text class="step" x="463" y="336" text-anchor="middle">Versão vulnerável</text>
  <text class="sub" x="463" y="354" text-anchor="middle">uma CVE conhecida</text>

  <!-- foothold (current focus) -->
  <rect class="boxcur" x="614" y="188" width="166" height="94" rx="8"/>
  <text class="step cur" x="697" y="220" text-anchor="middle">Acesso inicial</text>
  <text class="step cur" x="697" y="238" text-anchor="middle">(foothold)</text>
  <text class="sub" x="697" y="258" text-anchor="middle">comandos como o</text>
  <text class="sub" x="697" y="272" text-anchor="middle">usuário do serviço</text>

  <!-- post-foothold -->
  <rect class="box" x="808" y="196" width="78" height="78" rx="8"/>
  <text class="step" x="847" y="222" text-anchor="middle">Pós-</text>
  <text class="step" x="847" y="240" text-anchor="middle">foothold</text>
  <text class="sub" x="847" y="258" text-anchor="middle">saquear</text>

  <!-- flows -->
  <path class="flow" d="M154,235 L176,235"/>
  <path class="flow" d="M328,220 C344,200 344,150 358,133"/>
  <path class="flow" d="M328,235 L358,235"/>
  <path class="flow" d="M328,250 C344,270 344,320 358,337"/>
  <path class="flowcur" d="M566,129 C590,150 592,180 612,208"/>
  <path class="flowcur" d="M566,235 L612,235"/>
  <path class="flowcur" d="M566,341 C590,320 592,290 612,262"/>
  <path class="flow" d="M780,235 L806,235"/>

  <!-- brace over foothold -->
  <path class="brace" d="M614,170 q0,-12 12,-12 L685,158 q12,0 12,12"/>
  <path class="brace" d="M780,170 q0,-12 -12,-12 L709,158"/>
  <text class="bl" x="697" y="146" text-anchor="middle">o que você faz neste módulo</text>

  <!-- note about 5.4 -->
  <text class="tag" x="463" y="398" text-anchor="middle">a dissecação do CVE e o patch: módulo 5.4</text>
</svg>
