<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Onde termina o reconhecimento passivo</title>
  <desc id="d">Título: quem enxerga a sua consulta? É isso, e não a ferramenta, que separa passivo, semipassivo e ativo. Três colunas. Passiva: quem vê é só um terceiro; você consulta quem já guardou a informação, e o alvo não recebe nada. Exemplos: buscadores, arquivo antigo da web, registro do domínio. Risco: dado velho ou errado. Semipassiva: o seu pedido chega ao alvo, mas ele vê um visitante comum. Exemplos: perguntar o DNS publicado, abrir o site como visitante, baixar um PDF publicado. Ativa: o alvo recebe e estranha o tráfego. Exemplos: varrer todas as portas, chutar milhares de subdomínios, procurar páginas escondidas. Deixa rastro claro. Embaixo, uma faixa da esquerda para a direita mostra que cresce o rastro deixado no alvo; uma linha tracejada antes da coluna ativa marca que daqui em diante a carta de autorização é obrigatória. Escopo, finalidade e LGPD valem nas três colunas.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 15px; font-weight: 700; }
    .who { font-size: 13px; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #94a3b8; }
    .box { font-size: 12px; font-weight: 700; }
    .green { fill: #34d399; }
    .amber { fill: #fbbf24; }
    .red { fill: #f87171; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eab308"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <marker id="arrow-trail" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><polygon points="0 0, 10 5, 0 10" fill="#ef4444"/></marker>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Quem enxerga a sua consulta?</text>
  <text class="sub" x="40" y="62">É isso, e não a ferramenta, que separa passivo, semipassivo e ativo.</text>

  <!-- PASSIVE -->
  <rect data-graph-role="container" x="30" y="84" width="270" height="316" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text class="h green" x="48" y="112">PASSIVA</text>
  <text class="who" x="48" y="134">quem vê: só um terceiro</text>
  <rect x="45" y="164" width="60" height="34" rx="5" fill="#1e293b" stroke="#475569"/>
  <text class="box" x="75" y="186" text-anchor="middle">você</text>
  <line x1="107" y1="181" x2="166" y2="181" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="170" y="156" width="115" height="50" rx="5" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="box" x="227" y="177" text-anchor="middle">terceiro</text>
  <text class="s" x="227" y="194" text-anchor="middle">já guardou</text>
  <rect x="170" y="218" width="115" height="34" rx="5" fill="none" stroke="#475569" stroke-dasharray="4 3"/>
  <text class="s" x="227" y="239" text-anchor="middle">alvo: nada chega</text>
  <text class="s" x="48" y="290">exemplos</text>
  <text class="b" x="48" y="312">• buscadores</text>
  <text class="b" x="48" y="334">• arquivo antigo da web</text>
  <text class="b" x="48" y="356">• registro do domínio</text>
  <text class="s" x="48" y="386">risco: dado velho ou errado</text>

  <!-- SEMI-PASSIVE -->
  <rect data-graph-role="container" x="345" y="84" width="270" height="316" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text class="h amber" x="363" y="112">SEMIPASSIVA</text>
  <text class="who" x="363" y="134">quem vê: o alvo, sem estranhar</text>
  <rect x="360" y="164" width="60" height="34" rx="5" fill="#1e293b" stroke="#475569"/>
  <text class="box" x="390" y="186" text-anchor="middle">você</text>
  <line x1="422" y1="181" x2="481" y2="181" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <rect x="485" y="156" width="115" height="50" rx="5" fill="#1c1a0b" stroke="#eab308" stroke-width="1.5"/>
  <text class="box" x="542" y="177" text-anchor="middle">alvo</text>
  <text class="s" x="542" y="194" text-anchor="middle">"um visitante"</text>
  <text class="s" x="363" y="290">exemplos</text>
  <text class="b" x="363" y="312">• perguntar o DNS publicado</text>
  <text class="b" x="363" y="334">• abrir o site como visitante</text>
  <text class="b" x="363" y="356">• baixar um PDF publicado</text>
  <text class="s" x="363" y="386">parece tráfego normal</text>

  <!-- ACTIVE -->
  <rect data-graph-role="container" x="660" y="84" width="270" height="316" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="1.8"/>
  <text class="h red" x="678" y="112">ATIVA</text>
  <text class="who" x="678" y="134">quem vê: o alvo, e estranha</text>
  <rect x="675" y="164" width="60" height="34" rx="5" fill="#1e293b" stroke="#475569"/>
  <text class="box" x="705" y="186" text-anchor="middle">você</text>
  <line x1="737" y1="176" x2="796" y2="176" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <line x1="737" y1="186" x2="796" y2="186" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="800" y="156" width="115" height="50" rx="5" fill="#2a0f12" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="box" x="857" y="177" text-anchor="middle">alvo</text>
  <text class="s red" x="857" y="194" text-anchor="middle">"o que é isso?!"</text>
  <text class="s" x="678" y="290">exemplos</text>
  <text class="b" x="678" y="312">• varrer todas as portas</text>
  <text class="b" x="678" y="334">• chutar milhares de subdomínios</text>
  <text class="b" x="678" y="356">• procurar páginas escondidas</text>
  <text class="s" x="678" y="386">deixa rastro claro</text>

  <!-- authorization line -->
  <line x1="637" y1="78" x2="637" y2="532" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- trail -->
  <rect x="30" y="424" width="880" height="10" rx="5" fill="url(#trail)"/>
  <line x1="905" y1="429" x2="928" y2="429" stroke="#ef4444" stroke-width="3" marker-end="url(#arrow-trail)"/>
  <text class="b" x="30" y="456">mais rastro no alvo →</text>

  <rect x="660" y="476" width="270" height="56" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="box red" x="676" y="499">daqui em diante:</text>
  <text class="b" x="676" y="519">carta de autorização obrigatória</text>
  <text class="s" x="30" y="508">escopo, finalidade e LGPD valem nas três colunas</text>

  <!-- legend -->
  <line x1="30" y1="550" x2="930" y2="550" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="566" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="52" y="578">o alvo não recebe nada</text>
  <rect x="290" y="566" width="14" height="14" rx="3" fill="#1c1a0b" stroke="#eab308" stroke-width="1.5"/>
  <text class="leg" x="312" y="578">o alvo recebe, como visita normal</text>
  <rect x="625" y="566" width="14" height="14" rx="3" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="647" y="578">o alvo percebe tráfego estranho</text>
</svg>
