<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">O ciclo de inteligência e a ficha de cada achado</title>
  <desc id="d">À esquerda, um ciclo de cinco etapas ligadas por setas: requisito (o que o teste precisa saber, dentro do escopo), coleta (as fontes abertas), processamento (limpar, tirar duplicatas, normalizar), análise (cruzar fontes e classificar) e difusão (o dossiê e o relatório), que volta ao requisito com novas perguntas. À direita, a ficha que acompanha cada achado no dossiê, com sete campos: o achado, a fonte exata, a data da coleta em UTC, como foi coletado (passivo ou semipassivo), a confiabilidade da fonte de A a F, a credibilidade da informação de 1 a 8 e o status de escopo. Um exemplo preenchido mostra o nome intranet.valeverde.example, achado no crt.sh e confirmado no DNS e no RDAP.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .y { font-size: 11.5px; fill: #e8c46a; }
    .g { font-size: 11.5px; fill: #7fd49a; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e8c46a"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="32">Do requisito ao dossiê: o ciclo e a ficha</text>

  <rect x="150" y="56" width="206" height="56" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="h" x="166" y="78">1. Requisito</text>
  <text class="s" x="166" y="98">o que o teste precisa saber</text>

  <rect x="300" y="160" width="160" height="56" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="h" x="314" y="182">2. Coleta</text>
  <text class="s" x="314" y="202">CT, DNS, RDAP, busca</text>

  <rect x="250" y="292" width="200" height="56" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="h" x="264" y="314">3. Processamento</text>
  <text class="s" x="264" y="334">limpar, sort -u, normalizar</text>

  <rect x="40" y="292" width="170" height="56" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="h" x="54" y="314">4. Análise</text>
  <text class="s" x="54" y="334">cruzar e classificar</text>

  <rect x="30" y="160" width="160" height="56" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="h" x="44" y="182">5. Difusão</text>
  <text class="s" x="44" y="202">dossiê e relatório</text>

  <path d="M340 100 Q400 120 390 156" stroke="#e8c46a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M380 216 Q380 260 360 288" stroke="#e8c46a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <line x1="250" y1="320" x2="214" y2="320" stroke="#e8c46a" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M110 292 Q100 250 110 220" stroke="#e8c46a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M110 160 Q120 110 146 92" stroke="#e8c46a" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <text class="s" x="40" y="390">cada volta gera perguntas novas,</text>
  <text class="s" x="40" y="406">mas o requisito nunca sai do escopo</text>

  <rect x="500" y="56" width="370" height="390" rx="8" fill="#16201b" stroke="#3b6b4f" stroke-dasharray="5 4"/>
  <text class="y" x="518" y="82">Ficha de um achado (dossiê)</text>
  <text class="b" x="518" y="112">achado ..... intranet.valeverde.example</text>
  <text class="b" x="518" y="140">fonte ...... crt.sh, certificado 0b20;</text>
  <text class="b" x="518" y="158">             DNS; RDAP da faixa</text>
  <text class="b" x="518" y="186">coleta ..... 2026-10-20T14:05Z (UTC)</text>
  <text class="b" x="518" y="214">como ....... passivo (CT, RDAP) +</text>
  <text class="b" x="518" y="232">             semipassivo (DNS)</text>
  <text class="b" x="518" y="260">fonte ...... B  (normalmente confiável)</text>
  <text class="b" x="518" y="288">informação . 1  (confirmada por fontes</text>
  <text class="b" x="518" y="306">             independentes)</text>
  <text class="g" x="518" y="334">escopo ..... escopo (203.0.113.0/26)</text>
  <text class="s" x="518" y="372">A–F e 1–8: escalas do manual ATP 2-22.9</text>
  <text class="s" x="518" y="390">do Exército dos EUA (2012). Fonte nova</text>
  <text class="s" x="518" y="408">começa em F e 8: "sem base para julgar",</text>
  <text class="s" x="518" y="426">não "não confiável".</text>
</svg>
