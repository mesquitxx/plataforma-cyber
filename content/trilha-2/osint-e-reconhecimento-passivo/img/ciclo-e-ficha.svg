<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">O ciclo de inteligência e a ficha de cada achado</title>
  <desc id="d">Título: cada volta do ciclo termina numa ficha; sem fonte, data e nota de confiança, um achado de OSINT não vale como evidência. À esquerda, um ciclo de cinco etapas ligadas por setas: 1, requisito (a pergunta, dentro do escopo); 2, coleta (nas fontes abertas); 3, processamento (limpar, tirar repetidos); 4, análise (cruzar fontes, classificar); e 5, difusão (dossiê e relatório), que volta ao requisito, porque cada volta gera perguntas novas. Da difusão, uma seta dourada leva ao dossiê: a ficha de um achado, em destaque, com sete campos preenchidos com o exemplo intranet.valeverde.example: achado, fonte (crt.sh, DNS e dono do IP), data em UTC, como foi coletado (passivo, sem tocar no alvo), nota da fonte (normalmente confiável), nota da informação (confirmada por outra fonte) e escopo (sim, é do cliente).</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 14px; font-weight: 700; }
    .n { fill: #60a5fa; }
    .s { font-size: 11px; fill: #94a3b8; }
    .lab { font-size: 12px; fill: #94a3b8; }
    .val { font-size: 12px; }
    .gold { fill: #facc15; }
    .leg { font-size: 12px; fill: #94a3b8; }
    .big { font-size: 15px; }
    .bold { font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#facc15"/>
    </marker>
    <filter id="glow-gold" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="580" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Cada volta do ciclo termina numa ficha</text>
  <text class="sub" x="40" y="62">Sem fonte, data e nota de confiança, um achado de OSINT não vale como evidência.</text>

  <!-- cycle steps -->
  <rect x="160" y="112" width="220" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="176" y="135"><tspan class="n">1</tspan> Requisito</text>
  <text class="s" x="176" y="155">a pergunta, dentro do escopo</text>

  <rect x="18" y="234" width="190" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="34" y="257"><tspan class="n">2</tspan> Coleta</text>
  <text class="s" x="34" y="277">nas fontes abertas</text>

  <rect x="65" y="402" width="190" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="81" y="425"><tspan class="n">3</tspan> Processamento</text>
  <text class="s" x="81" y="445">limpar, tirar repetidos</text>

  <rect x="295" y="402" width="210" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="311" y="425"><tspan class="n">4</tspan> Análise</text>
  <text class="s" x="311" y="445">cruzar fontes, classificar</text>

  <rect x="332" y="234" width="190" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="348" y="257"><tspan class="n">5</tspan> Difusão</text>
  <text class="s" x="348" y="277">dossiê e relatório</text>

  <!-- cycle arrows -->
  <line x1="196" y1="170" x2="140" y2="229" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="118" y1="292" x2="146" y2="397" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="257" y1="430" x2="290" y2="430" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="408" y1="400" x2="424" y2="295" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <line x1="410" y1="232" x2="358" y2="173" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <text class="s" x="270" y="298" text-anchor="middle">cada volta gera</text>
  <text class="s" x="270" y="314" text-anchor="middle">perguntas novas</text>

  <!-- to the dossier -->
  <line x1="524" y1="262" x2="564" y2="262" stroke="#facc15" stroke-width="2.4" marker-end="url(#arrow-gold)"/>
  <text class="s gold" x="544" y="250" text-anchor="middle">dossiê</text>

  <!-- record card -->
  <rect x="570" y="96" width="360" height="400" rx="8" fill="#1c1a0b" stroke="#facc15" stroke-width="2.2" filter="url(#glow-gold)"/>
  <text class="h big gold" x="590" y="126">Ficha de um achado</text>
  <text class="s" x="590" y="146">o que fica de cada volta</text>

  <g stroke="#3f3a1a" stroke-width="1">
    <line x1="590" y1="200" x2="910" y2="200"/>
    <line x1="590" y1="240" x2="910" y2="240"/>
    <line x1="590" y1="280" x2="910" y2="280"/>
    <line x1="590" y1="320" x2="910" y2="320"/>
    <line x1="590" y1="360" x2="910" y2="360"/>
    <line x1="590" y1="400" x2="910" y2="400"/>
  </g>
  <text class="lab" x="590" y="184">achado</text><text class="val" x="700" y="184">intranet.valeverde.example</text>
  <text class="lab" x="590" y="224">fonte</text><text class="val" x="700" y="224">crt.sh + DNS + dono do IP</text>
  <text class="lab" x="590" y="264">data</text><text class="val" x="700" y="264">2026-10-20 14:05 UTC</text>
  <text class="lab" x="590" y="304">como</text><text class="val" x="700" y="304">passivo, sem tocar no alvo</text>
  <text class="lab" x="590" y="344">nota da fonte</text><text class="val" x="700" y="344">normalmente confiável</text>
  <text class="lab" x="590" y="384">nota da info</text><text class="val" x="700" y="384">confirmada por outra fonte</text>
  <text class="lab" x="590" y="424">escopo</text><text class="val" x="700" y="424">sim, é do cliente</text>

  <rect x="590" y="446" width="320" height="34" rx="5" fill="#2a2508" stroke="#facc15" stroke-width="1"/>
  <text class="val bold gold" x="750" y="468" text-anchor="middle">sem fonte, data e nota → não é evidência</text>

  <!-- legend -->
  <line x1="40" y1="528" x2="920" y2="528" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="544" width="14" height="14" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="62" y="556">etapa do ciclo</text>
  <rect x="260" y="544" width="14" height="14" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="282" y="556">o que fica como evidência</text>
</svg>
