<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">O grafo de pivôs da Vale Verde</title>
  <desc id="d">Um grafo que parte de uma única semente, o domínio valeverde.example, e mostra como cada fonte leva a novas entidades. Pelos logs de Certificate Transparency, a semente leva a dezesseis nomes, entre eles intranet, suporte, www e cooperados. Pelo DNS, intranet resolve para 203.0.113.20, que o RDAP mostra ser da Vale Verde: está no escopo. Suporte é um CNAME para valeverde.nuvemfacil.example, que não existe mais: um CNAME pendurado, que se relata. Www aponta para a CDN Exemplo, em 192.0.2.50: é de um terceiro, que precisa autorizar à parte. O certificado de cooperados também cita outro domínio, valeverde-cooperativa.example, que não está na carta: pede-se adendo. Pelo registro TXT de SPF, a semente revela que a NuvemFacil envia e-mails pela Vale Verde. Pelo buscador, a semente leva a um DOCX publicado, cujos metadados revelam o login c.lima e o servidor interno SRV-ARQ02. Cada aresta é rotulada com a fonte que a criou, e as cores separam o que está no escopo, o que é de terceiro e o que exige adendo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .b { font-size: 11.5px; }
    .s { font-size: 10px; fill: #9fb0a6; }
    .e { font-size: 10px; fill: #e8c46a; }
    .g { fill: #7fd49a; }
    .r { fill: #e07a6a; }
    .c { fill: #5cc8d8; }
  </style>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="30" y="32">Pivôs: cada fonte transforma uma entidade em outras</text>

  <g stroke="#6a7f73" stroke-width="1.5" fill="none">
    <path d="M150 270 L300 120"/><path d="M150 270 L300 270"/><path d="M150 270 L300 420"/>
    <path d="M150 270 L300 480"/>
    <path d="M420 120 L560 70"/><path d="M420 120 L560 130"/><path d="M420 120 L560 190"/><path d="M420 120 L560 250"/>
    <path d="M700 70 L740 70"/><path d="M700 130 L740 130"/><path d="M700 190 L740 190"/><path d="M700 250 L740 250"/>
    <path d="M450 420 L560 400"/><path d="M450 420 L560 450"/>
  </g>

  <rect x="40" y="248" width="120" height="44" rx="8" fill="#203328" stroke="#7fd49a"/>
  <text class="b" x="52" y="268">semente</text>
  <text class="b g" x="52" y="284">valeverde.ex.</text>

  <text class="e" x="190" y="180">CT</text>
  <text class="e" x="200" y="262">TXT (SPF)</text>
  <text class="e" x="236" y="352">buscador</text>
  <text class="e" x="236" y="452">RDAP</text>

  <rect x="300" y="98" width="120" height="44" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="312" y="118">16 nomes</text>
  <text class="s" x="312" y="134">(crt.sh)</text>

  <rect x="300" y="248" width="200" height="44" rx="8" fill="#2a1c1a" stroke="#8a4a3f"/>
  <text class="b" x="312" y="268">_spf.nuvemfacil</text>
  <text class="s" x="312" y="284">terceiro envia e-mail</text>

  <rect x="300" y="398" width="150" height="44" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="312" y="418">edital.docx</text>
  <text class="s" x="312" y="434">filetype:docx</text>

  <rect x="300" y="458" width="200" height="44" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="312" y="478">registrante redigido</text>
  <text class="s" x="312" y="494">desde 2009, sem DNSSEC</text>

  <text class="e" x="470" y="90">DNS</text>
  <rect x="560" y="50" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="570" y="74">intranet</text>
  <rect x="560" y="110" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="570" y="134">suporte</text>
  <rect x="560" y="170" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="570" y="194">www</text>
  <rect x="560" y="230" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b" x="570" y="254">cooperados</text>

  <text class="b g" x="746" y="66">203.0.113.20</text>
  <text class="s" x="746" y="80">RDAP: Vale Verde</text>
  <text class="b c" x="746" y="126">CNAME → NXDOMAIN</text>
  <text class="s" x="746" y="140">pendurado → relatar</text>
  <text class="b r" x="746" y="186">192.0.2.50</text>
  <text class="s" x="746" y="200">RDAP: CDN → terceiro</text>
  <text class="b r" x="746" y="246">SAN: outro domínio</text>
  <text class="s" x="746" y="260">fora da carta → adendo</text>

  <text class="e" x="470" y="398">metadados</text>
  <rect x="560" y="380" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b g" x="570" y="404">login c.lima</text>
  <rect x="560" y="432" width="140" height="40" rx="8" fill="#1a2a22" stroke="#3b6b4f"/>
  <text class="b g" x="570" y="456">SRV-ARQ02</text>

  <rect x="720" y="300" width="160" height="96" rx="8" fill="#16201b" stroke="#3b6b4f" stroke-dasharray="5 4"/>
  <text class="b" x="732" y="322">legenda</text>
  <text class="b g" x="732" y="342">■ do cliente/escopo</text>
  <text class="b r" x="732" y="360">■ terceiro / adendo</text>
  <text class="b c" x="732" y="378">■ achado de config.</text>
</svg>
