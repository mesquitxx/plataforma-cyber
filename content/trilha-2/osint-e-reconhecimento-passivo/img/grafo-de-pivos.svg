<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">O grafo de pivôs da Vale Verde</title>
  <desc id="d">Título: pivôs, cada fonte gera pistas novas, e cada pista volta ao escopo. Cada seta é uma fonte. Da semente valeverde.example saem três pivôs. Pelos logs de CT, a semente leva a 16 nomes do domínio, como intranet, www, suporte e cooperados. Pelo registro SPF, revela que a NuvemFacil, um terceiro, envia o e-mail do cliente. Pelo buscador, leva ao edital.docx publicado, cujos metadados revelam o login c.lima e o servidor SRV-ARQ02, do cliente. Os 16 nomes passam, por DNS e RDAP, pela pergunta-chave em destaque, é do cliente?: intranet aponta para um IP da Vale Verde e está no escopo; www aponta para um IP de hospedagem de outra empresa e precisa de autorização à parte; o certificado de cooperados cita outro domínio, fora da carta, e pede adendo; suporte aponta para um nome que não existe mais, está pendurado, e se relata sem tocar. As cores separam o que é do cliente, o que é de terceiro ou fora da carta e a falha de configuração.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .k { font-size: 13px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 11px; fill: #94a3b8; }
    .src { font-size: 11px; fill: #cbd5e1; font-style: italic; }
    .pill { font-size: 11px; font-weight: 700; }
    .green { fill: #34d399; }
    .orange { fill: #fb923c; }
    .cyan { fill: #22d3ee; }
    .gold { fill: #facc15; }
    .leg { font-size: 12px; fill: #94a3b8; }
    .big { font-size: 15px; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#facc15"/></marker>
    <filter id="glow-gold" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="640" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Pivôs: cada fonte gera pistas novas, e cada pista volta ao escopo</text>
  <text class="sub" x="40" y="62">Cada seta é uma fonte. Antes de tocar um nó novo, pergunte: é do cliente?</text>

  <!-- seed -->
  <rect x="30" y="290" width="170" height="56" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="s" x="46" y="311">semente (da carta)</text>
  <text class="k" x="46" y="332">valeverde.example</text>

  <!-- edges from seed -->
  <path d="M200 304 C 230 304, 230 150, 256 150" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text class="src" x="214" y="214">CT</text>
  <line x1="200" y1="318" x2="256" y2="318" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text class="src" x="228" y="310" text-anchor="middle">SPF</text>
  <path d="M200 332 C 230 332, 230 498, 256 498" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text class="src" x="160" y="430">buscador</text>

  <!-- 16 names -->
  <rect x="260" y="122" width="190" height="56" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text class="k" x="276" y="145">16 nomes</text>
  <text class="s" x="276" y="165">intranet, www, suporte…</text>

  <!-- SPF third party -->
  <rect x="260" y="290" width="225" height="56" rx="6" fill="#2a1508" stroke="#f97316" stroke-width="1.5"/>
  <text class="k orange" x="276" y="313">NuvemFacil</text>
  <text class="s" x="276" y="333">terceiro que envia o e-mail</text>

  <!-- docx -->
  <rect x="260" y="470" width="190" height="56" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text class="k" x="276" y="493">edital.docx</text>
  <text class="s" x="276" y="513">publicado no site</text>

  <line x1="450" y1="498" x2="516" y2="498" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
  <text class="src" x="483" y="490" text-anchor="middle">metadados</text>

  <rect x="520" y="470" width="220" height="56" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="k green" x="536" y="493">login c.lima</text>
  <text class="k green" x="536" y="513">servidor SRV-ARQ02</text>

  <!-- scope check (key moment) -->
  <line x1="450" y1="150" x2="514" y2="150" stroke="#facc15" stroke-width="2.4" marker-end="url(#arrow-gold)"/>
  <text class="src" x="483" y="140" text-anchor="middle">DNS+RDAP</text>

  <rect x="520" y="84" width="410" height="330" rx="8" fill="#1c1a0b" stroke="#facc15" stroke-width="2.2" filter="url(#glow-gold)"/>
  <text class="k big gold" x="538" y="110">É do cliente? (volta ao escopo)</text>

  <g stroke="#3f3a1a" stroke-width="1">
    <line x1="536" y1="188" x2="914" y2="188"/>
    <line x1="536" y1="256" x2="914" y2="256"/>
    <line x1="536" y1="324" x2="914" y2="324"/>
  </g>

  <text class="k" x="538" y="146">intranet</text>
  <rect x="770" y="128" width="146" height="26" rx="13" fill="#052e16" stroke="#10b981"/>
  <text class="pill green" x="843" y="145" text-anchor="middle">no escopo</text>
  <text class="s" x="538" y="172">aponta para IP da Vale Verde (RDAP)</text>

  <text class="k" x="538" y="214">www</text>
  <rect x="770" y="196" width="146" height="26" rx="13" fill="#2a1508" stroke="#f97316"/>
  <text class="pill orange" x="843" y="213" text-anchor="middle">autorizar à parte</text>
  <text class="s" x="538" y="240">aponta para IP de outra empresa</text>

  <text class="k" x="538" y="282">cooperados</text>
  <rect x="770" y="264" width="146" height="26" rx="13" fill="#2a1508" stroke="#f97316"/>
  <text class="pill orange" x="843" y="281" text-anchor="middle">pedir adendo</text>
  <text class="s" x="538" y="308">o certificado cita outro domínio</text>

  <text class="k" x="538" y="350">suporte</text>
  <rect x="770" y="332" width="146" height="26" rx="13" fill="#083344" stroke="#22d3ee"/>
  <text class="pill cyan" x="843" y="349" text-anchor="middle">relatar, não tocar</text>
  <text class="s" x="538" y="376">aponta para um nome que não existe</text>
  <text class="s" x="538" y="392">mais (pendurado)</text>

  <!-- legend -->
  <line x1="30" y1="578" x2="930" y2="578" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="596" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="52" y="608">do cliente</text>
  <rect x="160" y="596" width="14" height="14" rx="3" fill="#2a1508" stroke="#f97316" stroke-width="1.5"/>
  <text class="leg" x="182" y="608">terceiro ou fora da carta</text>
  <rect x="410" y="596" width="14" height="14" rx="3" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
  <text class="leg" x="432" y="608">falha de configuração</text>
  <rect x="640" y="596" width="14" height="14" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="662" y="608">a pergunta-chave</text>
</svg>
