<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">Como um nome interno vai parar num log público</title>
  <desc id="d">Título: o nome vaza já no pedido do certificado e fica público para sempre. Diagrama de sequência com quatro participantes: o dono do domínio, a autoridade certificadora (CA), os logs de Certificate Transparency, públicos e que só crescem, e o atacante (ou você, no OSINT). Passo 1: o dono pede à CA um certificado para intranet.valeverde.example. Passo 2, em destaque: a CA envia aos logs o precertificado, já com o nome; a partir daqui o nome é público, antes de o site existir. Passo 3: cada log devolve à CA um SCT, a promessa assinada de incluir o precertificado. Passo 4: a CA entrega o certificado final com os SCTs, que vai para o servidor. Passo 5: o navegador só confia se houver SCTs suficientes. Passo 6: o atacante busca o domínio nos logs, por exemplo pelo crt.sh, e recebe todos os nomes. Resultado em destaque: o atacante ganha a lista de nomes internos do cliente, de graça, sem tocar no alvo e para sempre. Separado e secundário: a CT existe como defesa, para o dono vigiar o log e descobrir certificados que ele não pediu.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .hd { font-size: 14px; font-weight: 700; }
    .m { font-size: 11px; }
    .s { font-size: 11px; fill: #94a3b8; }
    .k { font-size: 13px; font-weight: 700; }
    .blue { fill: #60a5fa; }
    .gold { fill: #facc15; }
    .red { fill: #f87171; }
    .gray { fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
    .bold { font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-gold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#facc15"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
    <filter id="glow-red" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-gold" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">O nome vaza já no pedido do certificado, e para sempre</text>
  <text class="sub" x="40" y="62">Os logs de CT foram feitos para vigiar as CAs, mas qualquer pessoa pode lê-los.</text>

  <!-- participants -->
  <rect x="35" y="88" width="170" height="48" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="hd" x="120" y="109" text-anchor="middle">Dono do domínio</text>
  <text class="s" x="120" y="126" text-anchor="middle">Vale Verde</text>
  <rect x="245" y="88" width="170" height="48" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="hd" x="330" y="109" text-anchor="middle">Autoridade (CA)</text>
  <text class="s" x="330" y="126" text-anchor="middle">emite certificados</text>
  <rect x="455" y="88" width="170" height="48" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="hd" x="540" y="109" text-anchor="middle">Logs de CT</text>
  <text class="s" x="540" y="126" text-anchor="middle">públicos, só crescem</text>
  <rect x="705" y="88" width="170" height="48" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="hd red" x="790" y="109" text-anchor="middle">Atacante</text>
  <text class="s" x="790" y="126" text-anchor="middle">(e você, no OSINT)</text>

  <!-- lifelines -->
  <g stroke="#475569" stroke-width="1" stroke-dasharray="4 4">
    <line x1="120" y1="136" x2="120" y2="500"/>
    <line x1="330" y1="136" x2="330" y2="500"/>
    <line x1="540" y1="136" x2="540" y2="240"/>
    <line x1="790" y1="136" x2="790" y2="500"/>
  </g>
  <!-- from step 2 on, the name lives in the public log -->
  <rect x="534" y="240" width="12" height="262" rx="3" fill="#facc15" fill-opacity="0.35" stroke="#facc15" stroke-width="1"/>

  <!-- 1 -->
  <text class="m" x="225" y="166" text-anchor="middle"><tspan class="blue">1.</tspan> pede certificado para</text>
  <text class="m" x="225" y="180" text-anchor="middle">intranet.valeverde.example</text>
  <line x1="122" y1="190" x2="325" y2="190" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- 2 (key moment) -->
  <text class="m bold gold" x="435" y="222" text-anchor="middle">2. envia o precertificado</text>
  <text class="m gold" x="435" y="235" text-anchor="middle">(já com o nome)</text>
  <line x1="332" y1="244" x2="530" y2="244" stroke="#facc15" stroke-width="2.6" marker-end="url(#arrow-gold)"/>

  <rect x="562" y="222" width="200" height="54" rx="6" fill="#1c1a0b" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="k gold" x="662" y="244" text-anchor="middle">o nome já é público</text>
  <text class="s" x="662" y="263" text-anchor="middle">antes de o site existir</text>

  <!-- 3 -->
  <text class="m" x="435" y="286" text-anchor="middle"><tspan class="blue">3.</tspan> devolve o SCT</text>
  <text class="s" x="435" y="300" text-anchor="middle">(promessa assinada)</text>
  <line x1="532" y1="310" x2="335" y2="310" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- 4 -->
  <text class="m" x="225" y="342" text-anchor="middle"><tspan class="blue">4.</tspan> certificado final</text>
  <text class="s" x="225" y="356" text-anchor="middle">com os SCTs → servidor</text>
  <line x1="328" y1="366" x2="125" y2="366" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- 5 -->
  <rect x="30" y="384" width="190" height="44" rx="5" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
  <text class="m" x="125" y="402" text-anchor="middle"><tspan class="blue">5.</tspan> navegador só confia</text>
  <text class="s" x="125" y="419" text-anchor="middle">com SCTs suficientes</text>

  <!-- 6 -->
  <text class="m red" x="665" y="420" text-anchor="middle">6. busca o domínio</text>
  <text class="s" x="665" y="434" text-anchor="middle">(ex.: crt.sh)</text>
  <line x1="788" y1="444" x2="551" y2="444" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text class="m bold red" x="665" y="476" text-anchor="middle">todos os nomes</text>
  <line x1="551" y1="486" x2="785" y2="486" stroke="#ef4444" stroke-width="2.2" marker-end="url(#arrow-red)"/>

  <!-- result -->
  <line x1="790" y1="500" x2="790" y2="522" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <rect x="580" y="528" width="350" height="72" rx="8" fill="#2a0f12" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="k red" x="598" y="552">O atacante ganha</text>
  <text class="m" x="598" y="572">a lista de nomes internos do cliente,</text>
  <text class="m" x="598" y="588">de graça, sem tocar no alvo, para sempre</text>

  <!-- defense, secondary -->
  <rect x="30" y="528" width="420" height="72" rx="6" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="5 4"/>
  <text class="m bold gray" x="46" y="552">Para que a CT existe (defesa)</text>
  <text class="s" x="46" y="572">o dono vigia o log e descobre certificados</text>
  <text class="s" x="46" y="588">que ele não pediu</text>

  <!-- legend -->
  <line x1="30" y1="616" x2="930" y2="616" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="632" width="14" height="14" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="52" y="644">emissão normal</text>
  <rect x="210" y="632" width="14" height="14" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="232" y="644">o nome vira público</text>
  <rect x="430" y="632" width="14" height="14" rx="3" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="452" y="644">atacante e o que ele ganha</text>
  <rect x="700" y="632" width="14" height="14" rx="3" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text class="leg" x="722" y="644">defesa (secundária)</text>
</svg>
