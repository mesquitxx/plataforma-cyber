<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
  <title id="t">O caminho de uma requisição com o Burp no meio</title>
  <desc id="d">Dentro do contêiner Kali, o Firefox manda cada requisição HTTP para o Burp Proxy, que escuta em 127.0.0.1 na porta 8080. O Burp segura a requisição (pode ler e alterar), decide encaminhar ou descartar, e só então a repassa pela rede interna lab_net para o Juice Shop, na porta 3000. A resposta volta pelo mesmo caminho: do Juice Shop para o Burp e do Burp para o Firefox. Sem o Burp, a seta iria direto do Firefox ao Juice Shop. O Juice Shop e a lab_net não têm internet.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .req { stroke: #5cc8d8; stroke-width: 2.5; marker-end: url(#ar); fill: none; }
    .res { stroke: #5ee08a; stroke-width: 2.5; marker-end: url(#ag); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="420" fill="#121815"/>
  <text class="t" x="30" y="32">Firefox → Burp Proxy → Juice Shop (e a resposta de volta)</text>

  <!-- Kali container box -->
  <rect x="20" y="60" width="600" height="250" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="s" x="34" y="80">contêiner Kali (a sua attack box)</text>

  <!-- Firefox -->
  <rect x="48" y="110" width="150" height="90" rx="8" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="h" x="70" y="140">Firefox</text>
  <text class="s" x="70" y="162">navegador</text>
  <text class="s" x="70" y="180">proxy manual:</text>
  <text class="s" x="70" y="194">127.0.0.1:8080</text>

  <!-- Burp -->
  <rect x="245" y="95" width="160" height="120" rx="8" fill="#1d2a23" stroke="#e8c46a"/>
  <text class="y" x="268" y="122">Burp Proxy</text>
  <text class="s" x="268" y="144">escuta 127.0.0.1</text>
  <text class="s" x="268" y="158">porta 8080</text>
  <text class="b g" x="268" y="182">lê · altera</text>
  <text class="b g" x="268" y="198">encaminha · descarta</text>

  <!-- Juice Shop -->
  <rect x="450" y="110" width="150" height="90" rx="8" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="h" x="472" y="140">Juice Shop</text>
  <text class="s" x="472" y="162">servidor web</text>
  <text class="s" x="472" y="180">porta 3000</text>

  <!-- request arrows -->
  <path class="req" d="M198,138 L243,138"/>
  <path class="req" d="M405,138 L448,138"/>
  <text class="b" x="200" y="128">requisição</text>

  <!-- response arrows -->
  <path class="res" d="M448,175 L407,175"/>
  <path class="res" d="M243,175 L200,175"/>
  <text class="b g" x="205" y="195">resposta</text>

  <!-- lab_net label -->
  <text class="s" x="412" y="235">lab_net (rede interna, sem internet)</text>

  <!-- side note -->
  <rect x="650" y="60" width="230" height="250" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="h" x="666" y="86">Por que funciona</text>
  <text class="b" x="666" y="116">O navegador é só</text>
  <text class="b" x="666" y="134">um cliente. Mandando</text>
  <text class="b" x="666" y="152">o tráfego pelo Burp,</text>
  <text class="b" x="666" y="170">você vê e edita tudo</text>
  <text class="b" x="666" y="188">que sai e que volta —</text>
  <text class="b" x="666" y="206">inclusive o que a</text>
  <text class="b" x="666" y="224">interface tentou</text>
  <text class="b" x="666" y="242">esconder ou proibir.</text>
  <text class="s" x="666" y="276">É um man-in-the-middle</text>
  <text class="s" x="666" y="292">consentido, na sua</text>
  <text class="s" x="666" y="308">própria máquina.</text>

  <text class="s" x="30" y="345">A seta azul é a requisição; a verde, a resposta. Sem o Burp, elas iriam direto entre o Firefox e o Juice Shop.</text>
  <text class="s" x="30" y="365">Como o Burp está no caminho, cada mensagem passa por ele antes de seguir.</text>
</svg>
