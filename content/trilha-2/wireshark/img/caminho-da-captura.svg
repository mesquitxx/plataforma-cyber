<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">O caminho de um pacote: o arquivo separa o que se perde do que só se esconde</title>
  <desc id="d">Em cima, antes de gravar: um quadro chega à placa de rede; o filtro de captura decide se ele é copiado, e o que ele recusa é descartado para sempre; o gravador, único programa com poder de root, grava as cópias. No meio, destacado, o arquivo da captura, que guarda os bytes e a hora de cada quadro. Embaixo, depois de gravar: o Wireshark lê o arquivo, ao vivo ou semanas depois e sem root, traduz cada protocolo (Ethernet, IP, TCP, HTTP) e aplica o filtro de exibição, que só esconde quadros da tela, sem apagar nada; a tela mostra a lista de pacotes, a árvore de campos e os bytes.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .zone { font-size: 14px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .s { font-size: 12px; fill: #94a3b8; }
    .lbl { font-size: 13px; font-weight: 700; }
    .red { fill: #f87171; }
    .green { fill: #34d399; }
    .gold { fill: #facc15; }
    .blue { fill: #60a5fa; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
  </defs>
  <rect width="960" height="580" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">O arquivo divide tudo: antes dele se perde, depois só se esconde</text>
  <text class="sub" x="30" y="60">O caminho de um pacote, da placa de rede até a tela do Wireshark.</text>

  <!-- ===== ANTES de gravar ===== -->
  <rect data-graph-role="container" x="30" y="78" width="900" height="186" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="zone red" x="50" y="102">ANTES de gravar: o que for recusado some para sempre</text>

  <rect x="60" y="122" width="200" height="74" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="h" x="160" y="152" text-anchor="middle">1 · placa de rede</text>
  <text class="s" x="160" y="174" text-anchor="middle">recebe os quadros</text>

  <rect x="330" y="122" width="250" height="74" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="h red" x="455" y="152" text-anchor="middle">2 · filtro de captura</text>
  <text class="s" x="455" y="174" text-anchor="middle">decide: copio ou não?</text>

  <rect x="650" y="122" width="250" height="74" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="h" x="775" y="152" text-anchor="middle">3 · gravador</text>
  <text class="s" x="775" y="174" text-anchor="middle">único programa com root</text>

  <line x1="262" y1="159" x2="326" y2="159" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="582" y1="159" x2="646" y2="159" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <line x1="455" y1="198" x2="455" y2="228" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>
  <text class="lbl red" x="470" y="246">✕ recusado: descartado, não volta mais</text>

  <!-- ===== Arquivo (momento-chave) ===== -->
  <line x1="775" y1="198" x2="775" y2="282" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <rect data-graph-role="container" x="540" y="286" width="390" height="74" rx="6" fill="#1c1a0b" stroke="#facc15" stroke-width="2.5"/>
  <text class="h gold" x="735" y="316" text-anchor="middle">4 · arquivo da captura</text>
  <text class="s" x="735" y="338" text-anchor="middle">bytes crus + hora de cada quadro</text>
  <text class="lbl gold" x="30" y="318">captura é gravação:</text>
  <text class="s" x="30" y="340">o que não entrou no arquivo não existe</text>

  <!-- ===== DEPOIS de gravar ===== -->
  <rect data-graph-role="container" x="30" y="380" width="900" height="134" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="zone green" x="50" y="404">DEPOIS de gravar: nada se perde</text>
  <text class="s" x="424" y="404">o Wireshark lê o arquivo: ao vivo ou semanas depois, sem root</text>

  <rect x="60" y="422" width="380" height="74" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="h" x="250" y="452" text-anchor="middle">5 · Wireshark traduz</text>
  <text class="s" x="250" y="474" text-anchor="middle">Ethernet → IP → TCP → HTTP</text>

  <rect x="520" y="422" width="380" height="74" rx="6" fill="#06281d" stroke="#10b981" stroke-width="2"/>
  <text class="h green" x="710" y="452" text-anchor="middle">6 · filtro de exibição → tela</text>
  <text class="s" x="710" y="474" text-anchor="middle">só esconde da tela; o arquivo fica inteiro</text>

  <path d="M640,362 L640,372 L400,372 L400,418" fill="none" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <line x1="442" y1="459" x2="516" y2="459" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- legend -->
  <line x1="30" y1="534" x2="930" y2="534" stroke="#334155" stroke-width="1"/>
  <line x1="30" y1="558" x2="56" y2="558" stroke="#3b82f6" stroke-width="2.5"/>
  <text class="leg" x="64" y="562">caminho do pacote</text>
  <rect x="230" y="550" width="16" height="16" rx="3" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="254" y="562">perda sem volta</text>
  <rect x="420" y="550" width="16" height="16" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="444" y="562">a fronteira: o arquivo</text>
  <rect x="660" y="550" width="16" height="16" rx="3" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="684" y="562">sem perda: dá para refazer</text>
</svg>
