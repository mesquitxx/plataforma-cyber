<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Capturar exige posição: você só vê o que chega à sua placa</title>
  <desc id="d">Três cenários lado a lado, com quem captura destacado. No primeiro, o laboratório: o Kali é uma das pontas da conversa com o DVWA, então vê a conversa inteira. No segundo, uma rede com switch: o switch entrega a conversa entre A e B só a eles, e quem captura vê apenas os avisos para todos, como o ARP; para ver mais, o dono da rede teria de copiar o tráfego para ele, ou alguém teria de enganar o switch, o que já é um ataque ativo. No terceiro, um Wi-Fi aberto: todos dividem o mesmo ar e, sem criptografia, quem captura grava a conversa de todos e leva senhas e cookies de sessão, como no Firesheep. Embaixo, separada, a defesa: com criptografia de ponta a ponta (HTTPS), quem captura vê quem fala com quem, mas não o conteúdo.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 15px; font-weight: 700; }
    .node { font-size: 13px; font-weight: 700; }
    .lbl { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #94a3b8; }
    .red { fill: #f87171; }
    .green { fill: #34d399; }
    .blue { fill: #60a5fa; }
    .gray { fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
    .def { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">Você só captura o que chega à sua placa</text>
  <text class="sub" x="30" y="60">A posição na rede decide o que dá para ver. O pior caso é o Wi-Fi aberto.</text>

  <!-- ===== Panel 1: lab ===== -->
  <rect data-graph-role="container" x="30" y="80" width="284" height="350" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="48" y="106">1 · você é uma das pontas</text>
  <text class="s" x="48" y="126">o laboratório deste módulo</text>

  <rect x="48" y="170" width="104" height="52" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text class="node blue" x="100" y="193" text-anchor="middle">Kali</text>
  <text class="s" x="100" y="211" text-anchor="middle">(você)</text>
  <rect x="192" y="170" width="104" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="244" y="201" text-anchor="middle">DVWA</text>
  <line x1="152" y1="196" x2="192" y2="196" stroke="#10b981" stroke-width="3"/>

  <text class="lbl green" x="48" y="276">vê a conversa inteira</text>
  <text class="s" x="48" y="300">o tráfego que entra e sai</text>
  <text class="s" x="48" y="318">da sua máquina sempre</text>
  <text class="s" x="48" y="336">passa pela sua placa</text>
  <text class="s" x="48" y="372">sem enganar ninguém</text>

  <!-- ===== Panel 2: switch ===== -->
  <rect data-graph-role="container" x="338" y="80" width="284" height="350" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="356" y="106">2 · rede com switch</text>
  <text class="s" x="356" y="126">só entrega a conversa aos donos</text>

  <rect x="430" y="146" width="100" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="480" y="169" text-anchor="middle">switch</text>
  <rect x="356" y="226" width="70" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="391" y="249" text-anchor="middle">A</text>
  <rect x="445" y="226" width="70" height="36" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="480" y="249" text-anchor="middle">B</text>
  <rect x="534" y="226" width="70" height="36" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text class="node blue" x="569" y="249" text-anchor="middle">você</text>
  <line x1="391" y1="226" x2="462" y2="183" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="480" y1="226" x2="480" y2="183" stroke="#94a3b8" stroke-width="2.5"/>
  <line x1="569" y1="226" x2="500" y2="183" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>

  <text class="lbl" x="356" y="290">A ↔ B não chega a você</text>
  <text class="s" x="356" y="310">só os avisos para todos (ARP)</text>
  <text class="s" x="356" y="346">para ver mais: o dono da rede</text>
  <text class="s" x="356" y="364">copia o tráfego para você, ou</text>
  <text class="s" x="356" y="382">alguém engana o switch</text>
  <text class="s" x="356" y="400">(isso já é um ataque ativo)</text>

  <!-- ===== Panel 3: open Wi-Fi (key moment) ===== -->
  <rect data-graph-role="container" x="646" y="80" width="284" height="350" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="h red" x="664" y="106">3 · Wi-Fi aberto</text>
  <text class="s" x="664" y="126">o ar é de todos, sem criptografia</text>

  <circle cx="788" cy="200" r="62" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
  <circle cx="788" cy="200" r="34" fill="none" stroke="#475569" stroke-dasharray="4 4"/>
  <rect x="762" y="186" width="52" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="s" x="788" y="205" text-anchor="middle">Wi-Fi</text>
  <rect x="664" y="146" width="44" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="686" y="166" text-anchor="middle">A</text>
  <rect x="868" y="146" width="44" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text class="node" x="890" y="166" text-anchor="middle">B</text>
  <rect x="756" y="262" width="64" height="30" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text class="node blue" x="788" y="282" text-anchor="middle">você</text>
  <line x1="708" y1="168" x2="762" y2="192" stroke="#10b981" stroke-width="2.5"/>
  <line x1="868" y1="168" x2="814" y2="192" stroke="#10b981" stroke-width="2.5"/>
  <line x1="788" y1="214" x2="788" y2="262" stroke="#10b981" stroke-width="2.5"/>

  <text class="lbl green" x="664" y="320">vê a conversa de todos</text>
  <rect data-graph-role="container" x="660" y="332" width="256" height="88" rx="6" fill="#1f0a0c" stroke="#ef4444" stroke-width="1.5"/>
  <text class="lbl red" x="674" y="354">o atacante leva:</text>
  <text class="s" x="674" y="374">senhas e cookies de sessão</text>
  <text class="s" x="674" y="392">de quem está por perto</text>
  <text class="s" x="674" y="410">(o caso Firesheep)</text>

  <!-- ===== Defense (secondary, separated) ===== -->
  <rect data-graph-role="container" x="30" y="452" width="900" height="64" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="lbl gray" x="48" y="477">Defesa, nos três casos</text>
  <text class="def" x="48" y="500">criptografia de ponta a ponta (HTTPS): quem captura vê quem fala com quem, mas não o conteúdo.</text>

  <!-- legend -->
  <line x1="30" y1="540" x2="930" y2="540" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="558" width="16" height="16" rx="3" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="54" y="570">quem captura</text>
  <line x1="180" y1="566" x2="206" y2="566" stroke="#10b981" stroke-width="2.5"/>
  <text class="leg" x="214" y="570">chega a você</text>
  <line x1="350" y1="566" x2="376" y2="566" stroke="#94a3b8" stroke-width="2.5"/>
  <text class="leg" x="384" y="570">conversa que não chega a você</text>
  <rect x="660" y="558" width="16" height="16" rx="3" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="684" y="570">o que o atacante ganha</text>
</svg>
