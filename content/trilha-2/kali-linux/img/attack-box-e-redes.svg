<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">A attack box e o que ela alcança</title>
  <desc id="d">No centro, o contêiner kali com duas interfaces: eth0 na rede desktop_net e eth1 na rede lab_net. Na desktop_net, à esquerda, está só o guacd, que o Kali alcança e resolve pelo nome. Na lab_net, à direita, ficam os alvos quando o lab tem um, como o DVWA no lab dvwa; no lab kali ela está vazia. Acima, setas cortadas em vermelho mostram o que o Kali não alcança: a internet (sem rota padrão, ping responde Network is unreachable), o PC e o Windows (as bridges internas não têm IP no host), os bancos de dados e a interface web do Guacamole (outras redes, nomes que não resolvem). Dentro do Kali, o DNS embutido do Docker em 127.0.0.11 só responde nomes de contêineres das redes do próprio Kali.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .r { fill: #f08a7a; }
  </style>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="32">A attack box por dentro: duas redes internas e nada além delas</text>

  <!-- forbidden zone -->
  <g fill="#1f1714" stroke="#5a3a33" stroke-width="1.5">
    <rect x="40" y="56" width="190" height="70" rx="8"/>
    <rect x="260" y="56" width="190" height="70" rx="8"/>
    <rect x="480" y="56" width="190" height="70" rx="8"/>
    <rect x="700" y="56" width="170" height="70" rx="8"/>
  </g>
  <text class="b r" x="52" y="80">Internet</text>
  <text class="s" x="52" y="98">sem rota padrão:</text>
  <text class="s" x="52" y="114">"Network is unreachable"</text>
  <text class="b r" x="272" y="80">PC (WSL) e Windows</text>
  <text class="s" x="272" y="98">bridges internas sem</text>
  <text class="s" x="272" y="114">IP no host</text>
  <text class="b r" x="492" y="80">guac-db, guacamole</text>
  <text class="s" x="492" y="98">outras redes; os nomes</text>
  <text class="s" x="492" y="114">nem resolvem</text>
  <text class="b r" x="712" y="80">guac-proxy</text>
  <text class="s" x="712" y="98">só fala com o</text>
  <text class="s" x="712" y="114">guacamole</text>

  <g stroke="#f08a7a" stroke-width="2" stroke-dasharray="5 4">
    <line x1="135" y1="130" x2="390" y2="232"/>
    <line x1="355" y1="130" x2="420" y2="232"/>
    <line x1="575" y1="130" x2="480" y2="232"/>
    <line x1="785" y1="130" x2="510" y2="232"/>
  </g>
  <g fill="#f08a7a" font-size="18" font-weight="700">
    <text x="252" y="186" style="fill:#f08a7a">✕</text>
    <text x="378" y="186" style="fill:#f08a7a">✕</text>
    <text x="520" y="186" style="fill:#f08a7a">✕</text>
    <text x="640" y="186" style="fill:#f08a7a">✕</text>
  </g>

  <!-- kali -->
  <rect x="330" y="236" width="240" height="120" rx="10" fill="#1a2420" stroke="#5ee08a" stroke-width="2"/>
  <text class="h" x="346" y="260">kali (contêiner)</text>
  <text class="s" x="346" y="280">usuário kali, sudo só aqui dentro</text>
  <text class="s" x="346" y="298">DNS: 127.0.0.11 (embutido)</text>
  <text class="s" x="346" y="316">escuta: o servidor VNC (?)</text>
  <text class="b g" x="346" y="342">eth0</text>
  <text class="b g" x="520" y="342">eth1</text>

  <!-- desktop_net -->
  <rect x="40" y="300" width="230" height="130" rx="8" fill="#16201c" stroke="#34413b" stroke-dasharray="6 4"/>
  <text class="h" x="52" y="322">desktop_net (interna)</text>
  <rect x="70" y="344" width="150" height="56" rx="6" fill="#1a2420" stroke="#34413b"/>
  <text class="b" x="84" y="366">guacd</text>
  <text class="s" x="84" y="386">resolve e alcança</text>
  <line x1="222" y1="372" x2="344" y2="345" stroke="#5ee08a" stroke-width="2"/>

  <!-- lab_net -->
  <rect x="630" y="300" width="240" height="130" rx="8" fill="#16201c" stroke="#34413b" stroke-dasharray="6 4"/>
  <text class="h" x="642" y="322">lab_net (interna)</text>
  <rect x="660" y="344" width="180" height="56" rx="6" fill="#1a2420" stroke="#34413b"/>
  <text class="b" x="674" y="366">alvos do lab</text>
  <text class="s" x="674" y="386">dvwa, juice-shop...</text>
  <text class="s" x="674" y="420">(vazia no lab kali)</text>
  <line x1="548" y1="345" x2="658" y2="372" stroke="#5ee08a" stroke-width="2"/>

  <text class="s" x="40" y="452">Verde: caminho que existe. Vermelho tracejado: caminho que o desenho corta (provado pelo scripts/lab.sh verify).</text>
</svg>
