<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">O caminho da sua tela até o Kali</title>
  <desc id="d">Da esquerda para a direita, cinco caixas ligadas por setas. Primeira: o navegador no Windows, que abre a plataforma em 127.0.0.1:3000 e, dentro dela, um iframe para 127.0.0.1:8080. Segunda: guac-proxy, um nginx, a única porta de laboratório publicada, só no loopback. Terceira: guacamole, a aplicação web do Apache Guacamole, que confere o login do usuário restrito plataforma. Quarta: guacd, que traduz o protocolo do Guacamole para VNC. Quinta: o Kali, onde um servidor VNC espera o guacd e desenha o desktop XFCE. Embaixo de cada seta, a rede usada: loopback do PC, guac_edge, guac_back e desktop_net, todas internas a partir do proxy. Uma faixa inferior lembra que nenhuma dessas redes tem saída para a internet.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 11.5px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .r { fill: #f08a7a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/>
    </marker>
  </defs>
  <rect width="900" height="430" fill="#121815"/>
  <text class="t" x="30" y="32">O caminho da sua tela: do navegador ao desktop do Kali</text>

  <!-- boxes -->
  <g fill="#1a2420" stroke="#34413b" stroke-width="1.5">
    <rect x="20" y="70" width="150" height="170" rx="8"/>
    <rect x="200" y="70" width="150" height="170" rx="8"/>
    <rect x="380" y="70" width="150" height="170" rx="8"/>
    <rect x="560" y="70" width="150" height="170" rx="8"/>
    <rect x="740" y="70" width="145" height="170" rx="8" stroke="#5ee08a"/>
  </g>

  <text class="h" x="32" y="94">Navegador</text>
  <text class="b" x="32" y="116">(Windows)</text>
  <text class="s" x="32" y="140">plataforma em</text>
  <text class="s g" x="32" y="156">127.0.0.1:3000</text>
  <text class="s" x="32" y="180">iframe para</text>
  <text class="s g" x="32" y="196">127.0.0.1:8080</text>
  <text class="s" x="32" y="222">o seu teclado/mouse</text>

  <text class="h" x="212" y="94">guac-proxy</text>
  <text class="b" x="212" y="116">(nginx)</text>
  <text class="s" x="212" y="140">única porta de lab</text>
  <text class="s" x="212" y="156">publicada, só no</text>
  <text class="s" x="212" y="172">loopback do PC</text>
  <text class="s" x="212" y="196">sem NAT: não sai</text>
  <text class="s" x="212" y="212">para a internet</text>

  <text class="h" x="392" y="94">guacamole</text>
  <text class="b" x="392" y="116">(aplicação web)</text>
  <text class="s" x="392" y="140">confere o login do</text>
  <text class="s" x="392" y="156">usuário restrito</text>
  <text class="s g" x="392" y="172">plataforma</text>
  <text class="s" x="392" y="196">abre a conexão</text>
  <text class="s" x="392" y="212">"Kali (attack box)"</text>

  <text class="h" x="572" y="94">guacd</text>
  <text class="b" x="572" y="116">(tradutor)</text>
  <text class="s" x="572" y="140">fala o protocolo</text>
  <text class="s" x="572" y="156">do Guacamole com o</text>
  <text class="s" x="572" y="172">navegador e VNC</text>
  <text class="s" x="572" y="188">com o Kali</text>
  <text class="s" x="572" y="212">usa a senha VNC</text>

  <text class="h" x="752" y="94">kali</text>
  <text class="b" x="752" y="116">(attack box)</text>
  <text class="s" x="752" y="140">um servidor VNC</text>
  <text class="s g" x="752" y="156">espera o guacd</text>
  <text class="s" x="752" y="180">desenha o desktop</text>
  <text class="s" x="752" y="196">XFCE do usuário</text>
  <text class="s" x="752" y="212">kali</text>

  <!-- arrows -->
  <g stroke="#5ee08a" stroke-width="2" marker-end="url(#a)">
    <line x1="172" y1="155" x2="196" y2="155"/>
    <line x1="352" y1="155" x2="376" y2="155"/>
    <line x1="532" y1="155" x2="556" y2="155"/>
    <line x1="712" y1="155" x2="736" y2="155"/>
  </g>

  <!-- networks -->
  <text class="s" x="140" y="272">loopback</text>
  <text class="s" x="140" y="286">(HTTP/WebSocket)</text>
  <text class="s" x="320" y="272">guac_edge</text>
  <text class="s" x="320" y="286">(interna)</text>
  <text class="s" x="500" y="272">guac_back</text>
  <text class="s" x="500" y="286">(interna)</text>
  <text class="s" x="680" y="272">desktop_net</text>
  <text class="s" x="680" y="286">(interna, VNC)</text>

  <rect x="20" y="318" width="865" height="88" rx="8" fill="#1f1714" stroke="#5a3a33"/>
  <text class="b r" x="36" y="344">Nenhuma rede depois do navegador tem saída para a internet.</text>
  <text class="s" x="36" y="366">O Kali não é publicado em porta nenhuma do PC: a única forma de chegar à tela dele é este caminho,</text>
  <text class="s" x="36" y="384">e o guacd é a única máquina da desktop_net além do próprio Kali.</text>
</svg>
