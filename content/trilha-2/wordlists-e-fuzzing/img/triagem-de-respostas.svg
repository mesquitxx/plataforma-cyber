<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">O laço do fuzzing e a triagem das respostas por status e tamanho</title>
  <desc id="d">À esquerda, uma wordlist: uma pilha de linhas com palavras como admin, login, backup, config e robots.txt. Uma seta leva cada palavra ao motor (ffuf, gobuster ou um laço de curl), que monta um pedido HTTP trocando a palavra FUZZ: GET /admin, GET /login, e assim por diante, e manda ao servidor. O servidor responde, e a decisão é lida pelo código de status e pelo tamanho da resposta. Quatro saídas: código 200 quer dizer que existe e foi entregue, é um achado; código 301 ou 302 quer dizer que existe mas redireciona, em geral porque exige login; código 403 quer dizer que existe mas o acesso ou a listagem foi negado, ainda é informação; código 404 quer dizer que não existe, e é a resposta de base que você ignora. A lição ao pé: compare sempre contra a resposta de base do 404; quando o site responde 200 para páginas que não existem, o código engana e você filtra pelo tamanho da resposta.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .r { fill: #f08a7e; }
    .mut { fill: #7f8f86; }
    .ln { stroke: #3a4b42; stroke-width: 2; }
    .ok { stroke: #5ee08a; stroke-width: 2.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="500" fill="#121815"/>
  <text class="t" x="30" y="34">Fuzzing: a mesma palavra entra na posição FUZZ, a resposta diz o que existe</text>

  <!-- wordlist -->
  <rect x="24" y="70" width="150" height="190" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="h" x="40" y="94">wordlist</text>
  <text class="b" x="40" y="120">admin</text>
  <text class="b" x="40" y="142">login</text>
  <text class="b" x="40" y="164">backup</text>
  <text class="b" x="40" y="186">config</text>
  <text class="b" x="40" y="208">robots.txt</text>
  <text class="s" x="40" y="236">...milhares</text>
  <text class="s" x="40" y="250">de linhas</text>

  <!-- engine -->
  <rect x="214" y="110" width="170" height="110" rx="10" fill="#16201b" stroke="#5cc8d8"/>
  <text class="h" x="230" y="134">motor</text>
  <text class="s" x="230" y="156">ffuf / gobuster</text>
  <text class="s" x="230" y="170">ou laço de curl</text>
  <text class="b y" x="230" y="196">troca FUZZ</text>
  <text class="s" x="230" y="212">por cada palavra</text>

  <line class="ln" x1="174" y1="165" x2="214" y2="165" marker-end="url(#a)"/>

  <!-- request -->
  <rect x="214" y="250" width="170" height="78" rx="10" fill="#1d2a23" stroke="#2c3a33"/>
  <text class="s mut" x="230" y="274">GET /FUZZ  vira</text>
  <text class="b g" x="230" y="296">GET /admin</text>
  <text class="b g" x="230" y="314">GET /login ...</text>
  <line class="ln" x1="299" y1="220" x2="299" y2="250" marker-end="url(#a)"/>

  <!-- server -->
  <rect x="424" y="150" width="90" height="70" rx="10" fill="#1d2a23" stroke="#e8c46a"/>
  <text class="b y" x="440" y="180">servidor</text>
  <text class="s" x="440" y="200">web</text>
  <line class="ln" x1="384" y1="165" x2="424" y2="165" marker-end="url(#a)"/>

  <!-- outcomes -->
  <line class="ln" x1="514" y1="185" x2="560" y2="185" marker-end="url(#a)"/>

  <rect x="560" y="78" width="316" height="40" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="574" y="103">200</text>
  <text class="b" x="620" y="103">existe e foi entregue — ACHADO</text>

  <rect x="560" y="126" width="316" height="40" rx="8" fill="#16201b" stroke="#5cc8d8"/>
  <text class="b h" x="574" y="151">301/302</text>
  <text class="b" x="640" y="151">existe, mas redireciona (login)</text>

  <rect x="560" y="174" width="316" height="40" rx="8" fill="#16201b" stroke="#e8c46a"/>
  <text class="b y" x="574" y="199">403</text>
  <text class="b" x="620" y="199">existe, acesso/listagem negado</text>

  <rect x="560" y="222" width="316" height="40" rx="8" fill="#16201b" stroke="#3a4b42"/>
  <text class="b r" x="574" y="247">404</text>
  <text class="b mut" x="620" y="247">não existe — a base, você ignora</text>

  <!-- lesson -->
  <rect x="24" y="356" width="852" height="120" rx="10" fill="#16201b" stroke="#e8c46a"/>
  <text class="h y" x="40" y="382">A regra de ouro: calibre pela resposta de base</text>
  <text class="b" x="40" y="408">Antes de confiar nos códigos, peça um caminho que com certeza NÃO existe e veja o que o site responde.</text>
  <text class="b" x="40" y="428">No DVWA, o 404 vem sempre com 306 bytes: esse é o seu ruído de fundo, tudo que for diferente merece um olhar.</text>
  <text class="s" x="40" y="452">Sites que respondem 200 para qualquer caminho (soft 404) enganam o código — aí você filtra pelo TAMANHO da resposta</text>
  <text class="s" x="40" y="468">(-fs no ffuf) ou pelo número de palavras/linhas, não pelo status.</text>
</svg>
