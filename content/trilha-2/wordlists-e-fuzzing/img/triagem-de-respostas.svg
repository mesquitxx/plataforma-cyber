<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">O que existe é o que foge da resposta de base</title>
  <desc id="d">No alto, o laço do fuzzing: a wordlist entrega cada palavra à ferramenta (ffuf, gobuster ou um laço de curl), que troca FUZZ pela palavra, e o pedido vai ao servidor web, que devolve um código e um tamanho. No meio, a triagem, começando pela base: o pedido /naoexiste volta 404 com 306 bytes, e essa é a resposta de base, o ruído de fundo. Tudo que foge dela existe: /login.php volta 200 (existe e foi entregue, um achado), /index.php volta 302 (existe, mas manda para o login) e /config/ volta 403 (existe, mas o acesso foi negado). Embaixo, a armadilha: quando o site responde 200 até para o que não existe, o código engana; aí compara-se o tamanho. Respostas 200 com o mesmo tamanho da base são ruído; uma resposta 200 com tamanho diferente é um achado.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 15px; font-weight: 700; }
    .code { font-size: 13px; }
    .fz { font-size: 13px; font-weight: 700; fill: #facc15; }
    .s { font-size: 12px; fill: #94a3b8; }
    .th { font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .td { font-size: 13px; }
    .tdb { font-size: 13px; font-weight: 700; }
    .green { fill: #34d399; }
    .gray { fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">O que existe é o que foge da resposta de base</text>
  <text class="sub" x="30" y="60">Cada palavra vira um pedido. Primeiro meça o "não existe"; depois procure o que é diferente.</text>

  <!-- ===== Row 1: the loop ===== -->
  <!-- wordlist -->
  <rect data-graph-role="container" x="30" y="84" width="180" height="128" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="46" y="108">wordlist</text>
  <text class="code" x="46" y="132">login.php</text>
  <text class="code" x="46" y="152">index.php</text>
  <text class="code" x="46" y="172">config/</text>
  <text class="s" x="46" y="196">...milhares de linhas</text>

  <line x1="212" y1="148" x2="262" y2="148" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- tool -->
  <rect data-graph-role="container" x="266" y="84" width="300" height="128" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h" x="282" y="108">ferramenta</text>
  <text class="s" x="282" y="128">ffuf · gobuster · laço de curl</text>
  <rect x="282" y="142" width="268" height="54" rx="4" fill="#1e293b" stroke="#475569"/>
  <text class="code" x="296" y="163">GET /</text><text class="fz" x="335" y="163">FUZZ</text><text class="s" x="380" y="163">  vira...</text>
  <text class="code" x="296" y="185">GET /</text><text class="tdb" x="335" y="185">login.php</text>

  <line x1="568" y1="148" x2="618" y2="148" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- server -->
  <rect data-graph-role="container" x="622" y="84" width="308" height="128" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="638" y="108">servidor web</text>
  <text class="s" x="638" y="136">devolve, para cada pedido:</text>
  <text class="tdb" x="638" y="162">· um código  (200, 404...)</text>
  <text class="tdb" x="638" y="186">· um tamanho (em bytes)</text>

  <line x1="776" y1="214" x2="776" y2="246" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- ===== Row 2: triage ===== -->
  <rect data-graph-role="container" x="30" y="250" width="900" height="206" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="50" y="276">A triagem: compare cada resposta com a base</text>
  <text class="th" x="50" y="302">pedido</text>
  <text class="th" x="230" y="302">código</text>
  <text class="th" x="320" y="302">tamanho</text>
  <text class="th" x="440" y="302">o que quer dizer</text>
  <line x1="50" y1="310" x2="910" y2="310" stroke="#334155" stroke-width="1"/>

  <!-- base row (highlighted) -->
  <rect x="42" y="318" width="876" height="34" rx="5" fill="#1e293b" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text class="tdb gray" x="54" y="340">/naoexiste</text>
  <text class="tdb gray" x="230" y="340">404</text>
  <text class="tdb gray" x="320" y="340">306 bytes</text>
  <text class="tdb" x="440" y="340">1º passo: BASE = o "não existe" (ruído)</text>

  <!-- found rows -->
  <rect x="42" y="360" width="876" height="28" rx="4" fill="#06281d" stroke="#10b981" stroke-width="1"/>
  <text class="td" x="54" y="379">/login.php</text>
  <text class="tdb green" x="230" y="379">200</text>
  <text class="td" x="320" y="379">1342 bytes</text>
  <text class="td" x="440" y="379">existe e foi entregue: achado</text>

  <rect x="42" y="392" width="876" height="28" rx="4" fill="#06281d" stroke="#10b981" stroke-width="1"/>
  <text class="td" x="54" y="411">/index.php</text>
  <text class="tdb green" x="230" y="411">302</text>
  <text class="td" x="320" y="411">0 bytes</text>
  <text class="td" x="440" y="411">existe, mas manda para o login</text>

  <rect x="42" y="424" width="876" height="28" rx="4" fill="#06281d" stroke="#10b981" stroke-width="1"/>
  <text class="td" x="54" y="443">/config/</text>
  <text class="tdb green" x="230" y="443">403</text>
  <text class="td" x="320" y="443">309 bytes</text>
  <text class="td" x="440" y="443">existe, mas o acesso foi negado</text>

  <!-- ===== Row 3: the trap ===== -->
  <rect data-graph-role="container" x="30" y="476" width="900" height="128" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="50" y="502">Armadilha: o site responde 200 até para o que não existe</text>
  <text class="s" x="50" y="522">O código engana. Então compare o TAMANHO com o da base.</text>

  <rect x="42" y="532" width="560" height="28" rx="4" fill="#1e293b" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
  <text class="td gray" x="54" y="551">/naoexiste</text><text class="td gray" x="170" y="551">200</text><text class="td gray" x="220" y="551">mesmo tamanho da base</text>
  <text class="td gray" x="420" y="551">→ ruído, ignore</text>

  <rect x="42" y="566" width="560" height="28" rx="4" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="td" x="54" y="585">/backup.zip</text><text class="td" x="170" y="585">200</text><text class="tdb green" x="220" y="585">tamanho diferente</text>
  <text class="tdb green" x="420" y="585">→ existe: achado</text>

  <rect x="626" y="532" width="290" height="62" rx="6" fill="#06281d" stroke="#10b981" stroke-width="2"/>
  <text class="tdb green" x="771" y="558" text-anchor="middle">quando o código engana,</text>
  <text class="tdb green" x="771" y="580" text-anchor="middle">filtre pelo tamanho</text>

  <!-- legend -->
  <line x1="30" y1="620" x2="930" y2="620" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="634" width="16" height="16" rx="3" fill="#2a2205" stroke="#eab308" stroke-width="1.5"/>
  <text class="leg" x="54" y="646">FUZZ: lugar da palavra</text>
  <line x1="250" y1="642" x2="280" y2="642" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="leg" x="290" y="646">pedido / resposta</text>
  <rect x="470" y="634" width="16" height="16" rx="3" fill="#1e293b" stroke="#94a3b8" stroke-dasharray="3 3"/>
  <text class="leg" x="494" y="646">base: ruído de fundo</text>
  <rect x="700" y="634" width="16" height="16" rx="3" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="724" y="646">existe (foge da base)</text>
</svg>
