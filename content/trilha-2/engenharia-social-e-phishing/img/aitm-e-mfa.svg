<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" width="960" height="690" fill="#e2e8f0" role="img" aria-labelledby="t d">
  <title id="t">O site falso fica com o cookie — e entra sem senha nem código</title>
  <desc id="d">Diagrama de sequência com três colunas: a vítima, o site falso do atacante (valeverde-ti.example) no meio e o site verdadeiro (login.valeverde.example). Passo 1: a vítima digita a senha no site falso, que a repassa na hora ao site verdadeiro. Passo 2: o mesmo acontece com o código do MFA. Passo 3, o momento-chave: o site verdadeiro devolve o cookie de sessão, a prova de que a pessoa já está logada; o site falso guarda uma cópia e mostra à vítima uma tela normal, sem nada de errado. Passo 4, já sem a vítima: o atacante usa o cookie roubado no site verdadeiro. O que o atacante ganha: a conta da vítima já logada, sem saber a senha e sem precisar de novo código. Separada embaixo, a defesa: a passkey só responde ao endereço verdadeiro do site; no site falso ela se recusa, e não há código digitável para repassar.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'SF Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .subtitle { font-size: 12px; fill: #94a3b8; }
    .h { font-size: 13px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #94a3b8; }
    .msg { font-size: 12.5px; font-weight: 700; fill: #cbd5e1; }
    .msgr { font-size: 13px; font-weight: 700; fill: #f87171; }
    .note { font-size: 11px; fill: #94a3b8; }
    .res1 { font-size: 14px; font-weight: 700; fill: #fca5a5; }
    .res2 { font-size: 13px; }
    .def1 { font-size: 12px; font-weight: 700; fill: #6ee7b7; }
    .def2 { font-size: 11.5px; fill: #a7c4b5; }
    .leg { font-size: 11.5px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="690" fill="url(#bg-grad)"/>

  <text class="title" x="480" y="40" text-anchor="middle">O site falso fica com o cookie — e entra sem senha nem código</text>
  <text class="subtitle" x="480" y="62" text-anchor="middle">phishing AiTM: o site falso fica no meio e repassa tudo em tempo real</text>

  <!-- participants -->
  <rect x="35" y="84" width="230" height="52" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="150" y="106" text-anchor="middle">VÍTIMA</text>
  <text class="sub" x="150" y="125" text-anchor="middle">acha que está no site certo</text>

  <rect x="365" y="84" width="230" height="52" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="h" x="480" y="106" text-anchor="middle" fill="#f87171">SITE FALSO (atacante)</text>
  <text class="sub" x="480" y="125" text-anchor="middle">valeverde-ti.example</text>

  <rect x="695" y="84" width="230" height="52" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="810" y="106" text-anchor="middle">SITE VERDADEIRO</text>
  <text class="sub" x="810" y="125" text-anchor="middle">login.valeverde.example</text>

  <!-- lifelines -->
  <line x1="150" y1="136" x2="150" y2="356" stroke="#334155" stroke-dasharray="4 4"/>
  <line x1="480" y1="136" x2="480" y2="440" stroke="#7f1d1d" stroke-dasharray="4 4"/>
  <line x1="810" y1="136" x2="810" y2="440" stroke="#334155" stroke-dasharray="4 4"/>

  <!-- step 1 -->
  <text class="msg" x="315" y="174" text-anchor="middle">1  senha</text>
  <line x1="154" y1="184" x2="472" y2="184" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text class="note" x="645" y="174" text-anchor="middle">repassa na hora</text>
  <line x1="488" y1="184" x2="802" y2="184" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- step 2 -->
  <text class="msg" x="315" y="226" text-anchor="middle">2  código do MFA</text>
  <line x1="154" y1="236" x2="472" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text class="note" x="645" y="226" text-anchor="middle">repassa na hora</text>
  <line x1="488" y1="236" x2="802" y2="236" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- step 3: key moment -->
  <text class="msgr" x="645" y="280" text-anchor="middle">3  cookie de sessão</text>
  <line x1="806" y1="290" x2="488" y2="290" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text class="note" x="645" y="308" text-anchor="middle">= prova de que já está logado</text>
  <text class="msg" x="315" y="280" text-anchor="middle">tela normal</text>
  <line x1="476" y1="290" x2="158" y2="290" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text class="note" x="315" y="308" text-anchor="middle">nada parece errado</text>
  <rect x="395" y="320" width="170" height="28" rx="14" fill="#2a0f12" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="h" x="480" y="339" text-anchor="middle" fill="#fca5a5">guarda uma cópia!</text>

  <!-- step 4 -->
  <text class="note" x="40" y="392">depois, já sem a vítima:</text>
  <text class="msgr" x="645" y="392" text-anchor="middle">4  usa o cookie roubado</text>
  <line x1="484" y1="404" x2="802" y2="404" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>

  <!-- result -->
  <rect x="40" y="448" width="880" height="62" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="res1" x="480" y="473" text-anchor="middle">O que o atacante ganha: a conta da vítima, já logada</text>
  <text class="res2" x="480" y="496" text-anchor="middle">sem saber a senha e sem precisar de um novo código</text>

  <!-- defense (secondary, separated) -->
  <rect x="40" y="540" width="880" height="80" rx="6" fill="#06231a" stroke="#10b981" stroke-dasharray="5 4"/>
  <text class="def1" x="60" y="564">Defesa (seção 8): passkey (FIDO2/WebAuthn)</text>
  <text class="def2" x="60" y="586">A passkey só responde ao endereço verdadeiro do site. No site falso ela se recusa,</text>
  <text class="def2" x="60" y="606">e não existe código digitável para o atacante repassar.</text>

  <!-- legend -->
  <line x1="60" y1="657" x2="92" y2="657" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <text class="leg" x="102" y="661">repassado normalmente</text>
  <line x1="320" y1="657" x2="352" y2="657" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text class="leg" x="362" y="661">atacante / roubo</text>
  <rect x="540" y="650" width="14" height="14" rx="3" fill="#06231a" stroke="#10b981" stroke-dasharray="3 2"/>
  <text class="leg" x="562" y="661">defesa</text>
</svg>
