<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">SYN scan e connect scan: onde os dois se separam</title>
  <desc id="d">Em cima, dois painéis lado a lado mostram uma porta aberta. À esquerda, o SYN scan (sudo nmap -sS): o Kali manda SYN, o alvo responde SYN/ACK e, no passo 3, destacado, o kernel do Kali manda RST, de modo que a conexão nunca se completa; resultado open. À direita, o connect scan (nmap -sT): SYN, SYN/ACK e, no passo 3, destacado, o Kali manda ACK e completa a conexão, que o programa na porta vê; no passo 4 o Kali manda RST para derrubá-la; resultado open. Embaixo, porta fechada e porta filtrada, iguais nos dois scans: na fechada, o alvo responde RST/ACK ao SYN, resultado closed; na filtrada, o SYN é descartado no caminho e não volta nada, resultado filtered.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 15px; font-weight: 700; }
    .cmd { font-size: 12px; fill: #94a3b8; }
    .lbl { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #94a3b8; }
    .actor { font-size: 13px; font-weight: 700; }
    .blue { fill: #60a5fa; }
    .green { fill: #34d399; }
    .red { fill: #f87171; }
    .gold { fill: #facc15; }
    .gray { fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef4444"/></marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">Porta aberta: o 3º pacote é onde os dois scans se separam</text>
  <text class="sub" x="30" y="60">Os dois ouvem o mesmo SYN/ACK ("aberta!"). O SYN scan corta ali; o connect scan completa a conexão.</text>

  <!-- ===== Left: SYN scan ===== -->
  <rect data-graph-role="container" x="30" y="80" width="440" height="330" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="50" y="106">SYN scan</text>
  <text class="cmd" x="140" y="106">sudo nmap -sS · meia conexão</text>

  <rect x="62" y="122" width="76" height="26" rx="5" fill="#172554" stroke="#3b82f6"/>
  <text class="actor" x="100" y="140" text-anchor="middle">Kali</text>
  <rect x="362" y="122" width="76" height="26" rx="5" fill="#1e293b" stroke="#475569"/>
  <text class="actor" x="400" y="140" text-anchor="middle">alvo</text>
  <line x1="100" y1="148" x2="100" y2="352" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="400" y1="148" x2="400" y2="352" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text class="lbl blue" x="250" y="176" text-anchor="middle">1 · SYN</text>
  <line x1="102" y1="184" x2="396" y2="184" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="lbl green" x="250" y="216" text-anchor="middle">2 · SYN/ACK  "aberta!"</text>
  <line x1="398" y1="224" x2="104" y2="224" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect data-graph-role="container" x="46" y="244" width="408" height="76" rx="6" fill="#1c1a0b" stroke="#facc15" stroke-width="2"/>
  <text class="lbl red" x="250" y="266" text-anchor="middle">3 · RST (o kernel do Kali)</text>
  <line x1="102" y1="276" x2="396" y2="276" stroke="#ef4444" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text class="lbl gold" x="250" y="306" text-anchor="middle">corta: a conexão nunca se completa</text>

  <text class="lbl green" x="50" y="386">→ open</text>
  <text class="s" x="120" y="386">exige root (sudo)</text>

  <!-- ===== Right: connect scan ===== -->
  <rect data-graph-role="container" x="490" y="80" width="440" height="330" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="510" y="106">connect scan</text>
  <text class="cmd" x="636" y="106">nmap -sT · conexão completa</text>

  <rect x="522" y="122" width="76" height="26" rx="5" fill="#172554" stroke="#3b82f6"/>
  <text class="actor" x="560" y="140" text-anchor="middle">Kali</text>
  <rect x="822" y="122" width="76" height="26" rx="5" fill="#1e293b" stroke="#475569"/>
  <text class="actor" x="860" y="140" text-anchor="middle">alvo</text>
  <line x1="560" y1="148" x2="560" y2="364" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="860" y1="148" x2="860" y2="364" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text class="lbl blue" x="710" y="176" text-anchor="middle">1 · SYN</text>
  <line x1="562" y1="184" x2="856" y2="184" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="lbl green" x="710" y="216" text-anchor="middle">2 · SYN/ACK  "aberta!"</text>
  <line x1="858" y1="224" x2="564" y2="224" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <rect data-graph-role="container" x="506" y="244" width="408" height="76" rx="6" fill="#1c1a0b" stroke="#facc15" stroke-width="2"/>
  <text class="lbl blue" x="710" y="266" text-anchor="middle">3 · ACK</text>
  <line x1="562" y1="276" x2="856" y2="276" stroke="#3b82f6" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <text class="lbl gold" x="710" y="306" text-anchor="middle">conexão completa: o programa vê</text>

  <text class="lbl red" x="710" y="342" text-anchor="middle">4 · RST derruba a conexão</text>
  <line x1="562" y1="352" x2="856" y2="352" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>

  <text class="lbl green" x="510" y="390">→ open</text>
  <text class="s" x="580" y="390">sem precisar de root</text>

  <!-- ===== Bottom: closed / filtered ===== -->
  <text class="h" x="30" y="446">Porta fechada ou filtrada: os dois scans veem igual</text>

  <rect data-graph-role="container" x="30" y="460" width="440" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="50" y="484">fechada</text>
  <text class="s" x="80" y="510" text-anchor="middle">Kali</text>
  <text class="s" x="290" y="510" text-anchor="middle">alvo</text>
  <line x1="80" y1="516" x2="80" y2="568" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="290" y1="516" x2="290" y2="568" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="s blue" x="185" y="526" text-anchor="middle">SYN</text>
  <line x1="82" y1="532" x2="286" y2="532" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text class="s red" x="185" y="552" text-anchor="middle">RST/ACK  "não"</text>
  <line x1="288" y1="558" x2="84" y2="558" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text class="lbl" x="316" y="530">→ closed</text>
  <text class="s" x="316" y="550">o host existe,</text>
  <text class="s" x="316" y="566">ninguém escuta</text>

  <rect data-graph-role="container" x="490" y="460" width="440" height="120" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="510" y="484">filtrada</text>
  <text class="s" x="540" y="510" text-anchor="middle">Kali</text>
  <text class="s" x="750" y="510" text-anchor="middle">alvo</text>
  <line x1="540" y1="516" x2="540" y2="568" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="750" y1="516" x2="750" y2="568" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="s blue" x="600" y="526" text-anchor="middle">SYN</text>
  <line x1="542" y1="532" x2="650" y2="532" stroke="#3b82f6" stroke-width="2"/>
  <text class="lbl gray" x="656" y="537">✕</text>
  <line x1="680" y1="532" x2="748" y2="532" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="s gray" x="645" y="560" text-anchor="middle">descartado: não volta nada</text>
  <text class="lbl" x="776" y="530">→ filtered</text>
  <text class="s" x="776" y="550">não dá para</text>
  <text class="s" x="776" y="566">saber</text>

  <!-- legend -->
  <line x1="30" y1="602" x2="930" y2="602" stroke="#334155" stroke-width="1"/>
  <line x1="30" y1="628" x2="56" y2="628" stroke="#3b82f6" stroke-width="2.5"/>
  <text class="leg" x="64" y="632">Kali envia</text>
  <line x1="170" y1="628" x2="196" y2="628" stroke="#10b981" stroke-width="2.5"/>
  <text class="leg" x="204" y="632">alvo: "aberta"</text>
  <line x1="340" y1="628" x2="366" y2="628" stroke="#ef4444" stroke-width="2.5"/>
  <text class="leg" x="374" y="632">RST (corta / recusa)</text>
  <line x1="545" y1="628" x2="571" y2="628" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="leg" x="579" y="632">sem resposta</text>
  <rect x="712" y="620" width="16" height="16" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="736" y="632">onde os dois diferem</text>
</svg>
