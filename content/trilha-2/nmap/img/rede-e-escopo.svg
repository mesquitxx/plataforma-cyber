<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">A rede de alvos e o escopo do teste</title>
  <desc id="d">No centro, o Kali, a sua attack box, ligado a duas redes. À esquerda, pela eth0, a desktop_net, apagada e com borda tracejada vermelha: FORA do escopo, não varrer. Lá fica o guacd, que leva a tela do Kali até o seu navegador; é infraestrutura da plataforma e não está na carta de autorização. À direita, pela eth1, a lab_net, com borda verde: NO escopo, autorizada pela carta. Lá ficam o dvwa, porta 80, Apache e PHP, e o juice-shop, porta 3000, Node.js. Embaixo, em destaque: o escopo é a rede, não o endereço; os endereços do seu lab serão outros, então descubra qual interface está na lab_net antes de varrer.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #94a3b8; }
    .green { fill: #34d399; }
    .red { fill: #f87171; }
    .blue { fill: #60a5fa; }
    .gold { fill: #facc15; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="540" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">O Kali está em duas redes, mas só a lab_net está no escopo</text>
  <text class="sub" x="30" y="60">Estar ao seu alcance não coloca nada no escopo: vale o que está na carta de autorização.</text>

  <!-- ===== out of scope: desktop_net ===== -->
  <g opacity="0.7">
    <rect x="30" y="86" width="280" height="290" rx="6" fill="#1a1012" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text class="h" x="50" y="114">desktop_net</text>
    <rect x="50" y="128" width="218" height="26" rx="13" fill="#3b0d0d" stroke="#ef4444"/>
    <text class="b red" x="159" y="146" text-anchor="middle">FORA do escopo</text>
    <rect x="55" y="176" width="230" height="84" rx="6" fill="#0f172a" stroke="#475569"/>
    <text class="b" x="73" y="202">guacd</text>
    <text class="s" x="73" y="224">leva a tela do Kali</text>
    <text class="s" x="73" y="242">até o seu navegador</text>
    <text class="s" x="50" y="292">infraestrutura da plataforma,</text>
    <text class="s" x="50" y="310">não está na carta</text>
    <text class="h red" x="50" y="350">✕ não varrer</text>
  </g>

  <!-- ===== kali ===== -->
  <rect x="380" y="166" width="200" height="130" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="2"/>
  <text class="h blue" x="480" y="196" text-anchor="middle">kali</text>
  <text class="s" x="480" y="216" text-anchor="middle">a sua attack box</text>
  <text class="b" x="400" y="252">eth0</text>
  <text class="s" x="446" y="252">→ desktop_net</text>
  <text class="b" x="400" y="278">eth1</text>
  <text class="s" x="446" y="278">→ lab_net</text>

  <line x1="380" y1="248" x2="310" y2="248" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="580" y1="274" x2="650" y2="274" stroke="#10b981" stroke-width="3"/>

  <!-- ===== in scope: lab_net ===== -->
  <rect x="650" y="86" width="280" height="290" rx="6" fill="#06231a" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
  <text class="h" x="670" y="114">lab_net</text>
  <rect x="670" y="128" width="218" height="26" rx="13" fill="#064e3b" stroke="#10b981"/>
  <text class="b green" x="779" y="146" text-anchor="middle">NO escopo</text>
  <rect x="675" y="172" width="230" height="84" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text class="b" x="693" y="198">dvwa</text>
  <text class="s" x="693" y="220">porta 80</text>
  <text class="s" x="693" y="238">Apache + PHP</text>
  <rect x="675" y="270" width="230" height="84" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text class="b" x="693" y="296">juice-shop</text>
  <text class="s" x="693" y="318">porta 3000</text>
  <text class="s" x="693" y="336">Node.js</text>

  <!-- ===== key callout ===== -->
  <rect x="30" y="400" width="900" height="70" rx="8" fill="#1c1a0b" stroke="#facc15" stroke-width="2"/>
  <text class="b gold" x="50" y="428">O escopo é a REDE, não o endereço.</text>
  <text class="s" x="50" y="452">Os endereços do seu lab serão outros. Antes de varrer, descubra qual interface está na lab_net.</text>

  <!-- legend -->
  <rect x="30" y="500" width="16" height="16" rx="3" fill="#06231a" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="54" y="512">pode varrer (no escopo)</text>
  <rect x="270" y="500" width="16" height="16" rx="3" fill="#1a1012" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="leg" x="294" y="512">não pode varrer (fora do escopo)</text>
  <rect x="570" y="500" width="16" height="16" rx="3" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="594" y="512">a sua máquina</text>
  <rect x="740" y="500" width="16" height="16" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="764" y="512">regra principal</text>
</svg>
