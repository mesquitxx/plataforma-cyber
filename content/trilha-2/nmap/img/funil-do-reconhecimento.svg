<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">O funil do reconhecimento ativo</title>
  <desc id="d">Funil com cinco faixas, cada uma mais estreita que a anterior. Escopo: o que posso tocar, que entrega as redes e máquinas autorizadas. Quem está vivo (nmap -sn): as máquinas que respondem. Que portas estão abertas (nmap -p-): as portas abertas de cada máquina. O que roda em cada porta (nmap -sV): o programa e a versão. O que mais dá para descobrir (nmap --script): detalhes de cada serviço. No fim do funil, em destaque, a saída: alvos priorizados para atacar. À direita, uma seta mostra que o barulho na rede e o risco para o alvo aumentam a cada etapa.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 13px; fill: #94a3b8; }
    .q { font-size: 14px; font-weight: 700; }
    .o { font-size: 12px; fill: #94a3b8; }
    .cmd { fill: #60a5fa; }
    .n { font-size: 14px; font-weight: 700; fill: #60a5fa; }
    .gold { fill: #facc15; }
    .orange { fill: #fb923c; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="noise" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="1"/>
    </linearGradient>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#f97316"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#3b82f6"/>
    </marker>
    <filter id="glow-gold" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="580" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Reconhecimento ativo é um funil</text>
  <text class="sub" x="40" y="62">Cada pergunta usa a resposta da anterior, até sobrar uma lista curta de alvos.</text>

  <!-- 0. scope -->
  <rect x="60" y="84" width="700" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="n" x="80" y="108">0</text>
  <text class="q" x="104" y="108">O que eu posso tocar? (o escopo)</text>
  <text class="o" x="104" y="129">carta de autorização → redes e máquinas permitidas</text>

  <!-- 1. alive -->
  <rect x="100" y="152" width="620" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="n" x="120" y="176">1</text>
  <text class="q" x="144" y="176">Quem está vivo?</text>
  <text class="o" x="144" y="197"><tspan class="cmd">nmap -sn</tspan> → máquinas que respondem</text>

  <!-- 2. ports -->
  <rect x="140" y="220" width="540" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="n" x="160" y="244">2</text>
  <text class="q" x="184" y="244">Que portas estão abertas?</text>
  <text class="o" x="184" y="265"><tspan class="cmd">nmap -p-</tspan> → portas abertas de cada máquina</text>

  <!-- 3. services -->
  <rect x="180" y="288" width="460" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="n" x="200" y="312">3</text>
  <text class="q" x="224" y="312">O que roda em cada porta?</text>
  <text class="o" x="224" y="333"><tspan class="cmd">nmap -sV</tspan> → programa e versão</text>

  <!-- 4. scripts -->
  <rect x="220" y="356" width="380" height="58" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="n" x="240" y="380">4</text>
  <text class="q" x="264" y="380">O que mais dá para saber?</text>
  <text class="o" x="264" y="401"><tspan class="cmd">nmap --script</tspan> → detalhes</text>

  <!-- output -->
  <line x1="410" y1="416" x2="410" y2="440" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="235" y="446" width="350" height="56" rx="8" fill="#1c1a0b" stroke="#facc15" stroke-width="2.2" filter="url(#glow-gold)"/>
  <text class="q gold" x="410" y="470" text-anchor="middle">Alvos priorizados para atacar</text>
  <text class="o" x="410" y="490" text-anchor="middle">o que vai para as próximas fases</text>

  <!-- noise arrow -->
  <rect data-graph-role="decoration" x="838" y="96" width="14" height="300" rx="7" fill="url(#noise)"/>
  <line x1="845" y1="380" x2="845" y2="420" stroke="#f97316" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <text class="leg orange" x="845" y="86" text-anchor="middle">pouco barulho</text>
  <text class="q orange" x="845" y="446" text-anchor="middle">mais barulho</text>
  <text class="o" x="845" y="464" text-anchor="middle">e mais risco</text>
  <text class="o" x="845" y="480" text-anchor="middle">para o alvo</text>

  <!-- legend -->
  <line x1="40" y1="528" x2="920" y2="528" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="544" width="14" height="14" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="62" y="556">etapa do reconhecimento</text>
  <rect x="290" y="544" width="14" height="14" rx="3" fill="#1c1a0b" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="312" y="556">o que você ganha no fim</text>
  <rect x="540" y="544" width="14" height="14" rx="3" fill="#f97316"/>
  <text class="leg" x="562" y="556">barulho na rede e risco para o alvo</text>
</svg>
