<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img" aria-labelledby="t d">
  <title id="t">O funil da enumeração: de "estou dentro" a "este é o vetor"</title>
  <desc id="d">Um funil vertical que estreita de cima para baixo. No topo, o foothold (conta de baixo privilégio). Abaixo, quatro faixas cada vez mais estreitas: 1 Coletar tudo (a mais larga), 2 Ler e reduzir o ruído, 3 Triar pelas quatro classes, 4 Candidatos priorizados (a mais estreita). Do fundo sai uma seta para a caixa verde do módulo 6.3, explorar o vetor escolhido. Uma régua à esquerda marca a passagem de "muito" para "pouco".</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 19px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #94a3b8; }
    .stage { font-size: 15px; font-weight: 700; fill: #60a5fa; }
    .item { font-size: 11.5px; fill: #cbd5e1; }
    .foot { font-size: 13px; font-weight: 700; }
    .res { font-size: 15px; font-weight: 700; fill: #10b981; }
    .guide { font-size: 11px; fill: #64748b; font-weight: 700; }
    .leg { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/></marker>
    <marker id="arrow-guide" markerWidth="8" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="620" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">O funil da enumeração — de "estou dentro" a "este é o vetor"</text>
  <text class="sub" x="40" y="62">Colete tudo no alvo e vá estreitando até sobrar poucos vetores para explorar.</text>

  <!-- left ruler: muito -> pouco -->
  <path d="M30,110 L30,478" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-guide)"/>
  <text class="guide" x="24" y="122" text-anchor="end" transform="rotate(-90 24 122)">muito</text>
  <text class="guide" x="24" y="470" text-anchor="start" transform="rotate(-90 24 470)">pouco</text>

  <!-- foothold (neutral start) -->
  <rect x="245" y="78" width="470" height="44" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="foot" x="480" y="98" text-anchor="middle">FOOTHOLD — você está dentro, mas sem poder</text>
  <text class="sub" x="480" y="114" text-anchor="middle">ex.: www-data, daemon · executa comando, não manda</text>
  <path d="M480,122 L480,140" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- funnel band 1: COLETAR (widest) -->
  <polygon points="70,148 890,148 806,230 154,230" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="176" text-anchor="middle">1 · COLETAR tudo</text>
  <text class="item" x="480" y="198" text-anchor="middle">varrer todas as superfícies do alvo, à mão e com LinPEAS / pspy</text>
  <text class="item" x="480" y="216" text-anchor="middle" fill="#94a3b8">contexto · SUID · sudo · capabilities · cron · graváveis · credenciais · kernel · rede</text>

  <!-- funnel band 2: LER -->
  <polygon points="154,232 806,232 722,310 238,310" fill="#122036" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="262" text-anchor="middle">2 · LER e reduzir o ruído</text>
  <text class="item" x="480" y="286" text-anchor="middle">ler cada achado e calar os erros — não olhar só o vermelho</text>

  <!-- funnel band 3: TRIAR -->
  <polygon points="238,312 722,312 638,390 322,390" fill="#111d31" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="342" text-anchor="middle">3 · TRIAR pelas 4 classes</text>
  <text class="item" x="480" y="366" text-anchor="middle">má config · software vulnerável · credenciais · abuso de recurso</text>

  <!-- funnel band 4: CANDIDATOS (narrowest) -->
  <polygon points="322,392 638,392 592,470 368,470" fill="#101a2b" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="422" text-anchor="middle">4 · CANDIDATOS</text>
  <text class="item" x="480" y="444" text-anchor="middle">poucos vetores, os mais confiáveis</text>

  <!-- exit to 6.3 -->
  <path d="M480,470 L480,496" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <rect x="300" y="500" width="360" height="52" rx="6" fill="#06281d" stroke="#10b981" stroke-width="2"/>
  <text class="res" x="480" y="531" text-anchor="middle">→ 6.3: explorar o vetor escolhido</text>

  <!-- legend -->
  <rect x="700" y="500" width="14" height="14" rx="3" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="722" y="511">etapas da enumeração</text>
  <rect x="700" y="524" width="14" height="14" rx="3" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="722" y="535">resultado: o vetor</text>
</svg>
