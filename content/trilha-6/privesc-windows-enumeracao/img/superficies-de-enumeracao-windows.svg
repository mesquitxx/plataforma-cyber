<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">As tres superficies de enumeracao no Windows e o cruzamento que vira vetor</title>
  <desc id="d">A caixa VOCE a esquerda, uma conta de servico de baixo privilegio. Dela saem tres faixas, uma por superficie que a enumeracao le. Em cada faixa, uma caixa verde mostra o que voce controla e uma caixa vermelha mostra o que tem poder, unidas por um sinal de cruzamento dourado. Faixa 1 servicos, lidos com sc e accesschk: voce controla a config ou o programa do servico; o poder e que ele roda como LocalSystem. Faixa 2 privilegios do token, lidos com whoami /priv: voce tem um privilegio especial ligado; o poder e que ele vale quase como SYSTEM. Faixa 3 permissoes de arquivo e registro, lidas com icacls e reg query: voce altera um arquivo ou chave; o poder e que o SYSTEM le ou executa aquilo. As tres faixas convergem para a caixa dourada CANDIDATO A VETOR. Dela sai uma seta tracejada secundaria para o modulo 6.5, explorar.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #94a3b8; }
    .lane { font-size: 13px; font-weight: 700; }
    .cmd { font-size: 10.5px; fill: #64748b; }
    .ctl { font-size: 11.5px; fill: #6ee7b7; }
    .pow { font-size: 11.5px; fill: #fca5a5; }
    .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.06em; }
    .you { font-size: 15px; font-weight: 700; }
    .cand { font-size: 15px; font-weight: 700; fill: #facc15; }
    .next { font-size: 11.5px; fill: #94a3b8; }
    .leg { font-size: 11.5px; fill: #94a3b8; }
    .x { font-size: 17px; font-weight: 700; fill: #facc15; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#64748b"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#facc15"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="38">O vetor mora no cruzamento: o que VOCE controla x o que tem PODER</text>
  <text class="sub" x="40" y="59">Enumerar e ler as tres superficies e, em cada achado, perguntar: eu controlo isto, e isto tem poder?</text>

  <!-- VOCE -->
  <rect x="24" y="252" width="128" height="96" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text class="you" x="88" y="290" text-anchor="middle">VOCE</text>
  <text class="sub" x="88" y="312" text-anchor="middle">conta de</text>
  <text class="sub" x="88" y="328" text-anchor="middle">servico</text>

  <!-- connectors VOCE -> lanes -->
  <path d="M152,280 C190,220 200,170 230,150" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M152,300 L222,300" stroke="#475569" stroke-width="1.5" fill="none"/>
  <path d="M152,320 C190,380 200,430 230,450" stroke="#475569" stroke-width="1.5" fill="none"/>

  <!-- ===== LANE 1: SERVICOS ===== -->
  <text class="lane" x="232" y="108">1 - SERVICOS</text>
  <text class="cmd" x="356" y="108">le com: sc qc, accesschk</text>
  <rect x="232" y="122" width="236" height="62" rx="6" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="tag" x="246" y="140" fill="#6ee7b7">VOCE CONTROLA</text>
  <text class="ctl" x="246" y="160">a configuracao ou o</text>
  <text class="ctl" x="246" y="176">programa do servico</text>
  <text class="x" x="492" y="159" text-anchor="middle">x</text>
  <rect x="516" y="122" width="236" height="62" rx="6" fill="#2a0f0f" stroke="#ef4444" stroke-width="1.5"/>
  <text class="tag" x="530" y="140" fill="#fca5a5">TEM PODER</text>
  <text class="pow" x="530" y="160">o servico roda como</text>
  <text class="pow" x="530" y="176">LocalSystem (= SYSTEM)</text>

  <!-- ===== LANE 2: TOKEN ===== -->
  <text class="lane" x="232" y="250">2 - PRIVILEGIOS DO TOKEN</text>
  <text class="cmd" x="440" y="250">le com: whoami /priv</text>
  <rect x="232" y="264" width="236" height="62" rx="6" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="tag" x="246" y="282" fill="#6ee7b7">VOCE CONTROLA</text>
  <text class="ctl" x="246" y="302">um privilegio especial</text>
  <text class="ctl" x="246" y="318">ligado no seu token</text>
  <text class="x" x="492" y="301" text-anchor="middle">x</text>
  <rect x="516" y="264" width="236" height="62" rx="6" fill="#2a0f0f" stroke="#ef4444" stroke-width="1.5"/>
  <text class="tag" x="530" y="282" fill="#fca5a5">TEM PODER</text>
  <text class="pow" x="530" y="302">SeImpersonate / SeBackup</text>
  <text class="pow" x="530" y="318">valem quase como SYSTEM</text>

  <!-- ===== LANE 3: PERMISSOES ===== -->
  <text class="lane" x="232" y="392">3 - ARQUIVO E REGISTRO</text>
  <text class="cmd" x="432" y="392">le com: icacls, reg query</text>
  <rect x="232" y="406" width="236" height="62" rx="6" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="tag" x="246" y="424" fill="#6ee7b7">VOCE CONTROLA</text>
  <text class="ctl" x="246" y="444">um arquivo ou uma</text>
  <text class="ctl" x="246" y="460">chave do registro</text>
  <text class="x" x="492" y="443" text-anchor="middle">x</text>
  <rect x="516" y="406" width="236" height="62" rx="6" fill="#2a0f0f" stroke="#ef4444" stroke-width="1.5"/>
  <text class="tag" x="530" y="424" fill="#fca5a5">TEM PODER</text>
  <text class="pow" x="530" y="444">o SYSTEM le ou executa</text>
  <text class="pow" x="530" y="460">aquele arquivo / chave</text>

  <!-- converge to candidate -->
  <path d="M752,153 C 800,180 812,250 816,286" stroke="#facc15" stroke-width="1.5" fill="none"/>
  <path d="M752,295 L812,295" stroke="#facc15" stroke-width="1.5" fill="none"/>
  <path d="M752,437 C 800,410 812,340 816,304" stroke="#facc15" stroke-width="1.5" fill="none"/>

  <!-- CANDIDATO -->
  <rect x="814" y="252" width="122" height="96" rx="6" fill="#2a2206" stroke="#facc15" stroke-width="2"/>
  <text class="cand" x="875" y="286" text-anchor="middle">CANDIDATO</text>
  <text class="cand" x="875" y="306" text-anchor="middle">A VETOR</text>
  <text class="sub" x="875" y="328" text-anchor="middle">controle</text>
  <text class="sub" x="875" y="342" text-anchor="middle">x poder</text>

  <!-- next: 6.5 (secondary, dashed) -->
  <path d="M875,348 L875,392" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="790" y="400" width="170" height="40" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text class="next" x="875" y="425" text-anchor="middle">modulo 6.5: explorar</text>

  <!-- legend -->
  <rect x="40" y="520" width="14" height="14" rx="3" fill="#06281d" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="62" y="531">o que VOCE controla (leitura)</text>
  <rect x="300" y="520" width="14" height="14" rx="3" fill="#2a0f0f" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="322" y="531">o que tem PODER</text>
  <rect x="500" y="520" width="14" height="14" rx="3" fill="#2a2206" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="522" y="531">o cruzamento = o vetor</text>
  <text class="leg" x="40" y="558" fill="#64748b">Enumerar e so LER o que ja e legivel; explorar o candidato e o modulo 6.5.</text>
</svg>
