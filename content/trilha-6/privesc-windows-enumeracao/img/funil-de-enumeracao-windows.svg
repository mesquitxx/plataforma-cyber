<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="t d">
  <title id="t">O funil da enumeracao no Windows: de "estou dentro" a "este e o vetor"</title>
  <desc id="d">Um funil vertical que estreita de cima para baixo. No topo, o foothold: uma conta de servico de baixo privilegio, voce executa comando mas sem poder. Abaixo, quatro faixas cada vez mais estreitas. Faixa 1 COLETAR tudo, a mais larga: contexto e patch, privilegios do token, servicos, permissoes, tarefas e credenciais, a mao e com WinPEAS, Seatbelt, PowerUp e WES-NG. Faixa 2 LER e reduzir o ruido: ler a legenda de cores do WinPEAS e lembrar que o Defender e o AMSI pegam as ferramentas. Faixa 3 TRIAR pelas quatro classes do 6.1: ma configuracao, software vulneravel, credenciais, abuso de recurso. Faixa 4 CANDIDATOS priorizados, a mais estreita: por confiabilidade, ruido e estabilidade. Do fundo sai uma seta para a caixa dourada do modulo 6.5, explorar o vetor escolhido. Uma regua a esquerda marca a passagem de muito para pouco.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #94a3b8; }
    .stage { font-size: 15px; font-weight: 700; fill: #60a5fa; }
    .item { font-size: 11.5px; fill: #cbd5e1; }
    .foot { font-size: 13px; font-weight: 700; }
    .res { font-size: 14px; font-weight: 700; fill: #facc15; }
    .guide { font-size: 11px; fill: #64748b; font-weight: 700; }
    .leg { font-size: 11px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-blue" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#60a5fa"/></marker>
    <marker id="arrow-gold" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#facc15"/></marker>
    <marker id="arrow-guide" markerWidth="8" markerHeight="7" refX="6.5" refY="3.5" orient="auto"><polygon points="0 0, 8 3.5, 0 7" fill="#64748b"/></marker>
  </defs>
  <rect width="960" height="640" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">O funil da enumeracao no Windows — de "estou dentro" a "este e o vetor"</text>
  <text class="sub" x="40" y="62">Colete tudo no host e va estreitando ate sobrar poucos vetores para explorar.</text>

  <!-- left ruler: muito -> pouco -->
  <path d="M30,120 L30,498" stroke="#475569" stroke-width="1.5" fill="none" marker-end="url(#arrow-guide)"/>
  <text class="guide" x="24" y="132" text-anchor="end" transform="rotate(-90 24 132)">muito</text>
  <text class="guide" x="24" y="490" text-anchor="start" transform="rotate(-90 24 490)">pouco</text>

  <!-- foothold -->
  <rect x="235" y="80" width="490" height="46" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text class="foot" x="480" y="101" text-anchor="middle">FOOTHOLD — conta de servico de baixo privilegio</text>
  <text class="sub" x="480" y="118" text-anchor="middle">voce executa comando, mas sem poder</text>
  <path d="M480,126 L480,146" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/>

  <!-- band 1: COLETAR (widest) -->
  <polygon points="70,152 890,152 806,246 154,246" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="180" text-anchor="middle">1 - COLETAR tudo</text>
  <text class="item" x="480" y="202" text-anchor="middle">contexto e patch · token · servicos · permissoes · tarefas · credenciais</text>
  <text class="item" x="480" y="222" text-anchor="middle" fill="#94a3b8">a mao (binarios nativos) + WinPEAS · Seatbelt · PowerUp · WES-NG</text>

  <!-- band 2: LER -->
  <polygon points="154,248 806,248 722,326 238,326" fill="#122036" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="278" text-anchor="middle">2 - LER e reduzir o ruido</text>
  <text class="item" x="480" y="302" text-anchor="middle">ler a legenda (RED/YELLOW primeiro) · Defender e AMSI pegam as ferramentas</text>

  <!-- band 3: TRIAR -->
  <polygon points="238,328 722,328 638,406 322,406" fill="#111d31" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="358" text-anchor="middle">3 - TRIAR pelas 4 classes (6.1)</text>
  <text class="item" x="480" y="382" text-anchor="middle">ma config · software vulneravel · credenciais · abuso de recurso</text>

  <!-- band 4: CANDIDATOS (narrowest) -->
  <polygon points="322,408 638,408 592,486 368,486" fill="#101a2b" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="480" y="438" text-anchor="middle">4 - CANDIDATOS priorizados</text>
  <text class="item" x="480" y="462" text-anchor="middle">por confiabilidade · ruido · estabilidade</text>

  <!-- exit to 6.5 -->
  <path d="M480,486 L480,514" stroke="#facc15" stroke-width="2.5" fill="none" marker-end="url(#arrow-gold)"/>
  <rect x="290" y="518" width="380" height="52" rx="6" fill="#2a2206" stroke="#facc15" stroke-width="2"/>
  <text class="res" x="480" y="549" text-anchor="middle">modulo 6.5: explorar o vetor escolhido</text>

  <!-- legend -->
  <rect x="700" y="520" width="14" height="14" rx="3" fill="#13213a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="leg" x="722" y="531">etapas da enumeracao</text>
  <rect x="700" y="544" width="14" height="14" rx="3" fill="#2a2206" stroke="#facc15" stroke-width="1.5"/>
  <text class="leg" x="722" y="555">resultado: o vetor</text>
</svg>
