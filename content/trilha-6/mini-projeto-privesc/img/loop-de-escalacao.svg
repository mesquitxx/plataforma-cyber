<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t2 d2">
  <title id="t2">O ciclo da escalação local e a etapa que o iniciante esquece</title>
  <desc id="d2">Um ciclo de três etapas no topo, ligadas por setas da esquerda para a direita: etapa 1, enumerar o que a identidade atual enxerga; etapa 2, escolher o vetor, do mais confiável e silencioso primeiro e deixando o kernel exploit por último; etapa 3, escalar e assumir a nova identidade. Depois da etapa 3 há uma decisão: se o atacante já virou root ou SYSTEM, para, no bloco vermelho; se ainda é usuário comum, segue para a etapa 4. A etapa 4, re-enumerar como a nova identidade, está destacada em dourado porque é a mais esquecida e a mais importante: a nova identidade vê o que a anterior não via. Uma seta volta da etapa 4 para a etapa 1, fechando o ciclo.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','DejaVu Sans Mono','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .num { font-size: 13px; font-weight: 700; fill: #60a5fa; }
    .numg { font-size: 13px; font-weight: 700; fill: #eab308; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .lbl { font-size: 11px; fill: #cbd5e1; }
    .leg { font-size: 11px; fill: #cbd5e1; }
    .stop { font-size: 14px; font-weight: 700; fill: #f87171; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="a" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#60a5fa"/>
    </marker>
    <marker id="ag" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/>
    </marker>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <filter id="glowG" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="470" fill="url(#bg)"/>

  <text class="title" x="40" y="40">Escalar é um CICLO — e a etapa 4 é a que o iniciante esquece</text>

  <!-- legend -->
  <rect x="40" y="56" width="15" height="12" rx="2" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="leg" x="62" y="66">passo do ciclo</text>
  <rect x="200" y="56" width="15" height="12" rx="2" fill="#2a2410" stroke="#eab308" stroke-width="1.5"/>
  <text class="leg" x="222" y="66">a etapa mais esquecida e mais importante</text>
  <rect x="560" y="56" width="15" height="12" rx="2" fill="#2a1115" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="582" y="66">pare: chegou ao topo (root / SYSTEM)</text>

  <!-- step 1 -->
  <rect x="40" y="92" width="240" height="96" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="num" x="60" y="124">1 · enumerar</text>
  <text class="sub" x="60" y="148">o que a identidade</text>
  <text class="sub" x="60" y="166">ATUAL enxerga</text>

  <!-- step 2 -->
  <rect x="360" y="92" width="240" height="96" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="num" x="380" y="124">2 · escolher o vetor</text>
  <text class="sub" x="380" y="148">confiável e silencioso 1º</text>
  <text class="sub" x="380" y="166">kernel exploit por último</text>

  <!-- step 3 -->
  <rect x="680" y="92" width="240" height="96" rx="6" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="num" x="700" y="124">3 · escalar</text>
  <text class="sub" x="700" y="148">assumir a nova</text>
  <text class="sub" x="700" y="166">identidade</text>

  <!-- step 4 highlighted -->
  <rect x="360" y="300" width="240" height="96" rx="6" fill="#2a2410" stroke="#eab308" stroke-width="2" filter="url(#glowG)"/>
  <text class="numg" x="380" y="332">4 · re-enumerar</text>
  <text class="sub" x="380" y="356">como a NOVA identidade —</text>
  <text class="sub" x="380" y="374">ela vê o que a anterior não via</text>

  <!-- stop box -->
  <rect x="680" y="300" width="240" height="96" rx="6" fill="#2a1115" stroke="#ef4444" stroke-width="2"/>
  <text class="stop" x="800" y="340" text-anchor="middle">PARE</text>
  <text class="sub" x="800" y="362" text-anchor="middle">já é root (uid 0)</text>
  <text class="sub" x="800" y="380" text-anchor="middle">ou SYSTEM</text>

  <!-- arrows 1->2, 2->3 -->
  <line x1="280" y1="140" x2="358" y2="140" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="600" y1="140" x2="678" y2="140" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- 3 -> stop (virou root) -->
  <line x1="800" y1="188" x2="800" y2="298" stroke="#ef4444" stroke-width="2.5" marker-end="url(#ar)"/>
  <text class="lbl" x="812" y="246">virei root / SYSTEM</text>

  <!-- 3 -> 4 (ainda usuário comum) -->
  <path d="M740,188 C740,252 650,278 562,300" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#a)"/>
  <text class="lbl" x="628" y="258" text-anchor="end">ainda sou usuário comum</text>

  <!-- 4 -> 1 (loop back) -->
  <path d="M360,348 C150,348 160,210 160,190" fill="none" stroke="#eab308" stroke-width="2.5" marker-end="url(#ag)"/>
  <text class="lbl" x="175" y="268">re-enumere e repita</text>
</svg>
