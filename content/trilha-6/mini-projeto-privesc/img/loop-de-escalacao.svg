<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t2 d2">
  <title id="t2">O ciclo de escalação local: enumerar, escolher, escalar e repetir como a nova identidade</title>
  <desc id="d2">Um ciclo de quatro etapas ligadas por setas. Etapa 1, enumerar o que a identidade atual enxerga. Etapa 2, escolher o vetor, priorizando o mais confiável e silencioso e deixando o kernel exploit por último. Etapa 3, escalar e assumir a nova identidade. Etapa 4, re-enumerar como a nova identidade, porque ela enxerga coisas que a anterior não via; a seta volta à etapa 1. Ao lado, uma nota lembra de documentar cada etapa, formando o caminho de ataque. O ciclo só termina quando a identidade atual é root ou SYSTEM.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .num { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .step { font-size: 12.5px; font-weight: 700; }
    .ctl { font-size: 10px; fill: #9fb0a6; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .flow { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#ac2); }
    .note { font-size: 11px; fill: #cfe0d6; }
  </style>
  <defs>
    <marker id="ac2" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="420" fill="#121815"/>
  <text class="t" x="30" y="34">O ciclo: enumerar → escolher → escalar → re-enumerar</text>

  <rect class="box" x="40" y="80" width="200" height="92" rx="8"/>
  <text class="num" x="56" y="106">1 · enumerar</text>
  <text class="ctl" x="56" y="128">o que a identidade</text>
  <text class="ctl" x="56" y="144">ATUAL enxerga</text>

  <rect class="box" x="300" y="80" width="200" height="92" rx="8"/>
  <text class="num" x="316" y="106">2 · escolher o vetor</text>
  <text class="ctl" x="316" y="128">confiável e silencioso 1º</text>
  <text class="ctl" x="316" y="144">kernel exploit por último</text>

  <rect class="box" x="560" y="80" width="200" height="92" rx="8"/>
  <text class="num" x="576" y="106">3 · escalar</text>
  <text class="ctl" x="576" y="128">assumir a nova</text>
  <text class="ctl" x="576" y="144">identidade</text>

  <rect class="box" x="300" y="250" width="200" height="92" rx="8"/>
  <text class="num" x="316" y="276">4 · re-enumerar</text>
  <text class="ctl" x="316" y="298">a nova identidade vê</text>
  <text class="ctl" x="316" y="314">o que a anterior não via</text>

  <path class="flow" d="M240,126 L298,126"/>
  <path class="flow" d="M500,126 L558,126"/>
  <path class="flow" d="M620,172 C620,230 520,250 502,274"/>
  <path class="flow" d="M300,300 C160,300 140,170 138,172"/>

  <rect class="goal box" x="560" y="250" width="360" height="92" rx="8" stroke="#5cc8d8" stroke-width="2.5"/>
  <text class="step" x="580" y="282" fill="#5cc8d8">pare quando: uid 0 (root) ou SYSTEM</text>
  <text class="note" x="580" y="306">documente cada etapa (comando, evidência, horário):</text>
  <text class="note" x="580" y="322">a soma delas é o caminho de ataque (attack path).</text>
</svg>
