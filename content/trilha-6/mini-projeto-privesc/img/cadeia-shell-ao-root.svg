<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">A cadeia de escalação em saltos, de um acesso inicial até root e SYSTEM</title>
  <desc id="d">Duas trilhas horizontais partem de um acesso inicial de baixo privilégio. Na trilha de cima, Linux: a conta de serviço www-data, uid 33, dá o salto 1 usando uma credencial reutilizada encontrada na enumeração para virar o usuario dev, uid 1000; depois o salto 2, uma regra de sudo que roda o awk como root, abre um shell com uid 0, o root. Na trilha de baixo, Windows: a conta do pool do IIS dá um único salto, abusando do privilegio SeImpersonatePrivilege e do servico Print Spooler com o PrintSpoofer, e chega a SYSTEM. As duas trilhas chegam a caixas destacadas em ciano: root uid 0 e SYSTEM. Uma faixa embaixo lembra que, a cada salto, é preciso re-enumerar como a nova identidade e registrar comando, evidência e horário, formando o caminho de ataque.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .lane { font-size: 12px; font-weight: 700; fill: #9fb0a6; }
    .node { font-size: 13px; font-weight: 700; }
    .ctl { font-size: 10px; fill: #9fb0a6; }
    .hop { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .hoplbl { font-size: 10px; fill: #9fb0a6; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .foot { fill: #16201b; stroke: #9fb0a6; stroke-width: 2; }
    .goal { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .flow { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#ac); }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#121815"/>
  <text class="t" x="30" y="36">Da shell ao root/SYSTEM: a escalação é uma cadeia de saltos</text>

  <!-- Linux lane -->
  <text class="lane" x="30" y="92">LINUX</text>
  <rect class="foot" x="30" y="110" width="170" height="86" rx="8"/>
  <text class="node" x="115" y="146" text-anchor="middle">foothold</text>
  <text class="ctl" x="115" y="166" text-anchor="middle">www-data · uid 33</text>
  <text class="ctl" x="115" y="182" text-anchor="middle">web shell</text>

  <rect class="box" x="420" y="110" width="150" height="86" rx="8"/>
  <text class="node" x="495" y="146" text-anchor="middle">dev</text>
  <text class="ctl" x="495" y="166" text-anchor="middle">uid 1000</text>
  <text class="ctl" x="495" y="182" text-anchor="middle">usuário comum</text>

  <rect class="goal" x="770" y="110" width="160" height="86" rx="8"/>
  <text class="node" x="850" y="146" text-anchor="middle" fill="#5cc8d8">root</text>
  <text class="ctl" x="850" y="166" text-anchor="middle">uid 0</text>
  <text class="ctl" x="850" y="182" text-anchor="middle">controle total</text>

  <path class="flow" d="M200,153 L418,153"/>
  <text class="hop" x="309" y="138" text-anchor="middle">salto 1</text>
  <text class="hoplbl" x="309" y="176" text-anchor="middle">credencial reutilizada</text>
  <text class="hoplbl" x="309" y="190" text-anchor="middle">su dev</text>

  <path class="flow" d="M570,153 L768,153"/>
  <text class="hop" x="669" y="138" text-anchor="middle">salto 2</text>
  <text class="hoplbl" x="669" y="176" text-anchor="middle">sudo awk (GTFOBins)</text>
  <text class="hoplbl" x="669" y="190" text-anchor="middle">shell com uid 0</text>

  <!-- Windows lane -->
  <text class="lane" x="30" y="352">WINDOWS</text>
  <rect class="foot" x="30" y="370" width="170" height="86" rx="8"/>
  <text class="node" x="115" y="406" text-anchor="middle">foothold</text>
  <text class="ctl" x="115" y="426" text-anchor="middle">IIS AppPool</text>
  <text class="ctl" x="115" y="442" text-anchor="middle">conta de serviço</text>

  <rect class="goal" x="770" y="370" width="160" height="86" rx="8"/>
  <text class="node" x="850" y="406" text-anchor="middle" fill="#5cc8d8">SYSTEM</text>
  <text class="ctl" x="850" y="426" text-anchor="middle">NT AUTHORITY</text>
  <text class="ctl" x="850" y="442" text-anchor="middle">controle total</text>

  <path class="flow" d="M200,413 L768,413"/>
  <text class="hop" x="485" y="398" text-anchor="middle">salto único</text>
  <text class="hoplbl" x="485" y="436" text-anchor="middle">SeImpersonatePrivilege + Print Spooler</text>
  <text class="hoplbl" x="485" y="450" text-anchor="middle">PrintSpoofer: veste o token do SYSTEM</text>

  <!-- rule band -->
  <rect class="box" x="30" y="516" width="900" height="54" rx="8"/>
  <text class="rule" x="480" y="540" text-anchor="middle">a cada salto: re-enumere como a NOVA identidade e registre comando + evidência + horário (UTC)</text>
  <text class="rule" x="480" y="558" text-anchor="middle">a sequência de saltos anotada é o seu caminho de ataque (attack path) — a base do relatório</text>
</svg>
