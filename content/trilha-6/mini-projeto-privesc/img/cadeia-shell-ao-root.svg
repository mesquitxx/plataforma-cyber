<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">A escalação é uma cadeia de saltos, do acesso inicial até o controle total</title>
  <desc id="d">Duas trilhas partem de um acesso inicial de baixo privilégio e terminam no controle total da máquina. Na trilha Linux, a conta de serviço www-data dá o salto 1, usando uma senha reutilizada encontrada na enumeração, e vira o usuário comum dev; depois o salto 2, abusando de uma regra de sudo mal configurada, abre um shell de root. Na trilha Windows, a conta do pool do IIS dá um único salto, abusando do privilégio de personificar token com o Print Spooler, e chega a SYSTEM. Cada seta é um salto que só se abre depois do anterior; o fim de cada trilha, destacado em vermelho, é o controle total. Uma faixa embaixo lembra de re-enumerar a cada salto e registrar comando, evidência e horário, formando o caminho de ataque.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','DejaVu Sans Mono','Courier New',monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .lane { font-size: 12px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.08em; }
    .node { font-size: 15px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .hop { font-size: 12px; font-weight: 700; fill: #10b981; }
    .hoplbl { font-size: 11px; fill: #cbd5e1; }
    .leg { font-size: 11px; fill: #cbd5e1; }
    .band { font-size: 12px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="hop" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/>
    </marker>
    <filter id="glowR" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="560" fill="url(#bg)"/>

  <text class="title" x="40" y="40">A escalação é uma CADEIA: cada salto só abre depois do anterior</text>

  <!-- legend -->
  <rect x="40" y="58" width="15" height="12" rx="2" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="leg" x="62" y="68">passo no caminho (pouco poder)</text>
  <rect x="300" y="58" width="15" height="12" rx="2" fill="#2a1115" stroke="#ef4444" stroke-width="1.5"/>
  <text class="leg" x="322" y="68">controle total da máquina (o alvo)</text>
  <line x1="600" y1="64" x2="628" y2="64" stroke="#10b981" stroke-width="2.5" marker-end="url(#hop)"/>
  <text class="leg" x="636" y="68">salto do atacante</text>

  <!-- LINUX lane -->
  <text class="lane" x="40" y="112">LINUX</text>
  <rect x="40" y="128" width="190" height="80" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="node" x="135" y="162" text-anchor="middle">www-data</text>
  <text class="sub" x="135" y="182" text-anchor="middle">conta de serviço web</text>
  <text class="sub" x="135" y="198" text-anchor="middle">uid 33 · acesso inicial</text>

  <rect x="400" y="128" width="150" height="80" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="node" x="475" y="162" text-anchor="middle">dev</text>
  <text class="sub" x="475" y="182" text-anchor="middle">usuário comum</text>
  <text class="sub" x="475" y="198" text-anchor="middle">uid 1000</text>

  <rect x="760" y="128" width="170" height="80" rx="6" fill="#2a1115" stroke="#ef4444" stroke-width="2" filter="url(#glowR)"/>
  <text class="node" x="845" y="162" text-anchor="middle" fill="#f87171">root</text>
  <text class="sub" x="845" y="182" text-anchor="middle">uid 0</text>
  <text class="sub" x="845" y="198" text-anchor="middle">controle total</text>

  <line x1="230" y1="168" x2="398" y2="168" stroke="#10b981" stroke-width="2.5" marker-end="url(#hop)"/>
  <text class="hop" x="312" y="152" text-anchor="middle">salto 1</text>
  <text class="hoplbl" x="312" y="188" text-anchor="middle">senha reutilizada</text>

  <line x1="550" y1="168" x2="758" y2="168" stroke="#10b981" stroke-width="2.5" marker-end="url(#hop)"/>
  <text class="hop" x="654" y="152" text-anchor="middle">salto 2</text>
  <text class="hoplbl" x="654" y="188" text-anchor="middle">regra de sudo → root</text>

  <!-- WINDOWS lane -->
  <text class="lane" x="40" y="332">WINDOWS</text>
  <rect x="40" y="348" width="190" height="80" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="node" x="135" y="382" text-anchor="middle">IIS AppPool</text>
  <text class="sub" x="135" y="402" text-anchor="middle">conta de serviço web</text>
  <text class="sub" x="135" y="418" text-anchor="middle">acesso inicial</text>

  <rect x="760" y="348" width="170" height="80" rx="6" fill="#2a1115" stroke="#ef4444" stroke-width="2" filter="url(#glowR)"/>
  <text class="node" x="845" y="382" text-anchor="middle" fill="#f87171">SYSTEM</text>
  <text class="sub" x="845" y="402" text-anchor="middle">NT AUTHORITY</text>
  <text class="sub" x="845" y="418" text-anchor="middle">controle total</text>

  <line x1="230" y1="388" x2="758" y2="388" stroke="#10b981" stroke-width="2.5" marker-end="url(#hop)"/>
  <text class="hop" x="494" y="372" text-anchor="middle">salto único</text>
  <text class="hoplbl" x="494" y="410" text-anchor="middle">privilégio de personificar token + Print Spooler</text>
  <text class="hoplbl" x="494" y="426" text-anchor="middle">PrintSpoofer veste o token do SYSTEM</text>

  <!-- method band (secondary) -->
  <rect x="40" y="470" width="890" height="64" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="5,4"/>
  <text class="band" x="485" y="496" text-anchor="middle">A cada salto: re-enumere como a NOVA identidade e anote comando + evidência + horário (UTC).</text>
  <text class="band" x="485" y="518" text-anchor="middle">A sequência de saltos anotada é o seu caminho de ataque (attack path) — a base do relatório.</text>
</svg>
