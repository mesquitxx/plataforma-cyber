<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t1 d1">
  <title id="t1">A pós-exploração: coletar, persistir, limpar e relatar, depois do root</title>
  <desc id="d1">A linha de cima mostra a kill chain, com a fase de escalação de privilégio (módulos 6.2 a 6.6) levando ao marco root ou SYSTEM. A partir desse marco, abre-se a fase de pós-exploração, com três atividades encadeadas: primeiro Coletar, o loot de evidências, credenciais e informações do host; depois Persistir, instalando mecanismos como cron, serviço systemd, chave SSH e tarefa agendada para garantir o retorno; por fim Limpar e Relatar, removendo os próprios artefatos de teste, restaurando o ambiente e documentando tudo. Uma faixa inferior marca o limite ético: tudo isso só dentro do escopo autorizado.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .num { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .ctl { font-size: 10.5px; fill: #9fb0a6; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .kc { fill: #141d18; stroke: #27332c; stroke-width: 1.2; }
    .kctext { font-size: 11px; fill: #8fa399; }
    .flow { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#ac1); }
    .eth { font-size: 11px; fill: #d8c48a; }
    .ethbox { fill: #1d1a12; stroke: #4a4122; stroke-width: 1.3; }
  </style>
  <defs>
    <marker id="ac1" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="440" fill="#121815"/>
  <text class="t" x="30" y="34">Pós-exploração: o que se faz depois do root/SYSTEM</text>

  <!-- kill chain strip -->
  <rect class="kc" x="30" y="56" width="610" height="40" rx="6"/>
  <text class="kctext" x="46" y="81">kill chain:  recon → acesso inicial → ESCALAÇÃO (6.2–6.6) → ...</text>
  <rect class="box" x="660" y="52" width="270" height="48" rx="8" stroke="#5cc8d8" stroke-width="2.5"/>
  <text class="num" x="678" y="81">marco: uid 0 (root) / SYSTEM</text>

  <!-- three activities -->
  <rect class="box" x="40" y="150" width="260" height="118" rx="8"/>
  <text class="num" x="58" y="178">1 · Coletar (loot)</text>
  <text class="ctl" x="58" y="202">evidências do impacto,</text>
  <text class="ctl" x="58" y="220">credenciais, info do host</text>
  <text class="ctl" x="58" y="244">(backups, history, config,</text>
  <text class="ctl" x="58" y="262">/etc/shadow, chaves)</text>

  <rect class="box" x="350" y="150" width="260" height="118" rx="8"/>
  <text class="num" x="368" y="178">2 · Persistir</text>
  <text class="ctl" x="368" y="202">garantir o retorno mesmo</text>
  <text class="ctl" x="368" y="220">após reboot ou troca de senha</text>
  <text class="ctl" x="368" y="244">(cron, serviço systemd,</text>
  <text class="ctl" x="368" y="262">chave SSH, tarefa agendada)</text>

  <rect class="box" x="660" y="150" width="270" height="118" rx="8"/>
  <text class="num" x="678" y="178">3 · Limpar &amp; Relatar</text>
  <text class="ctl" x="678" y="202">remover os PRÓPRIOS artefatos,</text>
  <text class="ctl" x="678" y="220">restaurar o ambiente,</text>
  <text class="ctl" x="678" y="244">documentar comando, evidência</text>
  <text class="ctl" x="678" y="262">e horário (o relatório)</text>

  <path class="flow" d="M795,100 L795,146"/>
  <path class="flow" d="M300,209 L348,209"/>
  <path class="flow" d="M610,209 L658,209"/>

  <!-- ethics strip -->
  <rect class="ethbox" x="40" y="320" width="890" height="80" rx="8"/>
  <text class="eth" x="60" y="352">LIMITE ÉTICO — tudo isto só dentro do escopo autorizado (lab local ou autorização por escrito).</text>
  <text class="eth" x="60" y="376">O atacante coleta para roubar, persiste para voltar e limpa para ESCONDER o rastro.</text>
  <text class="eth" x="60" y="394">O pentester coleta como prova, evita persistência fora do combinado e limpa para DEIXAR como estava.</text>
</svg>
