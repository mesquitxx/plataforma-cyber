<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">Escalar privilégio: passar por uma brecha e virar a conta que manda em tudo</title>
  <desc id="d">Duas colunas, Linux e Windows. Embaixo, em cinza, a conta de serviço onde o atacante entra quase sem poder: www-data no Linux e svc_web no Windows. No meio, atravessando as duas colunas e destacada em laranja, a brecha (a ponte de elevação): algo que já roda com poder e deixa você usar esse poder, como uma permissão dada a mais, um programa mal configurado ou uma falha de software. Em cima, em verde, o que o atacante ganha: root no Linux e SYSTEM no Windows, a conta que pode tudo. Setas sobem da conta fraca, passam pela brecha e chegam à conta todo-poderosa: isso é a escalação vertical. Abaixo, separada e em roxo, a escalação horizontal: uma seta tracejada liga o usuário joao ao usuário maria, do mesmo nível.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #94a3b8; }
    .col { font-size: 13px; font-weight: 700; fill: #94a3b8; letter-spacing: 0.12em; }
    .name { font-size: 16px; font-weight: 700; }
    .hname { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .gain { fill: #6ee7b7; }
    .brk { font-size: 15px; font-weight: 700; fill: #fb923c; }
    .brktxt { font-size: 13px; fill: #e2e8f0; }
    .lbl-up { font-size: 12px; font-weight: 700; fill: #10b981; }
    .lbl-h { font-size: 14px; font-weight: 700; fill: #c084fc; }
    .lbl-hs { font-size: 12px; fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-orange" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#10b981"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#c084fc"/></marker>
    <marker id="arrow-purple-start" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><polygon points="10 0, 0 4, 10 8" fill="#c084fc"/></marker>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="42">Escalar privilégio: passar por uma brecha e virar a conta que manda em tudo</text>
  <text class="subtitle" x="40" y="66">A mesma ideia no Linux e no Windows</text>

  <text class="col" x="250" y="102" text-anchor="middle">LINUX</text>
  <text class="col" x="710" y="102" text-anchor="middle">WINDOWS</text>

  <!-- top: what the attacker gains -->
  <rect x="60" y="115" width="380" height="70" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="name gain" x="250" y="144" text-anchor="middle">root</text>
  <text class="sub" x="250" y="168" text-anchor="middle">a conta que pode tudo · controle total</text>
  <rect x="520" y="115" width="380" height="70" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="name gain" x="710" y="144" text-anchor="middle">SYSTEM</text>
  <text class="sub" x="710" y="168" text-anchor="middle">a conta que pode tudo · controle total</text>

  <!-- brecha -> top -->
  <path d="M250,245 L250,189" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M710,245 L710,189" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text class="lbl-up" x="264" y="222">subir = escalação vertical</text>
  <text class="lbl-up" x="724" y="222">subir = escalação vertical</text>

  <!-- key moment: the breach -->
  <rect x="60" y="245" width="840" height="120" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="2.5" filter="url(#glow-orange)"/>
  <text class="brk" x="480" y="276" text-anchor="middle">A BRECHA — a ponte de elevação</text>
  <text class="brktxt" x="480" y="306" text-anchor="middle">algo que já roda com poder e deixa você usar esse poder:</text>
  <text class="brktxt" x="480" y="338" text-anchor="middle">• uma permissão dada a mais   • um programa mal configurado   • uma falha de software</text>

  <!-- low -> brecha -->
  <path d="M250,425 L250,369" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M710,425 L710,369" stroke="#94a3b8" stroke-width="2.5" fill="none" marker-end="url(#arrow-gray)"/>

  <!-- bottom: where the attacker starts -->
  <rect x="60" y="425" width="380" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="name" x="250" y="454" text-anchor="middle">www-data</text>
  <text class="sub" x="250" y="478" text-anchor="middle">onde o atacante entra · quase sem poder</text>
  <rect x="520" y="425" width="380" height="70" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="name" x="710" y="454" text-anchor="middle">svc_web</text>
  <text class="sub" x="710" y="478" text-anchor="middle">onde o atacante entra · quase sem poder</text>

  <!-- secondary: horizontal escalation -->
  <line x1="40" y1="522" x2="920" y2="522" stroke="#334155" stroke-width="1" stroke-dasharray="4 4"/>
  <text class="lbl-h" x="60" y="562">Escalação horizontal</text>
  <text class="lbl-hs" x="60" y="584">mesmo nível, outra conta</text>
  <rect x="400" y="545" width="170" height="48" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text class="hname" x="485" y="575" text-anchor="middle">usuário joao</text>
  <rect x="730" y="545" width="170" height="48" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text class="hname" x="815" y="575" text-anchor="middle">usuário maria</text>
  <path d="M576,569 L724,569" stroke="#c084fc" stroke-width="2" stroke-dasharray="6 5" fill="none" marker-start="url(#arrow-purple-start)" marker-end="url(#arrow-purple)"/>

  <!-- legend -->
  <rect x="60" y="625" width="14" height="14" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="leg" x="82" y="637">onde o atacante começa</text>
  <rect x="282" y="625" width="14" height="14" rx="3" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <text class="leg" x="304" y="637">a brecha</text>
  <rect x="402" y="625" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="leg" x="424" y="637">o que o atacante ganha</text>
  <rect x="624" y="625" width="14" height="14" rx="3" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text class="leg" x="646" y="637">movimento de lado (horizontal)</text>
</svg>
