<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d">
  <title id="t">O modelo de privilégio no Linux e no Windows, lado a lado</title>
  <desc id="d">Duas colunas. À esquerda, o Linux: embaixo, uma conta de serviço de baixo privilégio (www-data, uid 33); no topo, root (uid 0), com poder total. Entre as duas, uma faixa chamada "pontes de elevação" lista os caminhos que levam de baixo para cima: o bit SUID/SGID, o sudo, uma Linux capability e um bug (kernel ou programa SUID). Uma seta sobe da conta baixa até root passando por essa faixa. À direita, o Windows: embaixo, uma conta de serviço (svc_web, integridade Média); no meio, Administrador (integridade Alta); no topo, SYSTEM, a conta mais poderosa. Entre elas, a faixa "pontes de elevação" lista: token de acesso (SeImpersonate), o UAC (de Médio para Alto), um serviço mal configurado e um bug (driver ou serviço). Uma seta sobe da conta de serviço até SYSTEM. Embaixo das duas colunas, uma seta horizontal tracejada liga dois usuários do mesmo nível, com a legenda "escalação horizontal: virar outro usuário de mesmo poder". A vertical é rotulada "escalação vertical: ganhar mais poder".</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .step { font-size: 12.5px; font-weight: 700; }
    .sub { font-size: 10.5px; fill: #9fb0a6; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .top { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .band { fill: #10211c; stroke: #2c7d57; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .up { stroke: #5ee08a; stroke-width: 2.5; fill: none; marker-end: url(#au); }
    .side { stroke: #c8a85c; stroke-width: 2; fill: none; stroke-dasharray: 6 5; marker-end: url(#as); marker-start: url(#as2); }
    .gl { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .sl { font-size: 10.5px; font-weight: 700; fill: #c8a85c; }
    .bridge { font-size: 11px; fill: #cfe0d6; }
  </style>
  <defs>
    <marker id="au" markerWidth="10" markerHeight="10" refX="5" refY="9" orient="auto"><path d="M5,0 L10,9 L0,9 z" fill="#5ee08a"/></marker>
    <marker id="as" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#c8a85c"/></marker>
    <marker id="as2" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#c8a85c"/></marker>
  </defs>
  <rect width="920" height="520" fill="#121815"/>
  <text class="t" x="30" y="34">O modelo de privilégio: a mesma ideia, dois sistemas</text>
  <text class="sl" x="30" y="55">vertical = ganhar mais poder (↑)   ·   horizontal = virar outro usuário de mesmo poder (↔)</text>

  <!-- vertical axis label -->
  <text class="gl" x="18" y="300" transform="rotate(-90 18 300)" text-anchor="middle">escalação vertical ↑</text>

  <!-- ===================== LINUX ===================== -->
  <text class="h" x="70" y="92">LINUX</text>

  <!-- root (top) -->
  <rect class="top" x="60" y="104" width="300" height="66" rx="8"/>
  <text class="step" x="210" y="132" text-anchor="middle">root — uid 0</text>
  <text class="sub" x="210" y="152" text-anchor="middle">poder total sobre o host</text>

  <!-- bridge band -->
  <rect class="band" x="60" y="196" width="300" height="104" rx="8"/>
  <text class="h" x="210" y="218" text-anchor="middle" fill="#5ee08a">pontes de elevação</text>
  <text class="bridge" x="76" y="242">• bit SUID / SGID (roda como o dono)</text>
  <text class="bridge" x="76" y="262">• sudo (poder pontual via /etc/sudoers)</text>
  <text class="bridge" x="76" y="282">• capability · bug de kernel ou SUID</text>

  <!-- low account -->
  <rect class="box" x="60" y="326" width="300" height="66" rx="8"/>
  <text class="step" x="210" y="354" text-anchor="middle">www-data — uid 33</text>
  <text class="sub" x="210" y="374" text-anchor="middle">conta de serviço de baixo privilégio</text>

  <path class="up" d="M210,326 L210,172"/>

  <!-- ===================== WINDOWS ===================== -->
  <text class="h" x="570" y="92">WINDOWS</text>

  <!-- SYSTEM (top) -->
  <rect class="top" x="560" y="104" width="300" height="52" rx="8"/>
  <text class="step" x="710" y="128" text-anchor="middle">SYSTEM (S-1-5-18)</text>
  <text class="sub" x="710" y="146" text-anchor="middle">a conta mais poderosa da máquina</text>

  <!-- Administrator (mid) -->
  <rect class="box" x="560" y="170" width="300" height="48" rx="8"/>
  <text class="step" x="710" y="192" text-anchor="middle">Administrador — integridade Alta</text>
  <text class="sub" x="710" y="210" text-anchor="middle">token cheio só após o UAC</text>

  <!-- bridge band -->
  <rect class="band" x="560" y="232" width="300" height="86" rx="8"/>
  <text class="h" x="710" y="252" text-anchor="middle" fill="#5ee08a">pontes de elevação</text>
  <text class="bridge" x="576" y="274">• token de acesso (SeImpersonate → SYSTEM)</text>
  <text class="bridge" x="576" y="293">• UAC (Médio → Alto) · serviço mal configurado</text>
  <text class="bridge" x="576" y="312">• bug de driver ou de serviço</text>

  <!-- low account -->
  <rect class="box" x="560" y="336" width="300" height="56" rx="8"/>
  <text class="step" x="710" y="362" text-anchor="middle">svc_web — integridade Média</text>
  <text class="sub" x="710" y="381" text-anchor="middle">conta de serviço de baixo privilégio</text>

  <path class="up" d="M710,336 L710,158"/>

  <!-- horizontal escalation -->
  <rect class="box" x="120" y="440" width="180" height="48" rx="8"/>
  <text class="step" x="210" y="468" text-anchor="middle">usuário joao</text>
  <rect class="box" x="620" y="440" width="180" height="48" rx="8"/>
  <text class="step" x="710" y="468" text-anchor="middle">usuário maria</text>
  <path class="side" d="M312,464 L608,464"/>
  <text class="sl" x="460" y="456" text-anchor="middle">escalação horizontal</text>
  <text class="sl" x="460" y="482" text-anchor="middle">mesmo nível, outra conta</text>
</svg>
