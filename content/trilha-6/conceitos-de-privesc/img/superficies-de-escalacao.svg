<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="960" height="650" role="img" aria-labelledby="t d">
  <title id="t">A escalação é o 3º passo do ataque, e a brecha que ela procura é de 4 tipos</title>
  <desc id="d">No topo, a cadeia de um ataque em quatro passos: 1. reconhecimento (mapear o alvo), 2. acesso inicial (entrar como usuário fraco), 3. escalação, destacada em laranja (achar e usar a brecha) e 4. pós-exploração, em verde, já como root ou SYSTEM. Do passo 3 desce uma seta, "onde procurar a brecha", até quatro cartões laranja, um por tipo de brecha, cada um com um exemplo no Linux e um no Windows. 1, poder dado a mais (má configuração): no Linux, sudo frouxo ou uma tarefa do root que você pode editar; no Windows, um serviço cuja pasta qualquer um edita. 2, programa com falha (software vulnerável): no Linux, programa SUID com bug ou kernel antigo; no Windows, serviço ou driver com bug. 3, senha esquecida (credenciais): no Linux, senha em arquivo de configuração ou no histórico; no Windows, senha no registro ou em arquivos. 4, recurso legítimo abusado: no Linux, uma capability a mais como cap_setuid; no Windows, um token com SeImpersonate. No rodapé, o método: enumerar, listar candidatos, priorizar, explorar.</desc>
  <style>
    text { font-family: 'DejaVu Sans Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .subtitle { font-size: 13px; fill: #94a3b8; }
    .step { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .hot { fill: #fb923c; }
    .gain { fill: #6ee7b7; }
    .ctitle { font-size: 15px; font-weight: 700; fill: #fb923c; }
    .ckind { font-size: 12px; fill: #94a3b8; }
    .os { font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .ex { font-size: 13px; fill: #e2e8f0; }
    .drop { font-size: 12px; font-weight: 700; fill: #fb923c; }
    .method { font-size: 12px; fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-orange" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#94a3b8"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#f97316"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#10b981"/></marker>
  </defs>
  <rect width="960" height="650" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="42">A escalação é o 3º passo do ataque — e a brecha é sempre de 4 tipos</text>
  <text class="subtitle" x="40" y="66">Os mesmos 4 tipos valem no Linux e no Windows</text>

  <!-- attack chain -->
  <rect x="40" y="88" width="190" height="64" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="135" y="115" text-anchor="middle">1. Reconhecimento</text>
  <text class="sub" x="135" y="137" text-anchor="middle">mapear o alvo</text>
  <path d="M230,120 L262,120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>

  <rect x="266" y="88" width="200" height="64" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="step" x="366" y="115" text-anchor="middle">2. Acesso inicial</text>
  <text class="sub" x="366" y="137" text-anchor="middle">entra como usuário fraco</text>
  <path d="M466,120 L498,120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>

  <rect x="502" y="88" width="190" height="64" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="2.5" filter="url(#glow-orange)"/>
  <text class="step hot" x="597" y="115" text-anchor="middle">3. ESCALAÇÃO</text>
  <text class="sub" x="597" y="137" text-anchor="middle">achar e usar a brecha</text>
  <path d="M692,120 L724,120" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="728" y="88" width="192" height="64" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="step gain" x="824" y="115" text-anchor="middle">4. Pós-exploração</text>
  <text class="sub" x="824" y="137" text-anchor="middle">já como root / SYSTEM</text>

  <!-- drop from step 3 -->
  <path d="M597,152 L597,196" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="drop" x="611" y="180">onde procurar a brecha</text>

  <!-- container of the 4 kinds -->
  <rect x="40" y="200" width="880" height="350" rx="8" fill="none" stroke="#f97316" stroke-width="1.2" stroke-dasharray="6 5" opacity="0.7"/>

  <!-- card 1 -->
  <rect x="60" y="222" width="400" height="140" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text class="ctitle" x="80" y="250">1  Poder dado a mais</text>
  <text class="ckind" x="80" y="270">(má configuração)</text>
  <text class="os" x="80" y="304">Linux</text>
  <text class="ex" x="160" y="304">sudo frouxo · tarefa do root</text>
  <text class="ex" x="160" y="322">que você pode editar</text>
  <text class="os" x="80" y="348">Windows</text>
  <text class="ex" x="160" y="348">serviço cuja pasta todos editam</text>

  <!-- card 2 -->
  <rect x="500" y="222" width="400" height="140" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text class="ctitle" x="520" y="250">2  Programa com falha</text>
  <text class="ckind" x="520" y="270">(software vulnerável)</text>
  <text class="os" x="520" y="304">Linux</text>
  <text class="ex" x="600" y="304">programa SUID com bug</text>
  <text class="ex" x="600" y="322">· kernel antigo</text>
  <text class="os" x="520" y="348">Windows</text>
  <text class="ex" x="600" y="348">serviço ou driver com bug</text>

  <!-- card 3 -->
  <rect x="60" y="390" width="400" height="140" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text class="ctitle" x="80" y="418">3  Senha esquecida</text>
  <text class="ckind" x="80" y="438">(credenciais)</text>
  <text class="os" x="80" y="472">Linux</text>
  <text class="ex" x="160" y="472">senha em arquivo de config</text>
  <text class="ex" x="160" y="490">· histórico de comandos</text>
  <text class="os" x="80" y="516">Windows</text>
  <text class="ex" x="160" y="516">senha no registro ou em arquivo</text>

  <!-- card 4 -->
  <rect x="500" y="390" width="400" height="140" rx="6" fill="#1c1917" stroke="#ea580c" stroke-width="1.5"/>
  <text class="ctitle" x="520" y="418">4  Recurso legítimo abusado</text>
  <text class="ckind" x="520" y="438">(usado para o que não era)</text>
  <text class="os" x="520" y="472">Linux</text>
  <text class="ex" x="600" y="472">capability a mais</text>
  <text class="ex" x="600" y="490">(ex.: cap_setuid)</text>
  <text class="os" x="520" y="516">Windows</text>
  <text class="ex" x="600" y="516">token com SeImpersonate</text>

  <!-- method -->
  <text class="method" x="480" y="580" text-anchor="middle">método: enumerar → listar candidatos → priorizar → explorar</text>

  <!-- legend -->
  <rect x="160" y="612" width="14" height="14" rx="3" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="leg" x="182" y="624">passos do ataque</text>
  <rect x="352" y="612" width="14" height="14" rx="3" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <text class="leg" x="374" y="624">a escalação e suas brechas</text>
  <rect x="620" y="612" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="leg" x="642" y="624">o que o atacante ganha</text>
</svg>
