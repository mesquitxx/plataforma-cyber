<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Mapa da plataforma</title>
  <desc id="d">A barra superior mostra o selo 127.0.0.1 · offline e o lab ativo. O menu lateral leva a cinco páginas: Início, Trilhas, Painel, Laboratórios e Glossário. Trilhas leva a uma trilha, e a trilha leva ao módulo. A página do módulo tem, de cima para baixo: pré-requisitos, painel do laboratório (quando houver), o conteúdo com flags e quiz, as tarefas do módulo e os botões de anterior e próximo.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="460" fill="#121815"/>

  <!-- Top bar -->
  <rect class="box" x="20" y="16" width="860" height="40" rx="8"/>
  <rect x="34" y="25" width="190" height="22" rx="5" fill="none" stroke="#5ee08a"/>
  <text class="s" x="44" y="41" style="fill:#5ee08a">127.0.0.1 · offline</text>
  <text class="s" x="240" y="41">barra superior: selo de isolamento + lab ativo (se houver)</text>

  <!-- Sidebar -->
  <rect class="box" x="20" y="72" width="200" height="370" rx="10"/>
  <text class="t" x="36" y="98">Menu lateral</text>
  <g>
    <rect x="34" y="114" width="172" height="34" rx="6" fill="#121815" stroke="#34413b"/>
    <text class="t" x="46" y="136">Início</text>
    <rect x="34" y="158" width="172" height="34" rx="6" fill="#121815" stroke="#5cc8d8"/>
    <text class="t" x="46" y="180" style="fill:#5cc8d8">Trilhas</text>
    <rect x="34" y="202" width="172" height="34" rx="6" fill="#121815" stroke="#34413b"/>
    <text class="t" x="46" y="224">Painel</text>
    <rect x="34" y="246" width="172" height="34" rx="6" fill="#121815" stroke="#e8c25a"/>
    <text class="t" x="46" y="268" style="fill:#e8c25a">Laboratórios</text>
    <rect x="34" y="290" width="172" height="34" rx="6" fill="#121815" stroke="#34413b"/>
    <text class="t" x="46" y="312">Glossário</text>
  </g>
  <text class="s" x="36" y="350">Início: continuar de</text>
  <text class="s" x="36" y="366">onde parou</text>
  <text class="s" x="36" y="388">Painel: progresso,</text>
  <text class="s" x="36" y="404">sequência, conquistas</text>
  <text class="s" x="36" y="426">Glossário: todos os termos</text>

  <!-- Trilhas -> Trilha -> Módulo -->
  <rect class="box" x="260" y="150" width="150" height="50" rx="10" style="stroke:#5cc8d8"/>
  <text class="t" x="276" y="172">/trilhas</text>
  <text class="s" x="276" y="190">as 9 trilhas</text>
  <line x1="206" y1="175" x2="256" y2="175" stroke="#5cc8d8" stroke-width="2" marker-end="url(#c)"/>

  <rect class="box" x="260" y="240" width="150" height="62" rx="10" style="stroke:#5cc8d8"/>
  <text class="t" x="276" y="262">uma trilha</text>
  <text class="s" x="276" y="280">módulos e</text>
  <text class="s" x="276" y="295">seus estados</text>
  <line x1="335" y1="200" x2="335" y2="236" stroke="#5cc8d8" stroke-width="2" marker-end="url(#c)"/>
  <line x1="410" y1="271" x2="446" y2="271" stroke="#5cc8d8" stroke-width="2" marker-end="url(#c)"/>

  <!-- Module page -->
  <rect class="box" x="450" y="72" width="430" height="370" rx="10" style="stroke:#5ee08a"/>
  <text class="t" x="468" y="98" style="fill:#5ee08a">Página do módulo (de cima para baixo)</text>
  <rect x="468" y="112" width="394" height="40" rx="6" fill="#121815" stroke="#34413b"/>
  <text class="t" x="480" y="137">$ cat pre-requisitos</text>
  <rect x="468" y="162" width="394" height="48" rx="6" fill="#121815" stroke="#e8c25a"/>
  <text class="t" x="480" y="183" style="fill:#e8c25a">Laboratório (se houver)</text>
  <text class="s" x="480" y="201">Iniciar · Parar · Resetar · Verificar isolamento</text>
  <rect x="468" y="220" width="394" height="98" rx="6" fill="#121815" stroke="#34413b"/>
  <text class="t" x="480" y="243">Conteúdo: as 10 seções</text>
  <text class="s" x="480" y="263">teoria, diagramas, casos reais</text>
  <rect x="480" y="274" width="170" height="32" rx="5" fill="none" stroke="#5ee08a"/>
  <text class="s" x="492" y="294" style="fill:#5ee08a">FLAG{...}  Enviar</text>
  <rect x="662" y="274" width="188" height="32" rx="5" fill="none" stroke="#5ee08a"/>
  <text class="s" x="674" y="294" style="fill:#5ee08a">Quiz (no servidor)</text>
  <rect x="468" y="328" width="394" height="48" rx="6" fill="#121815" stroke="#34413b"/>
  <text class="t" x="480" y="349">Tarefas do módulo</text>
  <text class="s" x="480" y="367">tudo concluído = módulo concluído</text>
  <rect x="468" y="386" width="394" height="40" rx="6" fill="#121815" stroke="#34413b"/>
  <text class="t" x="480" y="411">← anterior     próximo →</text></svg>
