<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Lendo permissões: -rwxr-x---</title>
  <desc id="d">A string de permissões tem 10 caracteres: o primeiro é o tipo (- arquivo, d diretório, l link), seguido de três trios rwx para dono (user), grupo (group) e outros (others). Cada letra vale um número: r=4, w=2, x=1; somando cada trio, rwxr-x--- vira 750.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .big { font-size: 44px; font-weight: 700; }
    .t { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #9fb0a6; }
    .n { font-size: 30px; font-weight: 700; }
  </style>
  <rect width="900" height="380" fill="#121815"/>

  <!-- One <text> per group with a fixed textLength (26.4 per character), so the
       brackets line up whatever monospace font the system picks. -->
  <text class="big" x="150.0" y="100" fill="#9fb0a6" textLength="26.4" lengthAdjust="spacingAndGlyphs">-</text>
  <text class="big" x="176.4" y="100" fill="#5ee08a" textLength="79.2" lengthAdjust="spacingAndGlyphs">rwx</text>
  <text class="big" x="255.6" y="100" fill="#5cc8d8" textLength="79.2" lengthAdjust="spacingAndGlyphs">r-x</text>
  <text class="big" x="334.8" y="100" fill="#e8c25a" textLength="79.2" lengthAdjust="spacingAndGlyphs">---</text>
  <text class="s" x="440" y="94">1 aluno aluno 0 Oct  1 08:39 script.sh</text>

  <g stroke-width="2" fill="none">
    <path d="M150 112 v10 h24 v-10" stroke="#9fb0a6"/>
    <path d="M178 112 v10 h76 v-10" stroke="#5ee08a"/>
    <path d="M258 112 v10 h76 v-10" stroke="#5cc8d8"/>
    <path d="M338 112 v10 h76 v-10" stroke="#e8c25a"/>
  </g>

  <text class="t" x="110" y="152" fill="#9fb0a6">tipo</text>
  <text class="s" x="40" y="172">- arquivo · d pasta · l link</text>

  <text class="t" x="190" y="200" style="fill:#5ee08a">dono</text>
  <text class="s" x="190" y="218">(user, u)</text>
  <text class="t" x="270" y="246" style="fill:#5cc8d8">grupo</text>
  <text class="s" x="270" y="264">(group, g)</text>
  <text class="t" x="350" y="200" style="fill:#e8c25a">outros</text>
  <text class="s" x="350" y="218">(others, o)</text>

  <!-- Octal -->
  <text class="n" x="196" y="320" style="fill:#5ee08a">7</text>
  <text class="n" x="276" y="320" style="fill:#5cc8d8">5</text>
  <text class="n" x="356" y="320" style="fill:#e8c25a">0</text>
  <text class="s" x="168" y="346">4+2+1</text>
  <text class="s" x="250" y="346">4+0+1</text>
  <text class="s" x="330" y="346">0+0+0</text>
  <text class="s" x="40" y="320">em octal:</text>

  <!-- Legend: one <text> per cell (SVG collapses repeated spaces). -->
  <rect x="480" y="150" width="390" height="200" rx="10" fill="#1c2521" stroke="#34413b"/>
  <text class="t" x="500" y="180" style="fill:#9fb0a6">Letra</text>
  <text class="t" x="560" y="180" style="fill:#9fb0a6">Valor</text>
  <text class="t" x="620" y="180" style="fill:#9fb0a6">Em arquivo</text>
  <text class="t" x="750" y="180" style="fill:#9fb0a6">Em pasta</text>
  <line x1="500" y1="192" x2="850" y2="192" stroke="#34413b"/>
  <text class="t" x="500" y="222" style="fill:#e6ede8">r</text>
  <text class="t" x="560" y="222" style="fill:#e6ede8">4</text>
  <text class="t" x="620" y="222" style="fill:#e6ede8">ler conteúdo</text>
  <text class="t" x="750" y="222" style="fill:#e6ede8">listar nomes</text>
  <text class="t" x="500" y="256" style="fill:#e6ede8">w</text>
  <text class="t" x="560" y="256" style="fill:#e6ede8">2</text>
  <text class="t" x="620" y="256" style="fill:#e6ede8">alterar</text>
  <text class="t" x="750" y="256" style="fill:#e6ede8">criar/apagar</text>
  <text class="t" x="500" y="290" style="fill:#e6ede8">x</text>
  <text class="t" x="560" y="290" style="fill:#e6ede8">1</text>
  <text class="t" x="620" y="290" style="fill:#e6ede8">executar</text>
  <text class="t" x="750" y="290" style="fill:#e6ede8">entrar (cd)</text>
  <text class="t" x="500" y="324" style="fill:#9fb0a6">-</text>
  <text class="t" x="560" y="324" style="fill:#9fb0a6">0</text>
  <text class="t" x="620" y="324" style="fill:#9fb0a6">sem a permissão</text>
</svg>
