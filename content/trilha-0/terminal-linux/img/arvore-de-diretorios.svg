<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">A árvore de diretórios do Linux</title>
  <desc id="d">Tudo nasce na raiz "/". Abaixo dela: /etc (configurações), /home (pastas dos usuários, como /home/aluno), /root (pasta do administrador), /tmp (temporários, todos escrevem), /var/log (registros), /usr/bin (programas), /dev e /proc (dispositivos e processos vistos como arquivos). Um caminho absoluto começa em "/"; um relativo começa onde você está.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .dir { font-size: 17px; font-weight: 700; }
    .note { font-size: 12.5px; fill: #9fb0a6; }
    .hot { fill: #e8c25a; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <rect width="900" height="470" fill="#121815"/>

  <rect class="box" x="400" y="20" width="100" height="44" rx="8" style="stroke:#5ee08a"/>
  <text class="dir" x="443" y="48" style="fill:#5ee08a">/</text>
  <text class="note" x="515" y="47">a raiz: o topo de tudo</text>

  <g stroke="#34413b" stroke-width="2" fill="none">
    <path d="M450 64 v26"/>
    <path d="M80 90 h740"/>
    <path d="M80 90 v22 M230 90 v22 M380 90 v22 M530 90 v22 M680 90 v22 M820 90 v22"/>
  </g>

  <rect class="box" x="30" y="112" width="100" height="40" rx="8"/>
  <text class="dir" x="52" y="138">etc/</text>
  <text class="note" x="20" y="174">configurações</text>
  <text class="note" x="20" y="192">do sistema</text>
  <text class="note hot" x="20" y="210">passwd, hosts,</text>
  <text class="note hot" x="20" y="228">shadow (só root)</text>

  <rect class="box" x="180" y="112" width="100" height="40" rx="8" style="stroke:#5cc8d8"/>
  <text class="dir" x="198" y="138">home/</text>
  <text class="note" x="170" y="174">pastas pessoais</text>
  <text class="note" x="170" y="192">dos usuários</text>

  <rect class="box" x="330" y="112" width="100" height="40" rx="8"/>
  <text class="dir" x="352" y="138">root/</text>
  <text class="note" x="320" y="174">pasta do root</text>
  <text class="note hot" x="320" y="192">fechada (700)</text>

  <rect class="box" x="480" y="112" width="100" height="40" rx="8"/>
  <text class="dir" x="507" y="138">tmp/</text>
  <text class="note" x="470" y="174">temporários;</text>
  <text class="note hot" x="470" y="192">todos escrevem</text>

  <rect class="box" x="630" y="112" width="100" height="40" rx="8"/>
  <text class="dir" x="652" y="138">var/</text>
  <text class="note" x="620" y="174">dados variáveis</text>
  <text class="note hot" x="620" y="192">var/log: registros</text>

  <rect class="box" x="770" y="112" width="100" height="40" rx="8"/>
  <text class="dir" x="792" y="138">usr/</text>
  <text class="note" x="760" y="174">programas:</text>
  <text class="note" x="760" y="192">usr/bin/ls,</text>
  <text class="note" x="760" y="210">usr/bin/grep...</text>

  <!-- home subtree -->
  <g stroke="#5cc8d8" stroke-width="2" fill="none">
    <path d="M230 152 v52"/>
    <path d="M230 204 v40 h30"/>
    <path d="M300 268 v28 h24 M300 268 v78 h24 M300 268 v128 h24"/>
  </g>
  <rect class="box" x="262" y="226" width="140" height="40" rx="8" style="stroke:#5cc8d8"/>
  <text class="dir" x="280" y="252" style="fill:#5cc8d8">aluno/</text>
  <text class="note" x="415" y="244">= ~ (til) para o aluno</text>
  <text class="note" x="415" y="262">absoluto: /home/aluno</text>

  <text class="dir" x="330" y="302">missao-1/</text>
  <text class="note" x="455" y="300">.cofre/  ← oculto: começa com ponto</text>
  <text class="dir" x="330" y="352">missao-2/</text>
  <text class="note" x="455" y="350">arquivo-morto/2023/08/semana-3/...</text>
  <text class="dir" x="330" y="402">missao-3/</text>
  <text class="note" x="455" y="400">vazamento.txt</text>

  <rect x="20" y="425" width="860" height="34" rx="6" fill="none" stroke="#34413b" stroke-dasharray="4 4"/>
  <text class="note" x="34" y="447">Absoluto: /home/aluno/missao-1   ·   Relativo (estando em /home/aluno): missao-1   ·   .. = pasta de cima</text>
</svg>
