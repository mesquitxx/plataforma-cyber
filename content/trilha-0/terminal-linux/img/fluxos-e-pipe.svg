<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">stdin, stdout, stderr e o pipe</title>
  <desc id="d">Todo processo tem três canais: entrada padrão (0, stdin), saída padrão (1, stdout) e saída de erro (2, stderr). No pipeline "sort vazamento.txt | uniq -c | sort -rn &gt; ranking.txt", a saída de cada comando vira a entrada do próximo, a saída final vai para um arquivo e os erros continuam indo para a tela.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f08c7a"/></marker>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="400" fill="#121815"/>

  <!-- Part 1: one process -->
  <text class="t" x="30" y="36">1. Um processo tem três canais</text>
  <rect class="box" x="330" y="56" width="200" height="70" rx="10"/>
  <text class="t" x="390" y="97">processo</text>
  <line x1="150" y1="91" x2="326" y2="91" stroke="#5cc8d8" stroke-width="2" marker-end="url(#c)"/>
  <text class="s" x="30" y="86" style="fill:#5cc8d8">0 stdin</text>
  <text class="s" x="30" y="104">teclado</text>
  <line x1="534" y1="76" x2="700" y2="76" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>
  <text class="s" x="710" y="72" style="fill:#5ee08a">1 stdout → tela</text>
  <text class="s" x="710" y="88">resultado normal</text>
  <line x1="534" y1="110" x2="700" y2="110" stroke="#f08c7a" stroke-width="2" marker-end="url(#r)"/>
  <text class="s" x="710" y="114" style="fill:#f08c7a">2 stderr → tela</text>
  <text class="s" x="710" y="130">mensagens de erro</text>

  <!-- Part 2: pipeline -->
  <text class="t" x="30" y="186">2. O pipe | liga a saída de um à entrada do próximo</text>
  <rect class="box" x="30" y="210" width="190" height="56" rx="10"/>
  <text class="t" x="44" y="243">sort vaz...txt</text>
  <rect class="box" x="300" y="210" width="150" height="56" rx="10"/>
  <text class="t" x="320" y="243">uniq -c</text>
  <rect class="box" x="530" y="210" width="150" height="56" rx="10"/>
  <text class="t" x="555" y="243">sort -rn</text>
  <rect class="box" x="760" y="210" width="120" height="56" rx="10" style="stroke:#e8c25a"/>
  <text class="t" x="770" y="236" style="fill:#e8c25a">ranking</text>
  <text class="t" x="770" y="256" style="fill:#e8c25a">.txt</text>

  <line x1="220" y1="238" x2="296" y2="238" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>
  <text class="t" x="250" y="230" style="fill:#5ee08a">|</text>
  <line x1="450" y1="238" x2="526" y2="238" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>
  <text class="t" x="480" y="230" style="fill:#5ee08a">|</text>
  <line x1="680" y1="238" x2="756" y2="238" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>
  <text class="t" x="708" y="230" style="fill:#e8c25a">&gt;</text>

  <g stroke="#f08c7a" stroke-width="1.5" stroke-dasharray="5 4" fill="none">
    <path d="M125 266 v50" marker-end="url(#r)"/>
    <path d="M375 266 v50" marker-end="url(#r)"/>
    <path d="M605 266 v50" marker-end="url(#r)"/>
  </g>
  <rect x="30" y="320" width="650" height="30" rx="6" fill="none" stroke="#f08c7a" stroke-dasharray="4 4"/>
  <text class="s" x="44" y="340" style="fill:#f08c7a">stderr de todos continua indo para a tela (o pipe só carrega o stdout)</text>

  <text class="s" x="30" y="382">Redirecionar:  &gt; arquivo (sobrescreve) · &gt;&gt; arquivo (acrescenta) · 2&gt; arquivo (só erros) · &lt; arquivo (entrada)</text>
</svg>
