<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">Anatomia de uma linha de comando</title>
  <desc id="d">A linha "aluno@sandbox:~/missao-1$ ls -la .cofre" dividida em partes: usuário, máquina, diretório atual, símbolo do prompt, comando, opções e argumento.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; }
    .cmd { font-size: 26px; }
    .lbl { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12.5px; fill: #9fb0a6; }
  </style>
  <rect width="900" height="330" fill="#121815"/>
  <rect x="20" y="120" width="860" height="64" rx="10" fill="#1c2521" stroke="#34413b"/>

  <!-- One <text> per token with a fixed textLength (15.6 per character), so the
       brackets line up whatever monospace font the system picks. -->
  <text class="cmd" x="40.0" y="162" fill="#5ee08a" textLength="78.0" lengthAdjust="spacingAndGlyphs">aluno</text>
  <text class="cmd" x="118.0" y="162" fill="#9fb0a6" textLength="15.6" lengthAdjust="spacingAndGlyphs">@</text>
  <text class="cmd" x="133.6" y="162" fill="#5ee08a" textLength="109.2" lengthAdjust="spacingAndGlyphs">sandbox</text>
  <text class="cmd" x="242.8" y="162" fill="#9fb0a6" textLength="15.6" lengthAdjust="spacingAndGlyphs">:</text>
  <text class="cmd" x="258.4" y="162" fill="#5cc8d8" textLength="156.0" lengthAdjust="spacingAndGlyphs">~/missao-1</text>
  <text class="cmd" x="414.4" y="162" fill="#e6ede8" textLength="15.6" lengthAdjust="spacingAndGlyphs">$</text>
  <text class="cmd" x="445.6" y="162" fill="#e8c25a" textLength="31.2" lengthAdjust="spacingAndGlyphs">ls</text>
  <text class="cmd" x="492.4" y="162" fill="#f08c7a" textLength="46.8" lengthAdjust="spacingAndGlyphs">-la</text>
  <text class="cmd" x="554.8" y="162" fill="#c9a6ff" textLength="93.6" lengthAdjust="spacingAndGlyphs">.cofre</text>

  <!-- Brackets above: prompt parts -->
  <g stroke-width="2" fill="none">
    <path d="M40 110 v-8 h78 v8" stroke="#5ee08a"/>
    <path d="M134 110 v-8 h109 v8" stroke="#5ee08a"/>
    <path d="M259 110 v-8 h156 v8" stroke="#5cc8d8"/>
    <path d="M417 110 v-8 h14 v8" stroke="#e6ede8"/>
  </g>
  <text class="lbl" x="40" y="68" fill="#5ee08a">usuário</text>
  <text class="sub" x="40" y="88">quem você é</text>
  <text class="lbl" x="150" y="40" fill="#5ee08a">máquina</text>
  <text class="sub" x="150" y="60">"hostname"</text>
  <text class="lbl" x="268" y="68" fill="#5cc8d8">diretório atual</text>
  <text class="sub" x="268" y="88">~ = sua pasta pessoal</text>
  <text class="lbl" x="440" y="40" fill="#e6ede8">$ = usuário comum</text>
  <text class="sub" x="440" y="60"># = root (cuidado!)</text>
  <line x1="424" y1="66" x2="424" y2="100" stroke="#e6ede8" stroke-width="1.5"/>

  <!-- Brackets below: command parts -->
  <g stroke-width="2" fill="none">
    <path d="M446 194 v8 h31 v-8" stroke="#e8c25a"/>
    <path d="M493 194 v8 h47 v-8" stroke="#f08c7a"/>
    <path d="M556 194 v8 h94 v-8" stroke="#c9a6ff"/>
  </g>
  <text class="lbl" x="420" y="236" fill="#e8c25a">comando</text>
  <text class="sub" x="420" y="256">o programa</text>
  <text class="lbl" x="530" y="282" fill="#f08c7a">opções</text>
  <text class="sub" x="530" y="302">mudam o comportamento</text>
  <text class="lbl" x="660" y="236" fill="#c9a6ff">argumento</text>
  <text class="sub" x="660" y="256">sobre o que agir</text>
  <line x1="516" y1="206" x2="545" y2="266" stroke="#f08c7a" stroke-width="1.5"/>

  <rect x="40" y="206" width="350" height="96" rx="8" fill="none" stroke="#34413b" stroke-dasharray="4 4"/>
  <text class="lbl" x="56" y="232" fill="#9fb0a6">Prompt: escrito pelo shell</text>
  <text class="sub" x="56" y="254">Não se digita. Mostra quem, onde</text>
  <text class="sub" x="56" y="274">e com qual poder você está agora.</text>
  <text class="sub" x="56" y="294">Depois do $ começa o que você digita.</text>
</svg>
