<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">Os três modos do vim</title>
  <desc id="d">O vim abre no modo normal, em que as teclas são comandos (dd apaga a linha, u desfaz, /texto busca). A tecla i (ou a, o) leva ao modo de inserção, em que as teclas viram texto; Esc volta ao normal. Dois-pontos, a partir do modo normal, abre a linha de comando: :w grava, :q sai, :wq grava e sai, :q! sai descartando as mudanças; Enter executa e volta ao normal, Esc cancela. Na dúvida, aperte Esc duas vezes e digite :q! para sair sem salvar.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 15px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e8c25a"/></marker>
  </defs>
  <rect width="900" height="380" fill="#121815"/>
  <text class="t" x="30" y="36">vim é "modal": a mesma tecla faz coisas diferentes em cada modo</text>

  <rect class="box" x="320" y="70" width="260" height="110" rx="12" style="stroke:#5cc8d8"/>
  <text class="m" x="336" y="96" style="fill:#5cc8d8">NORMAL (abre aqui)</text>
  <text class="s" x="336" y="118">teclas são comandos:</text>
  <text class="s" x="336" y="136">dd apaga linha · u desfaz</text>
  <text class="s" x="336" y="154">/texto busca · G vai ao fim</text>
  <text class="s" x="336" y="172">x apaga caractere</text>

  <rect class="box" x="30" y="230" width="250" height="100" rx="12" style="stroke:#5ee08a"/>
  <text class="m" x="46" y="256" style="fill:#5ee08a">INSERÇÃO</text>
  <text class="s" x="46" y="278">teclas viram texto</text>
  <text class="s" x="46" y="296">rodapé: -- INSERT --</text>

  <rect class="box" x="620" y="230" width="250" height="100" rx="12" style="stroke:#e8c25a"/>
  <text class="m" x="636" y="256" style="fill:#e8c25a">LINHA DE COMANDO</text>
  <text class="s" x="636" y="278">:w grava   :q sai</text>
  <text class="s" x="636" y="296">:wq grava e sai</text>
  <text class="s" x="636" y="314">:q! sai sem salvar</text>

  <path d="M320 150 C230 150 170 180 170 226" fill="none" stroke="#5ee08a" stroke-width="2" marker-end="url(#g)"/>
  <text class="s" x="96" y="196" style="fill:#5ee08a">i, a, o</text>
  <path d="M280 300 C360 300 400 230 420 184" fill="none" stroke="#9fb0a6" stroke-width="2" marker-end="url(#g)"/>
  <text class="s" x="330" y="262">Esc</text>

  <path d="M580 150 C670 150 730 180 730 226" fill="none" stroke="#e8c25a" stroke-width="2" marker-end="url(#y)"/>
  <text class="s" x="742" y="196" style="fill:#e8c25a">: (dois-pontos)</text>
  <path d="M620 300 C540 300 500 230 480 184" fill="none" stroke="#9fb0a6" stroke-width="2" marker-end="url(#y)"/>
  <text class="s" x="522" y="222">Enter ou Esc</text>

  <rect x="300" y="340" width="300" height="30" rx="6" fill="none" stroke="#f08c7a" stroke-dasharray="4 4"/>
  <text class="s" x="314" y="360" style="fill:#f08c7a">Perdido? Esc, Esc, :q!  e Enter</text>
</svg>
