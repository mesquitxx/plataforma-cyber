<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" width="1300" height="760" role="img" aria-labelledby="t d" data-generator="fireworks-tech-graph" data-style-id="2" data-visual-theme="Dark Terminal">
  <title id="t">Mapa dos 74 bytes do quadro SYN: Ethernet, IPv4 e TCP em fila</title>
  <desc id="d">Grade de 16 bytes por linha, igual ao despejo hexadecimal da Missão 3, com as linhas 0000 a 0040. Amarelo é o cabeçalho Ethernet (bytes 0x00 a 0x0d: MAC de destino, MAC de origem, tipo 0800). Ciano é o IPv4 (0x0e a 0x21: versão e tamanho, prioridade, comprimento total, identificação, flags e fragmento, TTL em 0x16, protocolo em 0x17, checksum, IP de origem em 0x1a a 0x1d, IP de destino em 0x1e a 0x21). Verde é o TCP (0x22 a 0x49: porta de origem, porta de destino, número de sequência, número de confirmação, tamanho do cabeçalho, flags em 0x2f, janela, checksum, urgência e 20 bytes de opções). 14 + 20 + 40 = 74 bytes.</desc>
