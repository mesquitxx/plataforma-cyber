<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d">
  <title id="t">Mapa dos 74 bytes do quadro SYN da Missão 3</title>
  <desc id="d">Uma grade com 16 bytes por linha, na mesma disposição do dump hexadecimal da Missão 3, com deslocamentos 0000, 0010, 0020, 0030 e 0040 à esquerda. Cada byte está colorido pelo cabeçalho a que pertence: amarelo para Ethernet, bytes 0 a 13; ciano para IPv4, bytes 14 a 33; verde para TCP, bytes 34 a 73. Dentro da grade, cada campo tem um rótulo curto. Campos: MAC de destino, bytes 0 a 5 (0x00); MAC de origem, bytes 6 a 11 (0x06); EtherType (0800 = IPv4), bytes 12 a 13 (0x0c); versão e tamanho do cabeçalho IP, byte 14 (0x0e); DSCP/ECN (prioridade), byte 15 (0x0f); comprimento total do pacote IP, bytes 16 a 17 (0x10); identificação, bytes 18 a 19 (0x12); flags e deslocamento de fragmento, bytes 20 a 21 (0x14); TTL, byte 22 (0x16); protocolo (06 = TCP), byte 23 (0x17); checksum do cabeçalho IP, bytes 24 a 25 (0x18); IP de origem, bytes 26 a 29 (0x1a); IP de destino, bytes 30 a 33 (0x1e); porta de origem, bytes 34 a 35 (0x22); porta de destino, bytes 36 a 37 (0x24); número de sequência, bytes 38 a 41 (0x26); número de confirmação, bytes 42 a 45 (0x2a); tamanho do cabeçalho TCP, byte 46 (0x2e); flags TCP (SYN, ACK...), byte 47 (0x2f); janela, bytes 48 a 49 (0x30); checksum TCP, bytes 50 a 51 (0x32); ponteiro de urgência, bytes 52 a 53 (0x34); opções TCP, bytes 54 a 73 (0x36).</desc>
  <style>
