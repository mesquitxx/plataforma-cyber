<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">subprocess com shell=True contra lista de argumentos: o caminho da injeção</title>
  <desc id="d">Em cima, o caminho inseguro: a variável alvo vale 127.0.0.1; echo INJETADO: $(id -un). Uma f-string monta o texto echo testando seguido do alvo, e subprocess.run com shell=True entrega esse texto a /bin/sh -c. O shell lê o texto como código: o ponto e vírgula separa comandos e o $( ) executa id -un. Resultado real: duas linhas, testando 127.0.0.1 e INJETADO: aluno. Embaixo, o caminho seguro: subprocess.run recebe uma lista, ["echo", "testando", alvo]. Não há shell no meio: o Python chama o programa echo diretamente, por execve, e o alvo inteiro é um único argumento. Resultado real: uma linha só, testando 127.0.0.1; echo INJETADO: $(id -un), com o texto literal, sem nada executado.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 13.5px; font-weight: 700; }
    .s { font-size: 12px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f08c7a"/></marker>
  </defs>
  <rect width="900" height="430" fill="#121815"/>
  <text class="s" x="30" y="26">alvo = "127.0.0.1; echo INJETADO: $(id -un)"   (veio de fora do script)</text>

  <text class="t" x="30" y="58" style="fill:#f08c7a">Inseguro: shell=True com texto montado</text>
  <rect class="box" x="30" y="72" width="260" height="76" rx="10"/>
  <text class="m" x="44" y="96">f-string monta TEXTO</text>
  <text class="s" x="44" y="118">f"echo testando {alvo}"</text>
  <text class="s" x="44" y="136">shell=True</text>

  <rect class="box" x="316" y="72" width="270" height="76" rx="10" style="stroke:#f08c7a"/>
  <text class="m" x="330" y="96" style="fill:#f08c7a">/bin/sh -c "texto"</text>
  <text class="s" x="330" y="118">; separa comandos</text>
  <text class="s" x="330" y="136">$( ) executa id -un</text>

  <rect class="box" x="612" y="72" width="258" height="76" rx="10" style="stroke:#f08c7a"/>
  <text class="m" x="626" y="96">saída real</text>
  <text class="s" x="626" y="118">testando 127.0.0.1</text>
  <text class="s" x="626" y="136" style="fill:#f08c7a">INJETADO: aluno</text>
  <g stroke="#f08c7a" stroke-width="1.5">
    <line x1="290" y1="110" x2="312" y2="110" marker-end="url(#r)"/>
    <line x1="586" y1="110" x2="608" y2="110" marker-end="url(#r)"/>
  </g>

  <line x1="30" y1="178" x2="870" y2="178" stroke="#34413b" stroke-width="1.5"/>

  <text class="t" x="30" y="212" style="fill:#5ee08a">Seguro: lista de argumentos, sem shell</text>
  <rect class="box" x="30" y="226" width="260" height="76" rx="10"/>
  <text class="m" x="44" y="250">uma LISTA</text>
  <text class="s" x="44" y="272">["echo", "testando",</text>
  <text class="s" x="44" y="290"> alvo]</text>

  <rect class="box" x="316" y="226" width="270" height="76" rx="10" style="stroke:#5ee08a"/>
  <text class="m" x="330" y="250" style="fill:#5ee08a">execve("echo", lista)</text>
  <text class="s" x="330" y="272">nenhum shell lê nada:</text>
  <text class="s" x="330" y="290">alvo é UM argumento</text>

  <rect class="box" x="612" y="226" width="258" height="76" rx="10" style="stroke:#5ee08a"/>
  <text class="m" x="626" y="250">saída real</text>
  <text class="s" x="626" y="272">testando 127.0.0.1; echo</text>
  <text class="s" x="626" y="290">INJETADO: $(id -un)</text>
  <g stroke="#5ee08a" stroke-width="1.5">
    <line x1="290" y1="264" x2="312" y2="264" marker-end="url(#g)"/>
    <line x1="586" y1="264" x2="608" y2="264" marker-end="url(#g)"/>
  </g>

  <rect class="box" x="30" y="330" width="840" height="80" rx="10"/>
  <text class="m" x="44" y="354">Mesma lição do eval no 0.6: o perigo é um texto com dados de fora</text>
  <text class="m" x="44" y="372">ser LIDO DE NOVO como código.</text>
  <text class="s" x="44" y="394">Também ficam no mesmo grupo: eval(), exec(), os.system(), pickle.loads().</text>
</svg>
