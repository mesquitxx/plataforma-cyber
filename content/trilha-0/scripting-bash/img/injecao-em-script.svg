<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d">
  <title id="t">Quando dado vira código: injeção de comandos num script com eval, e a versão segura</title>
  <desc id="d">Em cima, o caminho inseguro: o usuário passa o argumento 192.168.0.10; id. O script monta o texto echo Testando o host 192.168.0.10; id e entrega ao eval. O eval faz o shell ler esse texto de novo como código, e o ponto e vírgula, que era só um caractere do dado, vira um separador de comandos: rodam dois comandos, o echo e o id, que imprime uid=1000(aluno). Embaixo, o caminho seguro: o argumento passa primeiro por uma validação com expressão regular de IPv4; como contém ponto e vírgula e espaço, é recusado com código 2. Mesmo que passasse, sem eval e com a variável entre aspas, ela seria um único argumento do comando e nunca seria lida como código.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; white-space: pre; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 13.5px; font-weight: 700; }
    .s { font-size: 12px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ee08a"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f08c7a"/></marker>
  </defs>
  <rect width="900" height="500" fill="#121815"/>
  <text class="t" x="30" y="34" style="fill:#f08c7a">Inseguro: o dado é lido de novo como código</text>

  <rect class="box" x="30" y="54" width="180" height="72" rx="10"/>
  <text class="m" x="44" y="78">argumento $1</text>
  <text class="s" x="44" y="100">192.168.0.10; id</text>
  <text class="s" x="44" y="116">(um dado só)</text>

  <rect class="box" x="236" y="54" width="344" height="72" rx="10"/>
  <text class="m" x="250" y="78">o script monta TEXTO</text>
  <text class="s" x="250" y="100">"echo Testando o host 192.168.0.10; id"</text>

  <rect class="box" x="606" y="54" width="264" height="72" rx="10" style="stroke:#f08c7a"/>
  <text class="m" x="620" y="78" style="fill:#f08c7a">eval: o shell relê</text>
  <text class="s" x="620" y="100">o ; vira separador de comandos</text>

  <g stroke="#f08c7a" stroke-width="1.5">
    <line x1="210" y1="90" x2="232" y2="90" marker-end="url(#r)"/>
    <line x1="580" y1="90" x2="602" y2="90" marker-end="url(#r)"/>
    <line x1="738" y1="126" x2="738" y2="150" marker-end="url(#r)"/>
  </g>
  <rect class="box" x="430" y="154" width="440" height="74" rx="10" style="stroke:#f08c7a"/>
  <text class="s" x="444" y="176">comando 1: echo Testando o host 192.168.0.10</text>
  <text class="s" x="444" y="196" style="fill:#f08c7a">comando 2: id   → uid=1000(aluno) gid=1000(aluno) ...</text>
  <text class="s" x="444" y="216">o "id" poderia ser rm, curl, qualquer coisa</text>
  <text class="s" x="30" y="176">Mesma família de falha da Shellshock (0.4)</text>
  <text class="s" x="30" y="192">e da command injection em sites (Trilha 4):</text>
  <text class="s" x="30" y="208">a fronteira entre dado e código se perdeu.</text>

  <line x1="30" y1="252" x2="870" y2="252" stroke="#34413b" stroke-width="1.5"/>
  <text class="t" x="30" y="284" style="fill:#5ee08a">Seguro: validar, não usar eval e sempre pôr aspas</text>

  <rect class="box" x="30" y="304" width="180" height="72" rx="10"/>
  <text class="m" x="44" y="328">argumento $1</text>
  <text class="s" x="44" y="350">192.168.0.10; id</text>

  <rect class="box" x="236" y="304" width="344" height="72" rx="10" style="stroke:#e8c25a"/>
  <text class="m" x="250" y="328" style="fill:#e8c25a">validar (allowlist)</text>
  <text class="s" x="250" y="350">[[ $alvo =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]</text>
  <text class="s" x="250" y="366">só dígitos e pontos passam</text>

  <rect class="box" x="606" y="304" width="264" height="72" rx="10" style="stroke:#f08c7a"/>
  <text class="m" x="620" y="328" style="fill:#f08c7a">recusado, código 2</text>
  <text class="s" x="620" y="350">erro: '192.168.0.10; id' não</text>
  <text class="s" x="620" y="366">parece um IPv4</text>

  <g stroke-width="1.5">
    <line x1="210" y1="340" x2="232" y2="340" stroke="#5ee08a" marker-end="url(#g)"/>
    <line x1="580" y1="340" x2="602" y2="340" stroke="#f08c7a" marker-end="url(#r)"/>
  </g>

  <rect class="box" x="30" y="396" width="840" height="84" rx="10" style="stroke:#5ee08a"/>
  <text class="m" x="44" y="420" style="fill:#5ee08a">E se passasse? Sem eval, "$alvo" é UM argumento e nunca é relido:</text>
  <text class="s" x="44" y="444">echo "Testando o host $alvo"   → imprime o texto inteiro, ponto e vírgula incluído, e não roda nada.</text>
  <text class="s" x="44" y="464">Por isso as duas camadas: a validação recusa o estranho; as aspas sem eval impedem a releitura.</text>
</svg>
