<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">Como os serviços do Windows são iniciados</title>
  <desc id="d">No topo, o registro: cada serviço é uma chave em HKLM\SYSTEM\CurrentControlSet\Services, com os valores ImagePath (o que executar), ObjectName (a conta), Start (quando iniciar: 2 automático, 3 manual, 4 desativado) e Type (processo próprio ou compartilhado). No meio, o Service Control Manager, o processo services.exe, que lê essas chaves no boot e inicia os serviços automáticos. Embaixo, três exemplos reais. O Spooler de Impressão roda num processo próprio, spoolsv.exe, como LocalSystem. O Agendador de Tarefas roda dentro de um svchost.exe -k netsvcs, como LocalSystem. O Cliente DNS roda num svchost.exe -k NetworkService, como NetworkService. À direita, as contas de serviço da mais para a menos poderosa: LocalSystem (o SYSTEM, poder total), NetworkService (pouco poder local, mas se apresenta na rede como o computador) e LocalService (pouco poder local, anônimo na rede).</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .m { font-size: 14px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #c9d6ce; }
    .k { font-size: 12px; fill: #9fb0a6; }
    .box { fill: #1c2521; stroke: #34413b; stroke-width: 1.5; }
    .scm { fill: #1b2a21; stroke: #5ee08a; stroke-width: 1.8; }
    .hot { fill: #2a1d1b; stroke: #f08c7a; stroke-width: 1.6; }
    .ln { stroke: #9fb0a6; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="36">Do registro ao processo: o caminho de um serviço</text>

  <rect class="box" x="30" y="54" width="580" height="96" rx="10"/>
  <text class="m" x="46" y="78">HKLM\SYSTEM\CurrentControlSet\Services\&lt;nome&gt;</text>
  <text class="s" x="46" y="100">ImagePath  = o que executar (com ou sem aspas!)</text>
  <text class="s" x="46" y="118">ObjectName = a conta    Start = 2 auto, 3 manual, 4 off</text>
  <text class="s" x="46" y="136">Type = 0x10 processo próprio, 0x20 compartilhado</text>

  <path class="ln" d="M320 150 L320 176" marker-end="url(#a)"/>
  <rect class="scm" x="130" y="178" width="380" height="56" rx="10"/>
  <text class="m" x="146" y="202" style="fill:#5ee08a">Service Control Manager</text>
  <text class="s" x="146" y="222">services.exe: lê as chaves e inicia</text>

  <path class="ln" d="M220 234 L110 276" marker-end="url(#a)"/>
  <path class="ln" d="M320 234 L320 276" marker-end="url(#a)"/>
  <path class="ln" d="M420 234 L520 276" marker-end="url(#a)"/>

  <rect class="hot" x="30" y="278" width="180" height="96" rx="10"/>
  <text class="m" x="44" y="302">spoolsv.exe</text>
  <text class="s" x="44" y="324">Spooler</text>
  <text class="k" x="44" y="344">processo próprio</text>
  <text class="k" x="44" y="362">LocalSystem</text>

  <rect class="hot" x="226" y="278" width="190" height="96" rx="10"/>
  <text class="m" x="240" y="302">svchost.exe</text>
  <text class="s" x="240" y="324">-k netsvcs -p</text>
  <text class="k" x="240" y="344">Schedule, BITS...</text>
  <text class="k" x="240" y="362">LocalSystem</text>

  <rect class="box" x="432" y="278" width="190" height="96" rx="10"/>
  <text class="m" x="446" y="302">svchost.exe</text>
  <text class="s" x="446" y="324">-k NetworkService -p</text>
  <text class="k" x="446" y="344">Dnscache</text>
  <text class="k" x="446" y="362">NetworkService</text>

  <rect class="box" x="650" y="54" width="220" height="320" rx="10"/>
  <text class="m" x="666" y="78">Contas de serviço</text>
  <text class="s" x="666" y="106" style="fill:#f08c7a">LocalSystem</text>
  <text class="k" x="666" y="124">= SYSTEM, S-1-5-18</text>
  <text class="k" x="666" y="142">poder total na máquina</text>
  <text class="s" x="666" y="176">NetworkService</text>
  <text class="k" x="666" y="194">S-1-5-20, pouco poder</text>
  <text class="k" x="666" y="212">local; na rede, aparece</text>
  <text class="k" x="666" y="230">como o computador</text>
  <text class="s" x="666" y="264">LocalService</text>
  <text class="k" x="666" y="282">S-1-5-19, pouco poder</text>
  <text class="k" x="666" y="300">local; anônimo na rede</text>
  <text class="k" x="666" y="340">menos poder = menos</text>
  <text class="k" x="666" y="358">estrago se for invadido</text>

  <rect class="box" x="30" y="392" width="840" height="58" rx="10"/>
  <text class="s" x="46" y="416">Vermelho: rodam como LocalSystem. Uma falha num serviço desses entrega o SYSTEM inteiro</text>
  <text class="s" x="46" y="436">(é o que aconteceu com o Spooler no PrintNightmare, seção 4).</text>
</svg>
