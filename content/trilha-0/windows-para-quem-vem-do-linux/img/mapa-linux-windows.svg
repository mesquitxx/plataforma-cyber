<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Mapa de equivalências entre Linux e Windows</title>
  <desc id="d">Tabela em três colunas: o conceito, como ele aparece no Linux e como aparece no Windows. Superusuário: root (UID 0) no Linux; SYSTEM (S-1-5-18) e o grupo Administradores no Windows. Identidade: UID e GID; SID. Contas e senhas: /etc/passwd e /etc/shadow; o banco SAM, guardado no registro. Credenciais do processo: UID, grupos e capabilities; o access token, com SIDs, privilégios e nível de integridade. Permissões: rwx em três trios; ACL com várias ACEs. Configuração: arquivos de texto em /etc; o registro, em colmeias binárias. Serviços: systemd e systemctl; o Service Control Manager e sc.exe. Agendamento: cron e timers; o Agendador de Tarefas e schtasks. Virar administrador: sudo; o UAC e o terminal elevado. Shell: Bash; cmd e PowerShell. Logs: journal e /var/log; o Visualizador de Eventos. Pacotes: apt; winget, Microsoft Store e instaladores.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13.5px; font-weight: 700; fill: #5ee08a; }
    .c { font-size: 13px; font-weight: 700; }
    .s { font-size: 12.5px; fill: #c9d6ce; }
    .row { fill: #1c2521; stroke: #34413b; stroke-width: 1; }
  </style>
  <rect width="900" height="520" fill="#121815"/>
  <text class="t" x="30" y="36">O que você já conhece, com outro nome</text>
  <text class="h" x="40" y="70">Conceito</text>
  <text class="h" x="270" y="70">Linux</text>
  <text class="h" x="560" y="70">Windows</text>

  <rect class="row" x="30" y="82" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="102">Superusuário</text>
  <text class="s" x="270" y="102">root (UID 0)</text>
  <text class="s" x="560" y="102">SYSTEM (S-1-5-18) e Administradores</text>

  <rect class="row" x="30" y="117" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="137">Identidade</text>
  <text class="s" x="270" y="137">UID / GID (números)</text>
  <text class="s" x="560" y="137">SID (S-1-5-21-...-RID)</text>

  <rect class="row" x="30" y="152" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="172">Contas e hashes</text>
  <text class="s" x="270" y="172">/etc/passwd, /etc/shadow</text>
  <text class="s" x="560" y="172">banco SAM (colmeia do registro)</text>

  <rect class="row" x="30" y="187" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="207">Credencial do processo</text>
  <text class="s" x="270" y="207">UID, grupos, capabilities</text>
  <text class="s" x="560" y="207">access token: SIDs, privilégios</text>

  <rect class="row" x="30" y="222" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="242">Permissões</text>
  <text class="s" x="270" y="242">rwx em três trios</text>
  <text class="s" x="560" y="242">ACL com várias ACEs (allow/deny)</text>

  <rect class="row" x="30" y="257" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="277">Configuração</text>
  <text class="s" x="270" y="277">texto em /etc</text>
  <text class="s" x="560" y="277">registro (colmeias binárias)</text>

  <rect class="row" x="30" y="292" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="312">Serviços</text>
  <text class="s" x="270" y="312">systemd, systemctl</text>
  <text class="s" x="560" y="312">SCM (services.exe), sc.exe</text>

  <rect class="row" x="30" y="327" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="347">Agendamento</text>
  <text class="s" x="270" y="347">cron, timers do systemd</text>
  <text class="s" x="560" y="347">Agendador de Tarefas, schtasks</text>

  <rect class="row" x="30" y="362" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="382">Agir como admin</text>
  <text class="s" x="270" y="382">sudo</text>
  <text class="s" x="560" y="382">UAC e o terminal elevado</text>

  <rect class="row" x="30" y="397" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="417">Shell</text>
  <text class="s" x="270" y="417">Bash (texto no pipe)</text>
  <text class="s" x="560" y="417">cmd e PowerShell (objetos)</text>

  <rect class="row" x="30" y="432" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="452">Logs</text>
  <text class="s" x="270" y="452">journal, /var/log</text>
  <text class="s" x="560" y="452">Visualizador de Eventos (.evtx)</text>

  <rect class="row" x="30" y="467" width="840" height="30" rx="5"/>
  <text class="c" x="40" y="487">Pacotes</text>
  <text class="s" x="270" y="487">apt, dpkg</text>
  <text class="s" x="560" y="487">winget, Store, instaladores</text>
</svg>
