<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">A estrutura lógica do Active Directory: floresta, árvores, domínios e unidades organizacionais</title>
  <desc id="d">Uma moldura grande, em ciano, representa a FLORESTA corp.local, rotulada como a fronteira de segurança. Dentro dela há duas árvores. À esquerda, a árvore corp.local: no topo o domínio raiz da floresta, corp.local, que é o único lugar onde existem os grupos Enterprise Admins e Schema Admins; abaixo dele, ligado por uma linha de parentesco, o domínio filho filial.corp.local, cujo nome continua o do pai. À direita, a árvore parceiro.local, um domínio com nome DNS diferente, mas na mesma floresta. Setas de duas pontas entre corp.local e filial.corp.local e entre corp.local e parceiro.local representam as relações de confiança automáticas, bidirecionais e transitivas que o AD cria dentro de uma floresta. Embaixo, uma ampliação do domínio corp.local mostra as unidades organizacionais: OU São Paulo contém OU Financeiro, que contém OU Estações e a conta ana.lima; ao lado, o contêiner CN=Users, que não é uma OU. Uma faixa no rodapé resume: o domínio é a fronteira de administração; a floresta é a fronteira de segurança; a OU organiza e recebe GPOs, mas não dá permissão a ninguém.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .s { font-size: 11px; fill: #9fb0a6; }
    .g { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .w { font-size: 11px; font-weight: 700; fill: #f0c05a; }
    .forest { fill: none; stroke: #5cc8d8; stroke-width: 2.5; stroke-dasharray: 8 5; }
    .dom { fill: #16201b; stroke: #9fb0a6; stroke-width: 2; }
    .root { fill: #16201b; stroke: #5ee08a; stroke-width: 2.5; }
    .ou { fill: #1b2721; stroke: #2c3a33; stroke-width: 1.5; }
    .cn { fill: #121815; stroke: #6b7a71; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tr { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#a); marker-start: url(#b); }
    .par { stroke: #9fb0a6; stroke-width: 1.5; fill: none; }
    .zoom { stroke: #6b7a71; stroke-width: 1; fill: none; stroke-dasharray: 3 3; }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="600" fill="#121815"/>
  <text class="t" x="30" y="34">Floresta, árvores, domínios e OUs</text>

  <rect class="forest" x="30" y="52" width="900" height="250" rx="14"/>
  <text class="h" x="48" y="76">FLORESTA corp.local</text>
  <text class="s" x="48" y="94">fronteira de segurança do AD</text>

  <text class="s" x="120" y="122">árvore 1: corp.local</text>
  <rect class="root" x="90" y="132" width="250" height="62" rx="8"/>
  <text class="h" x="106" y="156">corp.local</text>
  <text class="s" x="106" y="174">domínio raiz da floresta</text>
  <text class="g" x="106" y="188">Enterprise Admins · Schema Admins</text>

  <line class="par" x1="215" y1="194" x2="215" y2="226"/>
  <rect class="dom" x="90" y="226" width="250" height="56" rx="8"/>
  <text class="h" x="106" y="250">filial.corp.local</text>
  <text class="s" x="106" y="268">domínio filho: o nome continua o do pai</text>

  <text class="s" x="640" y="122">árvore 2: parceiro.local</text>
  <rect class="dom" x="610" y="132" width="290" height="62" rx="8"/>
  <text class="h" x="626" y="156">parceiro.local</text>
  <text class="s" x="626" y="174">outro nome DNS, mesma floresta</text>
  <text class="s" x="626" y="188">(nova árvore, mesmo schema)</text>

  <path class="tr" d="M348,163 L602,163"/>
  <text class="s" x="384" y="152">trust bidirecional e transitivo</text>
  <text class="s" x="384" y="182">(criado automaticamente)</text>
  <path class="tr" d="M80,180 C40,200 40,240 80,256"/>

  <text class="w" x="380" y="236">Um administrador de qualquer domínio</text>
  <text class="w" x="380" y="252">desta floresta pode alcançar os outros:</text>
  <text class="w" x="380" y="268">por isso o domínio NÃO isola.</text>

  <path class="zoom" d="M90,194 L60,330"/>
  <path class="zoom" d="M340,194 L900,330"/>
  <rect class="dom" x="60" y="330" width="840" height="200" rx="10"/>
  <text class="h" x="76" y="354">dentro do domínio corp.local (DC=corp,DC=local)</text>

  <rect class="ou" x="80" y="370" width="520" height="146" rx="8"/>
  <text class="g" x="96" y="392">OU=Sao Paulo</text>
  <rect class="ou" x="110" y="402" width="470" height="104" rx="8"/>
  <text class="g" x="126" y="424">OU=Financeiro</text>
  <rect class="ou" x="140" y="436" width="200" height="56" rx="6"/>
  <text class="g" x="156" y="458">OU=Estacoes</text>
  <text class="s" x="156" y="476">WS-FIN-07 (computador)</text>
  <text class="s" x="366" y="458">CN=Ana Lima (usuário)</text>
  <text class="s" x="366" y="476">CN=GG-Financeiro (grupo)</text>

  <rect class="cn" x="625" y="370" width="255" height="146" rx="8"/>
  <text class="s" x="641" y="392">CN=Users</text>
  <text class="s" x="641" y="410">contêiner padrão, NÃO é OU:</text>
  <text class="s" x="641" y="428">não recebe link de GPO</text>
  <text class="s" x="641" y="458">CN=Administrator</text>
  <text class="s" x="641" y="476">CN=Domain Admins</text>

  <text class="s" x="30" y="560">Domínio = fronteira de administração e de política de senha · Floresta = fronteira de segurança</text>
  <text class="s" x="30" y="580">OU = pasta que organiza objetos e recebe GPOs; quem dá permissão é grupo, não OU.</text>
</svg>
