<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">A floresta é a fronteira de segurança do Active Directory; o domínio não isola, e a OU só organiza</title>
  <desc id="d">Uma moldura grande em azul-claro é a floresta corp.local, rotulada como a fronteira de segurança de verdade. Dentro dela há três domínios: corp.local, o domínio raiz, o primeiro criado; abaixo dele, filial.corp.local, o domínio filho, cujo nome continua o do pai; e, à direita, parceiro.local, com outro nome, mas na mesma floresta. Setas laranja de duas pontas ligam corp.local aos outros dois: são as confianças automáticas, nos dois sentidos, que o AD cria dentro da floresta. Uma caixa de destaque laranja diz: o domínio não isola; um administrador de qualquer domínio desta floresta consegue alcançar todos os outros; só uma floresta separada isola de verdade. Embaixo, uma ampliação mostra o que há dentro do domínio corp.local: a OU São Paulo contém a OU Financeiro, que contém a OU Estações com o PC WS-FIN-07, a usuária Ana Lima e o grupo GG-Financeiro. Ao lado, a pasta padrão Users, que não é OU e não recebe políticas, e uma caixa verde lembrando que a OU é uma pasta: organiza e recebe políticas, mas não dá permissão a ninguém. A legenda explica as quatro cores.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #94a3b8; }
    .fr    { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .dh    { font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    .ds    { font-size: 11px; fill: #94a3b8; }
    .tr    { font-size: 11px; font-weight: 700; fill: #fb923c; }
    .ch    { font-size: 14px; font-weight: 700; fill: #fb923c; }
    .ct    { font-size: 12px; fill: #e2e8f0; }
    .ou    { font-size: 12px; font-weight: 700; fill: #34d399; }
    .os    { font-size: 11px; fill: #cbd5e1; }
    .lg    { font-size: 11px; fill: #cbd5e1; }
    .key   { font-size: 12px; font-weight: 700; fill: #38bdf8; }
    .zh    { font-size: 13px; font-weight: 700; fill: #e2e8f0; }
    .uh    { font-size: 12px; font-weight: 700; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-blue"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ao-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#fb923c"/></marker>
    <marker id="ao-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#fb923c"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">A floresta é a fronteira de segurança — o domínio não isola</text>
  <text class="sub" x="30" y="60">Domínios da mesma floresta confiam uns nos outros sozinhos. A OU só organiza.</text>

  <!-- forest: the real security boundary -->
  <rect data-graph-role="container" x="30" y="78" width="900" height="272" rx="10" fill="#0b1a2b" fill-opacity="0.35" stroke="#38bdf8" stroke-width="3" filter="url(#glow-blue)"/>
  <text class="fr" x="50" y="102">FLORESTA corp.local — a fronteira de segurança de verdade</text>

  <!-- domains -->
  <rect x="70" y="120" width="250" height="64" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="dh" x="86" y="146">corp.local</text>
  <text class="ds" x="86" y="168">domínio raiz (o primeiro criado)</text>

  <rect x="70" y="256" width="250" height="64" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="dh" x="86" y="282">filial.corp.local</text>
  <text class="ds" x="86" y="304">filho: nome continua o do pai</text>

  <rect x="640" y="120" width="250" height="64" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="dh" x="656" y="146">parceiro.local</text>
  <text class="ds" x="656" y="168">outro nome, mesma floresta</text>

  <!-- automatic trusts -->
  <path d="M195,190 L195,250" stroke="#fb923c" stroke-width="2.5" fill="none" marker-start="url(#ao-start)" marker-end="url(#ao-end)"/>
  <text class="tr" x="207" y="216">confiança</text>
  <text class="tr" x="207" y="232">automática</text>

  <path d="M326,152 L634,152" stroke="#fb923c" stroke-width="2.5" fill="none" marker-start="url(#ao-start)" marker-end="url(#ao-end)"/>
  <text class="tr" x="480" y="142" text-anchor="middle">confiança automática, nos dois sentidos</text>

  <!-- key idea callout -->
  <rect x="380" y="206" width="520" height="122" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="2"/>
  <text class="ch" x="400" y="234">⚠ O domínio NÃO isola</text>
  <text class="ct" x="400" y="260">Um administrador de qualquer domínio desta</text>
  <text class="ct" x="400" y="280">floresta consegue alcançar todos os outros.</text>
  <text class="key" x="400" y="308">Só uma floresta separada isola de verdade.</text>

  <!-- inside the domain -->
  <rect data-graph-role="container" x="30" y="370" width="900" height="168" rx="8" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="zh" x="50" y="394">por dentro do domínio corp.local</text>

  <rect data-graph-role="container" x="50" y="408" width="540" height="120" rx="6" fill="#052e16" fill-opacity="0.45" stroke="#34d399" stroke-width="1.5"/>
  <text class="ou" x="66" y="428">OU São Paulo</text>
  <rect data-graph-role="container" x="70" y="438" width="500" height="82" rx="6" fill="#052e16" fill-opacity="0.6" stroke="#34d399" stroke-width="1.5"/>
  <text class="ou" x="86" y="458">OU Financeiro</text>
  <rect x="90" y="466" width="200" height="46" rx="5" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="ou" x="104" y="485">OU Estações</text>
  <text class="os" x="104" y="503">PC WS-FIN-07</text>
  <text class="os" x="310" y="485">usuária Ana Lima</text>
  <text class="os" x="310" y="503">grupo GG-Financeiro</text>

  <rect x="610" y="408" width="300" height="54" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="uh" x="626" y="430">pasta padrão Users</text>
  <text class="ds" x="626" y="450">não é OU: não recebe políticas</text>

  <rect x="610" y="472" width="300" height="56" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="ou" x="626" y="494">OU = pasta: organiza e recebe</text>
  <text class="ou" x="626" y="514">políticas, mas NÃO dá permissão</text>

  <!-- legend -->
  <g transform="translate(30,568)">
    <rect x="0" y="-10" width="22" height="12" rx="2" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text class="lg" x="30" y="0">floresta (fronteira de segurança)</text>
    <line x1="270" y1="-4" x2="294" y2="-4" stroke="#fb923c" stroke-width="2.5"/>
    <text class="lg" x="302" y="0">confiança entre domínios</text>
    <rect x="490" y="-10" width="22" height="12" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="lg" x="520" y="0">domínio</text>
    <rect x="600" y="-10" width="22" height="12" rx="2" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
    <text class="lg" x="630" y="0">OU (pasta dentro do domínio)</text>
  </g>
</svg>
