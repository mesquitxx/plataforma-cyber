<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Um controlador de domínio por dentro: quem controla um DC controla a senha de todo mundo</title>
  <desc id="d">À esquerda, uma caixa cinza agrupa quem conversa com o controlador de domínio: a Ana fazendo logon, a estação WS-FIN-07 e o servidor SRV-ARQ01. Uma seta azul leva até o controlador dc01, com o rótulo: pedem logon, consultas e políticas. No centro, a caixa azul do dc01 contém três blocos. O primeiro, em vermelho e em destaque, é o NTDS.dit, o banco do diretório, com todos os objetos e a senha, em forma de hash, de todas as contas, inclusive a do administrador. O segundo, em azul, lista os serviços que a rede usa: DNS na porta 53 para achar o DC, Kerberos na porta 88 para o logon por tickets e LDAP na porta 389 para ler o diretório. O terceiro, em azul, é o SYSVOL, a pasta compartilhada com os arquivos das políticas, baixados via SMB na porta 445. À direita, um segundo controlador, dc02, com outra cópia completa e gravável do domínio, ligado ao dc01 por uma seta azul de duas pontas: cópia sincronizada. Um aviso em vermelho embaixo do dc02 diz: mudou em um, muda em todos, inclusive um estrago. Uma faixa vermelha no rodapé traz a ideia principal: ganhou um DC, ganhou a senha de todo mundo; por isso o controlador de domínio é o alvo final, ele vale a empresa inteira. A legenda explica as três cores.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .sub   { font-size: 12px; fill: #94a3b8; }
    .gh    { font-size: 12px; font-weight: 700; fill: #cbd5e1; }
    .ci    { font-size: 13px; font-weight: 700; fill: #e2e8f0; }
    .cs    { font-size: 11px; fill: #94a3b8; }
    .bh    { font-size: 13px; font-weight: 700; fill: #60a5fa; }
    .bt    { font-size: 11.5px; fill: #cbd5e1; }
    .bl    { font-size: 11px; font-weight: 700; fill: #60a5fa; }
    .rh    { font-size: 14px; font-weight: 700; fill: #f87171; }
    .rt    { font-size: 12px; fill: #fecaca; }
    .rw    { font-size: 11.5px; font-weight: 700; fill: #f87171; }
    .ban   { font-size: 16px; font-weight: 700; fill: #fecaca; }
    .bans  { font-size: 12px; fill: #e2e8f0; }
    .lg    { font-size: 11px; fill: #cbd5e1; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-red"><feGaussianBlur stdDeviation="3.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="ab-end" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#60a5fa"/></marker>
    <marker id="ab-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#60a5fa"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="38">Quem controla um DC controla a senha de todo mundo</text>
  <text class="sub" x="30" y="60">O controlador de domínio (DC) guarda o diretório inteiro e atende a rede toda.</text>

  <!-- clients -->
  <rect data-graph-role="container" x="30" y="100" width="200" height="290" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text class="gh" x="46" y="124">quem usa o DC</text>
  <rect x="46" y="140" width="168" height="58" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="ci" x="60" y="164">Ana</text>
  <text class="cs" x="60" y="184">faz logon</text>
  <rect x="46" y="214" width="168" height="58" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="ci" x="60" y="238">WS-FIN-07</text>
  <text class="cs" x="60" y="258">estação</text>
  <rect x="46" y="288" width="168" height="58" rx="6" fill="#111827" stroke="#94a3b8" stroke-width="1.2"/>
  <text class="ci" x="60" y="312">SRV-ARQ01</text>
  <text class="cs" x="60" y="332">servidor</text>

  <path d="M232,245 L284,245" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#ab-end)"/>
  <text class="bl" x="46" y="410">pedem logon, consultas</text>
  <text class="bl" x="46" y="426">e políticas ao DC</text>

  <!-- the DC -->
  <rect data-graph-role="container" x="290" y="96" width="400" height="336" rx="8" fill="#0b1626" stroke="#3b82f6" stroke-width="2"/>
  <text class="bh" x="310" y="120">dc01 — controlador de domínio</text>

  <!-- the prize -->
  <rect x="310" y="134" width="360" height="92" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="2.2" filter="url(#glow-red)"/>
  <text class="rh" x="326" y="158">NTDS.dit — o banco do diretório</text>
  <text class="rt" x="326" y="182">todos os objetos + a senha (hash) de</text>
  <text class="rt" x="326" y="202">TODAS as contas, inclusive a do admin</text>

  <!-- services -->
  <rect x="310" y="240" width="360" height="100" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="bh" x="326" y="262">serviços que a rede usa</text>
  <text class="bt" x="326" y="284">DNS 53</text>
  <text class="bt" x="440" y="284">onde está o DC?</text>
  <text class="bt" x="326" y="304">Kerberos 88</text>
  <text class="bt" x="440" y="304">logon por tickets</text>
  <text class="bt" x="326" y="324">LDAP 389</text>
  <text class="bt" x="440" y="324">ler o diretório</text>

  <rect x="310" y="354" width="360" height="62" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="bh" x="326" y="378">SYSVOL (pasta compartilhada)</text>
  <text class="bt" x="326" y="400">arquivos das políticas, via SMB 445</text>

  <!-- second DC + replication -->
  <path d="M696,210 L752,210" stroke="#60a5fa" stroke-width="2" fill="none" marker-start="url(#ab-start)" marker-end="url(#ab-end)"/>
  <text class="bl" x="724" y="194" text-anchor="middle">cópia</text>
  <rect x="760" y="150" width="170" height="110" rx="8" fill="#0b1626" stroke="#3b82f6" stroke-width="2"/>
  <text class="bh" x="776" y="176">dc02</text>
  <text class="bt" x="776" y="200">outra cópia</text>
  <text class="bt" x="776" y="220">completa e</text>
  <text class="bt" x="776" y="240">gravável</text>

  <rect x="740" y="280" width="190" height="70" rx="6" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="rw" x="754" y="304">⚠ mudou em um,</text>
  <text class="rw" x="754" y="322">muda em todos —</text>
  <text class="rw" x="754" y="340">inclusive um estrago</text>

  <!-- key idea -->
  <rect x="30" y="456" width="900" height="76" rx="8" fill="#2a0f12" stroke="#ef4444" stroke-width="2"/>
  <text class="ban" x="480" y="486" text-anchor="middle">Ganhou um DC = ganhou a senha de todo mundo</text>
  <text class="bans" x="480" y="512" text-anchor="middle">Por isso o controlador de domínio é o alvo final: ele vale a empresa inteira.</text>

  <!-- legend -->
  <g transform="translate(30,568)">
    <rect x="0" y="-10" width="22" height="12" rx="2" fill="#111827" stroke="#94a3b8" stroke-width="1.2"/>
    <text class="lg" x="30" y="0">máquinas e pessoas do domínio</text>
    <rect x="290" y="-10" width="22" height="12" rx="2" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text class="lg" x="320" y="0">o DC funcionando no dia a dia</text>
    <rect x="580" y="-10" width="22" height="12" rx="2" fill="#2a0f12" stroke="#ef4444" stroke-width="1.5"/>
    <text class="lg" x="610" y="0">o que o atacante ganha / o risco</text>
  </g>
</svg>
