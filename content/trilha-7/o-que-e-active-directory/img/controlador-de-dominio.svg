<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">O que vive dentro de um controlador de domínio e quem conversa com ele</title>
  <desc id="d">No centro, uma caixa grande em ciano representa o controlador de domínio dc01.corp.local. Dentro dela há cinco blocos. NTDS.dit: o banco de dados do diretório, com todos os objetos e os hashes de senha de todas as contas do domínio. SYSVOL: a pasta compartilhada que guarda os arquivos das GPOs e os scripts de logon, lida por todas as máquinas. KDC: o serviço Kerberos, na porta 88, que emite os tickets e usa a conta krbtgt. LDAP: o serviço de diretório nas portas 389 e 636, e o Global Catalog nas portas 3268 e 3269. DNS: na porta 53, onde ficam os registros SRV que os clientes usam para achar um controlador. À esquerda, três clientes (uma estação, um servidor membro e uma pessoa fazendo logon) se ligam ao controlador por setas rotuladas: achar o DC via DNS, autenticar via Kerberos, ler o diretório via LDAP e baixar GPO via SMB 445 no SYSVOL. À direita, um segundo controlador, dc02, ligado ao primeiro por uma seta de duas pontas rotulada replicação multimaster: cada DC tem uma cópia gravável completa do domínio. Uma faixa no rodapé em amarelo resume: quem controla um DC controla o NTDS.dit, isto é, a senha de todo mundo; por isso o DC vale a empresa inteira.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .s { font-size: 11px; fill: #9fb0a6; }
    .g { font-size: 12px; font-weight: 700; fill: #5ee08a; }
    .w { font-size: 12px; font-weight: 700; fill: #f0c05a; }
    .dc { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .blk { fill: #1b2721; stroke: #2c3a33; stroke-width: 1.5; }
    .cli { fill: #16201b; stroke: #9fb0a6; stroke-width: 1.8; }
    .flow { stroke: #5ee08a; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .rep { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#c); marker-start: url(#d2); }
  </style>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5ee08a"/></marker>
    <marker id="c" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
    <marker id="d2" markerWidth="10" markerHeight="10" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="560" fill="#121815"/>
  <text class="t" x="30" y="34">Um controlador de domínio por dentro</text>

  <rect class="cli" x="30" y="90" width="190" height="54" rx="8"/>
  <text class="h" x="46" y="114">ana.lima</text>
  <text class="s" x="46" y="132">faz logon na estação</text>
  <rect class="cli" x="30" y="210" width="190" height="54" rx="8"/>
  <text class="h" x="46" y="234">WS-FIN-07</text>
  <text class="s" x="46" y="252">estação membro do domínio</text>
  <rect class="cli" x="30" y="330" width="190" height="54" rx="8"/>
  <text class="h" x="46" y="354">SRV-ARQ01</text>
  <text class="s" x="46" y="372">servidor membro</text>

  <path class="flow" d="M222,117 L318,130"/>
  <text class="s" x="228" y="108">Kerberos 88</text>
  <path class="flow" d="M222,226 L318,210"/>
  <text class="s" x="230" y="204">DNS 53: onde há DC?</text>
  <path class="flow" d="M222,248 L318,300"/>
  <text class="s" x="232" y="290">SMB 445: GPO</text>
  <path class="flow" d="M222,357 L318,380"/>
  <text class="s" x="230" y="394">LDAP 389</text>

  <rect class="dc" x="320" y="70" width="380" height="380" rx="12"/>
  <text class="h" x="340" y="96">dc01.corp.local — controlador de domínio</text>

  <rect class="blk" x="340" y="112" width="340" height="62" rx="8"/>
  <text class="g" x="356" y="134">NTDS.dit</text>
  <text class="s" x="356" y="152">banco do diretório: todos os objetos e</text>
  <text class="s" x="356" y="166">os hashes de senha de TODAS as contas</text>

  <rect class="blk" x="340" y="184" width="340" height="56" rx="8"/>
  <text class="g" x="356" y="206">SYSVOL (compartilhamento)</text>
  <text class="s" x="356" y="224">arquivos das GPOs e scripts de logon</text>

  <rect class="blk" x="340" y="250" width="165" height="70" rx="8"/>
  <text class="g" x="352" y="272">KDC · 88</text>
  <text class="s" x="352" y="290">emite tickets</text>
  <text class="s" x="352" y="306">Kerberos (krbtgt)</text>

  <rect class="blk" x="515" y="250" width="165" height="70" rx="8"/>
  <text class="g" x="527" y="272">LDAP 389/636</text>
  <text class="s" x="527" y="290">Global Catalog</text>
  <text class="s" x="527" y="306">3268/3269</text>

  <rect class="blk" x="340" y="330" width="340" height="56" rx="8"/>
  <text class="g" x="356" y="352">DNS · 53</text>
  <text class="s" x="356" y="370">registros SRV: _ldap._tcp.dc._msdcs.corp.local</text>

  <text class="s" x="340" y="420">mais: papéis FSMO, replicação, NTP</text>
  <text class="s" x="340" y="436">do domínio (PDC emulator)</text>

  <rect class="dc" x="760" y="160" width="170" height="130" rx="12"/>
  <text class="h" x="776" y="186">dc02.corp.local</text>
  <text class="s" x="776" y="206">outra cópia</text>
  <text class="s" x="776" y="222">GRAVÁVEL e completa</text>
  <text class="s" x="776" y="238">do domínio</text>
  <path class="rep" d="M708,225 L752,225"/>
  <text class="s" x="702" y="316">replicação multimaster:</text>
  <text class="s" x="702" y="332">mudou em um, vai para todos</text>
  <text class="s" x="702" y="348">(inclusive um estrago)</text>

  <text class="w" x="30" y="500">Quem controla um DC controla o NTDS.dit — a senha de todo mundo.</text>
  <text class="w" x="30" y="522">Por isso um controlador de domínio vale a empresa inteira.</text>
</svg>
