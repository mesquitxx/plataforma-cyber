<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">O mapa do comprometimento: uma cadeia de credenciais emprestadas, do usuário comum ao domínio</title>
  <desc id="d">Seis etapas empilhadas de cima para baixo, cada caixa marcada com o módulo da Trilha 7 de origem e o identificador da técnica no MITRE ATT&amp;CK. Entre uma etapa e a seguinte, uma seta mostra o segredo que é emprestado para abrir o próximo passo. Etapa 1, foothold: você entra como j.silva, um usuário de domínio comum sem privilégio (módulo 7.2, técnica T1078); ela empresta o login de j.silva para a etapa 2. Etapa 2, enumerar: por LDAP e BloodHound você mapeia contas, SPNs e caminhos e acha a conta de serviço svc_backup (módulo 7.2, técnica T1087.002); empresta o alvo svc_backup. Etapa 3, Kerberoasting: você pede o ticket de serviço de svc_backup e quebra a senha fraca offline (módulo 7.3, técnica T1558.003); empresta a senha de svc_backup. Etapa 4, movimento lateral: reutiliza essa credencial por SMB e PsExec para executar em outro host (módulo 7.4, técnica T1021.002); empresta uma sessão privilegiada. Etapa 5, DCSync: numa conta com direito de replicação, pede ao controlador os hashes, inclusive o do krbtgt (módulo 7.4, técnica T1003.006); empresta o hash do krbtgt. Etapa 6, golden ticket: com o hash do krbtgt você forja um TGT para qualquer conta e vira Domain Admin, com persistência (módulo 7.4, técnica T1558.001), a consequência final destacada em vermelho. A faixa final resume a tese: não há exploit mágico, cada seta é uma credencial emprestada, e o módulo 7.5 transforma cada etapa numa linha do relatório.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .stage { font-size: 14px; font-weight: 700; }
    .desc  { font-size: 11.5px; fill: #cbd5e1; }
    .tag   { font-size: 11px; font-weight: 700; fill: #94a3b8; }
    .lend  { font-size: 10px; fill: #475569; }
    .secret { font-size: 11px; font-weight: 700; fill: #eab308; }
    .lg    { font-size: 11px; fill: #cbd5e1; }
    .banner { font-size: 13px; font-weight: 700; fill: #fde68a; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="a-secret" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#eab308"/></marker>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="42">O mapa do comprometimento: um usuário comum até o domínio</text>

  <!-- stage 1 -->
  <rect x="230" y="66" width="500" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="246" y="88">1 · foothold</text>
  <text class="desc"  x="246" y="104">j.silva — usuário de domínio comum, sem privilégio</text>
  <text class="tag"   x="714" y="88" text-anchor="end">7.2</text>
  <text class="tag"   x="714" y="104" text-anchor="end" fill="#34d399">T1078</text>

  <path d="M480,112 L480,142" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#a-secret)"/>
  <text class="secret" x="494" y="131">empresta → o login de j.silva</text>

  <!-- stage 2 -->
  <rect x="230" y="146" width="500" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="246" y="168">2 · enumerar</text>
  <text class="desc"  x="246" y="184">LDAP + BloodHound acham a conta svc_backup</text>
  <text class="tag"   x="714" y="168" text-anchor="end">7.2</text>
  <text class="tag"   x="714" y="184" text-anchor="end" fill="#34d399">T1087.002</text>

  <path d="M480,192 L480,222" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#a-secret)"/>
  <text class="secret" x="494" y="211">empresta → o alvo svc_backup</text>

  <!-- stage 3 -->
  <rect x="230" y="226" width="500" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="246" y="248">3 · Kerberoasting</text>
  <text class="desc"  x="246" y="264">quebra offline a senha fraca de svc_backup</text>
  <text class="tag"   x="714" y="248" text-anchor="end">7.3</text>
  <text class="tag"   x="714" y="264" text-anchor="end" fill="#34d399">T1558.003</text>

  <path d="M480,272 L480,302" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#a-secret)"/>
  <text class="secret" x="494" y="291">empresta → a senha de svc_backup</text>

  <!-- stage 4 -->
  <rect x="230" y="306" width="500" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="246" y="328">4 · movimento lateral</text>
  <text class="desc"  x="246" y="344">reusa a credencial (SMB/PsExec) noutro host</text>
  <text class="tag"   x="714" y="328" text-anchor="end">7.4</text>
  <text class="tag"   x="714" y="344" text-anchor="end" fill="#34d399">T1021.002</text>

  <path d="M480,352 L480,382" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#a-secret)"/>
  <text class="secret" x="494" y="371">empresta → uma sessão privilegiada</text>

  <!-- stage 5 -->
  <rect x="230" y="386" width="500" height="46" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="stage" x="246" y="408">5 · DCSync</text>
  <text class="desc"  x="246" y="424">replica o controlador e pega o hash do krbtgt</text>
  <text class="tag"   x="714" y="408" text-anchor="end">7.4</text>
  <text class="tag"   x="714" y="424" text-anchor="end" fill="#34d399">T1003.006</text>

  <path d="M480,432 L480,462" stroke="#eab308" stroke-width="2" fill="none" marker-end="url(#a-secret)"/>
  <text class="secret" x="494" y="451">empresta → o hash do krbtgt</text>

  <!-- stage 6 (consequencia final) -->
  <rect x="230" y="466" width="500" height="50" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="stage" x="246" y="488" fill="#fca5a5">6 · golden ticket</text>
  <text class="desc"  x="246" y="506" fill="#fecaca">forja o TGT de qualquer conta → DOMAIN ADMIN</text>
  <text class="tag"   x="714" y="488" text-anchor="end">7.4</text>
  <text class="tag"   x="714" y="506" text-anchor="end" fill="#34d399">T1558.001</text>

  <!-- legend -->
  <g transform="translate(40,544)">
    <rect x="0" y="-11" width="20" height="10" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text class="lg" x="28" y="-2">etapa do ataque</text>
    <rect x="190" y="-11" width="20" height="10" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text class="lg" x="218" y="-2">o prêmio final: dono do domínio</text>
    <line x1="470" y1="-6" x2="498" y2="-6" stroke="#eab308" stroke-width="2" marker-end="url(#a-secret)"/>
    <text class="lg" x="506" y="-2">o segredo emprestado</text>
  </g>

  <!-- banner: main idea -->
  <rect x="40" y="562" width="880" height="30" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text class="banner" x="480" y="582" text-anchor="middle">nenhum exploit mágico: cada seta é uma credencial emprestada — e o 7.5 vira cada etapa numa linha do relatório</text>
</svg>
