<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">A cadeia e seus cortes: quebrar um único elo já derruba o ataque inteiro</title>
  <desc id="d">À esquerda, os seis elos do ataque empilhados e ligados por uma corrente vertical, mostrando que um depende do anterior: elo 1, foothold, a credencial roubada; elo 2, enumeração, ler o diretório do Active Directory; elo 3, Kerberoasting, quebrar a senha da conta de serviço; elo 4, movimento lateral, reutilizar a credencial em outro host; elo 5, DCSync, replicar os segredos do controlador; elo 6, golden ticket, forjar TGTs e virar Domain Admin. À direita de cada elo, separada e secundária, a defesa que o corta, com uma tesoura verde cruzando a corrente no ponto do corte. Elo 1 é cortado por MFA e senhas fortes, que impedem o roubo inicial da conta. Elo 2, pela administração em camadas, chamada tiering, somada à detecção de leitura anômala, já que não dá para desligar a leitura do diretório. Elo 3, por contas gerenciadas gMSA de senha longa e por forçar AES, deixando nada fraco para quebrar offline. Elo 4, por LAPS, grupo Protected Users e restrição dos compartilhamentos administrativos, de modo que o hash de uma máquina não abre as outras. Elo 5, pela detecção do evento 4662 quando a replicação vem de uma conta que não é controlador. Elo 6, pela rotação dupla da senha do krbtgt, que expurga a chave roubada. A faixa final resume a tese da defesa em profundidade: o atacante precisa vencer todos os elos, mas o defensor precisa cortar só um.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .atk  { font-size: 13px; font-weight: 700; fill: #fb923c; }
    .atks { font-size: 10.5px; fill: #cbd5e1; }
    .def  { font-size: 12px; font-weight: 700; fill: #34d399; }
    .defs { font-size: 10.5px; fill: #94a3b8; }
    .lg   { font-size: 11px; fill: #cbd5e1; }
    .banner { font-size: 13px; font-weight: 700; fill: #fde68a; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">A cadeia e seus cortes: quebre um elo e derruba a campanha</text>

  <!-- chain spine behind attack links -->
  <line x1="60" y1="95" x2="60" y2="503" stroke="#7c2d12" stroke-width="6"/>
  <line x1="60" y1="95" x2="60" y2="503" stroke="#fb923c" stroke-width="2" stroke-dasharray="2 6"/>

  <!-- ============ ELO 1 ============ -->
  <rect x="40" y="95" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="120">1 · foothold</text>
  <text class="atks" x="76" y="140">credencial roubada</text>
  <!-- cut -->
  <g transform="translate(455,124)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="124" x2="455" y2="124" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="124" x2="500" y2="124" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="95" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="120">MFA + senhas fortes</text>
  <text class="defs" x="516" y="140">impede o roubo inicial da conta</text>

  <!-- ============ ELO 2 ============ -->
  <rect x="40" y="165" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="190">2 · enumeração</text>
  <text class="atks" x="76" y="210">lê o diretório do AD</text>
  <g transform="translate(455,194)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="194" x2="455" y2="194" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="194" x2="500" y2="194" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="165" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="190">tiering + detectar leitura anômala</text>
  <text class="defs" x="516" y="210">não dá para desligar a leitura do diretório</text>

  <!-- ============ ELO 3 ============ -->
  <rect x="40" y="235" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="260">3 · Kerberoasting</text>
  <text class="atks" x="76" y="280">quebra a senha do serviço</text>
  <g transform="translate(455,264)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="264" x2="455" y2="264" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="264" x2="500" y2="264" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="235" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="260">gMSA (senha longa) + forçar AES</text>
  <text class="defs" x="516" y="280">sem senha fraca, nada a quebrar offline</text>

  <!-- ============ ELO 4 ============ -->
  <rect x="40" y="305" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="330">4 · movimento lateral</text>
  <text class="atks" x="76" y="350">reusa a credencial em outro host</text>
  <g transform="translate(455,334)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="334" x2="455" y2="334" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="334" x2="500" y2="334" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="305" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="330">LAPS + Protected Users + ADMIN$ restrito</text>
  <text class="defs" x="516" y="350">o hash de uma máquina não abre as outras</text>

  <!-- ============ ELO 5 ============ -->
  <rect x="40" y="375" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="400">5 · DCSync</text>
  <text class="atks" x="76" y="420">replica os segredos do DC</text>
  <g transform="translate(455,404)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="404" x2="455" y2="404" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="404" x2="500" y2="404" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="375" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="400">detectar o evento 4662</text>
  <text class="defs" x="516" y="420">replicação vinda de quem não é controlador</text>

  <!-- ============ ELO 6 ============ -->
  <rect x="40" y="445" width="400" height="58" rx="6" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
  <text class="atk"  x="76" y="470">6 · golden ticket</text>
  <text class="atks" x="76" y="490">forja TGTs = Domain Admin</text>
  <g transform="translate(455,474)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="14" y2="7"/><line x1="0" y1="7" x2="14" y2="-7"/></g>
  <line x1="440" y1="474" x2="455" y2="474" stroke="#34d399" stroke-width="2"/>
  <line x1="469" y1="474" x2="500" y2="474" stroke="#34d399" stroke-width="2"/>
  <rect x="500" y="445" width="420" height="58" rx="6" fill="#052e16" stroke="#34d399" stroke-width="1.5"/>
  <text class="def"  x="516" y="470">rotação DUPLA da senha do krbtgt</text>
  <text class="defs" x="516" y="490">expurga a chave roubada</text>

  <!-- legend -->
  <g transform="translate(40,540)">
    <rect x="0" y="-11" width="20" height="10" rx="2" fill="#1c1917" stroke="#fb923c" stroke-width="1.5"/>
    <text class="lg" x="28" y="-2">elo do ataque (a corrente)</text>
    <g transform="translate(260,-6)" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-5" x2="10" y2="5"/><line x1="0" y1="5" x2="10" y2="-5"/></g>
    <text class="lg" x="282" y="-2">o corte da defesa</text>
  </g>

  <!-- banner: tese -->
  <rect x="40" y="558" width="880" height="30" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text class="banner" x="480" y="578" text-anchor="middle">defesa em profundidade: o atacante precisa vencer TODOS os elos — o defensor precisa cortar só UM</text>
</svg>
