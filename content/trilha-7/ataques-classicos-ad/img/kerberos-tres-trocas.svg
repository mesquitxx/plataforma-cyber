<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="t d">
  <title id="t">As três trocas do protocolo Kerberos e os pontos onde o Kerberoasting e o AS-REP roasting extraem material quebrável</title>
  <desc id="d">O diagrama mostra, em três faixas horizontais, o fluxo normal do Kerberos entre VOCÊ (a conta de domínio que o atacante controla, à esquerda) e o controlador de domínio (KDC, à direita). Troca 1, Autenticação: você envia um AS-REQ ao serviço de autenticação (AS) e recebe de volta um AS-REP contendo o TGT, o ticket-granting ticket. Um aviso em destaque marca aqui o AS-REP roasting: se a conta dispensa a pré-autenticação (bit DONT_REQ_PREAUTH), parte do AS-REP vem cifrada com uma chave derivada da senha do usuário, e qualquer um pode pedir esse AS-REP e quebrá-lo offline, sem nem ter a senha. Troca 2, Ticket de serviço: você apresenta o TGT num TGS-REQ ao serviço de concessão de tickets (TGS) e recebe um TGS-REP contendo o service ticket. Outro aviso marca aqui o Kerberoasting: o service ticket é cifrado com uma chave derivada da senha da conta de serviço (service account), então qualquer usuário autenticado pede o ticket e quebra essa senha offline. Troca 3, Uso: você apresenta o service ticket ao serviço de aplicação (um SQL Server, um IIS) num AP-REQ. Uma faixa embaixo lembra que o pass-the-hash não usa Kerberos: ele é do protocolo NTLM, onde o NT hash por si só prova a identidade, sem senha e sem ticket.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .vec { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .ctl { font-size: 10px; fill: #9fb0a6; }
    .act { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .you { fill: #16201b; stroke: #9fb0a6; stroke-width: 2; }
    .sys { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .lbl { font-size: 12.5px; font-weight: 700; }
    .flow { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#ac); }
    .back { stroke: #9fb0a6; stroke-width: 2; fill: none; marker-end: url(#ag); stroke-dasharray: 4 3; }
    .bite { fill: #20160f; stroke: #e0a05e; stroke-width: 2; }
    .bitetx { font-size: 10.5px; font-weight: 700; fill: #e0a05e; }
    .bitesub { font-size: 9.5px; fill: #d8b68e; }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
    .ex { font-size: 11px; font-weight: 700; fill: #5cc8d8; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="960" height="600" fill="#121815"/>
  <text class="t" x="30" y="34">Kerberos em três trocas — e onde cada ataque morde</text>

  <!-- VOCE (tall, left) -->
  <rect class="you" x="24" y="70" width="150" height="400" rx="8"/>
  <text class="lbl" x="99" y="255" text-anchor="middle">VOCÊ</text>
  <text class="ctl" x="99" y="275" text-anchor="middle">conta de</text>
  <text class="ctl" x="99" y="289" text-anchor="middle">domínio</text>
  <text class="ctl" x="99" y="303" text-anchor="middle">(j.silva)</text>

  <!-- Lane 1: AS -->
  <text class="ex" x="196" y="86">Troca 1 — Autenticação</text>
  <rect class="box" x="640" y="78" width="296" height="86" rx="8"/>
  <text class="vec" x="658" y="102">AS · serviço de autenticação</text>
  <text class="ctl" x="658" y="120">valida você e emite o TGT</text>
  <text class="act" x="658" y="140">devolve: AS-REP { TGT }</text>
  <path class="flow" d="M176,100 L636,100"/>
  <text class="ctl" x="400" y="95" text-anchor="middle">① AS-REQ</text>
  <path class="back" d="M636,135 L176,135"/>
  <text class="ctl" x="400" y="130" text-anchor="middle">AS-REP → TGT</text>

  <!-- bite 1: AS-REP roasting -->
  <rect class="bite" x="196" y="176" width="430" height="48" rx="6"/>
  <text class="bitetx" x="210" y="196">↯ AS-REP roasting</text>
  <text class="bitesub" x="210" y="212">conta sem pré-auth → o AS-REP vem cifrado com a chave do usuário: quebra offline, sem senha</text>

  <!-- Lane 2: TGS -->
  <text class="ex" x="196" y="262">Troca 2 — Ticket de serviço</text>
  <rect class="box" x="640" y="254" width="296" height="86" rx="8"/>
  <text class="vec" x="658" y="278">TGS · concessão de tickets</text>
  <text class="ctl" x="658" y="296">recebe o TGT e emite o ticket</text>
  <text class="act" x="658" y="316">devolve: TGS-REP { service ticket }</text>
  <path class="flow" d="M176,276 L636,276"/>
  <text class="ctl" x="400" y="271" text-anchor="middle">② TGS-REQ + TGT + SPN</text>
  <path class="back" d="M636,311 L176,311"/>
  <text class="ctl" x="400" y="306" text-anchor="middle">TGS-REP → service ticket</text>

  <!-- bite 2: Kerberoasting -->
  <rect class="bite" x="196" y="352" width="430" height="48" rx="6"/>
  <text class="bitetx" x="210" y="372">↯ Kerberoasting</text>
  <text class="bitesub" x="210" y="388">service ticket cifrado com a chave da service account: qualquer um pede e quebra offline</text>

  <!-- Lane 3: use -->
  <text class="ex" x="196" y="438">Troca 3 — Uso</text>
  <rect class="sys" x="640" y="430" width="296" height="40" rx="8"/>
  <text class="lbl" x="788" y="455" text-anchor="middle" fill="#5cc8d8">Serviço (SQL / IIS)</text>
  <path class="flow" d="M176,450 L636,450"/>
  <text class="ctl" x="400" y="445" text-anchor="middle">③ AP-REQ + service ticket</text>

  <!-- rule: pass-the-hash is NTLM -->
  <rect class="box" x="24" y="510" width="912" height="60" rx="8"/>
  <text class="act" x="44" y="535">pass-the-hash não usa nada disto.</text>
  <text class="rule" x="44" y="555">É do protocolo NTLM: o NT hash, por si só, prova a identidade — sem senha em claro e sem nenhum ticket Kerberos.</text>
</svg>
