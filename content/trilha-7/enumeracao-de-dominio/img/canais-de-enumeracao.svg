<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">De uma senha de usuário comum ao controle total do domínio</title>
  <desc id="d">À esquerda, uma caixa VOCÊ: um usuário de domínio comum, sem privilégio, com apenas uma senha válida. Dela partem dois canais de consulta ao controlador: LDAP na porta 389 (pergunta ao diretório) e SAMR na porta 445 (pergunta à base de contas). Os dois canais alimentam uma caixa central, o GRAFO de relações entre contas e grupos, ligadas por MemberOf e GenericAll. Do grafo sai uma seta para a caixa destacada Domain Admins: o controle total do domínio. A ideia central, em destaque: ler tudo isso é o desenho do Active Directory, não uma falha.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .nodeT { font-size: 14px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .port { font-size: 11px; font-weight: 700; }
    .lg { font-size: 11.5px; fill: #cbd5e1; }
    .banner { font-size: 13.5px; font-weight: 700; fill: #fde68a; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="a-blue" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#3b82f6"/></marker>
    <marker id="a-green" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#10b981"/></marker>
    <marker id="a-red" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#ef4444"/></marker>
    <filter id="glow-red" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="48">Uma senha comum abre o mapa inteiro do domínio</text>

  <!-- VOCE -->
  <rect x="40" y="250" width="170" height="120" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="nodeT" x="125" y="292" text-anchor="middle">VOCÊ</text>
  <text class="sub" x="125" y="316" text-anchor="middle">usuário comum</text>
  <text class="sub" x="125" y="334" text-anchor="middle">zero privilégio</text>
  <text class="sub" x="125" y="352" text-anchor="middle">só uma senha</text>

  <!-- LDAP channel -->
  <rect x="285" y="150" width="245" height="96" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="port" x="305" y="182" fill="#60a5fa">LDAP · porta 389</text>
  <text class="sub" x="305" y="204">pergunta ao diretório:</text>
  <text class="sub" x="305" y="222">usuários, grupos, SPN,</text>
  <text class="sub" x="305" y="240">userAccountControl, ACLs</text>

  <!-- SAMR channel -->
  <rect x="285" y="374" width="245" height="96" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="port" x="305" y="406" fill="#60a5fa">SAMR · porta 445</text>
  <text class="sub" x="305" y="428">pergunta à base de contas:</text>
  <text class="sub" x="305" y="446">lista de usuários, membros</text>
  <text class="sub" x="305" y="464">de grupo, RID cycling</text>

  <!-- GRAFO -->
  <rect x="595" y="232" width="190" height="156" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="nodeT" x="690" y="264" text-anchor="middle" fill="#34d399">GRAFO</text>
  <text class="sub" x="690" y="284" text-anchor="middle">relações entre contas</text>
  <!-- mini graph -->
  <circle cx="632" cy="330" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="700" cy="314" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="700" cy="360" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="760" cy="337" r="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <path d="M641,326 L691,317" stroke="#10b981" stroke-width="1.3" fill="none"/>
  <path d="M641,334 L691,357" stroke="#10b981" stroke-width="1.3" fill="none"/>
  <path d="M709,316 L751,333" stroke="#10b981" stroke-width="1.3" fill="none"/>
  <path d="M709,357 L751,341" stroke="#10b981" stroke-width="1.3" fill="none"/>
  <text class="sub" x="690" y="382" text-anchor="middle" font-size="10">MemberOf · GenericAll</text>

  <!-- DOMAIN ADMINS -->
  <rect x="800" y="250" width="140" height="120" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="nodeT" x="870" y="298" text-anchor="middle" fill="#fca5a5">Domain</text>
  <text class="nodeT" x="870" y="318" text-anchor="middle" fill="#fca5a5">Admins</text>
  <text class="sub" x="870" y="342" text-anchor="middle">controle total</text>
  <text class="sub" x="870" y="360" text-anchor="middle">do domínio</text>

  <!-- flows: you -> channels (blue) -->
  <path d="M210,290 C245,250 250,198 283,198" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <path d="M210,330 C245,370 250,422 283,422" stroke="#3b82f6" stroke-width="2" fill="none" marker-end="url(#a-blue)"/>
  <!-- channels -> grafo (green) -->
  <path d="M530,198 C560,198 565,290 593,300" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <path d="M530,422 C560,422 565,330 593,320" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#a-green)"/>
  <!-- grafo -> domain admins (red) -->
  <path d="M785,310 L798,310" stroke="#ef4444" stroke-width="2.2" fill="none" marker-end="url(#a-red)"/>

  <!-- legend -->
  <g transform="translate(40,500)">
    <rect x="0" y="-16" width="22" height="10" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text class="lg" x="30" y="-7">canal de consulta</text>
    <rect x="190" y="-16" width="22" height="10" rx="2" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text class="lg" x="220" y="-7">mapa que você monta</text>
    <rect x="410" y="-16" width="22" height="10" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text class="lg" x="440" y="-7">o prêmio final do atacante</text>
  </g>

  <!-- banner: main idea -->
  <rect x="40" y="530" width="880" height="44" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text class="banner" x="480" y="558" text-anchor="middle">ler o domínio inteiro com uma só senha é o desenho do Active Directory, não uma falha pontual</text>
</svg>
