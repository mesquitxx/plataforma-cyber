<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d">
  <title id="t">Os dois canais de enumeração de um domínio Active Directory, partindo de um usuário comum e convergindo para o grupo Domain Admins</title>
  <desc id="d">À esquerda, uma caixa representa VOCÊ: um único usuário de domínio comum, membro do grupo Authenticated Users, sem nenhum privilégio de administrador — apenas uma senha válida. Dessa caixa partem dois canais horizontais de consulta ao controlador de domínio. Canal de cima, LDAP sobre ADWS, porta 389: você consulta o diretório e recebe de volta a lista de usuários, grupos, os atributos servicePrincipalName e userAccountControl de cada conta, e as ACLs que dizem quem pode o quê. Canal de baixo, SAMR sobre RPC, porta 445: você pergunta diretamente à base de contas e recebe os usuários (enumdomusers), os membros de cada grupo e, por RID cycling, nomes que a consulta normal esconde. Os dois canais alimentam uma caixa central, o GRAFO: nós que são usuários e grupos, ligados por arestas como MemberOf, GenericAll e AdminTo. Do grafo sai uma seta para uma caixa destacada em ciano à direita: Domain Admins, o grupo que controla o domínio inteiro. Uma faixa embaixo resume a ideia central: um único usuário de domínio autenticado lê o mapa inteiro, porque isso é o desenho do Active Directory, não uma falha pontual.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .vec { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .ctl { font-size: 10px; fill: #9fb0a6; }
    .act { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .you { fill: #16201b; stroke: #9fb0a6; stroke-width: 2; }
    .sys { fill: #16201b; stroke: #5cc8d8; stroke-width: 2.5; }
    .lbl { font-size: 12.5px; font-weight: 700; }
    .flow { stroke: #5cc8d8; stroke-width: 2; fill: none; marker-end: url(#ac); }
    .edge { stroke: #5ee08a; stroke-width: 1.5; fill: none; }
    .node { fill: #16201b; stroke: #9fb0a6; stroke-width: 1.5; }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="960" height="560" fill="#121815"/>
  <text class="t" x="30" y="34">Dois canais, um mapa: do usuário comum ao domínio inteiro</text>

  <!-- you -->
  <rect class="you" x="24" y="205" width="150" height="110" rx="8"/>
  <text class="lbl" x="99" y="245" text-anchor="middle">VOCÊ</text>
  <text class="ctl" x="99" y="265" text-anchor="middle">usuário comum</text>
  <text class="ctl" x="99" y="281" text-anchor="middle">Authenticated Users</text>
  <text class="ctl" x="99" y="297" text-anchor="middle">só uma senha</text>

  <!-- channel A: LDAP -->
  <rect class="box" x="250" y="70" width="330" height="80" rx="8"/>
  <text class="vec" x="268" y="94">LDAP / ADWS · tcp 389</text>
  <text class="ctl" x="268" y="112">consulta o diretório e recebe de volta</text>
  <text class="act" x="268" y="129">usuários · grupos · SPN · UAC · ACLs</text>
  <path class="flow" d="M174,235 C210,110 215,110 248,110"/>

  <!-- channel B: SAMR -->
  <rect class="box" x="250" y="410" width="330" height="80" rx="8"/>
  <text class="vec" x="268" y="434">SAMR / RPC · tcp 445</text>
  <text class="ctl" x="268" y="452">pergunta direto à base de contas (SAM)</text>
  <text class="act" x="268" y="469">enumdomusers · membros · RID cycling</text>
  <path class="flow" d="M174,285 C210,450 215,450 248,450"/>

  <!-- graph box -->
  <rect class="box" x="250" y="195" width="330" height="170" rx="8"/>
  <text class="vec" x="268" y="219">GRAFO</text>
  <!-- tiny graph inside -->
  <circle class="node" cx="300" cy="270" r="14"/>
  <text class="ctl" x="300" y="300" text-anchor="middle">você</text>
  <circle class="node" cx="400" cy="250" r="14"/>
  <text class="ctl" x="400" y="232" text-anchor="middle">grupo</text>
  <circle class="node" cx="400" cy="320" r="14"/>
  <text class="ctl" x="400" y="348" text-anchor="middle">svc</text>
  <circle class="node" cx="510" cy="285" r="14"/>
  <text class="ctl" x="520" y="289" text-anchor="start">adm</text>
  <path class="edge" d="M314,268 L386,253"/>
  <path class="edge" d="M314,274 L386,316"/>
  <path class="edge" d="M414,253 L496,282"/>
  <path class="edge" d="M414,316 L496,290"/>
  <text class="act" x="415" y="214" text-anchor="middle" font-size="9.5">MemberOf · GenericAll · AdminTo</text>
  <!-- feed arrows into graph -->
  <path class="flow" d="M415,150 C415,168 415,172 415,193"/>
  <path class="flow" d="M415,410 C415,392 415,388 415,367"/>

  <!-- domain admins -->
  <rect class="sys" x="760" y="220" width="176" height="110" rx="8"/>
  <text class="lbl" x="848" y="262" text-anchor="middle" fill="#5cc8d8">Domain Admins</text>
  <text class="ctl" x="848" y="282" text-anchor="middle">controla todo</text>
  <text class="ctl" x="848" y="298" text-anchor="middle">o domínio</text>
  <path class="flow" d="M580,280 C680,280 690,275 758,275"/>

  <!-- rule -->
  <rect class="box" x="24" y="505" width="912" height="40" rx="8"/>
  <text class="rule" x="480" y="530" text-anchor="middle">um usuário comum lê o mapa inteiro — isso é o desenho do Active Directory, não uma falha pontual</text>
</svg>
