<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="t d">
  <title id="t">Árvore de decisão: cada atributo encontrado na enumeração do domínio e o ataque que ele habilita</title>
  <desc id="d">Da esquerda parte uma caixa raiz, achei um atributo na enumeração, e dela saem cinco ramos horizontais, cada um ligando uma condição a uma consequência. Ramo 1: servicePrincipalName povoado numa conta de usuário, leva a Kerberoasting, pedir o ticket do serviço e quebrar a senha offline, tratado no módulo 7.3. Ramo 2: userAccountControl com o bit 0x400000, DONT_REQ_PREAUTH, e sem o bit 0x2 de conta desabilitada, leva a AS-REP roasting, pegar o hash sem nem ter senha, também no 7.3. Ramo 3: adminCount igual a 1 ou memberOf apontando para um grupo poderoso, leva a alvo de alto valor, uma conta que vale a pena perseguir. Ramo 4: uma ACL concedendo GenericAll, GenericWrite ou WriteDacl sobre um objeto, leva a takeover do objeto, você reescreve a senha ou se adiciona ao grupo. Ramo 5: os campos description ou info contendo um segredo, leva a credencial de graça, senhas deixadas em texto na descrição da conta. Uma faixa embaixo resume: enumerar é ler esses atributos e decidir qual vira caminho de ataque.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .cond { font-size: 11.5px; font-weight: 700; fill: #5cc8d8; }
    .ctl { font-size: 10px; fill: #9fb0a6; }
    .act { font-size: 11.5px; font-weight: 700; fill: #5ee08a; }
    .box { fill: #16201b; stroke: #2c3a33; stroke-width: 1.5; }
    .root { fill: #16201b; stroke: #9fb0a6; stroke-width: 2; }
    .goal { fill: #16201b; stroke: #5cc8d8; stroke-width: 2; }
    .lbl { font-size: 12.5px; font-weight: 700; }
    .flow { stroke: #5ee08a; stroke-width: 1.8; fill: none; marker-end: url(#ar); }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="960" height="520" fill="#121815"/>
  <text class="t" x="30" y="34">Achei um atributo — e agora? A árvore de decisão</text>

  <!-- root -->
  <rect class="root" x="24" y="210" width="150" height="90" rx="8"/>
  <text class="lbl" x="99" y="248" text-anchor="middle">atributo</text>
  <text class="ctl" x="99" y="268" text-anchor="middle">achado na</text>
  <text class="ctl" x="99" y="284" text-anchor="middle">enumeração</text>

  <!-- branch 1 -->
  <rect class="box" x="330" y="60" width="300" height="56" rx="8"/>
  <text class="cond" x="346" y="82">servicePrincipalName em um user</text>
  <text class="act" x="346" y="104">→ Kerberoasting (7.3)</text>
  <rect class="goal" x="680" y="60" width="256" height="56" rx="8"/>
  <text class="ctl" x="694" y="83">pede o ticket do serviço e</text>
  <text class="ctl" x="694" y="99">quebra a senha offline</text>
  <path class="flow" d="M174,235 C250,88 255,88 328,88"/>
  <path class="flow" d="M630,88 L678,88"/>

  <!-- branch 2 -->
  <rect class="box" x="330" y="140" width="300" height="56" rx="8"/>
  <text class="cond" x="346" y="162">UAC &amp; 0x400000 · sem 0x2</text>
  <text class="act" x="346" y="184">→ AS-REP roasting (7.3)</text>
  <rect class="goal" x="680" y="140" width="256" height="56" rx="8"/>
  <text class="ctl" x="694" y="163">pega o hash sem nem</text>
  <text class="ctl" x="694" y="179">precisar da senha</text>
  <path class="flow" d="M174,250 C250,168 255,168 328,168"/>
  <path class="flow" d="M630,168 L678,168"/>

  <!-- branch 3 -->
  <rect class="box" x="330" y="220" width="300" height="56" rx="8"/>
  <text class="cond" x="346" y="242">adminCount=1 · memberOf forte</text>
  <text class="act" x="346" y="264">→ alvo de alto valor</text>
  <rect class="goal" x="680" y="220" width="256" height="56" rx="8"/>
  <text class="ctl" x="694" y="243">uma conta que vale</text>
  <text class="ctl" x="694" y="259">a pena perseguir</text>
  <path class="flow" d="M174,255 C250,248 255,248 328,248"/>
  <path class="flow" d="M630,248 L678,248"/>

  <!-- branch 4 -->
  <rect class="box" x="330" y="300" width="300" height="56" rx="8"/>
  <text class="cond" x="346" y="322">ACL: GenericAll / WriteDacl</text>
  <text class="act" x="346" y="344">→ takeover do objeto</text>
  <rect class="goal" x="680" y="300" width="256" height="56" rx="8"/>
  <text class="ctl" x="694" y="323">reescreve a senha ou</text>
  <text class="ctl" x="694" y="339">se adiciona ao grupo</text>
  <path class="flow" d="M174,270 C250,328 255,328 328,328"/>
  <path class="flow" d="M630,328 L678,328"/>

  <!-- branch 5 -->
  <rect class="box" x="330" y="380" width="300" height="56" rx="8"/>
  <text class="cond" x="346" y="402">description / info com segredo</text>
  <text class="act" x="346" y="424">→ credencial de graça</text>
  <rect class="goal" x="680" y="380" width="256" height="56" rx="8"/>
  <text class="ctl" x="694" y="403">senha em texto deixada</text>
  <text class="ctl" x="694" y="419">na descrição da conta</text>
  <path class="flow" d="M174,285 C250,408 255,408 328,408"/>
  <path class="flow" d="M630,408 L678,408"/>

  <!-- rule -->
  <rect class="box" x="24" y="465" width="912" height="38" rx="8"/>
  <text class="rule" x="480" y="489" text-anchor="middle">enumerar é ler esses atributos e decidir qual deles vira um caminho de ataque</text>
</svg>
