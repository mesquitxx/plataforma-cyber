<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Cada atributo achado na enumeração é a porta de um ataque</title>
  <desc id="d">À esquerda, a caixa raiz: um atributo achado na enumeração. Dela saem cinco ramos, cada um ligando um atributo (à esquerda, em azul) ao ataque que ele habilita (à direita, em vermelho). Ramo 1: servicePrincipalName numa conta de usuário leva a Kerberoasting. Ramo 2: userAccountControl com o bit 0x400000 e sem o bit 0x2 leva a AS-REP roasting. Ramo 3: adminCount igual a 1 ou memberOf forte marca um alvo de alto valor. Ramo 4: uma ACL GenericAll ou WriteDacl leva ao takeover do objeto. Ramo 5: description ou info com segredo entrega uma credencial de graça. A ideia central, em destaque: enumerar é ler o atributo e decidir qual deles vira caminho de ataque.</desc>
  <style>
    text { font-family: 'SF Mono','Fira Code','Cascadia Code','Courier New',monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .rootT { font-size: 13px; font-weight: 700; }
    .attr { font-size: 12.5px; font-weight: 700; fill: #60a5fa; }
    .attrS { font-size: 10px; fill: #94a3b8; }
    .atk { font-size: 13px; font-weight: 700; fill: #fca5a5; }
    .lg { font-size: 11.5px; fill: #cbd5e1; }
    .banner { font-size: 13.5px; font-weight: 700; fill: #fde68a; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="a-red" markerWidth="9" markerHeight="7" refX="7.5" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#ef4444"/></marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="48">Achei um atributo — qual ataque ele abre?</text>

  <!-- root -->
  <rect x="40" y="235" width="150" height="110" rx="6" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="rootT" x="115" y="282" text-anchor="middle">atributo</text>
  <text class="rootT" x="115" y="300" text-anchor="middle">achado na</text>
  <text class="rootT" x="115" y="318" text-anchor="middle">enumeração</text>

  <!-- helper: rows at y centers 108,188,290,392,472 -->
  <!-- Row 1 -->
  <rect x="300" y="80" width="300" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="attr" x="318" y="108">servicePrincipalName</text>
  <text class="attrS" x="318" y="128">numa conta de usuário</text>
  <rect x="660" y="80" width="260" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text class="atk" x="680" y="108">Kerberoasting</text>
  <text class="attrS" x="680" y="128">quebra a senha do serviço offline</text>

  <!-- Row 2 -->
  <rect x="300" y="168" width="300" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="attr" x="318" y="196">userAccountControl</text>
  <text class="attrS" x="318" y="216">bit 0x400000 ligado, sem 0x2</text>
  <rect x="660" y="168" width="260" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text class="atk" x="680" y="196">AS-REP roasting</text>
  <text class="attrS" x="680" y="216">pega o hash sem ter a senha</text>

  <!-- Row 3 -->
  <rect x="300" y="258" width="300" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="attr" x="318" y="286">adminCount = 1</text>
  <text class="attrS" x="318" y="306">ou memberOf de grupo forte</text>
  <rect x="660" y="258" width="260" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text class="atk" x="680" y="286">alvo de alto valor</text>
  <text class="attrS" x="680" y="306">conta que vale perseguir</text>

  <!-- Row 4 -->
  <rect x="300" y="348" width="300" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="attr" x="318" y="376">ACL GenericAll / WriteDacl</text>
  <text class="attrS" x="318" y="396">controle sobre outro objeto</text>
  <rect x="660" y="348" width="260" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text class="atk" x="680" y="376">takeover do objeto</text>
  <text class="attrS" x="680" y="396">reseta senha ou entra no grupo</text>

  <!-- Row 5 -->
  <rect x="300" y="438" width="300" height="64" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="attr" x="318" y="466">description / info</text>
  <text class="attrS" x="318" y="486">com um segredo escrito</text>
  <rect x="660" y="438" width="260" height="64" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
  <text class="atk" x="680" y="466">credencial de graça</text>
  <text class="attrS" x="680" y="486">senha em texto na conta</text>

  <!-- root -> attribute branches (neutral gray) -->
  <path d="M190,278 C235,112 250,112 298,112" stroke="#64748b" stroke-width="1.6" fill="none"/>
  <path d="M190,284 C235,200 250,200 298,200" stroke="#64748b" stroke-width="1.6" fill="none"/>
  <path d="M190,290 L298,290" stroke="#64748b" stroke-width="1.6" fill="none"/>
  <path d="M190,296 C235,380 250,380 298,380" stroke="#64748b" stroke-width="1.6" fill="none"/>
  <path d="M190,302 C235,470 250,470 298,470" stroke="#64748b" stroke-width="1.6" fill="none"/>

  <!-- attribute -> attack (red) -->
  <path d="M600,112 L658,112" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M600,200 L658,200" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M600,290 L658,290" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M600,380 L658,380" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#a-red)"/>
  <path d="M600,470 L658,470" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#a-red)"/>

  <!-- legend -->
  <g transform="translate(40,540)">
    <rect x="0" y="-15" width="22" height="10" rx="2" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text class="lg" x="30" y="-6">o atributo que você lê</text>
    <rect x="250" y="-15" width="22" height="10" rx="2" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text class="lg" x="280" y="-6">o ataque que ele habilita</text>
  </g>

  <!-- banner -->
  <rect x="40" y="560" width="880" height="34" rx="6" fill="#0f172a" stroke="#eab308" stroke-width="1.5"/>
  <text class="banner" x="480" y="582" text-anchor="middle">enumerar é ler o atributo e decidir qual deles vira caminho de ataque</text>
</svg>
