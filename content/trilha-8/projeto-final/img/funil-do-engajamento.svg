<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d">
  <title id="t">O funil do engajamento: do contrato ao relatório</title>
  <desc id="d">Um fluxo da esquerda para a direita em três estágios. Estágio 1, pré-engajamento: definir escopo, obter autorização por escrito, acordar as regras de engajamento e a janela de teste, e rodar o preflight que confere alvos contra o escopo; nada é tocado antes disso. Estágio 2, execução: um laço repetido — reconhecimento, foothold, escalação de privilégio e pós-exploração enxuta — envolto por uma faixa de OPSEC e notas ao vivo, porque cada comando e evidência é registrado enquanto o teste acontece. Estágio 3, entrega: o relatório, com resumo executivo, achados com risco e técnica ATT&amp;CK, narrativa do ataque e recomendações de correção. Uma seta grossa mostra que todo o trabalho desemboca no relatório. A faixa de rodapé resume a tese: a invasão é o meio; o entregável é o relatório; o contorno — escopo, autorização, OPSEC e limpeza — é o que separa o profissional do criminoso.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .st { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .li { font-size: 10px; fill: #cfe0d6; }
    .loop { font-size: 11px; font-weight: 700; fill: #5ee08a; }
    .box { fill: #0f1b20; stroke: #5cc8d8; stroke-width: 2; }
    .exec { fill: #10201c; stroke: #5ee08a; stroke-width: 2; }
    .rep { fill: #201a12; stroke: #e0a15e; stroke-width: 2.5; }
    .band { fill: #0c1410; stroke: #30423a; stroke-width: 1.5; }
    .flow { stroke: #9fb0a6; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .big { stroke: #e0a15e; stroke-width: 5; fill: none; marker-end: url(#ao); }
    .cyc { stroke: #5ee08a; stroke-width: 2; fill: none; marker-end: url(#ag); }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
    .lane { font-size: 9px; fill: #9fb0a6; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0a6"/></marker>
    <marker id="ao" markerWidth="11" markerHeight="11" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a15e"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="960" height="440" fill="#121815"/>
  <text class="t" x="30" y="34">O funil do engajamento: o trabalho todo desemboca no relatório</text>

  <!-- stage 1: pre-engagement -->
  <rect class="box" x="30" y="70" width="210" height="236" rx="8"/>
  <text class="st" x="135" y="96" text-anchor="middle">1 · pré-engajamento</text>
  <text class="li" x="48" y="130">• escopo definido</text>
  <text class="li" x="48" y="152">• autorização por escrito</text>
  <text class="li" x="48" y="174">• regras de engajamento</text>
  <text class="li" x="48" y="196">• janela de teste</text>
  <text class="li" x="48" y="218">• preflight: alvo ∈ escopo?</text>
  <text class="li" x="48" y="256" fill="#9fb0a6">nada é tocado</text>
  <text class="li" x="48" y="272" fill="#9fb0a6">antes disto.</text>

  <!-- stage 2: execution loop -->
  <rect class="exec" x="300" y="70" width="330" height="236" rx="8"/>
  <text class="st" x="465" y="96" text-anchor="middle" fill="#5ee08a">2 · execução (laço)</text>
  <rect class="box" x="322" y="118" width="130" height="34" rx="6"/><text class="loop" x="387" y="140" text-anchor="middle">recon</text>
  <rect class="box" x="478" y="118" width="130" height="34" rx="6"/><text class="loop" x="543" y="140" text-anchor="middle">foothold</text>
  <rect class="box" x="322" y="214" width="130" height="34" rx="6"/><text class="loop" x="387" y="236" text-anchor="middle">pós-explor.</text>
  <rect class="box" x="478" y="214" width="130" height="34" rx="6"/><text class="loop" x="543" y="236" text-anchor="middle">escalação</text>
  <path class="cyc" d="M452,135 L478,135"/>
  <path class="cyc" d="M543,152 L543,214"/>
  <path class="cyc" d="M478,231 L452,231"/>
  <path class="cyc" d="M387,214 L387,152"/>
  <rect class="band" x="322" y="264" width="286" height="30" rx="6"/>
  <text class="li" x="465" y="283" text-anchor="middle" fill="#5ee08a">OPSEC + notas ao vivo (cada comando e evidência)</text>

  <!-- stage 3: report -->
  <rect class="rep" x="690" y="70" width="240" height="236" rx="8"/>
  <text class="st" x="810" y="96" text-anchor="middle" fill="#e0a15e">3 · entrega: o relatório</text>
  <text class="li" x="708" y="130">• resumo executivo</text>
  <text class="li" x="708" y="152">• achados (risco + ATT&amp;CK)</text>
  <text class="li" x="708" y="174">• narrativa do ataque</text>
  <text class="li" x="708" y="196">• recomendações / correção</text>
  <text class="li" x="708" y="218">• anexos e evidências</text>
  <text class="li" x="708" y="256" fill="#9fb0a6">é o produto que</text>
  <text class="li" x="708" y="272" fill="#9fb0a6">o cliente compra.</text>

  <!-- flows -->
  <path class="flow" d="M240,188 L300,188"/>
  <path class="big" d="M630,188 L690,188"/>

  <text class="rule" x="30" y="390">A invasão é o meio; o entregável é o relatório. O contorno — escopo, autorização, OPSEC e limpeza —</text>
  <text class="rule" x="30" y="408">é o que separa o profissional do criminoso. Cada volta do laço vira uma linha de achado no relatório.</text>
</svg>
