<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="960" height="660" role="img" aria-labelledby="t d">
  <title id="t">Árvore de desempate: travei num CTF sem dicas, e agora?</title>
  <desc id="d">Uma coluna de quatro perguntas, respondidas em ordem a partir de "TRAVEI". Pergunta 1: enumerei tudo o que esta conta vê? Se não, enumere por completo, com script e checagem manual. Pergunta 2: estou no mesmo caminho além do time-box? Se sim, é um rabbit hole: abandone, anote como descartado e volte a enumerar. Pergunta 3: re-enumerei como a conta atual? Se não, rode de novo sudo -l, id, getcap e grupos com a nova conta. Pergunta 4: isto é achado real ou isca? Se for isca, descarte e volte a enumerar. Se for achado real, a saída em destaque: levante uma nova hipótese e teste dentro de um novo time-box, de volta ao laço da autonomia.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 14px; font-weight: 700; fill: #10b981; }
    .keyn { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .keysub { font-size: 12px; fill: #cbd5e1; }
    .start { font-size: 15px; font-weight: 700; fill: #e2e8f0; }
    .q { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .a { font-size: 13px; font-weight: 700; fill: #f97316; }
    .sub { font-size: 12px; fill: #cbd5e1; }
    .lno { font-size: 12px; font-weight: 700; fill: #f97316; }
    .lok { font-size: 12px; font-weight: 700; fill: #10b981; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f97316"/></marker>
    <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="660" fill="url(#bg-grad)"/>

  <text id="title" class="title" x="480" y="38" text-anchor="middle">Travei, e agora? — desça as 4 perguntas, em ordem</text>
  <rect id="key-banner" x="150" y="56" width="660" height="52" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="keyn" x="480" y="78" text-anchor="middle">Quase sempre o bloqueio está numa destas perguntas</text>
  <text class="keysub" x="480" y="97" text-anchor="middle">responda antes de pedir qualquer dica (nenhum ramo é “ler o writeup”)</text>

  <!-- start -->
  <rect id="start" x="160" y="128" width="220" height="40" rx="20" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text class="start" x="270" y="153" text-anchor="middle">TRAVEI</text>
  <path id="e-start-q1" d="M270,168 L270,186" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>

  <!-- Q1 -->
  <rect id="q1" x="60" y="190" width="420" height="62" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="q" x="270" y="215" text-anchor="middle">1 · Enumerei TUDO o que esta conta vê?</text>
  <text class="sub" x="270" y="236" text-anchor="middle">arquivos, serviços, permissões, grupos</text>
  <path id="e-q1-a1" d="M480,221 L566,221" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="lno" x="523" y="213" text-anchor="middle">não</text>
  <rect id="a1" x="570" y="190" width="350" height="62" rx="6" fill="#2a1408" stroke="#f97316" stroke-width="1.5"/>
  <text class="a" x="745" y="215" text-anchor="middle">Enumere por completo</text>
  <text class="sub" x="745" y="236" text-anchor="middle">com método: script + checagem manual</text>
  <path id="e-q1-q2" d="M270,252 L270,282" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text class="lok" x="282" y="272">sim</text>

  <!-- Q2 -->
  <rect id="q2" x="60" y="286" width="420" height="62" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="q" x="270" y="311" text-anchor="middle">2 · Estou no mesmo caminho além</text>
  <text class="q" x="270" y="331" text-anchor="middle">do tempo que me dei (time-box)?</text>
  <path id="e-q2-a2" d="M480,317 L566,317" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="lno" x="523" y="309" text-anchor="middle">sim</text>
  <rect id="a2" x="570" y="286" width="350" height="62" rx="6" fill="#2a1408" stroke="#f97316" stroke-width="1.5"/>
  <text class="a" x="745" y="311" text-anchor="middle">É rabbit hole: abandone</text>
  <text class="sub" x="745" y="332" text-anchor="middle">anote “descartado” e volte a enumerar</text>
  <path id="e-q2-q3" d="M270,348 L270,378" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text class="lok" x="282" y="368">não</text>

  <!-- Q3 -->
  <rect id="q3" x="60" y="382" width="420" height="62" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="q" x="270" y="407" text-anchor="middle">3 · Re-enumerei como a conta ATUAL?</text>
  <text class="sub" x="270" y="428" text-anchor="middle">(e não só como a conta anterior)</text>
  <path id="e-q3-a3" d="M480,413 L566,413" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="lno" x="523" y="405" text-anchor="middle">não</text>
  <rect id="a3" x="570" y="382" width="350" height="62" rx="6" fill="#2a1408" stroke="#f97316" stroke-width="1.5"/>
  <text class="a" x="745" y="407" text-anchor="middle">Rode tudo de novo como ela</text>
  <text class="sub" x="745" y="428" text-anchor="middle">sudo -l, id, getcap, grupos</text>
  <path id="e-q3-q4" d="M270,444 L270,474" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <text class="lok" x="282" y="464">sim</text>

  <!-- Q4 -->
  <rect id="q4" x="60" y="478" width="420" height="62" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="q" x="270" y="503" text-anchor="middle">4 · Isto é achado real ou isca?</text>
  <text class="sub" x="270" y="524" text-anchor="middle">leva ao objetivo, ou não serve para nada?</text>
  <path id="e-q4-a4" d="M480,509 L566,509" stroke="#f97316" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text class="lno" x="523" y="501" text-anchor="middle">isca</text>
  <rect id="a4" x="570" y="478" width="350" height="62" rx="6" fill="#2a1408" stroke="#f97316" stroke-width="1.5"/>
  <text class="a" x="745" y="503" text-anchor="middle">Descarte sem apego</text>
  <text class="sub" x="745" y="524" text-anchor="middle">e volte a enumerar</text>
  <path id="e-q4-out" d="M270,540 L270,570" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>
  <text class="lok" x="282" y="560">achado real</text>

  <!-- way out (key moment) -->
  <rect id="way-out" x="60" y="574" width="420" height="62" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text class="key" x="270" y="599" text-anchor="middle">DESTRAVOU: nova hipótese + teste</text>
  <text class="sub" x="270" y="620" text-anchor="middle">com um novo time-box (de volta ao laço)</text>

  <!-- legend -->
  <rect x="570" y="584" width="16" height="12" rx="2" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="leg" x="594" y="594">pergunta a responder</text>
  <rect x="570" y="606" width="16" height="12" rx="2" fill="#2a1408" stroke="#f97316" stroke-width="1.5"/>
  <text class="leg" x="594" y="616">achou o bloqueio: corrija</text>
  <rect x="570" y="628" width="16" height="12" rx="2" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="leg" x="594" y="638">tudo certo: siga em frente</text>
</svg>
