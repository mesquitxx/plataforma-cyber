<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d">
  <title id="t">O laço da autonomia: enumerar, levantar hipótese, testar, registrar</title>
  <desc id="d">Um ciclo fechado de quatro passos que gira no sentido horário. Passo 1, enumerar: colher tudo o que a identidade atual enxerga (arquivos, serviços, permissões, grupos). Passo 2, levantar hipótese: escolher o vetor mais promissor a partir do que a enumeração revelou. Passo 3, testar com time-box: tentar o vetor por um tempo limitado. Passo 4, registrar: anotar comando, evidência e horário, deu certo ou não. Do passo 3 saem duas setas: se funcionou, você muda de identidade e o laço recomeça do passo 1 com a nova identidade; se não funcionou dentro do time-box, você volta ao passo 1 para enumerar de novo, sem insistir no mesmo vetor. No centro, a regra: cada salto reinicia o laço, porque a nova identidade enxerga coisas que a anterior não via.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .st { font-size: 14px; font-weight: 700; fill: #5cc8d8; }
    .n { font-size: 10.5px; fill: #cfe0d6; }
    .box { fill: #0f1b20; stroke: #5cc8d8; stroke-width: 2; }
    .center { fill: #16201b; stroke: #5ee08a; stroke-width: 2; }
    .cx { font-size: 11px; fill: #5ee08a; font-weight: 700; }
    .cn { font-size: 9.5px; fill: #9fb0a6; }
    .flow { stroke: #9fb0a6; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .ok { stroke: #5ee08a; stroke-width: 2.5; fill: none; marker-end: url(#ag); }
    .no { stroke: #e0a15e; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; marker-end: url(#ao); }
    .lok { font-size: 9.5px; fill: #5ee08a; }
    .lno { font-size: 9.5px; fill: #e0a15e; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0a6"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5ee08a"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e0a15e"/></marker>
  </defs>
  <rect width="760" height="460" fill="#121815"/>
  <text class="t" x="30" y="36">O laço da autonomia — o que fazer quando ninguém te diz o próximo passo</text>

  <!-- 1 enumerar (top-left) -->
  <rect class="box" x="70" y="90" width="230" height="86" rx="8"/>
  <text class="st" x="185" y="120" text-anchor="middle">1 · enumerar</text>
  <text class="n" x="185" y="142" text-anchor="middle">tudo o que ESTA identidade vê:</text>
  <text class="n" x="185" y="158" text-anchor="middle">arquivos, serviços, perms, grupos</text>

  <!-- 2 hipótese (top-right) -->
  <rect class="box" x="460" y="90" width="230" height="86" rx="8"/>
  <text class="st" x="575" y="120" text-anchor="middle">2 · hipótese</text>
  <text class="n" x="575" y="142" text-anchor="middle">escolher o vetor mais</text>
  <text class="n" x="575" y="158" text-anchor="middle">promissor do que apareceu</text>

  <!-- 3 testar (bottom-right) -->
  <rect class="box" x="460" y="300" width="230" height="86" rx="8"/>
  <text class="st" x="575" y="330" text-anchor="middle">3 · testar (time-box)</text>
  <text class="n" x="575" y="352" text-anchor="middle">tentar o vetor por um</text>
  <text class="n" x="575" y="368" text-anchor="middle">tempo LIMITADO</text>

  <!-- 4 registrar (bottom-left) -->
  <rect class="box" x="70" y="300" width="230" height="86" rx="8"/>
  <text class="st" x="185" y="330" text-anchor="middle">4 · registrar</text>
  <text class="n" x="185" y="352" text-anchor="middle">comando + evidência + horário</text>
  <text class="n" x="185" y="368" text-anchor="middle">(deu certo OU não)</text>

  <!-- center rule -->
  <rect class="center" x="300" y="200" width="160" height="76" rx="8"/>
  <text class="cx" x="380" y="228" text-anchor="middle">cada salto</text>
  <text class="cx" x="380" y="244" text-anchor="middle">reinicia o laço</text>
  <text class="cn" x="380" y="262" text-anchor="middle">a nova identidade vê</text>

  <!-- arrows of the cycle -->
  <path class="flow" d="M300,133 L455,133"/>
  <path class="flow" d="M575,176 L575,296"/>
  <!-- test -> register (no / dentro do time-box, não achou) -->
  <path class="no" d="M460,355 L305,355"/>
  <text class="lno" x="382" y="348" text-anchor="middle">não funcionou → volta a enumerar</text>
  <!-- register -> enumerate (loop back up) -->
  <path class="flow" d="M185,300 L185,180"/>
  <!-- test -> success leaves the loop -->
  <path class="ok" d="M690,343 L742,343 L742,133 L694,133"/>
  <text class="lok" x="726" y="240" text-anchor="middle">funcionou:</text>
  <text class="lok" x="726" y="256" text-anchor="middle">nova</text>
  <text class="lok" x="726" y="272" text-anchor="middle">identidade,</text>
  <text class="lok" x="726" y="288" text-anchor="middle">recomeça</text>
</svg>
