<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
  <title id="t">A espinha da metodologia: cinco fases, da reconhecimento ao relatório</title>
  <desc id="d">Um fluxo da esquerda para a direita em cinco fases, e sob cada fase a tática correspondente do MITRE ATT&amp;CK, a ferramenta típica e a trilha da plataforma que a ensinou. Fase 1, reconhecimento: objetivo é mapear a superfície de ataque; tática Reconnaissance e Discovery; ferramentas nmap, OSINT e Burp; Trilha 2. Fase 2, acesso: objetivo é conseguir o primeiro foothold; tática Initial Access e Execution; ferramentas SQL injection, exploits web e CVEs de serviço; Trilhas 4 e 5. Fase 3, escalação: objetivo é ganhar mais poder e alcance; táticas Privilege Escalation, Credential Access, Discovery e Lateral Movement; ferramentas LinPEAS, hashcat, Kerberoasting e pass-the-hash; Trilhas 3, 6 e 7. Fase 4, pós-exploração: objetivo é persistir, coletar e exfiltrar as joias da coroa; táticas Persistence, Collection, Command and Control e Exfiltration; Trilha 6. Fase 5, relatório: objetivo é entregar valor; não há tática de ataque, e sim documentação; ferramentas a linha do tempo em UTC e o mapa ATT&amp;CK; Trilhas 1 e 8. Uma faixa embaixo diz que é a mesma espinha, repetida: dentro de cada host o atacante refaz o laço enumerar, explorar e consolidar, e cada fase vira uma seção do relatório.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .st { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .obj { font-size: 9.5px; fill: #9fb0a6; }
    .tac { font-size: 9px; fill: #5ee08a; }
    .tool { font-size: 9px; fill: #cfe0d6; }
    .mod { font-size: 9.5px; fill: #e0a15e; }
    .box { fill: #0f1b20; stroke: #5cc8d8; stroke-width: 2; }
    .rep { fill: #16201b; stroke: #5ee08a; stroke-width: 2.5; }
    .flow { stroke: #9fb0a6; stroke-width: 2.5; fill: none; marker-end: url(#ac); }
    .rule { font-size: 11.5px; fill: #cfe0d6; }
    .lane { font-size: 9px; fill: #9fb0a6; }
  </style>
  <defs>
    <marker id="ac" markerWidth="10" markerHeight="10" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="960" height="430" fill="#121815"/>
  <text class="t" x="30" y="34">A espinha da metodologia: a mesma linha, do recon ao relatório</text>

  <!-- lane labels -->
  <text class="lane" x="30" y="150">objetivo</text>
  <text class="lane" x="30" y="214">ATT&amp;CK</text>
  <text class="lane" x="30" y="236">ferramenta</text>
  <text class="lane" x="30" y="300">trilha</text>

  <!-- phase 1 -->
  <rect class="box" x="96" y="66" width="162" height="300" rx="8"/>
  <text class="st" x="177" y="92" text-anchor="middle">1 · recon</text>
  <text class="obj" x="177" y="140" text-anchor="middle">mapear a</text>
  <text class="obj" x="177" y="154" text-anchor="middle">superfície de ataque</text>
  <text class="tac" x="177" y="208" text-anchor="middle">Reconnaissance</text>
  <text class="tac" x="177" y="222" text-anchor="middle">Discovery</text>
  <text class="tool" x="177" y="244" text-anchor="middle">nmap · OSINT</text>
  <text class="tool" x="177" y="258" text-anchor="middle">Burp</text>
  <text class="mod" x="177" y="300" text-anchor="middle">Trilha 2</text>

  <!-- phase 2 -->
  <rect class="box" x="270" y="66" width="162" height="300" rx="8"/>
  <text class="st" x="351" y="92" text-anchor="middle">2 · acesso</text>
  <text class="obj" x="351" y="140" text-anchor="middle">conseguir o</text>
  <text class="obj" x="351" y="154" text-anchor="middle">primeiro foothold</text>
  <text class="tac" x="351" y="208" text-anchor="middle">Initial Access</text>
  <text class="tac" x="351" y="222" text-anchor="middle">Execution</text>
  <text class="tool" x="351" y="244" text-anchor="middle">SQLi · exploit web</text>
  <text class="tool" x="351" y="258" text-anchor="middle">CVE de serviço</text>
  <text class="mod" x="351" y="300" text-anchor="middle">Trilhas 4 · 5</text>

  <!-- phase 3 -->
  <rect class="box" x="444" y="66" width="162" height="300" rx="8"/>
  <text class="st" x="525" y="92" text-anchor="middle">3 · escalação</text>
  <text class="obj" x="525" y="140" text-anchor="middle">ganhar mais</text>
  <text class="obj" x="525" y="154" text-anchor="middle">poder e alcance</text>
  <text class="tac" x="525" y="200" text-anchor="middle">Priv Esc · Discovery</text>
  <text class="tac" x="525" y="214" text-anchor="middle">Credential Access</text>
  <text class="tac" x="525" y="228" text-anchor="middle">Lateral Movement</text>
  <text class="tool" x="525" y="250" text-anchor="middle">LinPEAS · hashcat</text>
  <text class="tool" x="525" y="264" text-anchor="middle">Kerberoasting · PtH</text>
  <text class="mod" x="525" y="300" text-anchor="middle">Trilhas 3 · 6 · 7</text>

  <!-- phase 4 -->
  <rect class="box" x="618" y="66" width="162" height="300" rx="8"/>
  <text class="st" x="699" y="92" text-anchor="middle">4 · pós-explor.</text>
  <text class="obj" x="699" y="140" text-anchor="middle">persistir, coletar e</text>
  <text class="obj" x="699" y="154" text-anchor="middle">exfiltrar as joias</text>
  <text class="tac" x="699" y="200" text-anchor="middle">Persistence</text>
  <text class="tac" x="699" y="214" text-anchor="middle">Collection · C2</text>
  <text class="tac" x="699" y="228" text-anchor="middle">Exfiltration</text>
  <text class="tool" x="699" y="250" text-anchor="middle">cron · túnel</text>
  <text class="tool" x="699" y="264" text-anchor="middle">loot · staging</text>
  <text class="mod" x="699" y="300" text-anchor="middle">Trilha 6</text>

  <!-- phase 5 (report) -->
  <rect class="rep" x="792" y="66" width="162" height="300" rx="8"/>
  <text class="st" x="873" y="92" text-anchor="middle" fill="#5ee08a">5 · relatório</text>
  <text class="obj" x="873" y="140" text-anchor="middle">entregar o valor</text>
  <text class="obj" x="873" y="154" text-anchor="middle">do engajamento</text>
  <text class="tac" x="873" y="208" text-anchor="middle" fill="#9fb0a6">(sem ataque:</text>
  <text class="tac" x="873" y="222" text-anchor="middle" fill="#9fb0a6">documentação)</text>
  <text class="tool" x="873" y="244" text-anchor="middle">timeline UTC</text>
  <text class="tool" x="873" y="258" text-anchor="middle">mapa ATT&amp;CK</text>
  <text class="mod" x="873" y="300" text-anchor="middle">Trilhas 1 · 8</text>

  <!-- arrows -->
  <path class="flow" d="M258,330 L270,330"/>
  <path class="flow" d="M432,330 L444,330"/>
  <path class="flow" d="M606,330 L618,330"/>
  <path class="flow" d="M780,330 L792,330"/>

  <text class="rule" x="30" y="404">A mesma espinha, repetida: em cada host o atacante refaz o laço enumerar → explorar → consolidar,</text>
  <text class="rule" x="30" y="420">e cada fase vira uma seção do relatório final.</text>
</svg>
