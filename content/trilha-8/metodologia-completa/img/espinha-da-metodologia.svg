<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="t d">
  <title id="t">A espinha da metodologia: cinco fases em linha, cada uma entregando à próxima o que ela precisa, e só o relatório entrega o valor ao cliente</title>
  <desc id="d">Cinco caixas da esquerda para a direita, ligadas por setas. Fase 1, recon: mapear hosts, serviços e versões; entrega onde atacar; Trilha 2. Fase 2, acesso: explorar a falha achada no recon; entrega o primeiro pé dentro, o foothold; Trilhas 4 e 5. Fase 3, escalação: virar root ou admin e mover-se para outras máquinas; entrega mais poder e alcance; Trilhas 3, 6 e 7. Fase 4, pós-exploração: persistir e chegar às joias da coroa; entrega as joias coletadas, que é o que o atacante ganha; Trilha 6. Fase 5, relatório, destacada em verde: contar como a rede caiu e como consertar; entrega o valor ao cliente; Trilhas 1 e 8. Uma nota embaixo lembra que, na prática, o laço enumerar, explorar e consolidar recomeça em cada máquina nova.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 15px; font-weight: 700; fill: #38bdf8; }
    .keyok { fill: #10b981; }
    .keysub { font-size: 12px; fill: #cbd5e1; }
    .step { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .stepok { font-size: 13px; font-weight: 700; fill: #10b981; }
    .sub { font-size: 12px; fill: #cbd5e1; }
    .lbl { font-size: 11px; fill: #94a3b8; }
    .out { font-size: 12px; font-weight: 700; fill: #e2e8f0; }
    .trk { font-size: 11px; fill: #94a3b8; }
    .note { font-size: 12px; fill: #94a3b8; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/></marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#10b981"/></marker>
    <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="480" fill="url(#bg-grad)"/>

  <text id="title" class="title" x="480" y="38" text-anchor="middle">A espinha da metodologia: uma linha só, do recon ao relatório</text>

  <!-- key idea banner -->
  <rect id="key-banner" x="110" y="56" width="740" height="58" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="key" x="480" y="81" text-anchor="middle">Cada fase entrega à próxima o que ela precisa —</text>
  <text class="key keyok" x="480" y="102" text-anchor="middle">e só a fase 5 entrega o valor ao cliente</text>

  <!-- phase 1 -->
  <rect id="phase-1" x="30" y="150" width="156" height="230" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="step" x="108" y="178" text-anchor="middle">1 · RECON</text>
  <text class="sub" x="108" y="206" text-anchor="middle">mapear hosts,</text>
  <text class="sub" x="108" y="222" text-anchor="middle">serviços e versões</text>
  <line x1="44" y1="250" x2="172" y2="250" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="108" y="272" text-anchor="middle">entrega:</text>
  <text class="out" x="108" y="292" text-anchor="middle">onde atacar</text>
  <text class="trk" x="108" y="360" text-anchor="middle">Trilha 2</text>

  <!-- phase 2 -->
  <rect id="phase-2" x="219" y="150" width="156" height="230" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="step" x="297" y="178" text-anchor="middle">2 · ACESSO</text>
  <text class="sub" x="297" y="206" text-anchor="middle">explorar a falha</text>
  <text class="sub" x="297" y="222" text-anchor="middle">achada no recon</text>
  <line x1="233" y1="250" x2="361" y2="250" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="297" y="272" text-anchor="middle">entrega:</text>
  <text class="out" x="297" y="292" text-anchor="middle">o primeiro pé</text>
  <text class="out" x="297" y="308" text-anchor="middle">dentro (foothold)</text>
  <text class="trk" x="297" y="360" text-anchor="middle">Trilhas 4 · 5</text>

  <!-- phase 3 -->
  <rect id="phase-3" x="408" y="150" width="156" height="230" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="step" x="486" y="178" text-anchor="middle">3 · ESCALAÇÃO</text>
  <text class="sub" x="486" y="206" text-anchor="middle">virar root/admin</text>
  <text class="sub" x="486" y="222" text-anchor="middle">e ir para outras</text>
  <text class="sub" x="486" y="238" text-anchor="middle">máquinas</text>
  <line x1="422" y1="250" x2="550" y2="250" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="486" y="272" text-anchor="middle">entrega:</text>
  <text class="out" x="486" y="292" text-anchor="middle">mais poder</text>
  <text class="out" x="486" y="308" text-anchor="middle">e alcance</text>
  <text class="trk" x="486" y="360" text-anchor="middle">Trilhas 3 · 6 · 7</text>

  <!-- phase 4 -->
  <rect id="phase-4" x="597" y="150" width="156" height="230" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="step" x="675" y="178" text-anchor="middle">4 · PÓS-EXPL.</text>
  <text class="sub" x="675" y="206" text-anchor="middle">persistir e chegar</text>
  <text class="sub" x="675" y="222" text-anchor="middle">às joias da coroa</text>
  <line x1="611" y1="250" x2="739" y2="250" stroke="#334155" stroke-width="1"/>
  <text class="lbl" x="675" y="272" text-anchor="middle">entrega:</text>
  <text class="out" x="675" y="292" text-anchor="middle">as joias coletadas</text>
  <text class="lbl" x="675" y="310" text-anchor="middle">(o que o atacante</text>
  <text class="lbl" x="675" y="325" text-anchor="middle">ganha)</text>
  <text class="trk" x="675" y="360" text-anchor="middle">Trilha 6</text>

  <!-- phase 5: report (key moment) -->
  <rect id="phase-5" x="786" y="150" width="156" height="230" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text class="stepok" x="864" y="178" text-anchor="middle">5 · RELATÓRIO</text>
  <text class="sub" x="864" y="206" text-anchor="middle">contar como a rede</text>
  <text class="sub" x="864" y="222" text-anchor="middle">caiu e como</text>
  <text class="sub" x="864" y="238" text-anchor="middle">consertar</text>
  <line x1="800" y1="250" x2="928" y2="250" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
  <text class="lbl" x="864" y="272" text-anchor="middle">entrega:</text>
  <text class="out" x="864" y="292" text-anchor="middle" fill="#10b981">o valor ao</text>
  <text class="out" x="864" y="308" text-anchor="middle" fill="#10b981">cliente</text>
  <text class="trk" x="864" y="360" text-anchor="middle">Trilhas 1 · 8</text>

  <!-- hand-off arrows -->
  <path id="e-1-2" d="M186,265 L215,265" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path id="e-2-3" d="M375,265 L404,265" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path id="e-3-4" d="M564,265 L593,265" stroke="#38bdf8" stroke-width="2" fill="none" marker-end="url(#arrow-cyan)"/>
  <path id="e-4-5" d="M753,265 L782,265" stroke="#10b981" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>

  <!-- secondary note -->
  <text class="note" x="480" y="412" text-anchor="middle">Na prática a linha se repete: em cada máquina nova, o laço enumerar → explorar → consolidar recomeça.</text>

  <!-- legend -->
  <rect x="250" y="440" width="22" height="14" rx="3" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="leg" x="280" y="452">fases do ataque</text>
  <rect x="480" y="440" width="22" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="leg" x="510" y="452">entrega do valor (relatório)</text>
</svg>
