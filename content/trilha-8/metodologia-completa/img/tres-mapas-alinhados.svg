<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="t d">
  <title id="t">Três mapas do mesmo ataque: Cyber Kill Chain, MITRE ATT&amp;CK e PTES concordam no ataque, mas só o PTES fecha com relatório</title>
  <desc id="d">Três linhas, uma por mapa, alinhadas às fases recon, acesso, escalação e pós-exploração, e uma coluna separada de relatório. Cyber Kill Chain, da Lockheed Martin, 2011: em recon Reconnaissance, Weaponization e Delivery; em acesso Exploitation e Installation; em escalação Command and Control; em pós-exploração Actions on Objectives; relatório: não tem. MITRE ATT&amp;CK, matriz de táticas: em recon Reconnaissance; em acesso Initial Access e Execution; em escalação Privilege Escalation, Credential Access, Discovery e Lateral Movement; em pós-exploração Collection, C2, Exfiltration e Impact; relatório: não tem. PTES, processo de um teste: em recon Intelligence Gathering; em acesso Exploitation; em escalação Exploitation e Post-Exploitation; em pós-exploração Post-Exploitation; relatório: Reporting, destacado em verde. A ideia principal, no topo: os três concordam no ataque, só o PTES fecha com o relatório, porque ninguém paga pela invasão, paga-se pelo relatório.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 15px; font-weight: 700; fill: #e2e8f0; }
    .keyok { fill: #10b981; }
    .keysub { font-size: 12px; fill: #cbd5e1; }
    .colhead { font-size: 13px; font-weight: 700; fill: #38bdf8; }
    .colheadok { font-size: 13px; font-weight: 700; fill: #10b981; }
    .ph { font-size: 11px; fill: #94a3b8; }
    .map { font-size: 13px; font-weight: 700; fill: #e2e8f0; }
    .orig { font-size: 11px; fill: #94a3b8; }
    .c { font-size: 11px; fill: #cbd5e1; }
    .none { font-size: 12px; fill: #64748b; }
    .rep { font-size: 13px; font-weight: 700; fill: #10b981; }
    .repsub { font-size: 11px; fill: #cbd5e1; }
    .leg { font-size: 12px; fill: #94a3b8; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-green"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="960" height="500" fill="url(#bg-grad)"/>

  <text id="title" class="title" x="480" y="36" text-anchor="middle">Três mapas do mesmo ataque</text>

  <!-- key idea banner -->
  <rect id="key-banner" x="130" y="52" width="700" height="58" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text class="key" x="480" y="77" text-anchor="middle">Os três concordam no ataque — <tspan class="keyok">só o PTES fecha com o relatório</tspan></text>
  <text class="keysub" x="480" y="97" text-anchor="middle">ninguém paga pela invasão: paga-se pelo relatório</text>

  <!-- column headers -->
  <text class="colhead" x="475" y="140" text-anchor="middle">COMO SE ATACA</text>
  <text class="ph" x="261" y="160" text-anchor="middle">recon</text>
  <text class="ph" x="404" y="160" text-anchor="middle">acesso</text>
  <text class="ph" x="547" y="160" text-anchor="middle">escalação</text>
  <text class="ph" x="690" y="160" text-anchor="middle">pós-exploração</text>
  <text class="colheadok" x="860" y="150" text-anchor="middle">RELATÓRIO</text>

  <!-- row 1: Cyber Kill Chain -->
  <text class="map" x="30" y="204">Cyber</text>
  <text class="map" x="30" y="220">Kill Chain</text>
  <text class="orig" x="30" y="238">Lockheed, 2011</text>
  <rect id="kc-attack" x="190" y="170" width="572" height="86" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="333" y1="180" x2="333" y2="246" stroke="#334155" stroke-width="1"/>
  <line x1="476" y1="180" x2="476" y2="246" stroke="#334155" stroke-width="1"/>
  <line x1="619" y1="180" x2="619" y2="246" stroke="#334155" stroke-width="1"/>
  <text class="c" x="261" y="198" text-anchor="middle">Reconnaissance</text>
  <text class="c" x="261" y="216" text-anchor="middle">Weaponization</text>
  <text class="c" x="261" y="234" text-anchor="middle">Delivery</text>
  <text class="c" x="404" y="207" text-anchor="middle">Exploitation</text>
  <text class="c" x="404" y="225" text-anchor="middle">Installation</text>
  <text class="c" x="547" y="207" text-anchor="middle">Command &amp;</text>
  <text class="c" x="547" y="225" text-anchor="middle">Control</text>
  <text class="c" x="690" y="207" text-anchor="middle">Actions on</text>
  <text class="c" x="690" y="225" text-anchor="middle">Objectives</text>
  <rect id="kc-report" x="785" y="170" width="150" height="86" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="none" x="860" y="218" text-anchor="middle">não tem</text>

  <!-- row 2: MITRE ATT&CK -->
  <text class="map" x="30" y="296">MITRE</text>
  <text class="map" x="30" y="312">ATT&amp;CK</text>
  <text class="orig" x="30" y="330">matriz de táticas</text>
  <rect id="attck-attack" x="190" y="266" width="572" height="86" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="333" y1="276" x2="333" y2="342" stroke="#334155" stroke-width="1"/>
  <line x1="476" y1="276" x2="476" y2="342" stroke="#334155" stroke-width="1"/>
  <line x1="619" y1="276" x2="619" y2="342" stroke="#334155" stroke-width="1"/>
  <text class="c" x="261" y="313" text-anchor="middle">Reconnaissance</text>
  <text class="c" x="404" y="303" text-anchor="middle">Initial Access</text>
  <text class="c" x="404" y="321" text-anchor="middle">Execution</text>
  <text class="c" x="547" y="285" text-anchor="middle">Privilege Escal.</text>
  <text class="c" x="547" y="303" text-anchor="middle">Credential Access</text>
  <text class="c" x="547" y="321" text-anchor="middle">Discovery</text>
  <text class="c" x="547" y="339" text-anchor="middle">Lateral Movement</text>
  <text class="c" x="690" y="294" text-anchor="middle">Collection · C2</text>
  <text class="c" x="690" y="312" text-anchor="middle">Exfiltration</text>
  <text class="c" x="690" y="330" text-anchor="middle">Impact</text>
  <rect id="attck-report" x="785" y="266" width="150" height="86" rx="6" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="none" x="860" y="314" text-anchor="middle">não tem</text>

  <!-- row 3: PTES -->
  <text class="map" x="30" y="400">PTES</text>
  <text class="orig" x="30" y="418">processo de</text>
  <text class="orig" x="30" y="432">um teste</text>
  <rect id="ptes-attack" x="190" y="362" width="572" height="86" rx="6" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="333" y1="372" x2="333" y2="438" stroke="#334155" stroke-width="1"/>
  <line x1="476" y1="372" x2="476" y2="438" stroke="#334155" stroke-width="1"/>
  <line x1="619" y1="372" x2="619" y2="438" stroke="#334155" stroke-width="1"/>
  <text class="c" x="261" y="399" text-anchor="middle">Intelligence</text>
  <text class="c" x="261" y="417" text-anchor="middle">Gathering</text>
  <text class="c" x="404" y="409" text-anchor="middle">Exploitation</text>
  <text class="c" x="547" y="399" text-anchor="middle">Exploitation /</text>
  <text class="c" x="547" y="417" text-anchor="middle">Post-Exploitation</text>
  <text class="c" x="690" y="409" text-anchor="middle">Post-Exploitation</text>
  <rect id="ptes-report" x="785" y="362" width="150" height="86" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2.5" filter="url(#glow-green)"/>
  <text class="rep" x="860" y="400" text-anchor="middle">Reporting</text>
  <text class="repsub" x="860" y="420" text-anchor="middle">fase de relatório</text>

  <!-- legend -->
  <rect x="170" y="470" width="22" height="14" rx="3" fill="#0c2233" stroke="#38bdf8" stroke-width="1.5"/>
  <text class="leg" x="200" y="482">fases de ataque</text>
  <rect x="380" y="470" width="22" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="leg" x="410" y="482">tem relatório</text>
  <rect x="580" y="470" width="22" height="14" rx="3" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text class="leg" x="610" y="482">não tem relatório</text>
</svg>
