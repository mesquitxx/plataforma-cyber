<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-labelledby="t d">
  <title id="t">Três mapas alinhados às cinco fases: Cyber Kill Chain, MITRE ATT&amp;CK e PTES</title>
  <desc id="d">Uma tabela que alinha três frameworks às cinco fases da metodologia deste módulo. Colunas: recon, acesso, escalação, pós-exploração e relatório. Linha Cyber Kill Chain da Lockheed Martin: em recon ficam Reconnaissance, Weaponization e Delivery; em acesso, Exploitation e Installation; em escalação, Command and Control e pivô; em pós-exploração, Actions on Objectives; em relatório, nada, pois a kill chain não tem fase de relatório. Linha MITRE ATT&amp;CK, por táticas: em recon, Reconnaissance; em acesso, Initial Access e Execution; em escalação, Privilege Escalation, Credential Access, Discovery e Lateral Movement; em pós-exploração, Collection, Command and Control, Exfiltration e Impact; em relatório, nada. Linha PTES: em recon, Intelligence Gathering; em acesso, Exploitation; em escalação, parte de Exploitation e Post-Exploitation; em pós-exploração, Post-Exploitation; em relatório, Reporting, destacado. A conclusão na faixa de baixo é que os três mapas quase coincidem no ataque, mas só o PTES fecha com uma fase de relatório, justamente a que este módulo mais cobra.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .ph { font-size: 11px; font-weight: 700; fill: #5cc8d8; }
    .fw { font-size: 10px; font-weight: 700; fill: #e0a15e; }
    .c { font-size: 8.5px; fill: #cfe0d6; }
    .rep { font-size: 9px; font-weight: 700; fill: #5ee08a; }
    .none { font-size: 9px; fill: #6f8078; }
    .grid { stroke: #2c3a33; stroke-width: 1; }
    .rule { font-size: 11px; fill: #cfe0d6; }
  </style>
  <rect width="960" height="370" fill="#121815"/>
  <text class="t" x="30" y="32">Três mapas, uma espinha — e só um fecha com relatório</text>

  <!-- column separators (phase columns start at x=180, width 156) -->
  <line class="grid" x1="180" y1="52" x2="180" y2="300"/>
  <line class="grid" x1="336" y1="52" x2="336" y2="300"/>
  <line class="grid" x1="492" y1="52" x2="492" y2="300"/>
  <line class="grid" x1="648" y1="52" x2="648" y2="300"/>
  <line class="grid" x1="804" y1="52" x2="804" y2="300"/>
  <!-- row separators -->
  <line class="grid" x1="30" y1="86" x2="960" y2="86"/>
  <line class="grid" x1="30" y1="158" x2="960" y2="158"/>
  <line class="grid" x1="30" y1="230" x2="960" y2="230"/>
  <line class="grid" x1="30" y1="300" x2="960" y2="300"/>

  <!-- phase headers -->
  <text class="ph" x="258" y="76" text-anchor="middle">recon</text>
  <text class="ph" x="414" y="76" text-anchor="middle">acesso</text>
  <text class="ph" x="570" y="76" text-anchor="middle">escalação</text>
  <text class="ph" x="726" y="76" text-anchor="middle">pós-exploração</text>
  <text class="ph" x="882" y="76" text-anchor="middle">relatório</text>

  <!-- Lane 1: Cyber Kill Chain -->
  <text class="fw" x="36" y="120">Cyber</text>
  <text class="fw" x="36" y="134">Kill Chain</text>
  <text class="c" x="258" y="112" text-anchor="middle">Reconnaissance</text>
  <text class="c" x="258" y="126" text-anchor="middle">Weaponization</text>
  <text class="c" x="258" y="140" text-anchor="middle">Delivery</text>
  <text class="c" x="414" y="118" text-anchor="middle">Exploitation</text>
  <text class="c" x="414" y="132" text-anchor="middle">Installation</text>
  <text class="c" x="570" y="125" text-anchor="middle">Command &amp; Control</text>
  <text class="c" x="726" y="125" text-anchor="middle">Actions on Objectives</text>
  <text class="none" x="882" y="125" text-anchor="middle">— (não tem)</text>

  <!-- Lane 2: MITRE ATT&CK -->
  <text class="fw" x="36" y="192">MITRE</text>
  <text class="fw" x="36" y="206">ATT&amp;CK</text>
  <text class="c" x="258" y="197" text-anchor="middle">Reconnaissance</text>
  <text class="c" x="414" y="190" text-anchor="middle">Initial Access</text>
  <text class="c" x="414" y="204" text-anchor="middle">Execution</text>
  <text class="c" x="570" y="183" text-anchor="middle">Privilege Escalation</text>
  <text class="c" x="570" y="197" text-anchor="middle">Credential Access</text>
  <text class="c" x="570" y="211" text-anchor="middle">Discovery · Lateral Mov.</text>
  <text class="c" x="726" y="190" text-anchor="middle">Collection · C2</text>
  <text class="c" x="726" y="204" text-anchor="middle">Exfiltration · Impact</text>
  <text class="none" x="882" y="197" text-anchor="middle">—</text>

  <!-- Lane 3: PTES -->
  <text class="fw" x="36" y="268">PTES</text>
  <text class="c" x="258" y="268" text-anchor="middle">Intelligence Gathering</text>
  <text class="c" x="414" y="268" text-anchor="middle">Exploitation</text>
  <text class="c" x="570" y="261" text-anchor="middle">(Exploitation /</text>
  <text class="c" x="570" y="275" text-anchor="middle">Post-Exploitation)</text>
  <text class="c" x="726" y="268" text-anchor="middle">Post-Exploitation</text>
  <rect x="810" y="252" width="144" height="24" rx="5" fill="#16201b" stroke="#5ee08a" stroke-width="2"/>
  <text class="rep" x="882" y="268" text-anchor="middle">Reporting</text>

  <text class="rule" x="30" y="330">Os três mapas quase coincidem no ataque. Só o PTES fecha com uma fase de relatório —</text>
  <text class="rule" x="30" y="348">a que separa um pentest de uma invasão, e a que este módulo mais cobra.</text>
</svg>
