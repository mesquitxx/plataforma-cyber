<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d">
  <title id="t">Anatomia de um JWT e os dois pontos onde ele quebra</title>
  <desc id="d">Em cima, um JSON Web Token mostrado como três partes separadas por ponto, cada uma codificada em Base64url: o header (que declara o algoritmo, por exemplo RS256), o payload (os dados, como o e-mail e o papel do usuário) e a assinatura. Setas indicam que header e payload são apenas Base64url, legíveis e editáveis por qualquer um; só a assinatura, calculada com uma chave, impede a alteração. Embaixo, dois ataques. No primeiro, o atacante troca o algoritmo do header para none e apaga a assinatura; um servidor que confia no campo alg aceita o token sem verificar nada. No segundo, a confusão de chaves: o servidor espera RS256 e verifica com a chave pública, mas o atacante assina com HS256 usando essa mesma chave pública como segredo HMAC; como a chave pública é conhecida, o token forjado passa na verificação.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .r { fill: #f08a7e; }
    .c { fill: #5cc8d8; }
    .arr { stroke: #9fb0a6; stroke-width: 1.5; marker-end: url(#ar); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="900" height="460" fill="#121815"/>
  <text class="t" x="30" y="32">Um JWT tem três partes — e só uma delas protege</text>

  <rect x="30" y="52" width="250" height="52" rx="8" fill="#1d2a23" stroke="#5cc8d8"/>
  <text class="h c" x="44" y="72">header</text>
  <text class="s" x="44" y="92">{"alg":"RS256","typ":"JWT"}</text>
  <text class="b" x="286" y="84">.</text>
  <rect x="300" y="52" width="300" height="52" rx="8" fill="#1d2a23" stroke="#e8c46a"/>
  <text class="h y" x="314" y="72">payload</text>
  <text class="s" x="314" y="92">{"data":{"email":"...","role":"admin"}}</text>
  <text class="b" x="606" y="84">.</text>
  <rect x="620" y="52" width="250" height="52" rx="8" fill="#1d2a23" stroke="#5ee08a"/>
  <text class="h g" x="634" y="72">signature</text>
  <text class="s" x="634" y="92">HMAC/RSA sobre header.payload</text>

  <path class="arr" d="M150,104 L150,132"/>
  <path class="arr" d="M450,104 L450,132"/>
  <path class="arr" d="M745,104 L745,132"/>
  <text class="b" x="60" y="150">Base64url: legível</text>
  <text class="b" x="360" y="150">Base64url: legível</text>
  <text class="b g" x="630" y="150">a única com chave</text>
  <text class="s r" x="60" y="166">qualquer um edita</text>
  <text class="s r" x="360" y="166">qualquer um edita</text>
  <text class="s" x="630" y="166">verificada no servidor</text>

  <rect x="30" y="192" width="400" height="236" rx="10" fill="#16201b" stroke="#f08a7e"/>
  <text class="h r" x="46" y="216">Ataque 1 — alg: none</text>
  <text class="b" x="46" y="240">header vira {"alg":"none"}</text>
  <text class="b" x="46" y="260">assinatura apagada (fica vazia)</text>
  <text class="b" x="46" y="280">token = header.payload.</text>
  <text class="s" x="46" y="304">O servidor lê o campo alg e confia:</text>
  <text class="s" x="46" y="320">"sem algoritmo, nada a verificar".</text>
  <text class="s r" x="46" y="344">Resultado: o payload editado passa.</text>
  <text class="s y" x="46" y="376">Vira qualquer usuário sem chave</text>
  <text class="s y" x="46" y="392">nenhuma. É a Missão 1.</text>

  <rect x="470" y="192" width="400" height="236" rx="10" fill="#16201b" stroke="#f08a7e"/>
  <text class="h r" x="486" y="216">Ataque 2 — confusão de chaves</text>
  <text class="b" x="486" y="240">servidor espera RS256 (assimétrica)</text>
  <text class="b" x="486" y="260">verifica com a chave PÚBLICA</text>
  <text class="b" x="486" y="280">atacante assina com HS256 usando</text>
  <text class="b" x="486" y="296">a chave pública como segredo HMAC</text>
  <text class="s" x="486" y="320">A pública é conhecida (o app até a</text>
  <text class="s" x="486" y="336">serve); o servidor confunde os papéis.</text>
  <text class="s r" x="486" y="360">Resultado: assinatura "válida".</text>
  <text class="s y" x="486" y="392">É a Missão 2.</text>
</svg>
