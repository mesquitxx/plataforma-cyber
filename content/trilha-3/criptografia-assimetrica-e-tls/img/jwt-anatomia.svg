<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" role="img" aria-labelledby="t d">
  <title id="t">JWT: qualquer um edita header e payload; só a assinatura protege, e os dois ataques a contornam</title>
  <desc id="d">No topo, um JWT em três partes separadas por ponto: o header, com o algoritmo (RS256), e o payload, com o e-mail e o papel "user", aparecem em laranja porque são só Base64url, que qualquer um lê e edita; a assinatura, em verde, é a única parte feita com chave e conferida pelo servidor. No meio, dois ataques em vermelho, lado a lado, cada um mostrando o token forjado com o papel trocado para "admin". Ataque 1, alg none (Missão 1): o atacante troca o alg para none e deixa a assinatura vazia; o servidor lê o alg e obedece, "sem algoritmo, nada a verificar". Ataque 2, confusão de chaves (Missão 2): o servidor espera RS256 e confere com a chave pública; o atacante assina em HS256 usando essa mesma chave pública, que o app serve, como segredo do HMAC, e a assinatura bate. Embaixo, as duas setas chegam ao mesmo resultado, em destaque vermelho: o servidor aceita o payload editado e o atacante vira qualquer usuário, até admin, sem saber chave nenhuma. Legenda: laranja é a parte que o atacante edita, verde é a assinatura que protege, vermelho é o ataque e o que ele ganha.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #94a3b8; }
    .code { font-size: 12px; }
    .org { fill: #fb923c; }
    .grn { fill: #34d399; }
    .red { fill: #f87171; }
    .ink1f0f12 { fill: #1f0f12; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1000" height="610" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Um JWT: qualquer um <tspan class="org">edita header e payload</tspan>;</text>
  <text class="title" x="40" y="64">só a <tspan class="grn">assinatura</tspan> protege — e os dois ataques a contornam</text>

  <!-- Token anatomy -->
  <rect x="40" y="84" width="250" height="52" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="h org" x="56" y="104">header</text>
  <text class="code" x="56" y="124">{"alg":"RS256","typ":"JWT"}</text>
  <text class="h" x="302" y="120">.</text>
  <rect x="320" y="84" width="290" height="52" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="h org" x="336" y="104">payload</text>
  <text class="code" x="336" y="124">{"email":"...","role":"user"}</text>
  <text class="h" x="622" y="120">.</text>
  <rect x="640" y="84" width="320" height="52" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/>
  <text class="h grn" x="656" y="104">assinatura</text>
  <text class="code" x="656" y="124">feita sobre header.payload</text>

  <path d="M40,146 V152 H610 V146" stroke="#f97316" stroke-width="1.5" fill="none"/>
  <text class="b org" x="325" y="172" text-anchor="middle">só Base64url: qualquer um lê e edita</text>
  <path d="M640,146 V152 H960 V146" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <text class="b grn" x="800" y="172" text-anchor="middle">feita com chave: o servidor confere</text>

  <!-- Attack 1 -->
  <rect x="40" y="196" width="450" height="236" rx="8" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="h red" x="58" y="222">Ataque 1 — alg: none</text>
  <text class="s" x="472" y="222" text-anchor="end">Missão 1</text>
  <rect x="58" y="236" width="132" height="32" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="code org" x="124" y="257" text-anchor="middle">{"alg":"none"}</text>
  <rect x="200" y="236" width="140" height="32" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="code org" x="270" y="257" text-anchor="middle">"role":"admin"</text>
  <rect x="350" y="236" width="122" height="32" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="code red" x="411" y="257" text-anchor="middle">(vazia)</text>
  <text class="b" x="58" y="300">Troca o alg para none, sobe o papel</text>
  <text class="b" x="58" y="318">e apaga a assinatura.</text>
  <text class="b" x="58" y="350">O servidor lê o alg e obedece:</text>
  <text class="b red" x="58" y="368">"sem algoritmo, nada a verificar".</text>

  <!-- Attack 2 -->
  <rect x="510" y="196" width="450" height="236" rx="8" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
  <text class="h red" x="528" y="222">Ataque 2 — confusão de chaves</text>
  <text class="s" x="942" y="222" text-anchor="end">Missão 2</text>
  <rect x="528" y="236" width="132" height="32" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="code org" x="594" y="257" text-anchor="middle">{"alg":"HS256"}</text>
  <rect x="670" y="236" width="140" height="32" rx="4" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="code org" x="740" y="257" text-anchor="middle">"role":"admin"</text>
  <rect x="820" y="236" width="122" height="32" rx="4" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="code red" x="881" y="257" text-anchor="middle">HMAC+pública</text>
  <text class="b" x="528" y="300">O servidor espera RS256 e confere</text>
  <text class="b" x="528" y="318">com a chave PÚBLICA.</text>
  <text class="b" x="528" y="350">O atacante assina em HS256 usando</text>
  <text class="b" x="528" y="368">essa pública (o app a serve) como</text>
  <text class="b" x="528" y="386">segredo do HMAC.</text>
  <text class="b red" x="528" y="414">A assinatura "bate".</text>

  <!-- Consequence -->
  <path d="M265,432 L265,474" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <path d="M735,432 L735,474" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="40" y="478" width="920" height="70" rx="8" fill="#ef4444"/>
  <text class="ink1f0f12" x="500" y="506" text-anchor="middle" font-size="16" font-weight="700">O servidor aceita o payload editado</text>
  <text class="ink1f0f12" x="500" y="532" text-anchor="middle" font-size="14" font-weight="700">o atacante vira qualquer usuário (até admin) sem saber chave nenhuma</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="578" width="14" height="14" rx="3" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="62" y="590">parte que o atacante edita</text>
    <rect x="340" y="578" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text x="362" y="590">assinatura que protege</text>
    <rect x="620" y="578" width="14" height="14" rx="3" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
    <text x="642" y="590">ataque e o que ele ganha</text>
  </g>
</svg>
