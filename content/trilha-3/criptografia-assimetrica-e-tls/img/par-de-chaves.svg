<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="t d">
  <title id="t">Os dois usos de um par de chaves assimétrico</title>
  <desc id="d">Um par de chaves tem uma chave pública, que pode ser divulgada, e uma chave privada, que fica só com o dono. O diagrama mostra os dois usos, lado a lado. À esquerda, confidencialidade: qualquer pessoa cifra uma mensagem com a chave pública do destinatário, e só o destinatário, com sua chave privada, consegue decifrar. À direita, autenticidade e assinatura: o dono assina com sua chave privada, e qualquer pessoa verifica com a chave pública dele; se a verificação passa, a mensagem veio mesmo do dono e não foi alterada. A regra no rodapé: o que uma chave do par faz, só a outra desfaz; a pública nunca decifra o que ela mesma cifrou, nem assina.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .arr { stroke: #5cc8d8; stroke-width: 2; marker-end: url(#ar); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="400" fill="#121815"/>
  <text class="t" x="30" y="32">Um par de chaves, dois usos: o que uma fecha, só a outra abre</text>

  <rect x="30" y="52" width="410" height="258" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="h" x="46" y="78">Confidencialidade (cifrar para alguém)</text>
  <rect x="46" y="96" width="120" height="48" rx="8" fill="#1d2a23" stroke="#5ee08a"/>
  <text class="b" x="60" y="116">quem envia</text>
  <text class="s" x="60" y="134">texto claro</text>
  <path class="arr" d="M168,120 L300,120"/>
  <text class="s y" x="176" y="112">cifra com a</text>
  <text class="s y" x="176" y="142">PÚBLICA do destino</text>
  <rect x="302" y="96" width="120" height="48" rx="8" fill="#1d2a23" stroke="#e8c46a"/>
  <text class="b" x="316" y="124">texto cifrado</text>
  <path class="arr" d="M362,144 L362,196"/>
  <rect x="302" y="198" width="120" height="48" rx="8" fill="#1d2a23" stroke="#5ee08a"/>
  <text class="b" x="316" y="218">destinatário</text>
  <text class="s g" x="316" y="236">decifra: PRIVADA</text>
  <text class="s" x="46" y="276">Só quem tem a chave privada lê. A pública,</text>
  <text class="s" x="46" y="292">que todos têm, não desfaz o que cifrou.</text>

  <rect x="460" y="52" width="410" height="258" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="h" x="476" y="78">Autenticidade (assinar)</text>
  <rect x="476" y="96" width="120" height="48" rx="8" fill="#1d2a23" stroke="#5ee08a"/>
  <text class="b" x="490" y="116">o dono</text>
  <text class="s g" x="490" y="134">assina: PRIVADA</text>
  <path class="arr" d="M598,120 L730,120"/>
  <text class="s y" x="606" y="112">mensagem +</text>
  <text class="s y" x="606" y="142">assinatura</text>
  <rect x="732" y="96" width="120" height="48" rx="8" fill="#1d2a23" stroke="#e8c46a"/>
  <text class="b" x="746" y="124">qualquer um</text>
  <path class="arr" d="M792,144 L792,196"/>
  <rect x="732" y="198" width="120" height="48" rx="8" fill="#1d2a23" stroke="#5ee08a"/>
  <text class="b" x="746" y="218">verifica com a</text>
  <text class="s g" x="746" y="236">PÚBLICA do dono</text>
  <text class="s" x="476" y="276">Passou? Veio do dono e não mudou. Só ele</text>
  <text class="s" x="476" y="292">tem a privada: é o não repúdio do 3.1.</text>

  <rect x="30" y="326" width="840" height="48" rx="10" fill="#1d2a23" stroke="#5cc8d8"/>
  <text class="b c" x="46" y="346">A regra: a PÚBLICA pode ser divulgada; a PRIVADA, nunca.</text>
  <text class="s" x="46" y="364">Cifrar usa a pública de quem recebe; assinar usa a privada de quem envia. Trocar os papéis é a falha da Missão 2.</text>
</svg>
