<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d">
  <title id="t">Um par de chaves, dois usos opostos</title>
  <desc id="d">A ideia principal, em destaque no topo: para cifrar, usa-se a chave pública de quem recebe; para assinar, usa-se a chave privada de quem envia. Verde é sempre a chave pública (pode ser divulgada) e dourado é sempre a chave privada (só o dono tem). À esquerda, cifrar para alguém: quem envia cifra a mensagem com a chave pública do destinatário; a mensagem cifrada ninguém lê no caminho; só a chave privada do destinatário a abre. À direita, assinar: o dono assina a mensagem com a própria chave privada; a mensagem segue com a assinatura; qualquer um confere com a chave pública do dono e, se bater, sabe que ela veio do dono e não foi alterada.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 20px; font-weight: 700; }
    .hl { font-size: 15px; font-weight: 700; }
    .ph { font-size: 15px; font-weight: 700; }
    .phs { font-size: 12px; fill: #94a3b8; }
    .bx { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .chip { font-size: 13px; font-weight: 700; }
    .leg { font-size: 12px; fill: #94a3b8; }
    .pub { fill: #10b981; }
    .prv { fill: #eab308; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1000" height="540" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="42">Um par de chaves, dois usos opostos</text>

  <!-- main idea banner -->
  <rect x="30" y="62" width="940" height="56" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="hl" x="54" y="96">CIFRAR: usa a <tspan class="pub">PÚBLICA</tspan> de quem RECEBE</text>
  <text class="hl" x="534" y="96">ASSINAR: usa a <tspan class="prv">PRIVADA</tspan> de quem ENVIA</text>
  <line x1="500" y1="74" x2="500" y2="106" stroke="#334155" stroke-width="1.5"/>

  <!-- left panel: encrypt -->
  
  <text class="ph" x="50" y="166">1. Cifrar para alguém</text>
  <text class="phs" x="268" y="166">(confidencialidade)</text>

  <rect x="50" y="186" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="66" y="208">Quem envia</text>
  <text class="sub" x="66" y="226">mensagem legível</text>

  <path d="M150,238 L150,284" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="170" y="248" width="300" height="30" rx="15" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <g fill="none" stroke="#10b981" stroke-width="2"><circle cx="187" cy="263" r="4"/><path d="M191,263 H204 M200,263 V267 M203,263 V266"/></g>
  <text class="chip pub" x="214" y="268">cifra: PÚBLICA do destinatário</text>

  <rect x="50" y="288" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="66" y="310">mensagem cifrada</text>
  <text class="sub" x="66" y="328">ninguém lê no caminho</text>

  <path d="M150,340 L150,386" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="170" y="350" width="300" height="30" rx="15" fill="#2a2306" stroke="#eab308" stroke-width="1.5"/>
  <g fill="none" stroke="#eab308" stroke-width="2"><circle cx="187" cy="365" r="4"/><path d="M191,365 H204 M200,365 V369 M203,365 V368"/></g>
  <text class="chip prv" x="214" y="370">abre: PRIVADA do destinatário</text>

  <rect x="50" y="390" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="66" y="412">Destinatário</text>
  <text class="sub" x="66" y="430">só ele lê a mensagem</text>

  <!-- right panel: sign -->
  <line x1="500" y1="140" x2="500" y2="462" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text class="ph" x="530" y="166">2. Assinar</text>
  <text class="phs" x="640" y="166">(autenticidade)</text>

  <rect x="530" y="186" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="546" y="208">O dono</text>
  <text class="sub" x="546" y="226">escreve a mensagem</text>

  <path d="M630,238 L630,284" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="650" y="248" width="300" height="30" rx="15" fill="#2a2306" stroke="#eab308" stroke-width="1.5"/>
  <g fill="none" stroke="#eab308" stroke-width="2"><circle cx="667" cy="263" r="4"/><path d="M671,263 H684 M680,263 V267 M683,263 V266"/></g>
  <text class="chip prv" x="694" y="268">assina: PRIVADA do dono</text>

  <rect x="530" y="288" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="546" y="310">mensagem</text>
  <text class="sub" x="546" y="328">+ assinatura</text>

  <path d="M630,340 L630,386" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="650" y="350" width="300" height="30" rx="15" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <g fill="none" stroke="#10b981" stroke-width="2"><circle cx="667" cy="365" r="4"/><path d="M671,365 H684 M680,365 V369 M683,365 V368"/></g>
  <text class="chip pub" x="694" y="370">confere: PÚBLICA do dono</text>

  <rect x="530" y="390" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569"/>
  <text class="bx" x="546" y="412">Qualquer um</text>
  <text class="sub" x="546" y="430">bateu: do dono, intacta</text>

  <!-- legend -->
  <g fill="none" stroke="#10b981" stroke-width="2"><circle cx="35" cy="504" r="4"/><path d="M39,504 H52 M48,504 V508 M51,504 V507"/></g>
  <text class="leg" x="62" y="508"><tspan class="pub">PÚBLICA</tspan>: pode ser divulgada a todos</text>
  <g fill="none" stroke="#eab308" stroke-width="2"><circle cx="395" cy="504" r="4"/><path d="M399,504 H412 M408,504 V508 M411,504 V507"/></g>
  <text class="leg" x="422" y="508"><tspan class="prv">PRIVADA</tspan>: só o dono tem</text>
  <text class="leg" x="700" y="508">Trocar os papéis = Missão 2</text>
</svg>
