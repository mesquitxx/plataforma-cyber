<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">O handshake do TLS 1.3 combina troca de chave, assinatura e cifra simétrica</title>
  <desc id="d">Diagrama de sequência entre Cliente (à esquerda) e Servidor (à direita). De cima para baixo: o Cliente envia ClientHello com seu key_share efêmero de curva elíptica (ECDHE); o Servidor responde ServerHello com o próprio key_share, e nesse ponto os dois derivam o mesmo segredo compartilhado sem jamais transmiti-lo. O Servidor então envia o Certificate (que contém sua chave pública, assinada por uma autoridade certificadora) e o CertificateVerify (uma assinatura feita com a chave privada do servidor, que prova a identidade). Depois do Finished dos dois lados, os dados da aplicação viajam cifrados com AES-GCM. À direita, a legenda mapeia cada etapa à primitiva: a criptografia assimétrica resolve a troca de chave (ECDHE) e a autenticação (certificado + assinatura); a simétrica (AES-GCM) cifra os dados em si.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .c { fill: #5cc8d8; }
    .life { stroke: #2c3a33; stroke-width: 2; }
    .msg { stroke: #5cc8d8; stroke-width: 2; marker-end: url(#ar); fill: none; }
    .data { stroke: #5ee08a; stroke-width: 2.5; marker-end: url(#arg); marker-start: url(#arg); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
    <marker id="arg" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5ee08a"/></marker>
  </defs>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="32">O handshake do TLS 1.3: combinar a chave, provar a identidade, cifrar os dados</text>

  <rect x="90" y="52" width="150" height="34" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="128" y="74">Cliente</text>
  <rect x="520" y="52" width="150" height="34" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="560" y="74">Servidor</text>
  <line class="life" x1="165" y1="86" x2="165" y2="400"/>
  <line class="life" x1="595" y1="86" x2="595" y2="400"/>

  <path class="msg" d="M167,120 L593,120"/>
  <text class="b c" x="180" y="112">ClientHello + key_share (ECDHE)</text>

  <path class="msg" d="M593,158 L167,158"/>
  <text class="b c" x="230" y="150">ServerHello + key_share (ECDHE)</text>

  <path class="msg" d="M593,206 L167,206"/>
  <text class="b" x="210" y="183">{Certificate}</text>
  <text class="s" x="210" y="198">chave pública do servidor, assinada pela CA</text>

  <path class="msg" d="M593,250 L167,250"/>
  <text class="b" x="210" y="228">{CertificateVerify}</text>
  <text class="s" x="210" y="242">assinatura com a chave privada do servidor</text>

  <path class="msg" d="M167,286 L593,286"/>
  <text class="b" x="300" y="278">{Finished}</text>

  <path class="data" d="M167,330 L593,330"/>
  <text class="b g" x="250" y="322">Dados da aplicação — AES-GCM</text>
  <text class="s" x="250" y="348">(chave de sessão derivada do segredo ECDHE)</text>

  <rect x="690" y="100" width="190" height="300" rx="10" fill="#16201b" stroke="#2c3a33"/>
  <text class="h" x="704" y="124">Quem faz o quê</text>
  <text class="s c" x="704" y="150">ASSIMÉTRICA</text>
  <text class="s" x="704" y="168">ECDHE combina a</text>
  <text class="s" x="704" y="182">chave sem enviá-la</text>
  <text class="s" x="704" y="206">certificado + assinatura</text>
  <text class="s" x="704" y="220">provam a identidade</text>
  <text class="s g" x="704" y="252">SIMÉTRICA</text>
  <text class="s" x="704" y="270">AES-GCM cifra e</text>
  <text class="s" x="704" y="284">autentica os dados</text>
  <text class="s y" x="704" y="318">key_share efêmero =</text>
  <text class="s y" x="704" y="332">forward secrecy:</text>
  <text class="s" x="704" y="348">a chave de ontem não</text>
  <text class="s" x="704" y="362">cai se a privada vazar</text>
  <text class="s" x="704" y="376">amanhã</text>
</svg>
