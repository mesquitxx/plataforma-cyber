<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="t d">
  <title id="t">Handshake do TLS 1.3: a assimétrica só no começo, a simétrica para os dados</title>
  <desc id="d">Diagrama de sequência entre Cliente (à esquerda) e Servidor, em três fases. Fase 1, combinar a chave (assimétrica, roxo): o cliente manda um olá com a sua metade do ECDHE; o servidor responde com a metade dele. Momento-chave, em destaque dourado: os dois lados calculam o mesmo segredo, que nunca passou pela rede. Fase 2, provar quem é (assimétrica, roxo): o servidor manda o certificado, com a chave pública dele assinada pela CA, e uma assinatura feita com a chave privada dele. Fase 3, cifrar os dados (simétrica, verde): do segredo nasce a chave de sessão, e os dados vão e voltam cifrados com AES-GCM. À direita, cada fase é explicada: o ECDHE combina a chave sem enviá-la; o certificado e a assinatura provam a identidade; a simétrica, rápida, leva todo o resto da conversa. Nota: os segredos do ECDHE são efêmeros, jogados fora depois, o que dá forward secrecy. Legenda: roxo é assimétrica, dourado é o segredo compartilhado, verde é simétrica.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 12px; fill: #94a3b8; }
    .pur { fill: #c084fc; }
    .gold { fill: #facc15; }
    .grn { fill: #34d399; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-gold" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="40">Handshake do TLS 1.3: a <tspan class="pur">assimétrica</tspan> só no começo,</text>
  <text class="title" x="30" y="64">a <tspan class="grn">simétrica</tspan> leva os dados</text>

  <!-- Actors -->
  <rect x="60" y="88" width="120" height="34" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="120" y="110" text-anchor="middle">Cliente</text>
  <rect x="500" y="88" width="120" height="34" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="560" y="110" text-anchor="middle">Servidor</text>
  <line x1="120" y1="122" x2="120" y2="540" stroke="#334155" stroke-width="2"/>
  <line x1="560" y1="122" x2="560" y2="540" stroke="#334155" stroke-width="2"/>

  <!-- Phase 1 -->
  <text class="b pur" x="140" y="152">1a. olá + minha metade do ECDHE</text>
  <path d="M122,162 L556,162" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text class="b pur" x="140" y="194">1b. olá + minha metade do ECDHE</text>
  <path d="M558,204 L126,204" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <rect x="140" y="222" width="400" height="58" rx="8" fill="#2a2306" stroke="#facc15" stroke-width="2" filter="url(#glow-gold)"/>
  <text class="h gold" x="340" y="246" text-anchor="middle">Os dois lados calculam o MESMO segredo</text>
  <text class="b" x="340" y="268" text-anchor="middle">ele nunca passou pela rede</text>

  <!-- Phase 2 -->
  <text class="b pur" x="140" y="322">2a. certificado: minha chave pública,</text>
  <text class="b pur" x="176" y="340">assinada pela CA</text>
  <path d="M558,350 L126,350" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>
  <text class="b pur" x="140" y="382">2b. assinatura com a minha chave privada</text>
  <path d="M558,392 L126,392" stroke="#a855f7" stroke-width="2" fill="none" marker-end="url(#arrow-purple)"/>

  <!-- Phase 3 -->
  <text class="h grn" x="140" y="452">3. dados cifrados com AES-GCM</text>
  <path d="M126,466 L554,466" stroke="#10b981" stroke-width="4" fill="none" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)"/>
  <text class="s" x="140" y="492">chave de sessão: nasce do segredo dourado</text>

  <!-- Right column: what each phase does -->
  <rect x="640" y="136" width="330" height="150" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <text class="h pur" x="658" y="162">1. Combinar a chave</text>
  <text class="s pur" x="658" y="182">ASSIMÉTRICA</text>
  <text class="b" x="658" y="206">O ECDHE combina a chave</text>
  <text class="b" x="658" y="224">sem enviá-la.</text>
  <text class="s" x="658" y="252">Segredos efêmeros, jogados</text>
  <text class="s" x="658" y="270">fora depois: forward secrecy.</text>

  <rect x="640" y="304" width="330" height="104" rx="8" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
  <text class="h pur" x="658" y="330">2. Provar quem é</text>
  <text class="s pur" x="658" y="350">ASSIMÉTRICA</text>
  <text class="b" x="658" y="374">Certificado + assinatura</text>
  <text class="b" x="658" y="392">provam a identidade.</text>

  <rect x="640" y="426" width="330" height="96" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="h grn" x="658" y="452">3. Cifrar os dados</text>
  <text class="s grn" x="658" y="472">SIMÉTRICA</text>
  <text class="b" x="658" y="496">Rápida: leva todo o resto</text>
  <text class="b" x="658" y="514">da conversa.</text>

  <!-- Legend -->
  <g class="s">
    <rect x="60" y="566" width="14" height="14" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="82" y="578">assimétrica (lenta, só no começo)</text>
    <rect x="390" y="566" width="14" height="14" rx="3" fill="#2a2306" stroke="#facc15" stroke-width="1.5"/>
    <text x="412" y="578">segredo compartilhado</text>
    <rect x="640" y="566" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text x="662" y="578">simétrica (rápida)</text>
  </g>
</svg>
