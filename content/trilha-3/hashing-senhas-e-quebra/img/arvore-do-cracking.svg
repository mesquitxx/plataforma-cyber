<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img" aria-labelledby="t d">
  <title id="t">O tipo do hash decide se a senha cai: identificar primeiro, depois escolher o ataque</title>
  <desc id="d">Árvore de decisão. No topo, o passo 1: identificar o tipo do hash pelo tamanho e pelo começo (32 caracteres hex costumam ser MD5, $6$ é sha512crypt, $2b$ é bcrypt), o que escolhe o modo da ferramenta. Daí saem dois ramos. Ramo principal, em laranja, à esquerda: hash rápido e sem salt (MD5, SHA-1, NTLM), com bilhões de tentativas por segundo na GPU. Os ataques vêm em escada, do mais barato ao mais caro: 1, lista de senhas comuns (rockyou); 2, a lista com variações de cada palavra (Senha, s3nha, senha123); 3, palavra da lista mais dígitos no fim (monkey mais 1337); 4, todas as combinações de um padrão, viável só para senha curta. O resultado, em vermelho, é a senha descoberta: o atacante entra na conta. Ramo secundário, em verde tracejado, à direita: hash lento e com salt (bcrypt, sha512crypt, Argon2). O salt único por senha torna a tabela pré-calculada (rainbow table) inútil; cada tentativa é cara, então são poucas por segundo; só resta uma lista pequena e bem escolhida; muitas vezes a quebra é inviável, e é aí que a defesa da seção 8 funciona. Legenda: laranja são as tentativas do atacante, vermelho é o que ele ganha, verde é onde a defesa segura.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .bb { font-size: 13px; font-weight: 700; }
    .s { font-size: 12px; fill: #94a3b8; }
    .org { fill: #fb923c; }
    .grn { fill: #34d399; }
    .red { fill: #f87171; }
    .ink { fill: #1f0f12; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1000" height="650" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">O <tspan class="org">tipo do hash</tspan> decide se a senha cai</text>
  <text class="s" x="40" y="64">Primeiro descubra o que o hash é; isso escolhe o modo da ferramenta e quais ataques valem a pena.</text>

  <!-- Step 1: identify -->
  <rect x="290" y="84" width="420" height="72" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="h" x="500" y="108" text-anchor="middle">1. Identificar o tipo</text>
  <text class="s" x="500" y="128" text-anchor="middle">pelo tamanho e pelo começo do hash</text>
  <text class="s" x="500" y="146" text-anchor="middle">32 hex = MD5 · $6$ = sha512crypt · $2b$ = bcrypt</text>

  <path d="M420,156 V176 H280 V196" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M580,156 V176 H770 V196" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Fast branch: attack focus -->
  <rect x="40" y="198" width="480" height="54" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="2"/>
  <text class="h org" x="58" y="220">2a. RÁPIDO e SEM salt</text>
  <text class="s" x="58" y="241">MD5, SHA-1, NTLM · bilhões de tentativas/s na GPU</text>

  <rect data-graph-role="container" x="40" y="268" width="480" height="210" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="s" x="58" y="292">tente em escada, do mais barato ao mais caro:</text>
  <rect x="58" y="304" width="400" height="36" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="b" x="74" y="327"><tspan class="bb org">1</tspan>  lista de senhas comuns (rockyou)</text>
  <rect x="58" y="346" width="400" height="36" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="b" x="74" y="369"><tspan class="bb org">2</tspan>  + variações: Senha, s3nha, senha123</text>
  <rect x="58" y="388" width="400" height="36" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="b" x="74" y="411"><tspan class="bb org">3</tspan>  palavra + dígitos: monkey + 1337</text>
  <rect x="58" y="430" width="400" height="36" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text class="b" x="74" y="453"><tspan class="bb org">4</tspan>  todas as combinações (só senha curta)</text>
  <path d="M484,306 V462" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text class="s" x="504" y="384" text-anchor="middle" transform="rotate(90 504 384)">mais caro</text>

  <path d="M280,478 V510" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <text class="s red" x="292" y="499">o primeiro que bater</text>
  <rect x="40" y="512" width="480" height="64" rx="8" fill="#ef4444"/>
  <text class="ink" x="280" y="539" text-anchor="middle" font-size="16" font-weight="700">SENHA DESCOBERTA</text>
  <text class="ink" x="280" y="563" text-anchor="middle" font-size="13" font-weight="700">o atacante entra na conta com ela</text>

  <!-- Slow branch: secondary, defense -->
  <rect data-graph-role="container" x="580" y="198" width="380" height="378" rx="8" fill="#0f172a" fill-opacity="0.6" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text class="h grn" x="600" y="222">2b. LENTO e COM salt</text>
  <text class="s" x="600" y="242">bcrypt, sha512crypt, Argon2</text>
  <rect x="600" y="262" width="340" height="62" rx="6" fill="#0f172a" stroke="#334155"/>
  <text class="b" x="616" y="284">salt único por senha</text>
  <text class="s" x="616" y="303">→ tabela pré-calculada</text>
  <text class="s" x="616" y="318">(rainbow table) não serve</text>
  <rect x="600" y="336" width="340" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text class="b" x="616" y="357">cada tentativa é cara</text>
  <text class="s" x="616" y="376">→ poucas tentativas por segundo</text>
  <rect x="600" y="398" width="340" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text class="b" x="616" y="419">só resta uma lista pequena</text>
  <text class="s" x="616" y="438">e bem escolhida</text>
  <rect x="600" y="474" width="340" height="80" rx="6" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="bb grn" x="770" y="500" text-anchor="middle">muitas vezes: INVIÁVEL</text>
  <text class="s" x="770" y="521" text-anchor="middle">é aqui que a defesa funciona</text>
  <text class="s" x="770" y="539" text-anchor="middle">(seção 8)</text>

  <!-- legend -->
  <g class="s">
    <rect x="40" y="612" width="14" height="14" rx="3" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="62" y="624">tentativas do atacante</text>
    <rect x="300" y="612" width="14" height="14" rx="3" fill="#ef4444"/>
    <text x="322" y="624">o que o atacante ganha</text>
    <rect x="560" y="612" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text x="582" y="624">onde a defesa segura</text>
  </g>
</svg>
