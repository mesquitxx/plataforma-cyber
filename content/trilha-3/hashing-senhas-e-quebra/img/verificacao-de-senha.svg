<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Como um sistema guarda e confere uma senha sem nunca guardar a senha</title>
  <desc id="d">Duas colunas. No cadastro, a senha digitada é combinada com um salt aleatório e passa por uma função de derivação de chave lenta (KDF, como Argon2 ou bcrypt); o sistema guarda apenas o salt e o hash resultante, nunca a senha em claro. No login, a senha digitada é combinada com o MESMO salt guardado, passa pela mesma KDF e o hash resultante é comparado com o hash armazenado: se forem iguais, o acesso é liberado. No rodapé, o aviso de que, se o banco vazar, o atacante leva só salt mais hash, e precisa quebrar cada hash offline.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .r { fill: #f08a7e; }
    .fw { stroke: #5cc8d8; stroke-width: 2.5; marker-end: url(#ar); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
  </defs>
  <rect width="900" height="430" fill="#121815"/>
  <text class="t" x="30" y="30">A senha nunca é guardada; só o salt e o hash</text>

  <text class="h" x="40" y="66">CADASTRO</text>
  <text class="h" x="500" y="66">LOGIN</text>
  <line x1="450" y1="48" x2="450" y2="360" stroke="#2b3a31" stroke-width="1"/>

  <!-- Cadastro -->
  <rect x="40" y="80" width="200" height="40" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="56" y="105">senha: monkey1337</text>
  <path class="fw" d="M140,120 L140,150"/>
  <rect x="40" y="150" width="200" height="40" rx="8" fill="#16201b" stroke="#e8c46a"/>
  <text class="b y" x="56" y="168">+ salt aleatório</text>
  <text class="s" x="56" y="183">único por senha (ex.: AaBbCcDd)</text>
  <path class="fw" d="M140,190 L140,220"/>
  <rect x="40" y="220" width="200" height="46" rx="8" fill="#16201b" stroke="#5cc8d8"/>
  <text class="b h" x="56" y="240">KDF lenta</text>
  <text class="s" x="56" y="257">Argon2 / bcrypt / scrypt</text>
  <path class="fw" d="M140,266 L140,296"/>
  <rect x="40" y="296" width="330" height="54" rx="8" fill="#101a22" stroke="#5cc8d8"/>
  <text class="b h" x="56" y="316">GUARDA no banco: salt + hash</text>
  <text class="s" x="56" y="334">$6$AaBbCcDd$q1iHdMXPab/s... (a senha NÃO entra aqui)</text>

  <!-- Login -->
  <rect x="500" y="80" width="200" height="40" rx="8" fill="#16201b" stroke="#5ee08a"/>
  <text class="b g" x="516" y="105">senha digitada</text>
  <path class="fw" d="M600,120 L600,150"/>
  <rect x="500" y="150" width="200" height="40" rx="8" fill="#16201b" stroke="#e8c46a"/>
  <text class="b y" x="516" y="168">+ o MESMO salt</text>
  <text class="s" x="516" y="183">lido do registro do usuário</text>
  <path class="fw" d="M600,190 L600,220"/>
  <rect x="500" y="220" width="200" height="46" rx="8" fill="#16201b" stroke="#5cc8d8"/>
  <text class="b h" x="516" y="240">mesma KDF</text>
  <text class="s" x="516" y="257">com os mesmos parâmetros</text>
  <path class="fw" d="M600,266 L600,296"/>
  <rect x="500" y="296" width="360" height="54" rx="8" fill="#101a22" stroke="#5ee08a"/>
  <text class="b" x="516" y="316">hash novo == hash guardado ?</text>
  <text class="s g" x="516" y="334">igual → acesso liberado · diferente → senha errada</text>

  <rect x="40" y="372" width="820" height="42" rx="8" fill="#201616" stroke="#f08a7e"/>
  <text class="b r" x="56" y="390">Se o banco vazar, o atacante leva só salt + hash — nunca a senha.</text>
  <text class="s" x="56" y="406">Para descobrir a senha, ele precisa QUEBRAR cada hash offline, um por um. É disso que trata este módulo.</text>
</svg>
