<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">Encoding, hash e cifra: três esteiras diferentes</title>
  <desc id="d">Três faixas horizontais com a mesma entrada, a senha senha123. Na primeira, encoding: o Base64 transforma senha123 em c2VuaGExMjM= e qualquer pessoa desfaz a transformação, sem chave nenhuma; a seta de volta está aberta. Na segunda, hash: o SHA-256 transforma senha123 em 64 caracteres hexadecimais de tamanho fixo e não existe seta de volta; só dá para calcular de novo e comparar. Na terceira, cifra: o AES transforma senha123 em bytes ilegíveis usando uma chave, e a volta só existe para quem tem a chave, desenhada como um cadeado na seta de retorno. Embaixo, um resumo: encoding protege nada, hash prova que não mudou, cifra esconde de quem não tem a chave.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .r { fill: #f08a7e; }
    .c { fill: #5cc8d8; }
    .fw { stroke: #5cc8d8; stroke-width: 2.5; marker-end: url(#ar); fill: none; }
    .bk { stroke: #9fb0a6; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#ag); fill: none; }
  </style>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8d8"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9fb0a6"/></marker>
  </defs>
  <rect width="900" height="430" fill="#121815"/>
  <text class="t" x="30" y="32">Três esteiras para a mesma entrada</text>

  <!-- encoding -->
  <rect x="20" y="50" width="860" height="95" rx="10" fill="#16201b" stroke="#f08a7e"/>
  <text class="h r" x="36" y="74">ENCODING (Base64, hex, URL)</text>
  <text class="s" x="36" y="92">representação · sem chave · algoritmo público</text>
  <rect x="36" y="102" width="110" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="50" y="122">senha123</text>
  <path class="fw" d="M156,112 L330,112"/>
  <text class="s" x="200" y="104">base64</text>
  <rect x="340" y="102" width="150" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="354" y="122">c2VuaGExMjM=</text>
  <path class="bk" d="M330,128 L156,128"/>
  <text class="s" x="190" y="142">base64 -d (qualquer um)</text>
  <text class="b r" x="520" y="116">volta aberta a todos</text>
  <text class="s" x="520" y="134">protege: nada</text>

  <!-- hash -->
  <rect x="20" y="160" width="860" height="95" rx="10" fill="#16201b" stroke="#e8c46a"/>
  <text class="h y" x="36" y="184">HASH (SHA-256)</text>
  <text class="s" x="36" y="202">mão única · tamanho fixo · sem chave</text>
  <rect x="36" y="212" width="110" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="50" y="232">senha123</text>
  <path class="fw" d="M156,227 L330,227"/>
  <text class="s" x="200" y="219">sha256sum</text>
  <rect x="340" y="212" width="330" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="352" y="232">55a5e9e7…(64 hex, sempre)</text>
  <text class="b y" x="690" y="224">sem volta</text>
  <text class="s" x="690" y="242">só recalcular e comparar</text>

  <!-- cipher -->
  <rect x="20" y="270" width="860" height="95" rx="10" fill="#16201b" stroke="#5ee08a"/>
  <text class="h g" x="36" y="294">CIFRA (AES, ChaCha20)</text>
  <text class="s" x="36" y="312">reversível · só com a chave · algoritmo público</text>
  <rect x="36" y="322" width="110" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="50" y="342">senha123</text>
  <path class="fw" d="M156,332 L330,332"/>
  <text class="s" x="190" y="324">cifrar + chave</text>
  <rect x="340" y="322" width="150" height="30" rx="5" fill="#1d2a23" stroke="#3a4b42"/>
  <text class="b" x="354" y="342">8f 1c e2 07 …</text>
  <path class="bk" d="M330,348 L156,348"/>
  <rect x="236" y="352" width="14" height="11" rx="2" fill="#5ee08a"/>
  <path d="M239,352 v-4 a4,4 0 0 1 8,0 v4" stroke="#5ee08a" stroke-width="2" fill="none"/>
  <text class="s" x="262" y="362">decifrar (só com a chave)</text>
  <text class="b g" x="520" y="336">volta só para quem tem a chave</text>
  <text class="s" x="520" y="354">protege: confidencialidade</text>

  <text class="b" x="30" y="396">Encoding <tspan class="r">não esconde nada</tspan> · hash <tspan class="y">prova que não mudou</tspan> · cifra <tspan class="g">esconde de quem não tem a chave</tspan></text>
  <text class="s" x="30" y="416">Pergunta que separa os três: "existe volta? e, se existe, ela exige um segredo?"</text>
</svg>
