<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 494" width="900" height="494" role="img" aria-labelledby="t d">
  <title id="t">Princípio de Kerckhoffs: o inimigo conhece o sistema, só a chave é segredo</title>
  <desc id="d">Alice manda o texto cifrado a Bob por um canal inseguro, onde Eve escuta. Os dois usam um algoritmo público e guardam a mesma chave secreta. Eve vê todo o texto cifrado e conhece o algoritmo, porque ele é público; a única coisa que ela não tem é a chave, e é só isso que protege a mensagem. Embaixo, uma escada do que mais Eve pode ter, do mais fraco ao mais forte: só o cifrado; pares de texto claro e cifrado; escolher o que é cifrado; mandar cifrados e ver a reação do sistema. A cifra caseira da Missão 3 cai no segundo degrau; uma cifra séria resiste aos quatro.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 17px; font-weight: 700; }
    .key { font-size: 14px; font-weight: 700; }
    .name { font-size: 15px; font-weight: 700; }
    .lbl { font-size: 13px; }
    .bold { font-size: 13px; font-weight: 700; }
    .sub { font-size: 11px; fill: #94a3b8; }
    .red { fill: #ef4444; } .green { fill: #10b981; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/><stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/></marker>
  </defs>
  <rect width="900" height="494" fill="url(#bg-grad)"/>

  <text class="title" x="30" y="34">Princípio de Kerckhoffs</text>
  <rect x="20" y="48" width="860" height="40" rx="6" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="key" x="450" y="73" text-anchor="middle">Eve conhece o sistema inteiro. A única coisa que ela não tem é a <tspan class="green">CHAVE</tspan>.</text>

  <!-- Alice -->
  <rect x="30" y="104" width="200" height="86" rx="6" fill="#0f172a" stroke="#334155"/>
  <text class="name" x="46" y="128">Alice</text>
  <text class="sub" x="46" y="150">algoritmo público</text>
  <rect x="44" y="160" width="172" height="22" rx="4" fill="#0b2a20" stroke="#10b981"/>
  <text class="bold green" x="130" y="176" text-anchor="middle">CHAVE secreta</text>

  <!-- canal -->
  <path d="M232,140 L666,140" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow-gray)"/>
  <text class="lbl" x="449" y="130" text-anchor="middle">texto cifrado (canal inseguro)</text>

  <!-- Bob -->
  <rect x="670" y="104" width="200" height="86" rx="6" fill="#0f172a" stroke="#334155"/>
  <text class="name" x="686" y="128">Bob</text>
  <text class="sub" x="686" y="150">algoritmo público</text>
  <rect x="684" y="160" width="172" height="22" rx="4" fill="#0b2a20" stroke="#10b981"/>
  <text class="bold green" x="770" y="176" text-anchor="middle">CHAVE secreta</text>

  <!-- Eve: o momento-chave -->
  <path d="M449,144 L449,204" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" fill="none"/>
  <text class="sub" x="459" y="180">escuta</text>
  <rect x="270" y="204" width="360" height="96" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="1.5"/>
  <text class="name red" x="286" y="228">Eve (atacante)</text>
  <text class="lbl" x="286" y="250">✓ vê todo o texto cifrado</text>
  <text class="lbl" x="286" y="270">✓ conhece o algoritmo (é público)</text>
  <text class="bold" x="286" y="290">✗ NÃO tem a <tspan class="green">chave</tspan> ← só isso protege</text>

  <!-- escada: o que mais Eve pode ter -->
  <rect x="20" y="316" width="860" height="140" rx="6" fill="#0f172a" stroke="#334155" data-graph-role="container"/>
  <text class="bold" x="36" y="338">O que mais Eve pode ter, do mais fraco ao mais forte</text>
  <text class="sub" x="36" y="356">uma cifra séria resiste aos quatro</text>

  <rect x="36" y="404" width="196" height="44" rx="6" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.5"/>
  <text class="bold" x="46" y="422">1. só o cifrado</text>
  <text class="sub" x="46" y="440">ex.: escuta na rede</text>

  <rect x="246" y="376" width="196" height="72" rx="6" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
  <text class="bold" x="256" y="394">2. pares claro+cifrado</text>
  <text class="sub" x="256" y="412">ex.: cabeçalho fixo</text>
  <text class="bold red" x="256" y="436">a Missão 3 cai aqui</text>

  <rect x="456" y="362" width="196" height="86" rx="6" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.5"/>
  <text class="bold" x="466" y="380">3. escolhe o que</text>
  <text class="bold" x="490" y="396">é cifrado</text>
  <text class="sub" x="466" y="414">ex.: cadastra dados</text>

  <rect x="666" y="334" width="196" height="114" rx="6" fill="#1e293b" stroke="#ef4444" stroke-opacity="0.5"/>
  <text class="bold" x="676" y="352">4. manda cifrados</text>
  <text class="bold" x="700" y="368">e vê a reação</text>
  <text class="sub" x="676" y="386">aceita, recusa, demora</text>

  <!-- legenda -->
  <text class="sub" x="30" y="478">cores:</text>
  <rect x="80" y="469" width="12" height="12" rx="2" fill="#10b981"/><text class="sub" x="98" y="479">a chave (o único segredo)</text>
  <rect x="300" y="469" width="12" height="12" rx="2" fill="#ef4444"/><text class="sub" x="318" y="479">o atacante e o que ele pode ter</text>
  <rect x="560" y="469" width="12" height="12" rx="2" fill="#94a3b8"/><text class="sub" x="578" y="479">público: qualquer um vê</text>
</svg>
