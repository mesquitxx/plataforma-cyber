<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="t d">
  <title id="t">Colher agora, decifrar depois: o que é gravado hoje vaza quando o CRQC chega</title>
  <desc id="d">Linha do tempo de hoje (esquerda) ao futuro (direita). Na faixa de cima, o atacante: 1, grava hoje os valores públicos do key_share e os dados cifrados; 2, só guarda, por anos, porque disco é barato; 3, em vermelho, no dia do CRQC roda o Shor no key_share gravado e lê todo o tráfego antigo. Uma linha tracejada vertical marca z, o momento em que chega o CRQC. Na faixa de baixo, a conta de Mosca: a barra azul y é o tempo para migrar, durante o qual o tráfego segue clássico; logo depois começa a barra amarela x, o tempo que o último dado clássico precisa ficar secreto. A parte de x que passa da linha z está em vermelho: é a janela exposta, em que o dado ainda vale alguma coisa e o atacante já consegue lê-lo. No quadro de destaque: se x + y for maior que z, o problema já começou hoje. Só y está nas mãos de quem defende: migrar antes encurta a janela.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 17px; font-weight: 700; }
    .lane { font-size: 13px; font-weight: 700; fill: #94a3b8; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; fill: #94a3b8; }
    .big { font-size: 17px; font-weight: 700; }
    .blu { fill: #93c5fd; }
    .gold { fill: #facc15; }
    .red { fill: #fca5a5; }
    .dark { fill: #0f0f1a; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-red" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Colher agora, decifrar depois: o gravado hoje vaza no dia do CRQC</text>

  <!-- Attacker lane -->
  <text class="lane" x="40" y="80">O ATACANTE</text>
  <rect x="40" y="92" width="250" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="h" x="56" y="116">1. Grava hoje</text>
  <text class="s" x="56" y="137">os valores públicos (key_share)</text>
  <text class="s" x="56" y="154">e os dados cifrados</text>
  <path d="M290,129 L314,129" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <rect x="318" y="92" width="250" height="74" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text class="h" x="334" y="116">2. Só guarda, por anos</text>
  <text class="s" x="334" y="137">disco é barato; ele não</text>
  <text class="s" x="334" y="154">precisa ler nada agora</text>
  <path d="M568,129 L616,129" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <rect x="620" y="92" width="300" height="74" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="2" filter="url(#glow-red)"/>
  <text class="h red" x="636" y="116">3. No dia do CRQC: lê tudo</text>
  <text class="s" x="636" y="137">Shor no key_share gravado →</text>
  <text class="s" x="636" y="154">chave da sessão → tráfego antigo</text>

  <!-- Timeline -->
  <line x1="40" y1="206" x2="912" y2="206" stroke="#475569" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text class="s" x="40" y="226">hoje</text>
  <text class="s" x="866" y="226">futuro</text>

  <!-- z line -->
  <line x1="620" y1="182" x2="620" y2="374" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="7 5"/>
  <text class="b" x="630" y="226">z: chega o CRQC</text>

  <!-- Mosca lane -->
  <text class="lane" x="40" y="262">A CONTA DE MOSCA</text>
  <rect x="40" y="274" width="340" height="32" rx="5" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="b blu" x="54" y="295">y: anos para migrar</text>
  <text class="s" x="40" y="324">(enquanto isso, o tráfego segue clássico)</text>

  <rect x="380" y="338" width="240" height="32" rx="5" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
  <text class="b gold" x="394" y="359">x: tempo de sigilo</text>
  <rect x="620" y="338" width="230" height="32" rx="5" fill="#ef4444" stroke="#ef4444" stroke-width="1.5"/>
  <text class="h dark" x="636" y="359">JANELA EXPOSTA</text>
  <text class="s" x="380" y="390">a partir do último dado clássico</text>

  <!-- Highlight conclusion -->
  <rect x="40" y="412" width="880" height="90" rx="8" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="big" x="60" y="444">Se <tspan class="gold">x</tspan> + <tspan class="blu">y</tspan> &gt; z, o problema já começou hoje.</text>
  <text class="b" x="60" y="470">O dado gravado durante a migração ainda vale algo quando o CRQC chega.</text>
  <text class="s" x="60" y="491">Só y está nas mãos de quem defende: migrar antes encurta a janela vermelha.</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="524" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="62" y="536">y: migração (quem defende controla)</text>
    <rect x="370" y="524" width="14" height="14" rx="3" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
    <text x="392" y="536">x: sigilo exigido</text>
    <rect x="560" y="524" width="14" height="14" rx="3" fill="#ef4444" stroke="#ef4444" stroke-width="1.5"/>
    <text x="582" y="536">o que o atacante consegue ler</text>
  </g>
</svg>
