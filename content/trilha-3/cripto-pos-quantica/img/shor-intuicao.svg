<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" role="img" aria-labelledby="t d">
  <title id="t">Shor: só achar o período r é quântico; o resto é conta comum</title>
  <desc id="d">À esquerda, as quatro etapas do algoritmo de Shor. Etapa 1, conta comum: escolher um número a menor que N, sem fator comum com N. Etapa 2, em roxo e destacada como a única etapa quântica: achar o período r de a elevado a x, módulo N, com superposição e a transformada de Fourier quântica. Etapa 3, conta comum: os fatores saem de dois mdc, p = mdc(a^(r/2) − 1, N) e q = mdc(a^(r/2) + 1, N). Etapa 4, em vermelho, o que o atacante ganha: com p e q, a chave privada RSA cai. À direita, o exemplo N = 15 e a = 7: a sequência 7, 4, 13, 1 se repete a cada 4 passos, então r = 4; 7 ao quadrado módulo 15 dá 4; mdc(3, 15) = 3 e mdc(5, 15) = 5; 15 = 3 × 5. Embaixo, o custo: no computador comum, cada bit a mais em N dobra o trabalho; no quântico, a etapa 2 cresce de forma polinomial, e aumentar a chave não salva. Legenda: roxo é a etapa quântica, azul é conta comum, amarelo é o período, vermelho é o que o atacante ganha.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; fill: #94a3b8; }
    .num { font-size: 15px; font-weight: 700; }
    .pur { fill: #c4b5fd; }
    .blu { fill: #93c5fd; }
    .gold { fill: #facc15; }
    .red { fill: #fca5a5; }
    .bold { font-weight: 700; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-purple" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="580" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Shor: só achar o período r é quântico; o resto é conta comum</text>
  <text class="sub" x="40" y="62">Fatorar N vira achar de quanto em quanto a sequência aˣ mod N se repete.</text>

  <!-- Step 1: classical -->
  <rect x="40" y="84" width="430" height="56" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h blu" x="56" y="107">1. Escolha um número a &lt; N</text>
  <text class="s" x="56" y="127">sem fator comum com N</text>
  <path d="M255,140 L255,156" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- Step 2: quantum (key moment) -->
  <rect x="40" y="160" width="430" height="96" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5" filter="url(#glow-purple)"/>
  <rect x="300" y="170" width="158" height="22" rx="11" fill="#7c3aed"/>
  <text x="379" y="185" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">SÓ ISTO É QUÂNTICO</text>
  <text class="h pur" x="56" y="208">2. Ache o período r de aˣ mod N</text>
  <text class="s" x="56" y="230">superposição de todos os x + QFT,</text>
  <text class="s" x="56" y="247">que "ouve" o ritmo e devolve r</text>
  <path d="M255,256 L255,272" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- Step 3: classical -->
  <rect x="40" y="276" width="430" height="78" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text class="h blu" x="56" y="299">3. Transforme r nos fatores</text>
  <text class="b" x="56" y="321">p = mdc(a^(r/2) − 1, N)</text>
  <text class="b" x="56" y="341">q = mdc(a^(r/2) + 1, N)</text>
  <path d="M255,354 L255,370" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- Step 4: attacker gain -->
  <rect x="40" y="374" width="430" height="60" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="2"/>
  <text class="h red" x="56" y="398">4. Com p e q, a chave privada RSA cai</text>
  <text class="s" x="56" y="420">o atacante calcula a chave como no módulo 3.4</text>

  <!-- Example panel -->
  <rect x="500" y="84" width="420" height="350" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="518" y="108">Exemplo: N = 15, a = 7</text>
  <text class="s" x="518" y="134">x =</text>
  <text class="s" x="518" y="164">7ˣ mod 15</text>
  <g class="s">
    <text x="610" y="134">1</text><text x="650" y="134">2</text><text x="690" y="134">3</text><text x="730" y="134">4</text>
    <text x="770" y="134">5</text><text x="810" y="134">6</text><text x="850" y="134">7</text><text x="890" y="134">8</text>
  </g>
  <g>
    <rect x="598" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="638" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="678" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="718" y="144" width="32" height="30" rx="4" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
    <rect x="758" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="798" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="838" y="144" width="32" height="30" rx="4" fill="#1e293b" stroke="#475569"/>
    <rect x="878" y="144" width="32" height="30" rx="4" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
  </g>
  <g class="b">
    <text x="610" y="164">7</text><text x="650" y="164">4</text><text x="682" y="164">13</text><text class="gold" x="730" y="164">1</text>
    <text x="770" y="164">7</text><text x="810" y="164">4</text><text x="842" y="164">13</text><text class="gold" x="890" y="164">1</text>
  </g>
  <path d="M600,184 L600,192 L748,192 L748,184" stroke="#facc15" stroke-width="2" fill="none"/>
  <path d="M760,184 L760,192 L908,192 L908,184" stroke="#facc15" stroke-width="2" stroke-dasharray="4 3" fill="none"/>
  <text class="b gold" x="598" y="214">repete a cada 4 passos → r = 4</text>

  <text class="b" x="518" y="252">r = 4 é par → 7² mod 15 = 4</text>
  <text class="b blu" x="518" y="280">mdc(4 − 1, 15) = 3</text>
  <text class="b blu" x="518" y="302">mdc(4 + 1, 15) = 5</text>

  <rect x="518" y="320" width="384" height="44" rx="6" fill="#2a0f14" stroke="#ef4444" stroke-width="2"/>
  <text class="num red" x="536" y="348">15 = 3 × 5 → fatorado</text>

  <text class="s" x="518" y="394">Se r sair ímpar, ou a^(r/2) mod N der N − 1,</text>
  <text class="s" x="518" y="412">troca-se de a e repete-se.</text>

  <!-- Cost comparison -->
  <rect x="40" y="454" width="880" height="72" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="b" x="56" y="480"><tspan class="blu bold">Computador comum:</tspan> anda na sequência; cada bit a mais em N dobra o trabalho.</text>
  <text class="b" x="56" y="508"><tspan class="pur bold">Computador quântico:</tspan> a etapa 2 cresce devagar; aumentar a chave não salva.</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="548" width="14" height="14" rx="3" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5"/>
    <text x="62" y="560">etapa quântica</text>
    <rect x="210" y="548" width="14" height="14" rx="3" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="232" y="560">conta comum</text>
    <rect x="370" y="548" width="14" height="14" rx="3" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
    <text x="392" y="560">o período (o ritmo)</text>
    <rect x="580" y="548" width="14" height="14" rx="3" fill="#2a0f14" stroke="#ef4444" stroke-width="1.5"/>
    <text x="602" y="560">o que o atacante ganha</text>
  </g>
</svg>
