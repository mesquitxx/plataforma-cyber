<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="t d">
  <title id="t">Híbrido X25519MLKEM768: para ler a sessão, é preciso quebrar os dois segredos</title>
  <desc id="d">Diagrama de sequência entre Cliente e Servidor, com passos numerados. Passo 1, ClientHello: o key_share híbrido de 1216 bytes, formado pela chave ML-KEM-768 de 1184 bytes (amarelo, pós-quântico) seguida da parte X25519 de 32 bytes (azul, clássico), e um X25519 puro de 32 bytes, de reserva, só clássico. Passo 2, ServerHello: 1120 bytes, o cifrado ML-KEM de 1088 bytes seguido do X25519 de 32 bytes do servidor. Passo 3, em destaque: nos dois lados, sem passar pela rede, o segredo ML-KEM de 32 bytes e o segredo X25519 de 32 bytes se juntam em 64 bytes, que viram as chaves da sessão. Passo 4: o certificado e a assinatura ML-DSA-65, de 3309 bytes. Passo 5: os dados, cifrados com AES-256-GCM. À direita, o quadro Por que dois: contra um computador quântico, o X25519 cai, mas o ML-KEM segura; se aparecer uma falha nova no ML-KEM, o X25519 segura. Nos dois casos a sessão continua protegida. O preço é o ClientHello passar de 1 KB. Legenda: amarelo é ML-KEM, pós-quântico; azul é X25519, clássico; verde é a chave final da sessão; vermelho é a parte que caiu.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; }
    .title { font-size: 17px; font-weight: 700; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .s { font-size: 11.5px; fill: #94a3b8; }
    .xs { font-size: 11px; }
    .blu { fill: #93c5fd; }
    .gold { fill: #facc15; }
    .grn { fill: #6ee7b7; }
    .red { fill: #fca5a5; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <filter id="glow-green" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="38">Híbrido: o atacante só lê a sessão se quebrar os DOIS segredos</text>
  <text class="sub" x="40" y="60">Grupo X25519MLKEM768 no TLS 1.3: duas trocas de chave na mesma negociação.</text>

  <!-- Actors -->
  <rect x="50" y="78" width="120" height="32" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="110" y="99" text-anchor="middle">Cliente</text>
  <rect x="470" y="78" width="120" height="32" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
  <text class="h" x="530" y="99" text-anchor="middle">Servidor</text>
  <line x1="110" y1="110" x2="110" y2="560" stroke="#334155" stroke-width="2"/>
  <line x1="530" y1="110" x2="530" y2="560" stroke="#334155" stroke-width="2"/>

  <!-- 1. ClientHello -->
  <text class="b" x="124" y="134">1. ClientHello · key_share</text>
  <rect x="124" y="142" width="240" height="22" rx="4" fill="#3a2f05" stroke="#facc15" stroke-width="1.2"/>
  <text class="xs gold" x="132" y="157">ML-KEM-768 · 1184 B</text>
  <rect x="364" y="142" width="80" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="xs blu" x="372" y="157">X25519 32</text>
  <text class="s" x="452" y="157">1216 B</text>
  <rect x="124" y="168" width="80" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="xs blu" x="132" y="183">X25519 32</text>
  <text class="s" x="212" y="183">reserva, só clássico</text>
  <path d="M112,202 L526,202" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- 2. ServerHello -->
  <text class="b" x="124" y="230">2. ServerHello · key_share</text>
  <rect x="124" y="238" width="220" height="22" rx="4" fill="#3a2f05" stroke="#facc15" stroke-width="1.2"/>
  <text class="xs gold" x="132" y="253">ML-KEM cifrado · 1088 B</text>
  <rect x="344" y="238" width="80" height="22" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="xs blu" x="352" y="253">X25519 32</text>
  <text class="s" x="432" y="253">1120 B</text>
  <path d="M528,272 L114,272" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- 3. Key moment: combine -->
  <rect x="124" y="290" width="392" height="124" rx="8" fill="#052e16" stroke="#10b981" stroke-width="2" filter="url(#glow-green)"/>
  <text class="h grn" x="140" y="314">3. Nos dois lados, sem passar pela rede</text>
  <rect x="140" y="326" width="164" height="26" rx="4" fill="#3a2f05" stroke="#facc15" stroke-width="1.2"/>
  <text class="xs gold" x="222" y="343" text-anchor="middle">segredo ML-KEM 32 B</text>
  <text class="h" x="320" y="344" text-anchor="middle">+</text>
  <rect x="336" y="326" width="164" height="26" rx="4" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="xs blu" x="418" y="343" text-anchor="middle">segredo X25519 32 B</text>
  <text class="h grn" x="320" y="371" text-anchor="middle">↓</text>
  <rect x="190" y="378" width="260" height="26" rx="4" fill="#10b981" stroke="#10b981"/>
  <text class="b" x="320" y="396" text-anchor="middle" fill="#052e16">64 B → chaves da sessão</text>

  <!-- 4. Certificate -->
  <text class="b" x="124" y="446">4. certificado + assinatura ML-DSA-65</text>
  <text class="s" x="124" y="464">(no exercício, 3309 B)</text>
  <path d="M528,476 L114,476" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-slate)"/>

  <!-- 5. Data -->
  <text class="b grn" x="124" y="510">5. dados cifrados (AES-256-GCM)</text>
  <path d="M112,522 L526,522" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>

  <!-- Why two -->
  <rect x="620" y="78" width="300" height="444" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text class="h" x="640" y="106">Por que dois?</text>
  <text class="s" x="640" y="128">Cada um cobre o ponto fraco do outro.</text>

  <rect x="640" y="146" width="260" height="140" rx="6" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text class="b" x="656" y="170">Se vier o computador</text>
  <text class="b" x="656" y="188">quântico:</text>
  <text class="b red" x="656" y="216">✗ X25519 cai (Shor)</text>
  <text class="b gold" x="656" y="240">✓ ML-KEM segura</text>
  <text class="b grn" x="656" y="270">→ sessão protegida</text>

  <rect x="640" y="300" width="260" height="140" rx="6" fill="#111827" stroke="#475569" stroke-width="1"/>
  <text class="b" x="656" y="324">Se achar uma falha no</text>
  <text class="b" x="656" y="342">ML-KEM (ele é novo):</text>
  <text class="b red" x="656" y="370">✗ ML-KEM cai</text>
  <text class="b blu" x="656" y="394">✓ X25519 segura</text>
  <text class="b grn" x="656" y="424">→ sessão protegida</text>

  <text class="s" x="640" y="474">O preço é o tamanho: o</text>
  <text class="s" x="640" y="492">ClientHello passa de 1 KB.</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="572" width="14" height="14" rx="3" fill="#3a2f05" stroke="#facc15" stroke-width="1.5"/>
    <text x="62" y="584">ML-KEM (pós-quântico)</text>
    <rect x="250" y="572" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="272" y="584">X25519 (clássico)</text>
    <rect x="430" y="572" width="14" height="14" rx="3" fill="#10b981" stroke="#10b981" stroke-width="1.5"/>
    <text x="452" y="584">chave final / sessão protegida</text>
    <text class="red" x="720" y="584">✗ = parte que caiu</text>
  </g>
</svg>
