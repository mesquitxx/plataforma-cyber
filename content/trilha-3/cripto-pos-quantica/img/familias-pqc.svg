<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d">
  <title id="t">As famílias de criptografia pós-quântica e os padrões do NIST</title>
  <desc id="d">Tabela com duas colunas, troca de chaves (KEM) e assinatura, e cinco linhas de famílias matemáticas. Reticulados: ML-KEM, o FIPS 203, antigo Kyber, como KEM principal; ML-DSA, o FIPS 204, antigo Dilithium, como assinatura principal, e FN-DSA, o futuro FIPS 206, baseado no Falcon, em elaboração. Hash: nenhum KEM; SLH-DSA, o FIPS 205, antigo SPHINCS+, assinatura sem estado de reserva, e LMS e XMSS, assinaturas com estado do NIST SP 800-208. Códigos corretores de erro: HQC, escolhido em março de 2025 como KEM de reserva, com matemática diferente da do ML-KEM; nenhuma assinatura. Isogenias: SIKE, KEM que chegou à quarta rodada e foi quebrado em julho de 2022 por um ataque clássico. Multivariada: Rainbow, assinatura finalista da terceira rodada, quebrada em fevereiro de 2022 num laptop. As duas últimas linhas aparecem em vermelho, como quebradas. Embaixo, a lição: padronizar em mais de uma família de matemática é a reserva contra surpresas.</desc>
  <style>
    text { font-family: ui-monospace, "DejaVu Sans Mono", Menlo, Consolas, monospace; fill: #e6ede8; }
    .t { font-size: 16px; font-weight: 700; }
    .h { font-size: 13px; font-weight: 700; fill: #5cc8d8; }
    .b { font-size: 12px; }
    .s { font-size: 10.5px; fill: #9fb0a6; }
    .g { fill: #5ee08a; }
    .y { fill: #e8c46a; }
    .r { fill: #e86a6a; }
    .row { fill: #16201b; stroke: #2c3a33; stroke-width: 1.2; }
    .dead { fill: #241515; stroke: #e86a6a; stroke-width: 1.2; }
  </style>
  <rect width="900" height="470" fill="#121815"/>
  <text class="t" x="30" y="32">Pós-quântica: cinco famílias de matemática, e o que sobrou de cada uma</text>

  <text class="h" x="40" y="66">Família</text>
  <text class="h" x="250" y="66">Troca de chaves (KEM)</text>
  <text class="h" x="560" y="66">Assinatura</text>

  <rect class="row" x="30" y="76" width="840" height="76" rx="8"/>
  <text class="b" x="40" y="100">Reticulados</text>
  <text class="s" x="40" y="118">(lattices, LWE)</text>
  <text class="b g" x="250" y="100">ML-KEM · FIPS 203</text>
  <text class="s" x="250" y="118">ex-Kyber; o padrão principal</text>
  <text class="b g" x="560" y="100">ML-DSA · FIPS 204</text>
  <text class="s" x="560" y="118">ex-Dilithium; o padrão principal</text>
  <text class="b y" x="560" y="138">FN-DSA · FIPS 206 (em elaboração)</text>

  <rect class="row" x="30" y="160" width="840" height="64" rx="8"/>
  <text class="b" x="40" y="184">Hash</text>
  <text class="s" x="40" y="202">(só funções de hash)</text>
  <text class="s" x="250" y="184">—</text>
  <text class="b g" x="560" y="184">SLH-DSA · FIPS 205</text>
  <text class="s" x="560" y="202">ex-SPHINCS+; reserva, sem estado</text>
  <text class="s" x="560" y="216">LMS/XMSS · SP 800-208 (com estado)</text>

  <rect class="row" x="30" y="232" width="840" height="56" rx="8"/>
  <text class="b" x="40" y="256">Códigos</text>
  <text class="s" x="40" y="274">(corretores de erro)</text>
  <text class="b y" x="250" y="256">HQC (escolhido em 03/2025)</text>
  <text class="s" x="250" y="274">reserva do ML-KEM, outra matemática</text>
  <text class="s" x="560" y="256">—</text>

  <rect class="dead" x="30" y="296" width="840" height="56" rx="8"/>
  <text class="b" x="40" y="320">Isogenias</text>
  <text class="s" x="40" y="338">(curvas elípticas)</text>
  <text class="b r" x="250" y="320">SIKE ✗ quebrado em 07/2022</text>
  <text class="s" x="250" y="338">ataque clássico, um núcleo de CPU</text>
  <text class="s" x="560" y="320">—</text>

  <rect class="dead" x="30" y="360" width="840" height="56" rx="8"/>
  <text class="b" x="40" y="384">Multivariada</text>
  <text class="s" x="40" y="402">(equações quadráticas)</text>
  <text class="s" x="250" y="384">—</text>
  <text class="b r" x="560" y="384">Rainbow ✗ quebrado em 02/2022</text>
  <text class="s" x="560" y="402">"um fim de semana num laptop"</text>

  <text class="b" x="30" y="446">Lição: padronizar em mais de uma família é a reserva contra surpresas.</text>
</svg>
