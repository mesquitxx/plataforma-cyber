<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" role="img" aria-labelledby="t d">
  <title id="t">Nonce repetido no CTR: o keystream se cancela e o atacante lê o cofre sem a chave</title>
  <desc id="d">Três passos numerados e o resultado. Passo 1: o servidor, com a chave, cifra dois arquivos com a mesma chave e o mesmo nonce, então o AES gera o mesmo keystream S, em laranja, nas duas vezes: C1 = P1 XOR S, onde P1 é o aviso público, e C2 = P2 XOR S, onde P2 é o cofre. Passo 2: o atacante, sem a chave, faz C1 XOR C2, que é (P1 XOR S) XOR (P2 XOR S); os dois S aparecem riscados, porque S XOR S = 0 e o keystream some, e sobra P1 XOR P2; onde os textos têm o mesmo byte, o resultado é zero. Passo 3: conhecendo o aviso público P1, ele faz C1 XOR P1 e recupera S; depois faz C2 XOR S e obtém P2, o cofre. Faixa vermelha final: o atacante lê o cofre sem a chave e sem quebrar o AES, até o tamanho do texto conhecido. Legenda: laranja é o keystream S, o mesmo nas duas mensagens; vermelho é o que o atacante ganha.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .c { font-size: 13px; text-anchor: middle; }
    .f { font-size: 16px; }
    .s { font-size: 12px; fill: #94a3b8; }
    .org { fill: #fb923c; }
    .bold { font-weight: 700; }
    .red { fill: #f87171; }
    .ink1f0f12 { fill: #1f0f12; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1000" height="630" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Nonce repetido no CTR: o <tspan class="org">keystream se cancela</tspan> e o cofre cai</text>
  <text class="s" x="40" y="64">O AES nunca é quebrado. O defeito é um só: o par (chave, nonce) foi usado duas vezes.</text>

  <!-- Step 1 -->
  <rect data-graph-role="container" x="40" y="84" width="920" height="136" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="108">1. O servidor (com a chave) cifra dois arquivos — mesma chave, MESMO nonce</text>
  <rect x="60" y="144" width="230" height="28" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="175" y="163">mesma chave + nonce N</text>
  <path d="M290,158 H338" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="340" y="144" width="140" height="28" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="2"/><text class="c org" x="410" y="163" font-weight="700">keystream S</text>
  <text class="s org" x="410" y="192" text-anchor="middle">o mesmo S nas duas</text>
  <path d="M480,158 H520 V138 H558" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <path d="M520,158 V178 H558" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="560" y="124" width="200" height="28" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="660" y="143">C1 = P1 ⊕ <tspan class="org bold">S</tspan></text>
  <rect x="560" y="164" width="200" height="28" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="660" y="183">C2 = P2 ⊕ <tspan class="org bold">S</tspan></text>
  <text class="s" x="780" y="143">P1 = aviso público</text>
  <text class="s" x="780" y="183">P2 = cofre (secreto)</text>

  <!-- Step 2: the key moment -->
  <rect data-graph-role="container" x="40" y="236" width="920" height="120" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="260">2. O atacante (sem a chave) junta os dois cifrados</text>
  <text class="f" x="104" y="301">C1 ⊕ C2 =</text>
  <rect x="206" y="280" width="96" height="30" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text class="f" x="262" y="301" text-anchor="end">P1 ⊕</text>
  <text class="f org" x="280" y="301" text-anchor="middle" font-weight="700">S</text>
  <path d="M271,305 L289,287" stroke="#e2e8f0" stroke-width="2"/>
  <text class="f" x="339" y="301" text-anchor="middle">⊕</text>
  <rect x="376" y="280" width="96" height="30" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text class="f" x="432" y="301" text-anchor="end">P2 ⊕</text>
  <text class="f org" x="450" y="301" text-anchor="middle" font-weight="700">S</text>
  <path d="M441,305 L459,287" stroke="#e2e8f0" stroke-width="2"/>
  <text class="f" x="500" y="301" text-anchor="middle">=</text>
  <rect x="530" y="280" width="140" height="30" rx="6" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="f" x="600" y="301" text-anchor="middle" font-weight="700">P1 ⊕ P2</text>
  <text class="b org" x="339" y="338" text-anchor="middle" font-weight="700">S ⊕ S = 0 → o keystream some</text>
  <text class="s" x="700" y="294">onde os dois textos têm</text>
  <text class="s" x="700" y="312">o mesmo byte, dá zero</text>

  <!-- Step 3 -->
  <rect data-graph-role="container" x="40" y="372" width="920" height="110" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="396">3. Com o texto do aviso público (P1), recupera S e abre o cofre</text>
  <rect x="60" y="420" width="180" height="30" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="150" y="440">C1 ⊕ P1</text>
  <path d="M240,435 H298" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="300" y="420" width="170" height="30" rx="6" fill="#1c1917" stroke="#f97316" stroke-width="2"/><text class="c org" x="385" y="440" font-weight="700">S recuperado</text>
  <path d="M470,435 H528" stroke="#f97316" stroke-width="1.5" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="530" y="420" width="170" height="30" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="615" y="440">C2 ⊕ <tspan class="org bold">S</tspan></text>
  <path d="M700,435 H758" stroke="#ef4444" stroke-width="1.5" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="760" y="420" width="180" height="30" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="2"/><text class="c red" x="850" y="440" font-weight="700">P2 = o cofre</text>

  <!-- Consequence -->
  <path d="M850,450 V500" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="40" y="504" width="920" height="66" rx="8" fill="#ef4444"/>
  <text class="ink1f0f12" x="500" y="531" text-anchor="middle" font-size="16" font-weight="700">O atacante lê o cofre sem a chave e sem quebrar o AES</text>
  <text class="ink1f0f12" x="500" y="556" text-anchor="middle" font-size="13" font-weight="700">(até o tamanho do texto que ele já conhecia)</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="596" width="14" height="14" rx="3" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
    <text x="62" y="608">keystream S: o mesmo nas duas mensagens</text>
    <rect x="440" y="596" width="14" height="14" rx="3" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
    <text x="462" y="608">o que o atacante ganha</text>
    <text x="740" y="608">⊕ = XOR</text>
  </g>
</svg>
