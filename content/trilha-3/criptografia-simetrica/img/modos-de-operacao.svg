<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d">
  <title id="t">O AES é o mesmo nos quatro modos; o modo decide se blocos iguais vazam e se dá para perceber alteração</title>
  <desc id="d">Quatro painéis, cada um recebendo a mesma entrada: dois blocos de texto iguais, A e A. ECB: cada bloco passa sozinho pelo AES e os dois saem iguais, X e X, em vermelho: o desenho vaza; não percebe alteração; não exige nada a mais. CBC: um valor inicial aleatório entra num XOR com o primeiro bloco antes do AES, e o primeiro cifrado entra no XOR do segundo bloco; os blocos saem diferentes, X e Y, em verde; não percebe alteração; exige um valor inicial aleatório, novo a cada mensagem. CTR: o AES cifra um número único mais um contador, e o resultado leva XOR com cada bloco de texto; saem diferentes; não percebe alteração; exige um número único por mensagem, nunca repetido. GCM: cifra como o CTR e ainda calcula um selo de 16 bytes sobre o cifrado; saem diferentes; percebe alteração, porque confere o selo antes de abrir; exige um número único por mensagem. Legenda: azul é o AES, o mesmo nos quatro; dourado é o que o modo exige; verde é o que protege; vermelho é a falha.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 15px; font-weight: 700; }
    .b { font-size: 13px; }
    .c { font-size: 13px; text-anchor: middle; }
    .s { font-size: 12px; fill: #94a3b8; }
    .blu { fill: #93c5fd; }
    .gld { fill: #facc15; }
    .grn { fill: #34d399; }
    .red { fill: #f87171; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-gold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eab308"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
  <rect width="1000" height="680" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40"><tspan class="blu">O AES é o mesmo nos quatro</tspan> — o modo é que decide o resto</text>
  <text class="s" x="40" y="64">Mesma entrada nos quatro painéis: dois blocos de texto IGUAIS (A e A). Observe se eles saem iguais.</text>

  <!-- ECB -->
  <rect data-graph-role="container" x="40" y="84" width="450" height="260" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="110">ECB</text>
  <text class="s" x="98" y="110">— cada bloco é cifrado sozinho</text>
  <rect x="140" y="124" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="170" y="141">A</text>
  <rect x="300" y="124" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="330" y="141">A</text>
  <path d="M170,148 V190" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M330,148 V190" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="130" y="192" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="170" y="211">AES</text>
  <rect x="290" y="192" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="330" y="211">AES</text>
  <path d="M170,220 V236" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M330,220 V236" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="140" y="238" width="60" height="26" rx="4" fill="#1f0f12" stroke="#ef4444" stroke-width="2"/><text class="c red" x="170" y="256" font-weight="700">X</text>
  <rect x="300" y="238" width="60" height="26" rx="4" fill="#1f0f12" stroke="#ef4444" stroke-width="2"/><text class="c red" x="330" y="256" font-weight="700">X</text>
  <text class="red" x="250" y="258" text-anchor="middle" font-size="20" font-weight="700">=</text>
  <text class="b red" x="374" y="256">iguais!</text>
  <text class="b red" x="58" y="292">✗ blocos iguais saem iguais: o desenho vaza</text>
  <text class="b red" x="58" y="312">✗ não percebe se alguém alterar o cifrado</text>
  <text class="b gld" x="58" y="332">exige: nada a mais</text>

  <!-- CBC -->
  <rect data-graph-role="container" x="510" y="84" width="450" height="260" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="528" y="110">CBC</text>
  <text class="s" x="568" y="110">— cada bloco recebe o cifrado anterior</text>
  <rect x="650" y="124" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="680" y="141">A</text>
  <rect x="810" y="124" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="840" y="141">A</text>
  <path d="M680,148 V163" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M840,148 V163" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <circle cx="680" cy="174" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M671,174 H689 M680,165 V183" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="840" cy="174" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M831,174 H849 M840,165 V183" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="528" y="162" width="96" height="24" rx="4" fill="#2a2410" stroke="#eab308" stroke-width="1.5"/><text class="c gld" x="576" y="179">aleatório</text>
  <path d="M624,174 H669" stroke="#eab308" stroke-width="1.5" fill="none" marker-end="url(#arrow-gold)"/>
  <path d="M680,183 V190" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M840,183 V190" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="640" y="192" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="680" y="211">AES</text>
  <rect x="800" y="192" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="840" y="211">AES</text>
  <path d="M680,220 V236" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M840,220 V236" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="650" y="238" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="680" y="256" font-weight="700">X</text>
  <rect x="810" y="238" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="840" y="256" font-weight="700">Y</text>
  <path d="M710,251 H760 V174 H829" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text class="b grn" x="528" y="292">✓ blocos iguais saem diferentes</text>
  <text class="b red" x="528" y="312">✗ não percebe se alguém alterar o cifrado</text>
  <text class="b gld" x="528" y="332">exige: valor inicial aleatório, novo a cada vez</text>

  <!-- CTR -->
  <rect data-graph-role="container" x="40" y="355" width="450" height="260" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="381">CTR</text>
  <text class="s" x="98" y="381">— o AES cifra um contador, não o texto</text>
  <rect x="155" y="395" width="110" height="24" rx="4" fill="#2a2410" stroke="#eab308" stroke-width="1.5"/><text class="c gld" x="210" y="412">nº único + 1</text>
  <rect x="315" y="395" width="110" height="24" rx="4" fill="#2a2410" stroke="#eab308" stroke-width="1.5"/><text class="c gld" x="370" y="412">nº único + 2</text>
  <path d="M210,419 V433" stroke="#eab308" stroke-width="1.5" fill="none" marker-end="url(#arrow-gold)"/>
  <path d="M370,419 V433" stroke="#eab308" stroke-width="1.5" fill="none" marker-end="url(#arrow-gold)"/>
  <rect x="170" y="435" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="210" y="454">AES</text>
  <rect x="330" y="435" width="80" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="370" y="454">AES</text>
  <path d="M210,463 V469" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M370,463 V469" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <circle cx="210" cy="480" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M201,480 H219 M210,471 V489" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="370" cy="480" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M361,480 H379 M370,471 V489" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="130" y="468" width="50" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="155" y="485">A</text>
  <rect x="290" y="468" width="50" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="315" y="485">A</text>
  <path d="M180,480 H199" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M340,480 H359" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M210,489 V507" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M370,489 V507" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="180" y="509" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="210" y="527" font-weight="700">X</text>
  <rect x="340" y="509" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="370" y="527" font-weight="700">Y</text>
  <text class="b grn" x="58" y="563">✓ blocos iguais saem diferentes</text>
  <text class="b red" x="58" y="583">✗ não percebe se alguém alterar o cifrado</text>
  <text class="b gld" x="58" y="603">exige: número único, nunca repetido</text>

  <!-- GCM -->
  <rect data-graph-role="container" x="510" y="355" width="450" height="260" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="528" y="381">GCM</text>
  <text class="s" x="568" y="381">— o CTR mais um selo de conferência</text>
  <rect x="570" y="395" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="600" y="412">A</text>
  <rect x="680" y="395" width="60" height="24" rx="4" fill="#1e293b" stroke="#64748b"/><text class="c" x="710" y="412">A</text>
  <path d="M600,419 V433" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M710,419 V433" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="540" y="435" width="230" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="655" y="454">cifra como o CTR (AES)</text>
  <path d="M600,463 V507" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M710,463 V507" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="570" y="509" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="600" y="527" font-weight="700">X</text>
  <rect x="680" y="509" width="60" height="26" rx="4" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="710" y="527" font-weight="700">Y</text>
  <path d="M740,522 H803" stroke="#10b981" stroke-width="1.5" fill="none" marker-end="url(#arrow-green)"/>
  <text class="s" x="870" y="497" text-anchor="middle">feito sobre o cifrado</text>
  <rect x="805" y="507" width="130" height="30" rx="6" fill="#052e16" stroke="#10b981" stroke-width="2"/><text class="c grn" x="870" y="527" font-weight="700">selo 16 bytes</text>
  <text class="b grn" x="528" y="563">✓ blocos iguais saem diferentes</text>
  <text class="b grn" x="528" y="583">✓ percebe alteração: confere o selo</text>
  <text class="b gld" x="528" y="603">exige: número único, nunca repetido</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="644" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="62" y="656">AES: o mesmo nos quatro</text>
    <rect x="290" y="644" width="14" height="14" rx="3" fill="#2a2410" stroke="#eab308" stroke-width="1.5"/>
    <text x="312" y="656">o que o modo exige</text>
    <rect x="500" y="644" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text x="522" y="656">protege</text>
    <rect x="620" y="644" width="14" height="14" rx="3" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
    <text x="642" y="656">falha</text>
    <text x="740" y="656">⊕ = XOR (visto no 3.1)</text>
  </g>
</svg>
