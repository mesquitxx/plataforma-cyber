<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 670" width="1000" height="670" role="img" aria-labelledby="t d">
  <title id="t">Bit-flipping no CBC: quem controla o IV controla o primeiro bloco, e guest vira admin</title>
  <desc id="d">Decifração CBC de um token de dois blocos. Em destaque, o ataque da Missão 3: o atacante troca o IV por IV linha, alterando só os bytes 5 a 9 com IV XOR (guest XOR admin). O bloco C1, intacto, é decifrado com a chave e dá D(C1), que não muda; D(C1) XOR IV linha dá role=admin;uid=7, com admin em vermelho, onde antes era role=guest;uid=7. O C1 intacto também entra no XOR do segundo bloco, que continua decifrando ;exp=2026-12-31: nada estraga. Faixa vermelha: o servidor aceita o token e o atacante vira admin sem a chave; o CBC sozinho não tem integridade. Embaixo, separada e secundária, a comparação com o módulo 3.1: trocar um byte de C1 em vez do IV faz o P1 inteiro virar lixo e leva a mesma troca para P2. Por último, em verde, a defesa: usar AES-GCM, em que qualquer bit trocado reprova a tag e nada é liberado. Legenda: vermelho é o que o atacante altera e o que ganha; azul é decifrar com a chave, que o atacante não controla; verde é a defesa; cinza tracejado é bloco estragado.</desc>
  <style>
    text { font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', 'DejaVu Sans Mono', 'Courier New', monospace; fill: #e2e8f0; letter-spacing: 0.02em; }
    .title { font-size: 19px; font-weight: 700; }
    .h { font-size: 14px; font-weight: 700; }
    .b { font-size: 13px; }
    .c { font-size: 13px; text-anchor: middle; }
    .f { font-size: 15px; text-anchor: middle; }
    .s { font-size: 12px; fill: #94a3b8; }
    .red { fill: #f87171; }
    .grn { fill: #34d399; }
    .mut { fill: #64748b; }
    .bold { font-weight: 700; }
    .ink1f0f12 { fill: #1f0f12; }
  </style>
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ef4444"/>
    </marker>
  </defs>
  <rect width="1000" height="670" fill="url(#bg-grad)"/>

  <text class="title" x="40" y="40">Quem controla o IV controla o 1º bloco: <tspan class="red">guest vira admin</tspan></text>
  <text class="s" x="40" y="64">Decifrar no CBC: P1 = D(C1) ⊕ IV. Se C1 fica intacto, D(C1) não muda — e cada bit trocado no IV muda igual em P1.</text>

  <!-- Attack -->
  <rect data-graph-role="container" x="40" y="84" width="920" height="252" rx="8" fill="#0f172a" stroke="#334155"/>
  <text class="h" x="58" y="108">Ataque (Missão 3): o atacante mexe SÓ no IV</text>

  <text class="s red" x="60" y="172">bytes 5 a 9: IV ⊕ (guest ⊕ admin)</text>
  <rect x="60" y="180" width="190" height="28" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="2"/><text class="c red bold" x="155" y="199">IV' (alterado)</text>
  <path d="M250,194 H280 V240 H359" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>

  <rect x="310" y="120" width="120" height="30" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="370" y="140">C1 (intacto)</text>
  <path d="M370,150 V178" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="310" y="180" width="120" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="370" y="199">decifra (AES)</text>
  <path d="M370,208 V230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <text class="s" x="382" y="224">D(C1): não muda</text>
  <circle cx="370" cy="240" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M361,240 H379 M370,231 V249" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M370,249 V268" stroke="#ef4444" stroke-width="2" fill="none" marker-end="url(#arrow-red)"/>
  <rect x="250" y="270" width="240" height="32" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="2"/><text class="f" x="370" y="291">role=<tspan class="red bold">admin</tspan>;uid=7</text>
  <text class="s" x="370" y="322" text-anchor="middle">antes: role=guest;uid=7</text>

  <path d="M430,135 H600 V240 H729" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="680" y="120" width="120" height="30" rx="6" fill="#1e293b" stroke="#64748b"/><text class="c" x="740" y="140">C2 (intacto)</text>
  <path d="M740,150 V178" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="680" y="180" width="120" height="28" rx="6" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/><text class="c" x="740" y="199">decifra (AES)</text>
  <path d="M740,208 V230" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <circle cx="740" cy="240" r="9" fill="#0f172a" stroke="#e2e8f0" stroke-width="1.5"/><path d="M731,240 H749 M740,231 V249" stroke="#e2e8f0" stroke-width="1.5"/>
  <path d="M740,249 V268" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="620" y="270" width="240" height="32" rx="6" fill="#1e293b" stroke="#64748b"/><text class="f" x="740" y="291">;exp=2026-12-31</text>
  <text class="s" x="740" y="322" text-anchor="middle">P2 decifra igual: nada estraga</text>

  <!-- Consequence -->
  <rect x="40" y="350" width="920" height="60" rx="8" fill="#ef4444"/>
  <text class="ink1f0f12" x="500" y="375" text-anchor="middle" font-size="16" font-weight="700">O servidor aceita o token: o atacante vira admin sem saber a chave</text>
  <text class="ink1f0f12" x="500" y="398" text-anchor="middle" font-size="13" font-weight="700">o CBC sozinho não tem integridade, então ninguém percebe a troca</text>

  <!-- Comparison (secondary) -->
  <rect data-graph-role="container" x="40" y="430" width="920" height="126" rx="8" fill="#0f172a" stroke="#334155" stroke-dasharray="6 4"/>
  <text class="b bold" x="58" y="454">Comparação (módulo 3.1): mexer num byte de C1, e não no IV</text>
  <rect x="60" y="480" width="200" height="30" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/><text class="c red" x="160" y="500">C1 com 1 byte trocado</text>
  <path d="M260,488 H298" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <path d="M260,502 H280 V521 H298" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)"/>
  <rect x="300" y="470" width="260" height="28" rx="6" fill="none" stroke="#64748b" stroke-dasharray="4 3"/><text class="c mut" x="430" y="489">P1 inteiro vira lixo</text>
  <rect x="300" y="507" width="260" height="28" rx="6" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/><text class="c red" x="430" y="526">P2 recebe a MESMA troca</text>
  <text class="s" x="590" y="489">foi o 1234-5 → 9234-5 do 3.1.</text>
  <text class="s" x="590" y="507">Mexer no IV é a versão limpa:</text>
  <text class="s" x="590" y="525">o IV não passa pelo AES, nada estraga.</text>

  <!-- Defense (separate, secondary) -->
  <rect x="40" y="572" width="920" height="40" rx="8" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
  <text class="b grn" x="58" y="597">Defesa: usar AES-GCM — qualquer bit trocado reprova a tag e nada é liberado</text>

  <!-- Legend -->
  <g class="s">
    <rect x="40" y="636" width="14" height="14" rx="3" fill="#1f0f12" stroke="#ef4444" stroke-width="1.5"/>
    <text x="62" y="648">atacante altera / ganha</text>
    <rect x="270" y="636" width="14" height="14" rx="3" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="292" y="648">decifra com a chave</text>
    <rect x="470" y="636" width="14" height="14" rx="3" fill="#052e16" stroke="#10b981" stroke-width="1.5"/>
    <text x="492" y="648">defesa</text>
    <rect x="580" y="636" width="14" height="14" rx="3" fill="none" stroke="#64748b" stroke-dasharray="3 2"/>
    <text x="602" y="648">bloco estragado</text>
    <text x="780" y="648">⊕ = XOR</text>
  </g>
</svg>
